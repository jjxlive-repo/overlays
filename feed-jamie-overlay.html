<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FEED JAMIE — Overlay</title>
<script src="jjx-core.js?v=9"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Boogaloo&family=Fredoka:wght@400;500;600;700&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ── FEED JAMIE overlay — 1080x1920 transparent browser source ── */
  :root {
    --fj-purple-deep:   #3B0764;
    --fj-purple-mid:    #7B2FBE;
    --fj-purple-bright: #A855F7;
    --fj-purple-light:  #C084FC;
    --fj-accent:        #E879F9;
    /* Painted Splat tokens — shared construction with follow-meter-overlay.html
       (heavy ink strokes, hard zero-blur shadows, hand-cut radii, no translucent
       plates). Feed Jamie keeps PURPLE as its accent where the follow meter uses
       blue, and tilts the opposite way, so the two read as siblings on a shared
       screen rather than as duplicates of one component. */
    --fj-ink:           #0d0d12;
    --fj-plate:         #A855F7;
    --fj-goldui:        #FDE047;
    --fj-white:         #FAF5FF;
    --fj-blue:          #3B82F6;
    --fj-gold:          #F5C518;
    --fj-charcoal:      #3A3A40;
  }
  html, body {
    width: 1080px; min-width: 1080px;
    height: 1920px; min-height: 1920px;
    margin: 0; padding: 0;
    overflow: hidden;
    background: transparent;
    pointer-events: none;
    font-family: 'DM Sans', sans-serif;
  }
  /* #stage MUST NOT carry a transform of its own. Spin The Screen's camera beats
     (bump / shake) drive this element, and a second transform here would silently
     replace theirs — the same trap the wheel overlay hit with its own bump layer.
     If this ever needs a static transform, add a wrapper for it instead. */
  #stage { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; overflow: hidden; }

  /* ── LAYER MAP ────────────────────────────────────────────────────
     Jamie owns the foreground. Every persistent UI plate sits BELOW him,
     so no card, meter or sign can ever cover the character — he is the
     thing viewers are here for, and the plates are configurable, so any
     of them can be dragged into his space at any time.
        5  floor line
       24  level-aura FX (glow / rays behind him)
       26  XP tag, like meter       ┐ persistent UI plates — always
       27  CTA ribbon               │ behind Jamie
       28  wooden gift sign         │
       29  prompt pill, thrown items┘
       30  JAMIE
       45  heart-me / jackpot veils
       50  particle effects              ┐ transient — deliberately over
       60  treat wheel (takeover)        │ him: FX should burst in front,
       61  event label (username)        │ and the labels are read-once
       64  gift float text ("+TREAT!")   ┘ text positioned off him
       79+ setup guides, connection dot (debug only)
     Adding a new plate? Give it 25-29, not a number above 30. */


  /* connection dot — hidden on the broadcast overlay; check feed-jamie-control.html for status */
  #conn-dot {
    display: none;
    position: absolute; top: 10px; right: 10px; width: 13px; height: 13px;
    border-radius: 50%; background: transparent; border: 3px solid #F59E0B;
    box-sizing: border-box; opacity: .8; z-index: 90;
  }
  #conn-dot.connected { background: var(--fj-blue); border-color: var(--fj-blue); box-shadow: 0 0 8px #3B82F688; }

  /* floor line */
  #floor-line {
    position: absolute; left: 0; width: 1080px; height: 3px;
    background: var(--fj-purple-bright); opacity: 0; z-index: 5;
    transition: opacity .3s;
  }

  /* setup guides */
  #guide-canvas { position: absolute; inset: 0; border: 3px dashed #3B82F666; box-sizing: border-box; display: none; z-index: 80; }
  #guide-floor-label {
    position: absolute; left: 12px; padding: 3px 10px; font: 700 20px 'DM Sans';
    color: #fff; background: #3B82F6CC; border-radius: 8px; display: none; z-index: 81;
  }
  #reach-zone-vis {
    position: absolute; border: 3px dashed var(--fj-accent); background: #E879F922;
    display: none; z-index: 40; box-sizing: border-box;
  }
  #roam-band { position: absolute; height: 12px; display: none; z-index: 41;
    background: repeating-linear-gradient(90deg, #22D3EE55 0 14px, transparent 14px 28px);
    border-left: 2px solid #22D3EE; border-right: 2px solid #22D3EE; }
  #jamie-box { position: absolute; border: 2px dashed var(--fj-gold); display: none; z-index: 41; box-sizing: border-box; }
  #safe-area { position: absolute; inset: 60px 40px; border: 2px dotted #FAF5FF55; display: none; z-index: 79; box-sizing: border-box; }
  #debug-hud {
    position: absolute; top: 30px; left: 12px; padding: 6px 10px; display: none; z-index: 82;
    font: 500 16px 'DM Sans'; color: #fff; background: #000000AA; border-radius: 8px; white-space: pre;
  }

  /* Jamie */
  #jamie {
    position: absolute; z-index: 30; will-change: transform;
    transform-origin: 50% 100%;
    /* width/height transition makes growth (eating) swell smoothly;
       transform matches so the feet stay glued to the floor line while growing */
    transition: transform .45s ease-out, width .45s ease-out, height .45s ease-out;
  }
  #jamie.hidden-state { display: none; }
  #jamie svg { width: 100%; height: 100%; display: block; }
  #jamie-inner { width: 100%; height: 100%; transform-origin: 50% 100%; position: relative; }
  /* crossfade-capable frame layers — stacked absolutely so old/new frames overlap exactly.
     JS drives opacity/transform transitions per-layer (duration = visuals.frameCrossfadeMs). */
  #jamie .fj-jamie-layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Runtime white sticker rim. The Cleanup6 art ships with a black outline only and
     NO baked rim — 124 of its 143 frames sit within 10px of the canvas edge (some at
     0px), so a baked rim would clip. One feMorphology dilate paints an even rim that
     renders outside the sprite box. Gated on visuals.stickerBorder. */
  #jamie.rimmed .fj-jamie-layer { filter: url(#fj-rim); }
  #jamie.rimmed.rim-baked .fj-jamie-layer { filter: none; }

  /* synthetic wobble/squash/hop/tilt — ONLY used as a fallback when no real drawn
     frame exists for the current pose (class .no-real-art). Real hand-drawn sprites
     play cleanly with no extra CSS motion layered on top. Amplitude scales with
     --fj-motion (0 = none .. 1 = normal .. 1.5+ = extra), set from visuals.intensity. */
  :root { --fj-motion: 1; }
  #jamie-inner { transition: transform .16s ease-out; }
  #jamie.no-real-art.pose-anticipation #jamie-inner {
    transform: scaleY(calc(1 - 0.12 * var(--fj-motion))) scaleX(calc(1 + 0.05 * var(--fj-motion))) translateY(calc(4% * var(--fj-motion)));
  }
  #jamie.no-real-art.pose-payoff #jamie-inner {
    transform: translateY(calc(-7% * var(--fj-motion))) scaleY(calc(1 + 0.04 * var(--fj-motion)));
  }
  #jamie.no-real-art.pose-celebrate #jamie-inner { animation: fjHop .45s ease-in-out infinite; }
  #jamie.no-real-art.pose-track-left  #jamie-inner { transform: rotate(calc(-5deg * var(--fj-motion))); }
  #jamie.no-real-art.pose-track-right #jamie-inner { transform: rotate(calc(5deg * var(--fj-motion))); }
  #jamie.pose-sleep #jamie-inner { transform: scaleY(.8) translateY(9%); filter: brightness(.85); }
  @keyframes fjHop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(calc(-9% * var(--fj-motion))); } }

  /* idle breathing — only a fallback; real idle sequences already alternate
     between drawn breathing frames, so this stays off when real art is present. */
  #jamie.no-real-art.breathe #jamie-inner { animation: fjBreathe 4s ease-in-out infinite; }
  @keyframes fjBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(calc(1 + 0.012 * var(--fj-motion)), calc(1 + 0.028 * var(--fj-motion))); } }
  #jamie.pose-anticipation.breathe #jamie-inner,
  #jamie.pose-celebrate.breathe #jamie-inner,
  #jamie.pose-payoff.breathe #jamie-inner { animation: none; }
  /* being petted: happy little nuzzle wobble (on #jamie-inner so it doesn't fight
     the inline transform #jamie carries for position/mirror) */
  #jamie.pet-nuzzle #jamie-inner { animation: fjNuzzle .5s ease-in-out infinite !important; }
  @keyframes fjNuzzle {
    0%,100% { transform: rotate(0) translateY(0); }
    25% { transform: rotate(calc(-4.5deg * var(--fj-motion))) translateY(calc(-2.5% * var(--fj-motion))); }
    75% { transform: rotate(calc(4.5deg * var(--fj-motion))) translateY(calc(-1.5% * var(--fj-motion))); }
  }

  /* placeholder SVG internal state classes (driven by container classes) */
  .fj-eyes-closed { display: none; }
  #jamie.ph-blink .fj-eyes-open   { display: none; }
  #jamie.ph-blink .fj-eyes-closed { display: block; }
  .fj-tongue { display: none; }
  #jamie.ph-happy .fj-tongue { display: block; }
  #jamie.ph-happy .fj-mouth-line { display: none; }

  /* objects */
  .fj-object {
    position: absolute; top: 0; left: 0; z-index: 29; /* in front of #gift-showcase (28), behind #jamie (30) */
    will-change: transform; pointer-events: none;
  }
  .fj-object img, .fj-object svg { width: 100%; height: 100%; display: block; }
  .fj-object.premium-glow { filter: drop-shadow(0 0 14px #F5C518CC) drop-shadow(0 0 26px #F5C51866); }
  .fj-object.jackpot-glow { filter: drop-shadow(0 0 14px #A855F7DD) drop-shadow(0 0 26px #A855F788); }
  .fj-object.splat-glow   { filter: drop-shadow(0 0 10px #A855F7AA); }
  .fj-object.dimmed { opacity: .25; transition: opacity .3s; }

  /* Knockout type — the core Painted Splat technique. paint-order is MANDATORY:
     without it the stroke paints over the glyph from the inside and eats the
     letterform. Blur is always 0 so the shadow reads as a printed offset, not a glow. */
  .fj-ko {
    color: #fff; -webkit-text-stroke: 7px var(--fj-ink);
    paint-order: stroke fill; text-shadow: 0 6px 0 var(--fj-ink);
  }

  /* item username tag */
  .fj-obj-tag {
    position: absolute; left: 50%; top: -30px; transform: translateX(-50%);
    font: 700 24px 'Fredoka', sans-serif; letter-spacing: .04em;
    color: #fff; white-space: nowrap;
    -webkit-text-stroke: 6px var(--fj-ink); paint-order: stroke fill;
    text-shadow: 0 5px 0 var(--fj-ink);
  }

  /* prompt pill */
  /* A solid chip, not a translucent plate — a half-opaque plate reads as default
     UI and inverts against dark gameplay. Hand-cut radius + hard offset shadow. */
  #prompt-pill {
    /* Jamie owns the foreground. If a transition briefly crosses their boxes,
       the character must never disappear behind his own instruction banner. */
    position: absolute; z-index: 29; transform: translateX(-50%);
    padding: 11px 34px 13px; border-radius: 10px 34px 14px 30px;
    background: var(--fj-plate);
    border: 7px solid var(--fj-ink);
    box-shadow: 0 10px 0 rgba(13,13,18,.9);
    font: 700 30px 'Fredoka', sans-serif; letter-spacing: .1em; text-transform: uppercase;
    color: #fff; text-align: center; white-space: nowrap;
    opacity: 0; transition: opacity .5s;
  }

  /* event label (follow / heart me / sub / gift) */
  #event-label {
    position: absolute; z-index: 61; padding: 9px 30px 11px;
    border-radius: 10px 34px 14px 30px;
    background: var(--fj-ink); border: 6px solid var(--fj-plate);
    box-shadow: 0 10px 0 rgba(13,13,18,.9);
    font: 700 30px 'Fredoka', sans-serif; letter-spacing: .04em;
    color: #fff; white-space: nowrap;
    opacity: 0; transition: opacity .3s, left .25s ease-out, top .25s ease-out;
  }
  /* gold is reserved for premium/jackpot moments, same meaning as on the follow meter */
  #event-label.gold { border-color: var(--fj-goldui); color: var(--fj-goldui); }

  /* like meter */
  #like-meter {
    position: absolute; z-index: 26; padding: 6px 18px 8px;
    border-radius: 8px 22px 10px 20px;
    background: var(--fj-ink); border: 5px solid var(--fj-plate);
    box-shadow: 0 7px 0 rgba(13,13,18,.9);
    font: 700 24px 'Fredoka', sans-serif; letter-spacing: .04em;
    color: var(--fj-goldui); white-space: nowrap;
    font-variant-numeric: tabular-nums;
    opacity: 0; transition: opacity .4s, left .25s ease-out, top .25s ease-out;
  }


  /* wide wooden treat board — several gift → item mappings shown side by side
     as carved-in windows, planted at the floor line beside Jamie, rotating
     through the full mapping list a slot-count at a time. Pure CSS (no baked
     art) so it scales cleanly to any width, height, font size, or slot count. */
  #gift-showcase {
    position: absolute; z-index: 28; opacity: 0; pointer-events: none;
    transform-origin: 50% 100%; box-sizing: border-box;
    display: flex; align-items: stretch;
    transition: opacity .35s ease, left .3s ease-out, top .3s ease-out;
    background:
      repeating-linear-gradient(90deg, #0000000f 0 2px, transparent 2px 40px),
      linear-gradient(180deg, #A0703F 0%, #7C4F2B 55%, #6B4325 100%);
    border-radius: 12px 30px 14px 26px;      /* hand-cut, matching the chips */
    border: 6px solid var(--fj-ink);
    box-shadow: inset 0 0 0 2px #C084FC55, 0 9px 0 rgba(13,13,18,.85);
  }
  .gs-cell {
    position: relative; flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #FBF3E3 0%, #F2E2C4 100%);
    border-radius: 6px;
    box-shadow: inset 0 0 0 1px #C9AE86, 0 2px 3px #0004;
  }
  .gs-cell::before, .gs-cell::after {
    content: ''; position: absolute; top: 8%; width: 7%; aspect-ratio: 1; max-width: 12px;
    border-radius: 50%; background: radial-gradient(circle at 35% 35%, #9a9a9a, #3a3a3a);
  }
  .gs-cell::before { left: 8%; }
  .gs-cell::after  { right: 8%; }
  .gs-cell-img { width: 46%; aspect-ratio: 1; object-fit: contain; }
  .gs-cell-label {
    font: 600 17px 'Fredoka', sans-serif; color: #3A2A1A; line-height: 1.05;
    text-align: center; overflow: hidden; overflow-wrap: break-word; max-width: 92%;
  }

  /* floating video-game trigger text above Jamie when a mapped gift lands */
  #gift-float-layer { position: absolute; inset: 0; z-index: 64; overflow: visible; pointer-events: none; }
  .fj-gift-float {
    position: absolute; transform: translate(-50%, -50%);
    text-align: center; white-space: nowrap; line-height: 1;
    animation: fjGiftFloat var(--float-duration, 1500ms) ease-out forwards;
  }
  /* real stroke rather than four stacked offset shadows — the faked version
     thins out on diagonals and blurs at scale */
  .fj-gift-float-main {
    font: 400 40px 'Boogaloo', cursive; letter-spacing: .5px; color: #fff;
    -webkit-text-stroke: 9px var(--fj-ink); paint-order: stroke fill;
    text-shadow: 0 7px 0 var(--fj-ink);
  }
  .fj-gift-float-sub {
    margin-top: 1px; font: 400 22px 'Boogaloo', cursive; letter-spacing: .3px;
    color: var(--fj-goldui);
    -webkit-text-stroke: 6px var(--fj-ink); paint-order: stroke fill;
    text-shadow: 0 5px 0 var(--fj-ink);
  }
  @keyframes fjGiftFloat {
    0%   { opacity: 0; transform: translate(-50%, -40%) scale(.82); }
    16%  { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
    75%  { opacity: 1; transform: translate(-50%, calc(-50% - var(--float-rise, 26px))) scale(1); }
    100% { opacity: 0; transform: translate(-50%, calc(-50% - var(--float-rise, 26px))) scale(.96); }
  }

  /* growth flash: golden glow pulse whenever eating makes Jamie bigger */
  #jamie.growing .fj-jamie-layer, #jamie.growing svg { animation: fjGrowGlow .9s ease-out; }
  @keyframes fjGrowGlow {
    0%   { filter: none; }
    30%  { filter: drop-shadow(0 0 16px #F5C518E0) drop-shadow(0 0 34px #A855F790) brightness(1.18); }
    100% { filter: none; }
  }

  /* effects layer */
  #effects { position: absolute; inset: 0; z-index: 50; overflow: hidden; }
  .fj-fx {
    position: absolute; top: 0; left: 0; will-change: transform, opacity;
    font-size: 30px; line-height: 1; user-select: none;
  }
  .fj-fx svg { display: block; }

  /* heart-me flash */
  #heartme-veil {
    position: absolute; inset: 0; z-index: 45; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at 50% 40%, #A855F72E 0%, transparent 65%);
    transition: opacity .35s;
  }
  /* jackpot flash (big gift / big superchat, gold instead of heart-me purple) */
  #jackpot-veil {
    position: absolute; inset: 0; z-index: 45; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at 50% 40%, #FFD34E33 0%, transparent 65%);
    transition: opacity .35s;
  }

  /* ════════════════════════════════════════════════════════════════
     XP AURA + TREAT WHEEL (the crowd sprites moved to
     _retired/splatty-squad-crowd-extract.md for wheel-reward-overlay reuse)
     ════════════════════════════════════════════════════════════════ */

  /* ── treat wheel — transient, pops on !spin, CSS-drawn (art can replace) ── */
  #squad-wheel {
    position: absolute; z-index: 60; pointer-events: none;
    opacity: 0; transform: scale(.5);
  }
  #squad-wheel.show { animation: sqWheelIn .28s cubic-bezier(.34,1.56,.64,1) forwards; }
  #squad-wheel.hide { animation: sqWheelOut .3s ease-in forwards; }
  @keyframes sqWheelIn { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }
  @keyframes sqWheelOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(.6); } }
  /* "Neon night" (6b): the wheel is a prize takeover, so it goes LOUDER against
     gameplay than the pastel wedges did. Stays in the purple Painted Splat set
     with #1A0A2A ink — deliberately NOT the cream/Baloo doodle tokens, which are
     scoped to #feed-hud alone. */
  .sq-wheel-disc {
    position: absolute; inset: 34px 0 0 0; border-radius: 50%;
    border: 6px solid #1A0A2A;
    box-shadow: 0 6px 0 rgba(26,10,42,.6), 0 0 24px rgba(255,46,196,.35);
    background: conic-gradient(
      #31205C 0deg 45deg,   #4A2D86 45deg 90deg,
      #31205C 90deg 135deg, #4A2D86 135deg 180deg,
      #31205C 180deg 225deg,#4A2D86 225deg 270deg,
      #31205C 270deg 315deg,#4A2D86 315deg 360deg);
  }
  /* Wedge spokes. The two 6b purples sit at ~1.3:1 against each other, so the
     conic boundaries alone are invisible at stream size and the disc reads as
     one solid circle — the spin loses its "wheel" legibility. Four full-diameter
     ink lines (0/45/90/135deg = the eight 45deg boundaries) restore it without
     touching the approved palette. Drawn with linear-gradients rather than extra
     conic stops so every spoke is a constant 2px wide instead of tapering toward
     the hub. Paints under the icons and hub: ::before is the box's first child,
     ::after its last. */
  .sq-wheel-disc::before {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background:
      linear-gradient(0deg,   transparent calc(50% - 1px), #1A0A2A calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(45deg,  transparent calc(50% - 1px), #1A0A2A calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(90deg,  transparent calc(50% - 1px), #1A0A2A calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(135deg, transparent calc(50% - 1px), #1A0A2A calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px));
  }
  .sq-wheel-disc::after {   /* hub */
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 22%; height: 22%; transform: translate(-50%,-50%);
    background: #FF2EC4; border: 5px solid #1A0A2A; border-radius: 50%;
  }
  .sq-wheel-icon {
    position: absolute; left: 50%; top: 50%; object-fit: contain; pointer-events: none;
  }
  .sq-wheel-ptr {
    position: absolute; left: 50%; top: 6px; transform: translateX(-50%);
    width: 0; height: 0; z-index: 2;
    border-left: 17px solid transparent; border-right: 17px solid transparent;
    border-top: 30px solid #FF2EC4;
    filter: drop-shadow(0 2.5px 0 #1A0A2A);
  }
  /* real art variants (swap in when the PNGs exist — they do, so this is the
     path that actually runs on stream; the CSS-drawn wheel above is the fallback).
     The 6b glow is carried over deliberately: it is the only part of the Neon
     night restyle that is not baked into the art, and dropping box-shadow here
     would silently discard it. Ink offset stays lighter than the CSS wheel's .6
     because the PNG brings its own edge. */
  .sq-wheel-disc.has-art {
    background: none; border: none;
    box-shadow: 0 6px 0 rgba(26,10,42,.4), 0 0 24px rgba(255,46,196,.35);
  }
  /* the painted face brings its own wedges and hub */
  .sq-wheel-disc.has-art::before,
  .sq-wheel-disc.has-art::after { display: none; }
  .sq-wheel-face { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .sq-wheel-ptr-img {
    position: absolute; left: 50%; top: 2px; transform: translateX(-50%);
    z-index: 2; object-fit: contain;
    filter: drop-shadow(0 2px 0 rgba(26,10,42,.4));
  }
  .sq-wheel-caption {
    position: absolute; left: 0; right: 0; top: -32px; text-align: center;
    font: 400 20px 'Boogaloo', cursive; color: #FFF6D8; letter-spacing: .5px;
    text-shadow: 0 2px 0 #1A0A2A, 0 0 10px rgba(0,0,0,.8); white-space: nowrap;
  }
  #squad-wheel.landed .sq-wheel-disc { animation: sqWheelLand .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes sqWheelLand { 0%{scale:1} 45%{scale:1.09} 100%{scale:1} }

  /* ── Jamie drip tiers (ported from Top Splatty; tint via --jt-tint) ── */
  #jamie-tier-fx { position: absolute; inset: 0; z-index: 24; pointer-events: none; }
  .jt-fx { position: absolute; pointer-events: none; opacity: 0; transition: opacity .8s; }
  .jt-glow {
    border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--jt-tint,255,210,90),.38) 0%, transparent 70%);
  }
  .jt-glow.on { opacity: .55; animation: jtGlowPulse 3s ease-in-out infinite; }
  @keyframes jtGlowPulse { 0%,100% { transform: scale(1); opacity: .45; } 50% { transform: scale(1.06); opacity: .6; } }
  .jt-rays {
    background: repeating-conic-gradient(rgba(var(--jt-tint,255,210,90),.5) 0deg 4deg, transparent 4deg 20deg);
    border-radius: 50%;
    animation: jtRaySpin 22s linear infinite;
  }
  .jt-rays.on { opacity: .4; }
  @keyframes jtRaySpin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .jt-spot .beam {
    position: absolute; top: 0; width: 46%; height: 100%;
    background: linear-gradient(180deg, rgba(255,255,255,.5), transparent 85%);
  }
  .jt-spot .b1 { left: 5%; transform: skewX(-9deg); }
  .jt-spot .b2 { right: 5%; transform: skewX(9deg); }
  .jt-spot.on { opacity: .3; }
  .jt-halo {
    border-radius: 50%;
    background: conic-gradient(from 0deg, #ff5da2, #FFD25A, #7FE8F2, #A855F7, #ff5da2);
    animation: jtHaloSpin 3.4s linear infinite;
    filter: blur(1.5px);
  }
  .jt-halo.on { opacity: .38; }
  @keyframes jtHaloSpin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .jt-orbit { position: absolute; pointer-events: none; }
  .jt-orbit .jt-orbit-icon {
    position: absolute; top: 50%; left: 50%; object-fit: contain;
    margin: calc(var(--jt-size, 22px) / -2) 0 0 calc(var(--jt-size, 22px) / -2);
    animation: jtOrbit var(--jt-dur, 5.5s) linear infinite;
    animation-delay: var(--jt-delay, 0s);
  }
  @keyframes jtOrbit {
    from { transform: rotate(0deg) translateX(var(--jt-r, 90px)) rotate(0deg); }
    to   { transform: rotate(360deg) translateX(var(--jt-r, 90px)) rotate(-360deg); }
  }
  .jt-sparkle {
    position: absolute; pointer-events: none; font-size: 17px; opacity: 0;
    text-shadow: 0 0 6px rgba(255,255,255,.9);
  }
  .jt-sparkle.on { animation: jtTwinkle 1.8s ease-in-out infinite; }
  .jt-sparkle.s2 { animation-delay: .45s; }
  .jt-sparkle.s3 { animation-delay: .95s; }
  .jt-sparkle.s4 { animation-delay: 1.35s; }
  @keyframes jtTwinkle { 0%,100% { opacity: 0; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
  .jt-crown { position: absolute; object-fit: contain; opacity: 0; transition: opacity .8s; animation: sqCrownBob 2.8s ease-in-out infinite; }
  .jt-crown.on { opacity: 1; }

  /* ── XP tag — 0/100xp · LVL 1 riding under Jamie (doodle tokens, same
     family as the ribbon). Position is written by xpTagPlace() every time
     Jamie's transform moves, so it follows walks and growth for free. */
  #xp-tag {
    position: absolute; z-index: 26; pointer-events: none; display: none;
    transform-origin: 50% 0;
    background: #fdf8ee; color: #1a1a1a;
    border: 3px solid #1a1a1a; border-radius: 10px;
    box-shadow: 0 3px 0 rgba(0,0,0,.35);
    font-family: 'Baloo 2', system-ui, sans-serif;
    font-weight: 800; font-size: 15px; letter-spacing: .4px;
    padding: 2px 10px 3px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  #xp-tag.show { display: block; }
  #xp-tag b { color: #17a24b; font-size: 18px; font-weight: 800; }
  #xp-tag.pop { animation: xpTagPop .6s cubic-bezier(.34,1.56,.64,1); }
  @keyframes xpTagPop {
    0% { scale: 1; } 45% { scale: 1.18; } 100% { scale: 1; }
  }

  /* ── CTA RIBBON — the HUD goal card, condensed to its one surviving row:
     the purple rotating prompt, edge-mounted. (The stat row moved to #xp-tag
     under Jamie.) The cream/Baloo doodle tokens are scoped to this module and
     #xp-tag only; do not spread them outward. Fixed footprint: the ribbon
     never grows, shrinks, appears or disappears on a state change — only its
     text hard-swaps. */
  #feed-hud {
    position: absolute; z-index: 27; pointer-events: none; display: none;
    transform-origin: 0 0;
    font-family: 'Baloo 2', system-ui, sans-serif;
  }
  #feed-hud.show { display: block; }
  /* only when the operator empties the CTA list — an operator config change,
     not a live state change, so the footprint rule does not apply */
  #feed-hud.no-cta { display: none; }
  .fh-ribbon {
    width: 250px; box-sizing: border-box;
    background: #6c3fd8; color: #ffd93b;
    border: 3px solid #1a1a1a; border-radius: 14px;
    box-shadow: 0 4px 0 rgba(0,0,0,.35);
    font-weight: 800; font-size: 17px; letter-spacing: .5px;
    white-space: nowrap; text-align: center;
    padding: 5px 10px 6px;
    /* Copy that still will not fit at the 11px floor gets an ellipsis rather
       than a centred double-clip — the ribbon never widens to accommodate it. */
    overflow: hidden; text-overflow: ellipsis;
  }
  /* edge-mounted: drop the border on the screen-edge side and keep the radius
     on the free corners only (the style guide's edge rule) */
  #feed-hud.edge-left  .fh-ribbon { border-left: none;  border-radius: 0 14px 14px 0; }
  #feed-hud.edge-right .fh-ribbon { border-right: none; border-radius: 14px 0 0 14px; }
</style>
</head>
<body>

  <div id="reach-zone-vis"></div>

  <div id="jamie-tier-fx"></div>

  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <filter id="fj-rim" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="fj-fat"/>
      <feFlood flood-color="#ffffff" result="fj-white"/>
      <feComposite in="fj-white" in2="fj-fat" operator="in" result="fj-rimmed"/>
      <feMerge><feMergeNode in="fj-rimmed"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </svg>
  <div id="gift-showcase" aria-label="TikTok gift actions"></div>
  <div id="gift-float-layer" aria-live="polite"></div>
  <div id="debug-hud"></div>
  <!-- The transport is the Producer Dock's local WebSocket, not Ably. JJX.dockRealtime only
       WEARS Ably's shape so the ~140 existing publish/subscribe call sites kept working; its
       `fallbackKey` is accepted and ignored, and the Ably SDK script tags are gone entirely.
       This tooltip still said "Ably connection", which reads as "still attached, still billing"
       to anyone who has been told to cancel the account. -->
  <div id="conn-dot" title="Producer Dock connection (127.0.0.1) — not Ably"></div>
</div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════
   FEED JAMIE — overlay engine
   1080x1920 transparent browser source for TikTok Live Studio.
   Receives events/config from feed-jamie-control.html via Ably
   (live), BroadcastChannel + localStorage (local testing).
════════════════════════════════════════════════════════════════ */

/* ── 1. DEFAULT CONFIG ─────────────────────────────────────────── */
const FJ_DEFAULT_CONFIG = {
  canvas: { width: 1080, height: 1920 },
  floor: {
    y: 500, min: 180, max: 1500,
    liveVisible: false, color: '#A855F7', opacity: 0.35, thickness: 3
  },
  jamie: {
    x: 130, width: 260, yOffset: 0, side: 'left', flip: false,
    scale: 1, rotation: 0
  },
  reachZone: {
    xOffset: 0, yOffset: 0, width: 135, height: 150, shape: 'ellipse',
    anticipationDistance: 180, nearMissDistance: 70
  },
  movement: {
    normalSpeedMin: 150, normalSpeedMax: 220,
    premiumSpeedMin: 190, premiumSpeedMax: 280,
    objectScale: 1, maxObjects: 1, spin: 40,
    /* L5 item showers get their own, higher concurrent-object cap — a big
       spend spectacle can queue up to 22 shower items, and bottlenecking
       them through the normal 1-3 cap would turn the storm into a slow
       trickle instead of an actual swarm. */
    showerMaxObjects: 8,
    maxLifetimeNormal: 25, maxLifetimePremium: 35,
    guidanceEnabled: true, guidanceStrength: 0.6,
    cornerJackpot: true, cornerTolerance: 30, cornerWindowMs: 150,
    cornerRewardMultiplier: 1, squashStretch: true
  },
  /* Roaming. Default OFF: switching it on changes how Jamie behaves on every
     catch, so it is opt-in rather than something an update turns on under you. */
  roam: {
    enabled: false,
    xMin: 40, xMax: 820,        // the allotted band, in stage px (left edge of the sprite)
    speed: 165,                 // px/sec walking
    chase: true,                // walk toward loose objects instead of waiting
    wander: true, wanderEverySec: 20,
    returnHome: true, returnAfterSec: 12
  },
  events: {
    likesPerTreatEnabled: true, likesPerTreat: 50, likeQueueCap: 2,
    sleepEnabled: true, sleepAfterSec: 240,
    commentCooldown: 4, perUserCooldown: 10,
    genericSpawnChance: 0.05, keywordOnly: false,
    keywords: {
      ball: 'tennis-ball', treat: 'random-treat', toy: 'squeaky-toy',
      duck: 'duck', sock: 'sock', bubble: 'bubble', jamie: 'look'
    },
    treatWeights: { 'treat-biscuit': 45, 'treat-bone': 30, 'treat-purple-splat': 20, 'treat-heart': 5 },
    heartMeDurationSec: 3, heartMeSpawnHeart: true,
    /* Heart Me randomly rotates through these 4 variants each time it fires
       (uncheck any you don't want in the rotation). */
    heartMeVariants: { run: true, classic: true, spin: true, proud: true },
    subscribeDurationSec: 2.5,
    giftLowMax: 99, giftHighMin: 5000,
    giftFallbackEnabled: true,  /* false = only explicitly mapped gifts react */
    giftSizeScaling: {
      enabled: true,      /* bigger gifts spawn bigger items */
      maxScale: 2.6,      /* size multiplier at/above coinsForMax (1-coin gifts stay 1x) */
      coinsForMax: 20000  /* coin value that reaches full size — pushed out so items keep
                             growing from Galaxy toward a TikTok Universe (log curve between) */
    },
    /* intensity ladder: how big a reaction scales with coin value.
       L1 normal catch · L2 +sparkle & size · L3 premium (fast/glow/2x growth)
       · L4 MEGA (Heart-Me style) · L5 MEGA + item shower. Above L5 the SPEND
       SPECTACLE keeps escalating (storm/size/duration/repeats) up to a Universe.
       Gate is deliberately low so a Galaxy (~1k coins) already hits the mega. */
    intensityThresholds: { l2: 50, l3: 250, l4: 500, l5: 1000 },
    /* cheap gifts (and all likes) skip the bounce entirely and go straight
       into Jamie's mouth — instant payoff, and they never occupy a bounce
       slot so a big gift right after isn't stuck waiting behind a Rose. */
    instantFeed: { enabled: true, maxCoins: 1 },
    giftMappings: [],   /* [{giftName, itemType ('heartme' = mega reaction), minValue, maxValue, showUsername, intensity: 'auto'|1-5}] */
    /* YouTube Super Chats — same 5-level ladder, dollar thresholds. Fed via
       stream-dock's existing 'gift-alert' Ably broadcast; no direct YouTube
       connection here. */
    superchat: {
      enabled: true,
      thresholds: { l2: 2, l3: 5, l4: 20, l5: 100 },
      sizeScaling: { enabled: true, maxScale: 2, dollarsForMax: 50 }
    },
  },
  /* ── THE GAME: viewer points → !spin → Jamie XP ─────────────────────
     TikFinity-style loop, rebuilt native: viewers earn points for
     NON-monetized engagement (chatting = presence, likes, follows, shares,
     waving at Jamie), then spend them. `!spin` (or !spin2/3/4 for pricier
     tiers) spins the treat wheel; the wedge's multiplier x the tier's base
     XP is what Jamie actually gains. Keyword throws (ball/treat/toy) can
     also cost points, making every Jamie interaction earned rather than
     bought. Jamie's XP climbs level thresholds; levels drive the aura FX
     and the always-on XP tag under him. */
  game: {
    enabled: true,
    points: {
      perComment: 5, commentCooldownSec: 60,   /* "minutes in chat" proxy: chatting ~1/min earns steadily */
      likesPerPoint: 10,                       /* 1 pt per N likes sent */
      followBonus: 100, shareBonus: 50, subscribeBonus: 200,
      waveBonus: 10, waveCooldownSec: 120,
      waveKeywords: 'wave, hi jamie, hey jamie, 👋',
      keywordCost: 10,                         /* cost to throw via ball/treat/toy comment; 0 = free */
      balanceCommand: true                     /* !points / !pts replies with the viewer's balance */
    },
    spin: {
      costs:  [50, 150, 400, 1000],            /* !spin1..!spin4 point cost */
      baseXp: [10, 25, 60, 150],               /* per-tier base XP; wedge multiplier applies on top */
      perUserCooldownSec: 10,
      maxQueued: 5
    },
    xp: {
      thresholds: [100, 250, 500, 1000, 2000, 4000],  /* cumulative XP to reach LVL 2..7 */
      auraEnabled: true                        /* level-driven glow/rays/crown FX around Jamie */
    },
    xpTag: { enabled: true, offsetY: 12, scale: 1 }    /* the 0/100xp · LVL 1 tag under Jamie */
  },
  wheel: {
    /* the treat wheel — pops on !spin (and test buttons). Position/size only;
       what it pays out lives in game.spin above. */
    enabled: true, x: 540, y: 0, size: 300, spinMs: 2100, holdMs: 900   /* y 0 = auto (upper third) */
  },
  prompts: {
    /* The CTA copy + rotation speed. These now feed the HUD card's ribbon
       (see `hud` below); with the HUD off they fall back to the old floating
       prompt pill, which is what x/y/scale/opacity still position and style. */
    enabled: true, intervalSec: 4, x: 540, y: 110, scale: 1,
    /* bgOpacity now drives the SOLID chip's fill alpha. Defaulted opaque because a
       translucent plate inverts against dark gameplay — the slider still works if
       a softer chip is wanted. */
    opacity: 1, bgOpacity: 1,
    /* No emoji: the HUD ribbon is a fixed-width slot at 17px, and emoji
       both blow the width budget and clash with the flat sticker look. */
    list: [
      'LEVEL JAMIE UP — !SPIN',
      'CHAT + WAVE = EARN PTS',
      'SAY BALL · TREAT · TOY'
    ]
  },
  /* ── FEED JAMIE HUD ───────────────────────────────────────────────
     The edge-mounted goal card from the "Doodle Stream HUD" handoff
     (option 4a): Jamie sticker + LVL n/6 counter + rotating CTA ribbon,
     condensed (2026-08-01) to ONE purple row: just the rotating CTA ribbon,
     edge-mounted. The level readout moved to the XP tag that rides under
     Jamie (game.xpTag). While the ribbon is on it replaces the old floating
     prompt pill. */
  hud: {
    enabled: true,
    /* x/y are the ribbon's top-left. x <= 2 mounts it flush to the left edge
       (no left border, radius on the free corners only); the mirror applies
       at the right edge. */
    x: 0, y: 430, scale: 1
  },
  copy: {
    follow: '@{username} threw Jamie a ball! 🎾',
    heartMe: '@{username} gave Jamie a Heart Me! 💜',
    heartMeGift: '@{username} sent {gift}! 🎁',
    jackpot: '@{username} triggered a Jamie JACKPOT! 🌟',
    jackpotGift: '@{username} triggered a JACKPOT with {gift}! 🌟',
    subscribe: '@{username} unlocked Jamie’s golden ball! ⭐',
    likeMeter: '🦴 {current}/{target}',
    pluck: 'YOURS! 🤏',
    giftSignFallback: 'THROW {item}',
    wheelSpinUser: '@{username} spins for Jamie…',
    wheelSpinAnon: 'treat wheel…',
    wheelWin: '{winner} won a {item} · +{xp} XP!',
    wheelBust: '{winner} — BUST! Jamie keeps the {item} 😅',
    pointsBalance: '@{username} · {pts} pts',
    needPoints: '@{username} needs {cost} pts — chat to earn!',
    wheelBusy: '@{username} — wheel queue is full, hold on!',
    levelUp: 'JAMIE LEVELED UP → LVL {level}! 🎉',
    xpGain: '+{xp} XP'
  },
  visuals: {
    usernameLabels: true, likeMeter: true, particleLevel: 'low',
    blueAccent: true, stickerBorder: true, highContrast: false,
    intensity: 1, cornerGlow: 1,
    frameCrossfadeMs: 120,   /* dissolve duration between Jamie sprite frames — smoothness */
    frameDurationScale: 1,   /* multiplies every animation frame's hold time — pacing/calmness */
    eventLabelX: 540, eventLabelY: 110, eventLabelScale: 1,  /* follow/heart-me/sub/gift username text */
    likeMeterX: 404, likeMeterY: 440, likeMeterScale: 1,
    usernameSeconds: 2.5,   /* how long username tags/labels stay visible */
    usernameEvents: {       /* which events display the viewer's username */
      follow: true, keyword: false, gift: true, subscribe: true, heartMe: true
    },
    giftShowcase: {   /* wide wooden treat board — N cells rotating through gift → item mappings */
      enabled: true, anchorToJamie: true, gap: 15, x: 420, floorOffset: 4,
      width: 365, intervalSec: 7, transitionMs: 350,
      heightScale: 1, /* stretch the board taller than its default proportions for more text room */
      fontScale: 1,   /* independent text-size multiplier, on top of per-cell-width scaling */
      slots: 3        /* how many gift cells are shown side by side at once */
    },
    giftFloatText: {  /* video-game floating text above Jamie when a mapped gift lands */
      enabled: true, xOffset: 0, yOffset: -45, durationMs: 1500, risePx: 26,
      maxVisible: 3, aggregateWindowMs: 700, showSender: true
    }
  },
  audio: {
    muted: false, master: 0.7, cooldownMs: 140,
    volumes: {
      bounce: 0.25, catch: 0.7, crunch: 0.6, ballBounce: 0.5, squeak: 0.7,
      quack: 0.7, pop: 0.6, jackpot: 0.7, heartMe: 0.85, subscribe: 0.8, gift: 0.7
    },
    urls: {}  /* soundName -> https URL; empty = Web Audio placeholder synth */
  },
  growth: {
    enabled: true,       /* Jamie grows a little with every item he catches */
    maxScale: 2,         /* size cap (1 = no growth possible, 2 = double size) */
    perCatch: 0.05,      /* size gained per catch (premium items count double) */
    decayPerMinute: 0.05,/* how fast he shrinks back toward 1x (0 = never) */
    fx: true             /* golden glow + sparkles whenever he grows */
  },
  assets: { basePath: 'assets/feed-jamie/', manifestFile: 'asset-manifest.json' },
  debug: { setupGuides: false, showReachZone: false, showJamieBox: false, showSafeArea: false, showState: false, showWarnings: false }
};

const FJ_LS_CONFIG  = 'feedJamie.config.v1';
const FJ_LS_MSG     = 'feedJamie.msg';
const FJ_LS_STATUS  = 'feedJamie.status';
const FJ_LS_ASSETS  = 'feedJamie.assetOverrides.v1';
const FJ_BC_NAME    = 'feed-jamie-control';
const FJ_ABLY_KEY   = null;
const FJ_ABLY_CH    = 'splat-overlay';
const FJ_ABLY_MSG_IN  = 'feed-jamie';        /* control -> overlay */
const FJ_ABLY_MSG_OUT = 'feed-jamie-status'; /* overlay -> control */
/* cache-bust key: forces a fresh fetch of every asset on each page load, so
   replacing a PNG under the same filename (common during art iteration)
   can never keep showing a stale browser-cached copy. */
const FJ_CACHE_BUST = Date.now();
/* mirror mode (?mirror=1): the control panel's tiny live-mirror iframe. It's a
   same-origin copy driven purely over BroadcastChannel/localStorage, so it
   must never attach to Ably (cost), publish status (would fight the real
   TikTok Studio copy), or make noise. */
const FJ_IS_MIRROR = /[?&]mirror=1/.test(location.search) || location.hash === '#mirror';

function fjDeepMerge(base, extra) {
  if (extra === null || typeof extra !== 'object' || Array.isArray(extra)) return base;
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  for (const k of Object.keys(extra)) {
    const bv = out[k], ev = extra[k];
    if (bv && ev && typeof bv === 'object' && typeof ev === 'object' && !Array.isArray(bv) && !Array.isArray(ev)) {
      out[k] = fjDeepMerge(bv, ev);
    } else if (ev !== undefined) {
      out[k] = ev;
    }
  }
  return out;
}
function fjClone(o) { return JSON.parse(JSON.stringify(o)); }

let CFG = fjClone(FJ_DEFAULT_CONFIG);
try {
  const saved = JSON.parse(localStorage.getItem(FJ_LS_CONFIG) || 'null');
  if (saved) CFG = fjDeepMerge(CFG, saved);
} catch (e) {}

/* clamp critical values so a bad import can't break the overlay */
function fjValidateConfig() {
  const c = CFG;
  c.floor.y = Math.min(Math.max(+c.floor.y || 500, 180), 1500);
  c.movement.maxObjects = Math.min(Math.max(Math.round(+c.movement.maxObjects || 1), 1), 3);
  c.movement.showerMaxObjects = Math.min(Math.max(Math.round(+c.movement.showerMaxObjects || 8), 3), 22);
  c.events.likesPerTreatEnabled = c.events.likesPerTreatEnabled !== false;
  c.events.likesPerTreat = Math.min(Math.max(Math.round(+c.events.likesPerTreat || 50), 10), 1000);
  c.events.sleepEnabled = c.events.sleepEnabled !== false;
  c.events.sleepAfterSec = Math.min(Math.max(Math.round(+c.events.sleepAfterSec || 240), 30), 3600);
  c.jamie.width = Math.min(Math.max(+c.jamie.width || 260, 80), 600);
  if (!['ellipse', 'rect'].includes(c.reachZone.shape)) c.reachZone.shape = 'ellipse';
  if (!['off', 'low', 'medium'].includes(c.visuals.particleLevel)) c.visuals.particleLevel = 'low';
  c.visuals.intensity = Math.min(Math.max(Number.isFinite(+c.visuals.intensity) ? +c.visuals.intensity : 1, 0), 2);
  c.visuals.frameCrossfadeMs = Math.min(Math.max(Math.round(+c.visuals.frameCrossfadeMs || 0), 0), 500);
  c.visuals.frameDurationScale = Math.min(Math.max(+c.visuals.frameDurationScale || 1, 0.4), 3);
  c.visuals.eventLabelX = Math.min(Math.max(+c.visuals.eventLabelX || 540, 0), 1080);
  c.visuals.eventLabelY = Math.min(Math.max(+c.visuals.eventLabelY || 110, 0), 1920);
  c.visuals.eventLabelScale = Math.min(Math.max(+c.visuals.eventLabelScale || 1, 0.4), 2.5);
  c.visuals.likeMeterX = Math.min(Math.max(+c.visuals.likeMeterX || 404, 0), 1080);
  c.visuals.likeMeterY = Math.min(Math.max(+c.visuals.likeMeterY || 440, 0), 1920);
  c.visuals.likeMeterScale = Math.min(Math.max(+c.visuals.likeMeterScale || 1, 0.4), 2.5);
  if (!c.events.giftSizeScaling || typeof c.events.giftSizeScaling !== 'object') {
    c.events.giftSizeScaling = { enabled: true, maxScale: 2, coinsForMax: 5000 };
  }
  /* wooden gift sign (migrates the old floating-card giftShowcase config:
     x is kept as the manual fallback; old y/scale are ignored safely) */
  const num = (v, d) => { const n = +v; return Number.isFinite(n) ? n : d; };
  /* roam — validated here rather than earlier because it needs num() above */
  if (!c.roam || typeof c.roam !== 'object') c.roam = fjClone(FJ_DEFAULT_CONFIG.roam);
  c.roam.enabled = !!c.roam.enabled;
  c.roam.chase = c.roam.chase !== false;
  c.roam.wander = c.roam.wander !== false;
  c.roam.returnHome = c.roam.returnHome !== false;
  c.roam.xMin = Math.min(Math.max(num(c.roam.xMin, 40), 0), 1000);
  c.roam.xMax = Math.min(Math.max(num(c.roam.xMax, 820), c.roam.xMin + 80), 1080);
  c.roam.speed = Math.min(Math.max(num(c.roam.speed, 165), 40), 600);
  c.roam.wanderEverySec = Math.min(Math.max(num(c.roam.wanderEverySec, 20), 4), 120);
  c.roam.returnAfterSec = Math.min(Math.max(num(c.roam.returnAfterSec, 12), 2), 120);
  if (!c.visuals.giftShowcase || typeof c.visuals.giftShowcase !== 'object') c.visuals.giftShowcase = {};
  const gsc = c.visuals.giftShowcase;
  gsc.enabled = gsc.enabled !== false;

/* ── POINTS + XP GAME ─────────────────────────────────────────────
   Viewer side: a per-viewer point balance earned from non-monetized
   engagement, persisted across streams (loyalty, not a per-stream drip).
   Jamie side: XP earned from wheel spins, climbing level thresholds that
   drive the aura FX and the tag under him. Both live OUTSIDE CFG so the
   control panel's full-config pushes can never clobber live balances. */
const FJ_LS_POINTS = 'feedJamie.points.v1';
const FJ_LS_XP = 'feedJamie.xp.v1';
let ptsState = { viewers: {} };   /* key -> { name, pts, earnAt, waveAt, spinAt, balAt, needAt } */
let xpState = { xp: 0 };
try {
  const s = JSON.parse(localStorage.getItem(FJ_LS_POINTS) || 'null');
  if (s && s.viewers && typeof s.viewers === 'object') ptsState.viewers = s.viewers;
} catch (e) {}
try {
  const s = JSON.parse(localStorage.getItem(FJ_LS_XP) || 'null');
  if (s && Number.isFinite(+s.xp)) xpState.xp = Math.max(0, +s.xp);
} catch (e) {}
let ptsSaveTimer = null;
function savePoints() {
  clearTimeout(ptsSaveTimer);
  ptsSaveTimer = setTimeout(() => {
    try { localStorage.setItem(FJ_LS_POINTS, JSON.stringify({ viewers: ptsState.viewers, ts: Date.now() })); } catch (e) {}
  }, 800);
}
function saveXp() {
  try { localStorage.setItem(FJ_LS_XP, JSON.stringify({ xp: xpState.xp, ts: Date.now() })); } catch (e) {}
}
const ptsKey = n => String(n || '').trim().toLowerCase();
function viewerOf(username) {
  const k = ptsKey(username);
  if (!k || k === 'anon') return null;
  return ptsState.viewers[k] || (ptsState.viewers[k] = { name: String(username), pts: 0 });
}
function addPoints(username, n) {
  const v = viewerOf(username);
  if (!v || !(n > 0)) return 0;
  v.pts = Math.min(1000000, Math.round(v.pts + n));
  v.name = String(username);
  savePoints();
  return v.pts;
}
function spendPoints(username, n) {
  const v = viewerOf(username);
  if (!v || v.pts < n) return false;
  v.pts = Math.round(v.pts - n);
  savePoints();
  return true;
}
/* level from cumulative XP: below thresholds[0] = LVL 1; past the last = max */
function xpLevelInfo() {
  const th = CFG.game.xp.thresholds;
  let level = 1;
  for (const t of th) { if (xpState.xp >= t) level++; else break; }
  const maxLevel = th.length + 1;
  return { level, maxLevel, nextAt: level > th.length ? null : th[level - 1] };
}
function addXp(amount, username) {
  if (!(amount > 0)) return;
  const before = xpLevelInfo().level;
  xpState.xp = Math.min(99999999, Math.round(xpState.xp + amount));
  saveXp();
  const info = xpLevelInfo();
  xpTagRender(true);
  if (info.level > before) {
    /* xpApplyLevel(true) picks the celebration pose itself (grownProud, or the
       mythic frame at max level) — no second cheer on top of it */
    xpApplyLevel(true);
    showEventLabel(copyText('levelUp', 'JAMIE LEVELED UP → LVL {level}! 🎉', { level: String(info.level) }),
      CFG.visuals.usernameSeconds * 1.5, true);
    spawnFx('sparkleGold', jamieRect.x + jamieRect.w / 2, jamieRect.y + 20, 10);
    playSound('subscribe');
  } else {
    xpApplyLevel(false);
  }
  publishStatus();
}
function resetXp() { xpState.xp = 0; saveXp(); xpTagRender(false); xpApplyLevel(false); publishStatus(true); }
function resetPoints() { ptsState.viewers = {}; savePoints(); publishStatus(true); }
/* engagement → points. `kind` decides rate + cooldown; all non-monetized. */
function creditEngagement(kind, username, n) {
  if (!CFG.game.enabled) return;
  const gp = CFG.game.points;
  const v = viewerOf(username);
  if (!v) return;
  const now = Date.now();
  switch (kind) {
    case 'comment':
      if (v.earnAt && now - v.earnAt < gp.commentCooldownSec * 1000) return;
      v.earnAt = now;
      addPoints(username, gp.perComment);
      break;
    case 'like': {
      /* fractional carry so 3-like taps still add up to a point eventually */
      v.likeCarry = (v.likeCarry || 0) + Math.max(0, n || 0);
      const pts = Math.floor(v.likeCarry / gp.likesPerPoint);
      if (pts > 0) { v.likeCarry -= pts * gp.likesPerPoint; addPoints(username, pts); }
      savePoints();
      break;
    }
    case 'follow': addPoints(username, gp.followBonus); break;
    case 'share': addPoints(username, gp.shareBonus); break;
    case 'subscribe': addPoints(username, gp.subscribeBonus); break;
    case 'wave':
      if (v.waveAt && now - v.waveAt < gp.waveCooldownSec * 1000) return;
      v.waveAt = now;
      addPoints(username, gp.waveBonus);
      break;
  }
}
function waveKeywordList() {
  return String(CFG.game.points.waveKeywords || '')
    .split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
}
let growGlowTimer = null;
let pendingGrownProud = false;
let pendingGrownMid = false;
function growthFlash(hitMax) {
  if (CFG.growth.fx === false) return;
  /* golden glow pulse on the sprite */
  jamieEl.classList.remove('growing');
  void jamieEl.offsetWidth;  /* restart the animation */
  jamieEl.classList.add('growing');
  clearTimeout(growGlowTimer);
  growGlowTimer = setTimeout(() => jamieEl.classList.remove('growing'), 950);
  /* sparkle burst around Jamie (bigger celebration when he hits max size) */
  const cx = jamieRect.x + jamieRect.w / 2;
  const cy = jamieRect.y + jamieRect.h * 0.45;
  spawnFx('sparkleGold', cx, cy, hitMax ? 10 : 5);
  spawnFx('sparkle', cx, cy, hitMax ? 8 : 3);
  if (hitMax) {
    spawnFx('star', cx, jamieRect.y + jamieRect.h * 0.2, 4);
    /* queue the proud/puffed pose to play as soon as the current catch's
       payoff/celebrate sequence finishes and Jamie settles back down */
    pendingGrownProud = true;
  }
}
function applyGrowthCatch(obj) {
  const g = CFG.growth;
  if (!g.enabled || growth >= g.maxScale) return;
  const before = growth;
  growth = Math.min(g.maxScale, growth + g.perCatch * (obj.premium ? 2 : 1));
  /* crossing the halfway mark toward max size flashes the intermediate
     grown-mid pose (distinct from the grown-proud flash reserved for max). */
  const mid = 1 + (g.maxScale - 1) * 0.5;
  if (before < mid && growth >= mid && growth < g.maxScale) pendingGrownMid = true;
  saveGrowth();
  applyLayout();
  growthFlash(growth >= g.maxScale);
  publishStatus();
}
function resetGrowth() {
  growth = 1;
  saveGrowth();
  applyLayout();
  publishStatus(true);
}

/* ── 4. ASSET MANIFEST + AVAILABILITY ──────────────────────────── */
/* Safe built-in default: normalized 1200x1400 art canvas. All Jamie
   frames share the primary floor anchor + targets unless the loaded
   manifest overrides them per frame. */
const DEFAULT_FRAME_META = {
  anchor:         { x: 588, y: 1172 },
  mouthTarget:    { x: 560, y: 680 },
  leftPawTarget:  { x: 435, y: 1130 },
  rightPawTarget: { x: 726, y: 1130 },
  visualScale: 1,
  facing: 'center'
};
let MANIFEST = { version: 2, canvas: { width: 1161, height: 1355, floorAnchor: { x: 588, y: 1172 } }, states: {}, items: {}, effects: {}, audio: {} };
const assetAvailable = {};   /* filename -> true/false (probed) */
const assetWarnings  = [];
let assetOverrides   = {};   /* filename -> dataURL (from control panel uploads) */
try { assetOverrides = JSON.parse(localStorage.getItem(FJ_LS_ASSETS) || '{}'); } catch (e) {}

function fjAssetUrl(file) {
  if (assetOverrides[file]) return assetOverrides[file];
  return CFG.assets.basePath + file + '?v=' + FJ_CACHE_BUST;
}
function fjProbe(file) {
  return new Promise(resolve => {
    if (assetOverrides[file]) { assetAvailable[file] = true; return resolve(true); }
    const img = new Image();
    img.onload  = () => { assetAvailable[file] = true;  resolve(true);  };
    img.onerror = () => { assetAvailable[file] = false; resolve(false); };
    img.src = CFG.assets.basePath + file + '?v=' + FJ_CACHE_BUST;
  });
}
function fjFrameMeta(file) {
  for (const st of Object.values(MANIFEST.states || {})) {
    for (const fr of (st.frames || [])) {
      if (fr.file === file) return fjDeepMerge(fjClone(DEFAULT_FRAME_META), fr);
    }
  }
  return fjClone(DEFAULT_FRAME_META);
}
/* resolve a Jamie frame file through the fallback chain; null = use placeholder SVG */
function fjResolveFrame(file) {
  let f = file, hops = 0;
  while (f && hops < 6) {
    if (assetAvailable[f]) return f;
    f = FRAME_FALLBACK[f] || (f === 'jamie-idle-01-in.png' ? null : 'jamie-idle-01-in.png');
    hops++;
  }
  return null;
}
async function fjLoadAssets() {
  try {
    const res = await fetch(CFG.assets.basePath + CFG.assets.manifestFile, { cache: 'no-cache' });
    if (res.ok) {
      const m = await res.json();
      if (m && m.states) MANIFEST = m;
    }
  } catch (e) { assetWarnings.push('manifest missing — using built-in defaults'); }
  const files = new Set();
  Object.values(SEQ).forEach(seq => seq.forEach(fr => files.add(fr.f)));
  Object.values(ITEM_DEFS).forEach(d => files.add(d.file));
  await Promise.all([...files].map(fjProbe));
  for (const f of files) if (!assetAvailable[f]) assetWarnings.push('missing: ' + f);
  jamieRender(true);
  publishStatus();
}

/* ── 6. AUDIO (Web Audio placeholder synth + optional file URLs) ── */
let audioCtx = null;
const soundLastPlayed = {};
const audioFileCache = {};
function fjAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}
function playSound(name) {
  if (FJ_IS_MIRROR || CFG.audio.muted) return;
  const now = performance.now();
  if (soundLastPlayed[name] && now - soundLastPlayed[name] < CFG.audio.cooldownMs) return;
  soundLastPlayed[name] = now;
  const vol = (CFG.audio.volumes[name] ?? 0.6) * CFG.audio.master;
  if (vol <= 0) return;
  const url = CFG.audio.urls[name];
  if (url) {
    try {
      let a = audioFileCache[name];
      if (!a || a.src !== url) { a = new Audio(url); audioFileCache[name] = a; }
      const inst = a.cloneNode();
      inst.volume = Math.min(vol, 1);
      inst.play().catch(() => {});
      return;
    } catch (e) { /* fall through to synth */ }
  }
  fjSynth(name, vol);
}
function fjSynth(name, vol) {
  const ctx = fjAudio();
  if (!ctx) return;
  const t = ctx.currentTime;
  const master = ctx.createGain();
  master.gain.value = vol * 0.5;
  master.connect(ctx.destination);
  const tone = (freq, start, dur, type, peak) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t + start);
    g.gain.setValueAtTime(0.0001, t + start);
    g.gain.exponentialRampToValueAtTime(peak || 1, t + start + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + start + dur);
    o.connect(g); g.connect(master);
    o.start(t + start); o.stop(t + start + dur + 0.05);
    return o;
  };
  switch (name) {
    case 'bounce':     tone(320, 0, 0.08, 'sine'); break;
    case 'ballBounce': tone(180, 0, 0.12, 'triangle'); break;
    case 'catch':      tone(520, 0, 0.1, 'triangle'); tone(780, 0.07, 0.12, 'triangle'); break;
    case 'crunch':     tone(150, 0, 0.06, 'square', 0.5); tone(120, 0.07, 0.06, 'square', 0.4); tone(100, 0.14, 0.08, 'square', 0.3); break;
    case 'squeak':   { const o = tone(900, 0, 0.22, 'sawtooth', 0.5); o.frequency.exponentialRampToValueAtTime(1400, t + 0.1); o.frequency.exponentialRampToValueAtTime(700, t + 0.22); break; }
    case 'quack':    { const o = tone(260, 0, 0.16, 'sawtooth', 0.6); o.frequency.exponentialRampToValueAtTime(180, t + 0.16); tone(240, 0.2, 0.14, 'sawtooth', 0.4); break; }
    case 'pop':      { const o = tone(600, 0, 0.07, 'sine'); o.frequency.exponentialRampToValueAtTime(1200, t + 0.06); break; }
    case 'pet':      { const o = tone(420, 0, 0.32, 'sine', 0.45); o.frequency.exponentialRampToValueAtTime(560, t + 0.14); o.frequency.exponentialRampToValueAtTime(500, t + 0.32); break; } /* soft content coo */
    case 'jackpot':    tone(660, 0, 0.12, 'triangle'); tone(880, 0.1, 0.12, 'triangle'); tone(1320, 0.2, 0.2, 'triangle'); break;
    case 'heartMe':    tone(523, 0, 0.18, 'triangle'); tone(659, 0.12, 0.18, 'triangle'); tone(784, 0.24, 0.22, 'triangle'); tone(1047, 0.36, 0.3, 'triangle'); break;
    case 'subscribe':  tone(784, 0, 0.14, 'triangle'); tone(988, 0.1, 0.14, 'triangle'); tone(1175, 0.2, 0.28, 'triangle'); break;
    case 'gift':       tone(587, 0, 0.14, 'triangle'); tone(880, 0.11, 0.2, 'triangle'); break;
    default:           tone(440, 0, 0.1, 'sine');
  }
}

/* ── 7. LAYOUT (Jamie + reach zone geometry) ───────────────────── */
const $ = id => document.getElementById(id);
const jamieEl = $('jamie'), jamieInner = $('jamie-inner');
let jamieRect = { x: 0, y: 0, w: 260, h: 303 };  /* on-screen box */

function jamieHeightFor(width) {
  const mc = MANIFEST.canvas || { width: 1200, height: 1400 };
  return width * (mc.height / mc.width);
}
/* fast/directional poses (anticipation lean, fetch leap, toy pounce) can pin an
   explicit left/right mirror toward whatever they're reacting to, overriding
   the plain global side flip for just that pose. null = use isFlipped(). Reset
   to null on every state change unless that change explicitly requests one
   (see setJamieState), so slower/face-forward poses (idle, celebrate,
   growth-proud, ...) always render Jamie's real, un-mirrored art. */
let poseMirror = null;
function currentMirror() { return poseMirror === null ? isFlipped() : poseMirror; }
function applyJamieTransform() {
  const j = CFG.jamie;
  jamieEl.style.transform = `translate3d(${jamieRect.x}px, ${jamieRect.y}px, 0) rotate(${j.rotation || 0}deg)` + (currentMirror() ? ' scaleX(-1)' : '');
  /* The aura layer and the XP tag live outside the sprite. Keep both attached
     whenever Jamie moves, including roam walks and hand-tweened Heart Me runs. */
  if (typeof sqLayoutTierFx === 'function' && jtEls) sqLayoutTierFx();
  if (typeof xpTagPlace === 'function') xpTagPlace();
}
/* smoothly interpolates jamieRect.x over `ms`, re-applying the transform each
   frame — drives Heart Me's run-to-center-and-back sprint. */
function tweenJamieX(fromX, toX, ms, onDone) {
  /* setTimeout, not requestAnimationFrame: this is a one-shot animation, not
     a continuously-rescheduling loop like the main tick() below, so it has no
     way to self-heal if a single rAF callback never fires (e.g. the OBS
     browser source gets occluded/backgrounded for a moment mid-Heart-Me) —
     that would leave heartMeActive stuck true forever. setTimeout can't get
     silently suspended the same way, so this always eventually completes. */
  const start = performance.now();
  function step() {
    const now = performance.now();
    const t = Math.min(1, (now - start) / ms);
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; /* ease-in-out quad */
    jamieRect.x = fromX + (toX - fromX) * e;
    applyJamieTransform();
    if (t < 1) setTimeout(step, 16);
    else { jamieRect.x = toX; applyJamieTransform(); if (onDone) onDone(); }
  }
  step();
}

/**
 * Keep the rotating prompt out of Jamie's box. Its configured position remains
 * the first choice. If growth makes that unsafe, use the roomier side and reduce
 * only the prompt enough to keep it inside the 1080px canvas.
 */
function positionPrompt() {
  const pp = $('prompt-pill');
  const margin = 24;
  const gap = 28;
  const configuredScale = CFG.prompts.scale;
  const naturalW = Math.max(1, pp.offsetWidth);
  const naturalH = Math.max(1, pp.offsetHeight);
  let scale = configuredScale;
  let x = CFG.prompts.x;
  const y = Math.max(margin, Math.min(1920 - naturalH * scale - margin, CFG.prompts.y));

  const promptLeft = x - naturalW * scale / 2;
  const promptRight = x + naturalW * scale / 2;
  const promptBottom = y + naturalH * scale + 10;
  const overlapsJamie =
    promptRight > jamieRect.x - gap &&
    promptLeft < jamieRect.x + jamieRect.w + gap &&
    promptBottom > jamieRect.y - gap &&
    y < jamieRect.y + jamieRect.h + gap;

  if (overlapsJamie) {
    const leftSpace = Math.max(0, jamieRect.x - gap - margin);
    const rightStart = jamieRect.x + jamieRect.w + gap;
    const rightSpace = Math.max(0, 1080 - margin - rightStart);
    const useRight = rightSpace >= leftSpace;
    const available = useRight ? rightSpace : leftSpace;
    scale = Math.max(0.7, Math.min(configuredScale, available / naturalW));
    const renderedW = naturalW * scale;
    x = useRight
      ? Math.min(1080 - margin - renderedW / 2, rightStart + renderedW / 2)
      : Math.max(margin + renderedW / 2, jamieRect.x - gap - renderedW / 2);
  }

  pp.style.left = x + 'px';
  pp.style.top = y + 'px';
  pp.style.transform = `translateX(-50%) rotate(2deg) scale(${scale})`;
}

function applyLayout() {
  const j = CFG.jamie;
  /* An art package can declare how much of its canvas the character actually fills.
     The v2 Cleanup6 frames inset every drawing by >=82px so nothing clips at the
     canvas edge, which would otherwise render Jamie ~13% smaller than the previous
     art at the same jamie.width. Dividing by contentScale keeps jamie.width meaning
     the CHARACTER's on-screen width rather than the image box's, so swapping art
     never silently resizes him out from under a tuned layout. */
  const contentScale = (MANIFEST.canvas && MANIFEST.canvas.contentScale) || 1;
  const mc = MANIFEST.canvas || { width: 1200, height: 1400, floorAnchor: { y: 1320 } };
  const anchorFrac = (mc.floorAnchor?.y ?? 1320) / mc.height;
  const baseW = j.width * j.scale / contentScale;
  const baseH = jamieHeightFor(j.width) * j.scale / contentScale;
  /* Growth may still reach MAX LEVEL as a gameplay state, but its visible size
     must fit above the configured floor. At the default floor, uncapped 2x
     growth previously produced y=-145 and cut Jamie's head off. */
  const topSafe = 24;
  const floorAnchorY = CFG.floor.y + j.yOffset;
  const maxVisibleGrowth = Math.max(1, (floorAnchorY - topSafe) / (baseH * anchorFrac));
  const renderedGrowth = Math.min(growthScale(), maxVisibleGrowth);
  const w = baseW * renderedGrowth;
  const h = baseH * renderedGrowth;
  /* roamX is Jamie's live walked position. applyLayout runs on config changes and
     once a second during growth decay, so if it recomputed x from config every
     time it would teleport a roaming Jamie back home mid-step — the same class of
     bug that used to make the Heart Me sprint stutter. Honouring roamX here means
     roam survives every layout pass instead of needing a guard at each call site. */
  const homeX = j.side === 'right' ? (1080 - j.x - w) : j.x;
  jamieHomeX = homeX;
  const x = (roamX === null) ? homeX : Math.min(Math.max(roamX, 0), 1080 - w);
  /* anchor: bottom of sprite sits at floorY + yOffset (top-positioned; never CSS bottom) */
  const y = CFG.floor.y + j.yOffset - h * anchorFrac;
  jamieRect = { x, y, w, h };
  jamieEl.classList.toggle('rimmed', CFG.visuals.stickerBorder !== false);
  jamieEl.style.width  = w + 'px';
  jamieEl.style.height = h + 'px';
  applyJamieTransform();

  /* floor line */
  const fl = $('floor-line');
  fl.style.top = CFG.floor.y + 'px';
  fl.style.height = CFG.floor.thickness + 'px';
  fl.style.background = CFG.floor.color;
  const showFloor = CFG.debug.setupGuides || CFG.floor.liveVisible;
  fl.style.opacity = showFloor ? CFG.floor.opacity : 0;

  /* guides */
  $('guide-canvas').style.display = CFG.debug.setupGuides ? 'block' : 'none';
  $('safe-area').style.display = (CFG.debug.setupGuides && CFG.debug.showSafeArea) ? 'block' : 'none';
  const gfl = $('guide-floor-label');
  gfl.style.display = CFG.debug.setupGuides ? 'block' : 'none';
  gfl.style.top = (CFG.floor.y - 34) + 'px';
  gfl.textContent = 'floor Y = ' + CFG.floor.y;
  const rb = $('roam-band');
  if (rb) {
    const showBand = CFG.debug.setupGuides && CFG.roam.enabled;
    rb.style.display = showBand ? 'block' : 'none';
    rb.style.left = CFG.roam.xMin + 'px';
    rb.style.width = Math.max(0, CFG.roam.xMax - CFG.roam.xMin) + 'px';
    rb.style.top = (CFG.floor.y - 6) + 'px';
  }
  const jb = $('jamie-box');
  jb.style.display = (CFG.debug.setupGuides && CFG.debug.showJamieBox) ? 'block' : 'none';
  jb.style.left = x + 'px'; jb.style.top = y + 'px';
  jb.style.width = w + 'px'; jb.style.height = h + 'px';

  const rz = reachZoneRect();
  const rzv = $('reach-zone-vis');
  rzv.style.display = (CFG.debug.setupGuides && CFG.debug.showReachZone) ? 'block' : 'none';
  rzv.style.left = (rz.cx - rz.rx) + 'px'; rzv.style.top = (rz.cy - rz.ry) + 'px';
  rzv.style.width = rz.rx * 2 + 'px'; rzv.style.height = rz.ry * 2 + 'px';
  rzv.style.borderRadius = CFG.reachZone.shape === 'ellipse' ? '50%' : '18px';

  /* prompt + meter + event-label positions — all independently configurable
     (not auto-computed from Jamie's position) so they can be placed anywhere. */
  const pp = $('prompt-pill');
  positionPrompt();
  pp.style.background = `rgba(168, 85, 247, ${CFG.prompts.bgOpacity})`;
  fhLayout();   /* HUD card — also hides the pill above when it is on */
  const lm = $('like-meter');
  lm.style.left = CFG.visuals.likeMeterX + 'px';
  lm.style.top = CFG.visuals.likeMeterY + 'px';
  lm.style.transform = `rotate(2deg) scale(${CFG.visuals.likeMeterScale})`;
  lm.style.transformOrigin = '0 50%';
  const el = $('event-label');
  el.style.left = CFG.visuals.eventLabelX + 'px';
  el.style.top = CFG.visuals.eventLabelY + 'px';
  el.style.transform = `translateX(-50%) rotate(-1.5deg) scale(${CFG.visuals.eventLabelScale})`;
  applyGiftShowcaseLayout();
  if (typeof gameLayout === 'function' && jtEls) gameLayout();  /* aura/wheel/xp-tag track floor/Jamie moves */
}

/* ── wide wooden treat board layout: N cells side by side, each holding a
   gift image + one-word label, sized purely from CSS/flexbox (no baked art)
   so it scales cleanly at any width, height, font size, or slot count. ── */
const BOARD_FONT_REF_CELL_WIDTH = 120; /* label font size tuned at this per-cell width */
function ensureBoardCells(gs, n) {
  let cells = Array.from(gs.querySelectorAll('.gs-cell'));
  while (cells.length < n) {
    const cell = document.createElement('div');
    cell.className = 'gs-cell';
    const img = document.createElement('img');
    img.className = 'gs-cell-img';
    img.alt = '';
    const label = document.createElement('div');
    label.className = 'gs-cell-label';
    cell.appendChild(img);
    cell.appendChild(label);
    gs.appendChild(cell);
    cells.push(cell);
  }
  while (cells.length > n) { gs.removeChild(cells.pop()); }
  return cells;
}
function applyGiftShowcaseLayout() {
  const gs = $('gift-showcase');
  const sc = CFG.visuals.giftShowcase;
  const width = sc.width;
  const slots = sc.slots || 3;
  const cellWidth = width / slots;
  /* heightScale stretches the board taller than its default proportions for
     more label room, independent of width/slot count. */
  const height = cellWidth * 1.2 * (sc.heightScale || 1);
  let x = sc.x;
  if (sc.anchorToJamie) {
    const rightX = jamieRect.x + jamieRect.w + sc.gap;
    const leftX = jamieRect.x - sc.gap - width;
    x = CFG.jamie.side === 'right' ? leftX : rightX;
    if (x < 8) x = rightX;
    if (x + width > 1072) x = leftX;
  }
  x = Math.max(8, Math.min(1080 - width - 8, x));
  const y = CFG.floor.y + sc.floorOffset - height;
  gs.style.left = x + 'px';

      ? (trackBand === 'trackHigh' ? 'trackDiagonalUp' : 'trackDiagonalDown')
      : trackBand;
    /* Every non-forward tracking drawing faces right. Mirror it toward the
       object, but keep the previous side while the object is almost centered. */
    if (ax > 45) trackFacingLeft = dx < 0;
    if (trackFacingLeft === null) trackFacingLeft = false;
    if (poseMirror !== trackFacingLeft) { poseMirror = trackFacingLeft; applyJamieTransform(); }
  } else {
    trackDiagonal = false;
    /* Horizontal sweep. The mirror only shows on the quarter/side poses, and it is
       flipped while the FORWARD pose is on screen — a head-on frame is close to
       symmetric, so the swap is very nearly invisible. That is what turns a
       left-to-right cross into a rotation instead of a snap. */
    const ax = Math.abs(dx);
    if (ax < 45 && Math.abs(dy) < 100) {
      key = 'trackForward';
      if (trackFacingLeft === null) trackFacingLeft = false;
    } else if (dy < -100 && ax > 45) {
      /* The medium-height profile bridges a level side glance into the steeper
         diagonal/top poses while preserving the object's actual left/right side. */
      key = 'trackCenter';
      trackFacingLeft = dx < 0;
    } else {
      if (sweepBand === 'trackSide') { if (ax < SWEEP_OUT.side) sweepBand = 'trackQuarter'; }
      else if (sweepBand === 'trackQuarter') {
        if (ax > SWEEP_IN.side) sweepBand = 'trackSide';
        else if (ax < SWEEP_OUT.quarter) sweepBand = 'trackForward';
      } else {
        if (ax > SWEEP_IN.side) sweepBand = 'trackSide';
        else if (ax > SWEEP_IN.quarter) sweepBand = 'trackQuarter';
      }
      key = sweepBand;
      const wantMirror = dx < 0;
      if (sweepBand === 'trackForward') trackFacingLeft = wantMirror;   // flip while face-on
      else trackFacingLeft = trackFacingLeft === null ? wantMirror : trackFacingLeft;
      if (Math.abs(dx) > SWEEP_IN.quarter) trackFacingLeft = wantMirror;
    }
    if (poseMirror !== trackFacingLeft) { poseMirror = trackFacingLeft; applyJamieTransform(); }
  }

  const frame = SEQ[key][0].f;
  if (currentFrameFile !== frame) showFrame(frame);
}

/* one-shot look/miss interrupts (only from calm states) */
/* ── Petting: the streamer "pets" Jamie via a stroking hand motion on camera

let _jamieOneShotActive = false;

/* ── 9. OBJECT SYSTEM (DVD bounce physics) ─────────────────────── */
const objectsLayer = $('stage');
let objects = [];

// Body colliders (streamer's body shape) published by gesture-cam; treats bounce

let bodyParts = [], bodyPartsAt = -1e9, _bodyPingCh = null, _lastBodyPing = 0;
const BODY_PARTS_TTL = 2500;
// Closest point on segment (x1,y1)-(x2,y2) to point (px,py) — for capsule collision.
function closestOnSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy || 1e-6;
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));

let lastMissAt = 0;

function rand(min, max) { return min + Math.random() * (max - min); }

function spawnObject(itemType, opts = {}) {
  const def = ITEM_DEFS[itemType];
  if (!def) return null;
  const premium = opts.premium ?? def.premium;
  const speedMin = premium ? CFG.movement.premiumSpeedMin : CFG.movement.normalSpeedMin;
  const speedMax = premium ? CFG.movement.premiumSpeedMax : CFG.movement.normalSpeedMax;
  const speed = rand(speedMin, speedMax) * (def.speedFactor || 1);
  const w = def.width * CFG.movement.objectScale * (opts.sizeScale || 1);
  const h = w;
  /* direction: enforce min normalized components (never near-flat) */
  let nx = rand(0.35, 0.85) * (Math.random() < 0.5 ? -1 : 1);
  let ny = Math.sqrt(1 - nx * nx) * (Math.random() < 0.6 ? 1 : -1);
  let x, y;
  const lvl = opts.intensityLevel || 0;
  if (opts.startX != null) {
    /* squad toss: item launches upward from an explicit point (the crowd) */
    x = opts.startX - w / 2;
    y = (opts.startY != null ? opts.startY : CFG.floor.y - 20) - h;
    nx = Math.abs(nx) * (opts.dirX != null ? Math.sign(opts.dirX) : -1);
    ny = -Math.abs(ny);
  } else if (opts.entry === 'throw') {
    const fromLeft = CFG.jamie.side === 'right';
    x = fromLeft ? -w * 0.5 : 1080 - w * 0.5;
    y = rand(40, Math.max(80, CFG.floor.y * 0.35));
    nx = Math.abs(nx) * (fromLeft ? 1 : -1);
    ny = Math.abs(ny);
  } else {
    const minX = 40, maxX = 1080 - w - 40;
    /* bigger gifts intentionally spawn farther from Jamie so they take
       longer to bounce their way over — more time for the username tag
       and bigger item to stay on screen before he ever gets a shot. */
    const farBias = Math.min(1, Math.max(0, lvl - 1) * 0.22);
    const jamieOnLeft = CFG.jamie.side !== 'right';
    const uniformX = rand(minX, maxX);
    const farX = jamieOnLeft ? rand(minX + (maxX - minX) * 0.55, maxX) : rand(minX, minX + (maxX - minX) * 0.45);
    x = uniformX * (1 - farBias) + farX * farBias;
    y = rand(30, Math.max(60, CFG.floor.y - h - 60));
  }
  const el = document.createElement('div');
  el.className = 'fj-object';
  el.style.width = w + 'px'; el.style.height = h + 'px';
  const url = assetOverrides[def.file] ? assetOverrides[def.file] : CFG.assets.basePath + def.file + '?v=' + FJ_CACHE_BUST;
  if (assetAvailable[def.file]) {
    const img = document.createElement('img');
    img.src = url;
    img.onerror = () => { el.innerHTML = ITEM_SVGS[itemType] || ITEM_SVGS['treat-biscuit']; };
    el.appendChild(img);
  } else {
    el.innerHTML = ITEM_SVGS[itemType] || ITEM_SVGS['treat-biscuit'];
  }
  if (def.glow === 'gold') el.classList.add('premium-glow');
  if (def.glow === 'purple') el.classList.add('splat-glow');
  if (opts.username && CFG.visuals.usernameLabels && opts.showName) {
    const tag = document.createElement('div');
    tag.className = 'fj-obj-tag';
    tag.textContent = '@' + sanitizeName(opts.username);
    el.appendChild(tag);
    setTimeout(() => tag.remove(), (opts.nameSeconds || 1.5) * 1000);
  }
  objectsLayer.appendChild(el);
  const obj = {
    id: 'obj' + (++objectSeq), itemType, def,
    sourceEvent: opts.sourceEvent || 'manual',
    username: opts.username || null, message: opts.message || '',
    value: opts.value || 0,
    x, y, vx: nx * speed, vy: ny * speed, speed,
    w, h, radius: w * 0.42,
    rotation: rand(0, 360), angularVelocity: rand(-1, 1) * CFG.movement.spin,
    priority: opts.priority || 0,
    createdAt: performance.now(), age: 0,
    /* higher-level gifts get more total bounce time before guidance forces
       a catch — bigger spends buy the spotlight longer. */
    maxLifetime: (premium ? CFG.movement.maxLifetimePremium : CFG.movement.maxLifetimeNormal) * 1000 * (1 + Math.max(0, lvl - 1) * 0.2),
    captured: false, paused: false,
    cornerHitCount: 0, rewardLevel: premium ? 1 : 0,
    premium, intensityLevel: opts.intensityLevel || 0,
    lastHBounce: -9999, lastVBounce: -9999, lastBounceAt: 0,
    anticipated: false, nearMissArmed: true,
    squash: 0, el,
    assetPath: def.file

  if (J.state === 'SLEEPING') wakeIfSleeping();
  else if (J.state === 'IDLE') setJamieState('TRACKING');

}
/* shared wake path for any engagement (likes, comments, gifts, heartme, spawns, manual WAKE).
   Guarded so overlapping triggers within the wake animation's window don't restart it. */
let wakingUp = false;
function wakeIfSleeping() {
  if (J.state !== 'SLEEPING' || wakingUp) return;
  wakingUp = true;
  clearTimeout(J.sleepTwitchTimer);
  playSeq('wake', { loop: false });
  setTimeout(() => {

function removeObject(obj) {

function clearAllObjects() {
  showerTimers.forEach(t => clearTimeout(t));
  showerTimers = [];
  spawnQueue = [];
  objects.forEach(o => o.el.remove());
  objects = [];

function enforceMinDirection(obj) {
  const sp = Math.hypot(obj.vx, obj.vy) || 1;
  let nx = obj.vx / sp, ny = obj.vy / sp;
  const MIN = 0.3;
  if (Math.abs(nx) < MIN) nx = MIN * (nx < 0 ? -1 : 1);
  if (Math.abs(ny) < MIN) ny = MIN * (ny < 0 ? -1 : 1);
  const len = Math.hypot(nx, ny);
  obj.vx = (nx / len) * sp; obj.vy = (ny / len) * sp;

function stepObject(obj, dt, now) {
  if (obj.captured || obj.paused) return;
  obj.age = now - obj.createdAt;

  /* final-seconds guidance: bias trajectory toward the reach zone.
     Higher-level gifts get a shorter, gentler guidance window — they wander
     freely for most of their (also extended) lifetime instead of getting
     pulled in early, so bigger spends stay bouncing/on-screen longer. */
  const guideWindowMs = Math.max(1200, 5000 - (obj.intensityLevel || 0) * 700);
  /* Objects are normally steered toward Jamie so he reliably catches them. If he
     is ALSO walking to them, both sides converge and the catch looks robotic — so
     back the steering off while chasing and let his legs do the work. */
  const chaseMult = (CFG.roam.enabled && CFG.roam.chase) ? 0.4 : 1;
  const guideStrengthMult = Math.max(0.4, 1 - (obj.intensityLevel || 0) * 0.1) * chaseMult;
  if (CFG.movement.guidanceEnabled && obj.maxLifetime - obj.age < guideWindowMs && !obj.captured) {
    const rz = reachZoneRect();
    const tx = rz.cx - (obj.x + obj.w / 2), ty = rz.cy - (obj.y + obj.h / 2);
    const tlen = Math.hypot(tx, ty) || 1;
    const sp = Math.hypot(obj.vx, obj.vy);
    const k = CFG.movement.guidanceStrength * guideStrengthMult * dt * 1.6;
    obj.vx += (tx / tlen) * sp * k;
    obj.vy += (ty / tlen) * sp * k;
    const nsp = Math.hypot(obj.vx, obj.vy) || 1;
    obj.vx = obj.vx / nsp * sp; obj.vy = obj.vy / nsp * sp;
  }

  obj.x += obj.vx * dt;
  obj.y += obj.vy * dt;
  obj.rotation += obj.angularVelocity * dt;

  const floorY = CFG.floor.y;
  let hBounce = false, vBounce = false;
  if (obj.x <= 0)              { obj.x = 0;              obj.vx = Math.abs(obj.vx);  hBounce = true; }
  else if (obj.x + obj.w >= 1080) { obj.x = 1080 - obj.w; obj.vx = -Math.abs(obj.vx); hBounce = true; }
  if (obj.y <= 0)              { obj.y = 0;              obj.vy = Math.abs(obj.vy);  vBounce = true; }
  else if (obj.y + obj.h >= floorY) { obj.y = floorY - obj.h; obj.vy = -Math.abs(obj.vy); vBounce = true; }

  /* bounce off the streamer's body colliders (head circle / limb+torso capsules).
     Each part is treated as a static, immovable rounded shape: push the treat out
     along the surface normal and reflect its velocity. Only treats up in the
     camera region ever touch these, so this is cheap for the rest. */
  if (bodyParts.length && now - bodyPartsAt < BODY_PARTS_TTL) {
    const cx = obj.x + obj.w / 2, cy = obj.y + obj.h / 2, rr = obj.radius;
    for (const p of bodyParts) {

      if (p.t === 'c') { nearX = p.x; nearY = p.y; minD = rr + p.r; }
      else { const cp = closestOnSeg(cx, cy, p.x1, p.y1, p.x2, p.y2); nearX = cp.x; nearY = cp.y; minD = rr + p.r; }
      const dx = cx - nearX, dy = cy - nearY;
      const dist = Math.hypot(dx, dy) || 0.001;
      if (dist < minD) {
        const nx = dx / dist, ny = dy / dist;
        const push = minD - dist;

        if (now - obj.lastBounceAt > 80) { obj.lastBounceAt = now; if (CFG.movement.squashStretch) obj.squash = 1; playSound(obj.def.bounceSound || 'bounce'); }
        enforceMinDirection(obj);
      }
    }
  }

  if (hBounce || vBounce) {
    /* debounce double-trigger jitter */
    if (now - obj.lastBounceAt > 80) {
      obj.lastBounceAt = now;
      enforceMinDirection(obj);
      if (CFG.movement.squashStretch) { obj.squash = 1; }
      playSound(obj.def.bounceSound || 'bounce');
      if (hBounce) obj.lastHBounce = now;
      if (vBounce) obj.lastVBounce = now;
      /* corner jackpot */
      if (CFG.movement.cornerJackpot &&
          Math.abs(obj.lastHBounce - obj.lastVBounce) <= CFG.movement.cornerWindowMs) {
        const tol = CFG.movement.cornerTolerance;

        const nearY = obj.y <= tol || obj.y + obj.h >= floorY - tol;

  if (obj.age > obj.maxLifetime) {
    obj.el.style.transition = 'opacity .6s';
    obj.el.style.opacity = '0';
    obj.captured = true; /* stop physics */
    setTimeout(() => { removeObject(obj); if (!objects.length && ['TRACKING', 'ANTICIPATION'].includes(J.state)) setJamieState('IDLE'); drainQueue(); }, 650);

}
function renderObject(obj, dt) {

  const s = obj.squash;
  const sx = 1 + s * 0.14, sy = 1 - s * 0.14;

}
function cornerJackpot(obj) {
