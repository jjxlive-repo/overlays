  const cy = obj.y < CFG.floor.y / 2 ? obj.y + 10 : obj.y + obj.h - 10;
  spawnFx('star', cx, cy, 4 + Math.round(3 * CFG.visuals.cornerGlow));
}

/* reach zone collision (ellipse or rounded-rect), single trigger */
function checkReachZone(obj, now) {
  if (obj.captured || J.paused) return;
  if (!['TRACKING', 'ANTICIPATION', 'IDLE'].includes(J.state)) return;
  const rz = reachZoneRect();
  const cx = obj.x + obj.w / 2, cy = obj.y + obj.h / 2;
  const dx = cx - rz.cx, dy = cy - rz.cy;
  let inside, dist;
  if (CFG.reachZone.shape === 'ellipse') {
    const ex = dx / (rz.rx + obj.radius), ey = dy / (rz.ry + obj.radius);
    dist = Math.sqrt(ex * ex + ey * ey);
    inside = dist <= 1;
  } else {
    inside = Math.abs(dx) <= rz.rx + obj.radius && Math.abs(dy) <= rz.ry + obj.radius;
    dist = Math.max(Math.abs(dx) / (rz.rx + obj.radius), Math.abs(dy) / (rz.ry + obj.radius));
  }
  const edgeDist = Math.hypot(dx, dy) - Math.max(rz.rx, rz.ry) - obj.radius;

  /* anticipation (once per object) — leans/faces toward whichever side the
     object is actually approaching from, mirroring the real art if needed. */
  if (!inside && !obj.anticipated && edgeDist < CFG.reachZone.anticipationDistance &&
      ['TRACKING', 'IDLE'].includes(J.state)) {
    obj.anticipated = true;
    const mirror = cx < (jamieRect.x + jamieRect.w / 2);
    if (obj.def.reaction === 'bubble' && (assetAvailable['jamie-bubble-01-spot.png'])) {
      setJamieState('ANTICIPATION', { mirror }); playSeq('bubble', { loop: false });
    } else if (obj.premium && assetAvailable['jamie-premium-01-catch.png']) {
      setJamieState('ANTICIPATION', { mirror }); playSeq('premium', { loop: false });
    } else {
      setJamieState('ANTICIPATION', { mirror });
    }
  }
  /* near miss: passed close but is now leaving */
  if (!inside && obj.anticipated && obj.nearMissArmed && edgeDist > 0 &&
      edgeDist < CFG.reachZone.nearMissDistance &&
      (dx * obj.vx + dy * obj.vy) > 0 && now - lastMissAt > 8000) {
    obj.nearMissArmed = false;
    lastMissAt = now;
    if (['TRACKING', 'ANTICIPATION'].includes(J.state)) {
      const seq = (assetAvailable['jamie-conf-01-cock.png'] && Math.random() < 0.4) ? 'confused' : 'miss';
      jamieOneShot(seq, seq === 'confused' ? 900 : 800);
    }

}
/* Pluck-steal: the gesture engine (gesture-cam.html) publishes a one-shot
   'gesture-event' {type:'pluck', x, y} when the streamer pinches on camera.
   If a live treat is near that point, the STREAMER takes it instead of Jamie —
   it zips to the pinch point, shrinks, sparkles, and never reaches the dog. */
function pluckSteal(px, py) {
  let best = null, bestD = 180; // grab radius in canvas px
  for (const o of objects) {
    if (o.captured || o.paused) continue;
    const d = Math.hypot(o.x + o.w / 2 - px, o.y + o.h / 2 - py);
    if (d < bestD) { bestD = d; best = o; }
  }
  if (!best) return;
  const obj = best;
  obj.captured = true; /* stop physics + take it out of Jamie's reach checks */
  obj.el.classList.remove('jackpot-glow');
  playSound(obj.def.catchSound);
  const fromX = obj.x, fromY = obj.y;
  const toX = px - obj.w / 2, toY = py - obj.h / 2;
  const start = performance.now(), dur = 320;
  /* same rAF-stall safety net captureObject uses */
  setTimeout(() => { if (!obj.finished) { obj.finished = true; removeObject(obj); drainQueue(); } }, dur + 1500);
  const ease = t => 1 - Math.pow(1 - t, 2.2);
  (function animSteal(nowT) {
    const t = Math.min(1, (nowT - start) / dur);
    const e = ease(t);
    obj.x = fromX + (toX - fromX) * e;
    obj.y = fromY + (toY - fromY) * e;
    obj.el.style.transform = `translate3d(${obj.x}px, ${obj.y}px, 0) rotate(${obj.rotation * (1 - e)}deg) scale(${1 - e * 0.75})`;
    if (t < 1) requestAnimationFrame(animSteal);
    else {
      if (obj.finished) return;
      obj.finished = true;
      spawnFx('sparkle', px, py, 7);
      const tag = document.createElement('div');
      tag.className = 'fj-obj-tag';
      tag.textContent = copyText('pluck', 'YOURS! 🤏');
      tag.style.cssText = `position:absolute;left:${px - 60}px;top:${py - 70}px;transition:transform 1s ease, opacity 1s ease;`;
      objectsLayer.appendChild(tag);
      requestAnimationFrame(() => { tag.style.transform = 'translateY(-60px)'; tag.style.opacity = '0'; });
      setTimeout(() => tag.remove(), 1100);
      removeObject(obj);
      drainQueue();
      if (!objects.length && ['TRACKING', 'ANTICIPATION'].includes(J.state)) setJamieState('IDLE');
    }
  })(start);
}

function captureObject(obj) {
  if (obj.captured) return;
  obj.captured = true;
  obj.el.classList.remove('jackpot-glow');
  const r = REACTION_SEQ[obj.def.reaction] || REACTION_SEQ.treat;
  const seqName = r.payoff;
  /* during an L5 item shower, occasionally swap in the "still hungry" nom pose
     as the celebrate beat so the rapid-fire catches don't feel identical */
  let celebrateSeq = r.celebrate;
  if (obj.sourceEvent === 'gift-shower' && assetAvailable['jamie-nom-01.png'] && Math.random() < 0.5) {
    celebrateSeq = 'showerNom';
  }
  const mirror = MIRROR_PAYOFF_REACTIONS.has(obj.def.reaction)
    ? (obj.x + obj.w / 2) < (jamieRect.x + jamieRect.w / 2)

  }

  const now = Date.now();
  if (/^points|^pts/i.test(m[1])) {
    if (!CFG.game.points.balanceCommand) return true;
    if (v.balAt && now - v.balAt < 30000) return true;   /* balance replies capped at 2/min/user */

  if (CFG.events.giftFallbackEnabled === false) return;

let floatActive = [];
let floatSlotSeq = 0;
function showGiftFloat(mapping, username, rawGiftName) {
  const cfgF = CFG.visuals.giftFloatText;
  if (!cfgF.enabled) return;
  const defaults = GIFT_ACTION_DEFAULTS[mapping.itemType] || {};
  const mainText = mapping.floatText || defaults.floatText || ('+ ' + (GIFT_ITEM_LABELS[mapping.itemType] || 'GIFT') + '!').toUpperCase();
  const key = (username || '') + '|' + (rawGiftName || '');
  const now = performance.now();
  floatActive = floatActive.filter(f => f.el.isConnected);
  const existing = floatActive.find(f => f.key === key && now - f.t <= cfgF.aggregateWindowMs);
  if (existing) {  /* same gift + sender in quick succession: bump to ×N */
    existing.count++; existing.t = now;
    existing.el.querySelector('.fj-gift-float-main').textContent = mainText + ' ×' + existing.count;
    return;
  }
  if (floatActive.length >= cfgF.maxVisible) {
    const oldest = floatActive.shift();
    oldest.el.remove();
  }
  const el = document.createElement('div');
  el.className = 'fj-gift-float';
  const main = document.createElement('div');
  main.className = 'fj-gift-float-main';
  main.textContent = mainText;
  const sub = document.createElement('div');
  sub.className = 'fj-gift-float-sub';
  const withSender = cfgF.showSender && username && CFG.visuals.usernameEvents.gift;
  sub.textContent = withSender ? '@' + sanitizeName(username) + ' • ' + (rawGiftName || '') : (rawGiftName || '');
  el.appendChild(main); el.appendChild(sub);
  /* each concurrent float gets its own rotating vertical slot — not just the
     current array length, which plateaus at (maxVisible - 1) forever once
     the buffer fills and the oldest keeps getting shifted out, which is why
     everything past the first few used to land in the exact same spot —
     plus a small alternating side jitter so near-simultaneous gifts read as
     genuinely separate bubbles floating out of Jamie independently. */
  const slot = floatSlotSeq % cfgF.maxVisible;
  floatSlotSeq++;
  const jitterX = (slot % 2 === 0 ? -1 : 1) * (14 + (slot % 3) * 8);
  const x = jamieRect.x + jamieRect.w / 2 + cfgF.xOffset + jitterX;
  const y = jamieRect.y + cfgF.yOffset - slot * 48;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.setProperty('--float-duration', cfgF.durationMs + 'ms');
  el.style.setProperty('--float-rise', cfgF.risePx + 'px');
  $('gift-float-layer').appendChild(el);
  const rec = { el, key, count: 1, t: now };
  floatActive.push(rec);
  const cleanup = () => { el.remove(); floatActive = floatActive.filter(f => f !== rec); };
  el.addEventListener('animationend', cleanup);
  setTimeout(cleanup, cfgF.durationMs + 600);  /* safety if animation events stall */
}

function spawnFx(kind, x, y, count) {

  const def = FX_GLYPHS[kind] || FX_GLYPHS.sparkle;
  const n = Math.min(count, cap - fxCount);

    if (def.color) el.style.color = def.color;

    $('effects').appendChild(el);
    const dx = rand(-70, 70), dy = def.rise < 0 ? rand(-140, -60) : rand(30, 90);
    const dur = rand(600, 1100);
    el.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    el.style.opacity = '1';
    el.style.transition = `transform ${dur}ms ease-out, opacity ${dur}ms ease-in`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transform = `translate3d(${x + dx}px, ${y + dy * Math.abs(def.rise)}px, 0) rotate(${rand(-40, 40)}deg)`;
      el.style.opacity = '0';
    }));

}

/* ── 14. MAIN LOOP ─────────────────────────────────────────────── */
let lastFrame = performance.now();
let growthDecayAccum = 0;
let rafId = null;
function tick(now) {
  rafId = requestAnimationFrame(tick);
  let dt = (now - lastFrame) / 1000;
  lastFrame = now;
  if (dt > 0.05) dt = 0.05;  /* clamp after tab-hidden gaps */
  if (J.paused || J.hidden) return;
  petTick(now);
  // ping gesture-cam ~every 2s while we have treats, so it only scans/publishes
  // the body-colliders while there's actually something to bounce off it
  if (objects.length && _bodyPingCh && now - _lastBodyPing > 2000) {
    _lastBodyPing = now;
    _bodyPingCh.publish('fj-active', {}).catch(() => {});
  }
  /* growth decay: shrink slowly back toward 1x (layout refresh throttled to ~1/s).
     Skip the refresh while Heart Me/Jackpot are running — they hand-manage
     jamieRect.x/jamieEl's transform (the Heart Me run-to-center-and-back
     tween, the Jackpot scale-up), and this periodic applyLayout() would
     silently reset that mid-sequence, snapping Jamie back to his resting
     position and making the run look like it glitches/restarts. Both
     already call applyLayout() themselves once they finish. */
  if (CFG.growth.enabled && growth > 1 && CFG.growth.decayPerMinute > 0) {
    growth = Math.max(1, growth - CFG.growth.decayPerMinute * dt / 60);
    growthDecayAccum += dt;
    if (growthDecayAccum >= 1) {
      growthDecayAccum = 0; saveGrowth();
      if (!heartMeActive && !jackpotActive) applyLayout();
    }
  }
  if (CFG.events.sleepEnabled && J.state === 'IDLE' && !objects.length && !_petActive && !roamMoving() &&
      (now - lastEngagementAt) > CFG.events.sleepAfterSec * 1000) {
    setJamieState('SLEEPING');
  }
  updateRoam(dt, now);
  const active = objects.filter(o => !o.captured);
  for (const o of objects) stepObject(o, dt, now);
  /* while he is walking, roam owns the frame — head-tracking poses would fight
     the trot cycle for the same sprite */

function sqPickWedge(tier) {
  const wts = WHEEL_WEIGHTS[Math.min(4, Math.max(1, tier))];
  const sum = wts.reduce((a, b) => a + b, 0);
  let r = Math.random() * sum;
  for (let i = 0; i < wts.length; i++) { r -= wts[i]; if (r <= 0) return i; }
  return 0;
}
let sqWheelRot = 0;
function sqSpinWheel({ tier, username }) {
  sqWheelBusy = true;
  const w = $('squad-wheel');
  const disc = w.querySelector('.sq-wheel-disc');
  const cap = w.querySelector('.sq-wheel-caption');
  cap.textContent = username
    ? copyText('wheelSpinUser', '@{username} spins for Jamie…', { username: sanitizeName(username) })
    : copyText('wheelSpinAnon', 'treat wheel…');
  const wedge = sqPickWedge(tier);
  const item = WHEEL_ITEMS[wedge];
  const xp = CFG.game.spin.baseXp[Math.min(3, Math.max(0, tier - 1))] * WHEEL_MULT[wedge];
  /* pointer at top: land wedge center under it */
  const target = 360 * 4 + (360 - (wedge * 45 + 22.5));
  sqWheelRot += target - (sqWheelRot % 360);
  w.classList.remove('hide', 'landed');
  w.classList.add('show');
  disc.style.transition = 'none';
  disc.style.transform = `rotate(${sqWheelRot - target}deg)`;
  void disc.offsetWidth;
  disc.style.transition = `transform ${CFG.wheel.spinMs}ms cubic-bezier(.12,.68,.16,1)`;
  disc.style.transform = `rotate(${sqWheelRot}deg)`;
  playSound('bounce');
  /* timers, not transitionend — must complete even in a throttled tab */
  setTimeout(() => {
    w.classList.add('landed');
    const winner = username ? '@' + sanitizeName(username) : 'chat';
    const itemLabel = GIFT_ITEM_LABELS[item] || item;
    cap.textContent = xp > 0
      ? copyText('wheelWin', '{winner} won a {item} · +{xp} XP!', { winner, item: itemLabel, xp: xp.toLocaleString() })
      : copyText('wheelBust', '{winner} — BUST! Jamie keeps the {item} 😅', { winner, item: itemLabel });
    playSound(xp > 0 ? 'jackpot' : 'pop');
    setTimeout(() => {
      w.classList.remove('show', 'landed');
      w.classList.add('hide');
      sqWheelBusy = false;
      /* the prize launches from the wheel toward Jamie, whichever side he is on */
      const jamieOnLeft = CFG.jamie.side !== 'right';
      queueSpawn(item, {
        sourceEvent: 'spin', username,
        priority: 80, premium: WHEEL_MULT[wedge] >= 2, showName: !!CFG.visuals.usernameEvents.gift,
        nameSeconds: CFG.visuals.usernameSeconds * 1.5,

         gifts still have theirs via the intensity ladder */

      drainWheelQueue();
    }, CFG.wheel.holdMs);
  }, CFG.wheel.spinMs + 150);
}

/* ── 15. COMMS: Ably + BroadcastChannel + localStorage ─────────── */
let bc = null, ablyChannel = null;
/* The controller fires every message over BroadcastChannel + Ably + localStorage
   at once (only Ably crosses into TikTok Studio, but any overlay copy sharing
   the controller's browser origin — preview iframe, monitoring tab — receives
   all three). send() stamps a fresh _mid per call, so a repeated _mid is the
   same message on another transport, never a new command. */
const seenMids = [];
function processMessage(msg) {
  if (!msg || !msg.cmd) return;
  if (msg._mid) {
    if (seenMids.includes(msg._mid)) return;
    seenMids.push(msg._mid);
    if (seenMids.length > 80) seenMids.splice(0, 40);
  }
  switch (msg.cmd) {
    case 'CONFIG_UPDATE':
      CFG = fjDeepMerge(fjClone(FJ_DEFAULT_CONFIG), msg.data || {});
      fjValidateConfig();
      applyLayout(); promptLoop(); giftShowcaseLoop(); applyMotionVar();
      break;
    case 'SPAWN_ITEM':
      if (msg.data && ITEM_DEFS[msg.data.itemType]) spawnObject(msg.data.itemType, msg.data.options || {});
      break;
    case 'TRIGGER_EVENT': handleEvent(msg.data || {}); break;
    case 'CLEAR_ALL': clearAllObjects(); break;
    case 'PAUSE':  setPaused(true);  break;
    case 'RESUME': setPaused(false); break;
    case 'HIDE':   setHidden(true);  break;
    case 'SHOW':   setHidden(false); break;
    case 'RESET_STATE': forceReset('control'); break;
    case 'RESET_GROWTH': resetGrowth(); break;
    case 'XP_RESET': resetXp(); break;
    case 'XP_ADD': addXp(Math.max(0, Math.round(+((msg.data || {}).amount) || 0)), (msg.data || {}).username || null); break;
    case 'POINTS_RESET': resetPoints(); break;
    case 'POINTS_ADD': {
      const d = msg.data || {};
      if (d.username) { addPoints(d.username, Math.max(0, Math.round(+d.amount || 0))); publishStatus(true); }
      break;
    }
    case 'SPIN_TEST': {
      const d = msg.data || {};
      queueWheelSpin({ tier: Math.min(4, Math.max(1, Math.round(+d.tier || 1))), username: d.username || 'test_viewer' });
      break;
    }
    case 'FX_REACT': { const d = msg.data || {}; reactToFx(String(d.kind || ''), +d.x); break; }
    case 'GIFT_SIGN_NEXT': giftShowcaseLoop(); break;   /* advance the wooden sign immediately */
    case 'TEST_GIFT_FLOAT': {
      const d = msg.data || {};
      const n = Math.min(Math.max(Math.round(+d.count || 1), 1), 8);
      for (let i = 0; i < n; i++) {
        setTimeout(() => showGiftFloat(
          { itemType: d.itemType || 'treat-biscuit' },
          d.username || 'test_viewer',
          d.giftName || 'Rose'
        ), i * 150);
      }
      break;
    }
    case 'TEST_SUPERCHAT':
      handleSuperchat({ amount: (msg.data && msg.data.amount) || 5, name: (msg.data && msg.data.username) || 'yt_viewer' });
      break;
    case 'SETUP_GUIDES':
      CFG.debug = fjDeepMerge(CFG.debug, msg.data || {});
      applyLayout();
      break;
    case 'ASSET_UPDATE':
      if (msg.data && msg.data.file) {
        if (msg.data.dataURL) assetOverrides[msg.data.file] = msg.data.dataURL;
        else delete assetOverrides[msg.data.file];
        try { localStorage.setItem(FJ_LS_ASSETS, JSON.stringify(assetOverrides)); } catch (e) {}
        assetAvailable[msg.data.file] = !!msg.data.dataURL || assetAvailable[msg.data.file];
        fjLoadAssets();
      }
      break;
    case 'RELOAD_ASSETS':
      try { assetOverrides = JSON.parse(localStorage.getItem(FJ_LS_ASSETS) || '{}'); } catch (e) {}
      fjLoadAssets();
      break;
    case 'REQUEST_STATUS': publishStatus(true); break;
    case 'PLAY_SOUND': if (msg.data && msg.data.sound) playSound(msg.data.sound); break;
    case 'FORCE_CATCH': { const o = objects.find(x => !x.captured); if (o) captureObject(o); break; }
    case 'FORCE_MISS': jamieOneShot('miss', 800); break;
    case 'FORCE_TIMEOUT': { const o = objects.find(x => !x.captured); if (o) o.createdAt = performance.now() - o.maxLifetime - 1; break; }
    case 'FORCE_JACKPOT': { const o = objects.find(x => !x.captured); if (o) cornerJackpot(o); break; }
    case 'SLEEP': if (['IDLE', 'TRACKING'].includes(J.state)) setJamieState('SLEEPING'); break;
    case 'WAKE': wakeIfSleeping(); break;
  }
}
let statusTimer = null, statusDirty = false;
function publishStatus(immediate) {

        objectCount: objects.filter(o => !o.captured).length,

        queued: spawnQueue.length,

        likeProgress: likeAccumulator, likesPerTreat: CFG.events.likesPerTreat,
        growth: Math.round(growth * 100) / 100,
        lastEvent: lastEventInfo,
        game: (() => {
          const info = xpLevelInfo();

            .sort((a, b) => b.pts - a.pts).slice(0, 3)

            queuedSpins: wheelQueue.length + (sqWheelBusy ? 1 : 0),
            viewerCount: Object.keys(ptsState.viewers).length,

          };
        })(),
        warnings: assetWarnings.slice(0, 40),
        assetAvailable: Object.fromEntries(Object.entries(assetAvailable)),
        ts: Date.now()
      }
    };
    try { if (bc) bc.postMessage(status); } catch (e) {}
    try { if (ablyChannel) ablyChannel.publish(FJ_ABLY_MSG_OUT, status).catch(() => {}); } catch (e) {}
    try { localStorage.setItem(FJ_LS_STATUS, JSON.stringify({ n: Math.random(), s: status })); } catch (e) {}
  };
  if (immediate) send();
  else statusTimer = setTimeout(send, 1000);
}
function initComms() {
  try {
    bc = new BroadcastChannel(FJ_BC_NAME);
    bc.onmessage = e => { if (e.data && e.data.cmd !== 'STATUS_UPDATE') processMessage(e.data); };
  } catch (e) {}
  window.addEventListener('storage', e => {
    if (e.key === FJ_LS_MSG && e.newValue) {
      try { const wrap = JSON.parse(e.newValue); processMessage(wrap.p); } catch (err) {}
    }
    if (e.key === FJ_LS_CONFIG && e.newValue) {
      try { CFG = fjDeepMerge(fjClone(FJ_DEFAULT_CONFIG), JSON.parse(e.newValue)); fjValidateConfig(); applyLayout(); promptLoop(); giftShowcaseLoop(); applyMotionVar(); } catch (err) {}
    }
  });
  /* The old `window.Ably` guard is gone with the SDK: the transport is the dock socket
     via JJX.dockRealtime, which needs no Ably global. Left in place it always tripped,
     silently disabling this page's realtime. */
  if (!FJ_IS_MIRROR) {
    try {
      const ably = JJX.dockRealtime({ fallbackKey: FJ_ABLY_KEY });
      ablyChannel = ably.channels.get(FJ_ABLY_CH);
      ablyChannel.subscribe(FJ_ABLY_MSG_IN, m => processMessage(m.data));
      /* stream-dock already publishes YouTube Super Chats here (name/amount
         in USD/type). Feed Jamie piggybacks on this existing broadcast
         instead of opening its own YouTube connection. gift-alert lives on
         its own 'splat-gifts' channel now (split off the busy chat/gift
         firehose 'splat-overlay') — Feed Jamie never needs raw chat volume
         at all, so this moves it off 100% of that cost, not just a slice. */
      const giftsChannel = ably.channels.get('splat-gifts');
      giftsChannel.subscribe('gift-alert', m => {
        const d = m.data || {};
        if (d.type === 'youtube_superchat' && (+d.amount || 0) > 0) handleSuperchat(d);
        else if (d.type === 'youtube_jewels' && (+d.amount || 0) > 0) handleJewels(d);
      });
      /* gesture engine: streamer pinched on camera → steal the nearest treat for
         them. Rides the DEDICATED near-silent 'gesture-events' channel (same
         connection, second channel) — not the busy shared channel — so gesture
         consumers never pay Ably delivery costs for the chat/gift firehose. */
      const gestureCh = ably.channels.get('gesture-events');
      gestureCh.subscribe('gesture-event', m => {
        const d = m.data || {};
        if (d.type === 'pet') handlePet();
      });
      /* body-colliders/fj-active are high-frequency while Feed Jamie is active, so
         they live on their OWN channel ('jamie-signals') rather than 'gesture-events'.
         Ably bills every message to every attached client regardless of which event
         name it subscribed to, so if this rode the shared channel, gesture-fx-overlay
         and bomb-drop-overlay would be billed for it too despite never reading it. */
      const jamieCh = ably.channels.get('jamie-signals');
      // Body colliders — the streamer's body shape (head/torso/arms), detected by
      // gesture-cam.html via pose landmarks. Treats bounce off these (see stepObject).
      jamieCh.subscribe('body-colliders', m => {
        const d = m.data || {};
        if (Array.isArray(d.parts)) { bodyParts = d.parts; bodyPartsAt = performance.now(); }
      });
      // Tell gesture-cam we have treats on screen so it only scans/publishes the
      // body while there's something to bounce (gated, keeps Ably cost down).
      _bodyPingCh = jamieCh;
      /* Spin The Screen camera beats. Jamie sits at the cam/gameplay seam, right under
         the wheel overlay's effects, but Studio composites them as separate sources —
         so the wheel broadcasts its frame-level beats and we move ourselves. The
         implementation is shared (jjx-core) so all twelve overlays move on the SAME
         curve and origin; the effect depends entirely on them not drifting apart.
         Reuses this page's existing socket rather than opening a second one. */
      JJX.cameraBeats({ client: ably });
      /* semantic wheel beats — see reactToFx. Validated here rather than trusted:
         a malformed publish must never leave Jamie stuck in a reaction pose. */
      try {
        ably.channels.get('wheel-fx').subscribe('impact', m => {
          const d = (m && m.data) || {};
          const x = Number(d.x);
          if (!['water', 'glass', 'strike', 'object', 'press'].includes(d.kind)) return;
          reactToFx(d.kind, Number.isFinite(x) ? x : undefined);
        });
        ably.channels.get('wheel-fx').subscribe('jamie-cue', m => {
          const d = (m && m.data) || {};
          if (!['anticipate', 'look', 'confused', 'chase', 'celebrate'].includes(d.cue)) return;
          const x = Number(d.x);
          reactToWheelCue(d.cue, Number.isFinite(x) ? x : undefined, String(d.tier || ''));
        });
      } catch (e) {}
      ably.connection.on('connected',    () => $('conn-dot').classList.add('connected'));
      ably.connection.on('disconnected', () => $('conn-dot').classList.remove('connected'));
      ably.connection.on('suspended',    () => $('conn-dot').classList.remove('connected'));
    } catch (e) {}
  }
}
function setPaused(v) {
  J.paused = v;
  if (v) { J.state === 'PAUSED' || setJamieState('PAUSED'); }
  else setJamieState(objects.length ? 'TRACKING' : 'IDLE');
  publishStatus(true);
}
function setHidden(v) {
  J.hidden = v;
  jamieEl.classList.toggle('hidden-state', v);
  $('stage').style.opacity = v ? 0 : 1;
  if (v) setJamieState('HIDDEN');
  else setJamieState(objects.length ? 'TRACKING' : 'IDLE');
  publishStatus(true);
}

/* ── 16. PUBLIC API ────────────────────────────────────────────── */
window.feedJamie = {
  handleEvent,
  spawnItem: (type, options) => spawnObject(type, options || {}),
  triggerHeartMe,
  triggerSubscribe,
  pet: handlePet,
  get petActive() { return _petActive; },
  /* roam surface — lets the walk be driven and inspected without waiting on the
     main loop (browser sources get their timers clamped when backgrounded) */
  get roam() {
    return { x: roamX, homeX: jamieHomeX, rectX: jamieRect.x,
             targetX: RM.targetX, vx: RM.vx, moving: roamMoving(), seq: RM.seq,
             mirror: poseMirror, enabled: CFG.roam.enabled };
  },
  _roamSet(o) {
    o = o || {};
    if (o.x !== undefined) roamX = o.x;
    if (o.targetX !== undefined) RM.targetX = o.targetX;
    if (o.stoppedAt !== undefined) RM.stoppedAt = o.stoppedAt;
  },
  _roamStep(dt, steps) {
    for (let i = 0; i < (steps || 1); i++) updateRoam(dt || 0.05, performance.now());
  },
  _applyLayout: () => applyLayout(),
  get bodyParts() { return bodyParts; },
  _setBodyParts(parts) { bodyParts = parts; bodyPartsAt = performance.now(); },
  setFloorY: v => { CFG.floor.y = Math.min(Math.max(+v || 500, CFG.floor.min), CFG.floor.max); applyLayout(); },
  setJamiePosition: opts => { CFG.jamie = fjDeepMerge(CFG.jamie, opts || {}); applyLayout(); },
  setPaused,
  clearAll: clearAllObjects,
  hide: () => setHidden(true),
  show: () => setHidden(false),
  testEvent: type => {
    const t = String(type || '').toLowerCase();
    if (t === 'like') handleEvent({ type: 'like', count: CFG.events.likesPerTreat });
    else if (t === 'comment') handleEvent({ type: 'comment', username: 'test_viewer', message: 'ball' });
    else handleEvent({ type: t, username: 'test_viewer', value: t === 'gift' ? 500 : 0, giftName: 'Test' });
  },
  getState: () => ({
    state: J.state, paused: J.paused, hidden: J.hidden, growth,
    objects: objects.map(o => ({ id: o.id, itemType: o.itemType, x: o.x, y: o.y, captured: o.captured })),
    queued: spawnQueue.length,
    reactionQueued: jamieReactionQueue.length,
    reactionActive: activeJamieReaction ? activeJamieReaction.kind : null,
    likeAccumulator, warnings: assetWarnings.slice(),
    xp: xpState.xp, level: xpLevelInfo().level,
    config: fjClone(CFG)
  }),
  resetGrowth,
  reloadAssets: fjLoadAssets,
  getConfig: () => fjClone(CFG)
};

/* ── 17. BOOT ──────────────────────────────────────────────────── */
applyLayout();
applyMotionVar();
showFrame('jamie-idle-01-in.png', { instant: true });
setJamieState('IDLE');
promptLoop();
giftShowcaseLoop();
initComms();
fjLoadAssets();
gameBoot();
/* The ribbon's shrink-to-fit measures text, so it has to run again once Baloo 2
   actually lands — the fallback metrics differ enough to mis-size the CTA. */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { try { fhFitRibbon(); } catch (e) {} });
rafId = requestAnimationFrame(tick);
</script>
