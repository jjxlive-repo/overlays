<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FOLLOW METER — Overlay</title>
<!--
  Implements the "Painted Splat" design handoff (design_handoff_splatties_overlay).
  Sticker language: heavy near-black knockout strokes, hard zero-blur offset
  shadows, hand-cut radii, slight tilt, and NO translucent plates — a half-opaque
  plate reads as default UI and inverts against dark gameplay.

  Platform safe zones are hard constraints, not preferences:
    y 0-170 live badge · y 1270+ comments/gifts · x 900+ action rail.
  Everything lives in the y170-1270 band.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1920px;
    background: transparent;              /* OBS composites real alpha */
    overflow: hidden;
    font-family: 'Fredoka', sans-serif;
  }

  /* ── Knockout type: the core technique. paint-order is MANDATORY — without it
     the stroke paints over the glyph from the inside and eats the letterform. */
  .ko {
    color: #FFFFFF;
    -webkit-text-stroke: 12px #0d0d12;
    paint-order: stroke fill;
    text-shadow: 0 10px 0 #0d0d12;        /* hard, zero blur */
  }

  /* ══ SCREEN 2 — PROGRESS METER (always on) ══════════════════════ */
  #meter {
    position: absolute; left: 44px; top: 200px;
    z-index: 5;                            /* above the splat */
    opacity: 0; transition: opacity .35s ease;
  }
  #meter.show { opacity: 1; }
  #meter-rot { transform: rotate(-1.25deg); transform-origin: left center; }
  #meter-labelrow {
    display: flex; align-items: baseline; gap: 14px; margin-bottom: 12px;
  }
  #meter-label {
    font-family: 'Fredoka', sans-serif; font-weight: 700;
    font-size: 34px; letter-spacing: .14em; text-transform: uppercase;
    color: #fff; -webkit-text-stroke: 5px #0d0d12; paint-order: stroke fill;
    text-shadow: 0 10px 0 #0d0d12;
  }
  #meter-count {
    font-family: 'Boogaloo', cursive; font-size: 58px; color: #FDE047;
    -webkit-text-stroke: 6px #0d0d12; paint-order: stroke fill;
    text-shadow: 0 10px 0 #0d0d12; white-space: nowrap;
  }
  #meter-count .tgt { font-size: 44px; color: #fff; }
  #meter-track {
    display: flex; gap: 5px; align-items: stretch;
    width: 452px; height: 52px; padding: 6px;
    background: rgba(13,13,18,0.8);
    border: 6px solid #0d0d12;
    border-radius: 16px;
    box-shadow: 0 8px 0 rgba(13,13,18,0.6), inset 0 3px 0 rgba(0,0,0,0.5);
  }
  #meter-track .seg {
    flex: 1; border-radius: 5px;
    background: rgba(255,255,255,0.15);    /* empty must stay visible over light gameplay */
    transform-origin: center;
  }
  #meter-track .seg.on {
    background: #38BDF8;
    box-shadow: inset 0 4px 0 rgba(255,255,255,0.5);
  }
  /* The cap marks the GOAL, not progress — wider, and gold in every resting state. */
  #meter-track .seg.cap {
    flex: 1.35; background: #FDE047;
    box-shadow: inset 0 4px 0 rgba(255,255,255,0.6), 0 0 14px rgba(253,224,71,0.9);
  }

  /* ══ SCREEN 1 — FOLLOWER ALERT ═════════════════════════════════ */
  #alert-scene { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  /* 650x850 at (215,280) is the solution to three constraints at once — the splat
     body fills only the middle ~63% of the GIF box, the impact squash reaches
     y339 (meter bottom is y321), and the band must end above y1270. Do not tidy. */
  #alert-gifbox {
    position: absolute; left: 215px; top: 280px; width: 650px; height: 850px;
    display: flex; align-items: center; justify-content: center;
  }
  #alert-gifbox > * { width: 100%; height: 100%; object-fit: contain; display: block; }
  #alert-band {
    position: absolute; left: 0; top: 975px; width: 1080px;
    padding: 0 70px; z-index: 4;
    opacity: 0;
  }
  #alert-rot {
    display: inline-block; transform: rotate(-2deg); isolation: isolate;
    position: relative;
  }
  /* Halo must be a child of the ROTATED wrapper and sized with inset — sizing it
     off the full-width band leaves a dark smudge past the text and misses the
     lower line. This is what buys legibility over busy video. */
  #alert-halo {
    position: absolute; inset: -40px -60px -30px -50px; z-index: -1;
    background: rgba(13,13,18,0.72); filter: blur(46px); border-radius: 50%;
  }
  #alert-chip {
    display: inline-block; margin-bottom: 14px;
    border: 7px solid #0d0d12;
    border-radius: 10px 34px 14px 30px;    /* hand-cut */
    box-shadow: 0 10px 0 rgba(13,13,18,.9);
    padding: 9px 38px 11px;
    font-family: 'Fredoka', sans-serif; font-weight: 700;
    font-size: 38px; letter-spacing: .12em; text-transform: uppercase;
  }
  #alert-hero {
    font-family: 'Boogaloo', cursive; font-size: 94px; line-height: 1.05;
    color: #fff; -webkit-text-stroke: 12px #0d0d12; paint-order: stroke fill;
    text-shadow: 0 10px 0 #0d0d12;
  }

  /* ══ SCREEN 3 — MILESTONE ══════════════════════════════════════ */
  #ms-scene {
    position: absolute; left: 0; top: 820px; width: 1080px; z-index: 7;
    display: flex; flex-direction: column; align-items: center; gap: 22px;
    opacity: 0; pointer-events: none;
  }
  #ms-kicker {
    background: #A855F7;                   /* purple appears ONLY here */
    border: 7px solid #0d0d12; border-radius: 10px 34px 14px 30px;
    box-shadow: 0 10px 0 rgba(13,13,18,.9);
    padding: 9px 40px 11px; transform: rotate(-2deg);
    font-family: 'Fredoka', sans-serif; font-weight: 700;
    font-size: 38px; letter-spacing: .16em; text-transform: uppercase; color: #fff;
  }
  #ms-hero {
    font-family: 'Boogaloo', cursive; font-size: 118px; line-height: .98;
    text-align: center; color: #FDE047; transform: rotate(-2deg);
    -webkit-text-stroke: 12px #0d0d12; paint-order: stroke fill;
    text-shadow: 0 10px 0 #0d0d12;
  }
  #ms-next {
    background: #0d0d12; border: 5px solid #fff; border-radius: 14px;
    padding: 7px 26px 9px; opacity: 0;
    font-family: 'Fredoka', sans-serif; font-weight: 600;
    font-size: 30px; letter-spacing: .10em; text-transform: uppercase; color: #38BDF8;
  }
  /* ══ SCREEN 4 — ANTHEM DROP ════════════════════════════════════ */
  /* Fireworks sit BEHIND everything (z1). 486x864 is exactly 9:16, so it fills
     the frame with no crop. */
  #anthem-gifbox {
    position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
    z-index: 1; opacity: 0; pointer-events: none;
  }
  #anthem-gifbox > * { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Reuses the alert's band geometry, but red-on-bursts with no hero line under it. */
  #anthem-band {
    position: absolute; left: 0; top: 975px; width: 1080px;
    padding: 0 70px; z-index: 4; opacity: 0;
  }
  #anthem-rot { display: inline-block; transform: rotate(-2deg); }
  #anthem-chip {
    display: inline-block; background: #EF4444; color: #fff;
    border: 7px solid #0d0d12; border-radius: 10px 34px 14px 30px;
    box-shadow: 0 10px 0 rgba(13,13,18,.9);
    padding: 9px 38px 11px;
    font-family: 'Fredoka', sans-serif; font-weight: 700;
    font-size: 38px; letter-spacing: .12em; text-transform: uppercase;
  }

  #confetti { position: absolute; inset: 0; z-index: 6; pointer-events: none; overflow: hidden; }
  #confetti i {
    position: absolute; display: block;
    border: 4px solid #0d0d12;             /* outline is what keeps dabs visible over bright gameplay */
  }
</style>
</head>
<body>

<div id="meter">
  <div id="meter-rot">
    <div id="meter-labelrow">
      <span id="meter-label">FOLLOWS/SUBS</span>
      <span id="meter-count">0 <span class="tgt">/ 10</span></span>
    </div>
    <div id="meter-track"></div>
  </div>
</div>

<div id="anthem-gifbox"></div>
<div id="anthem-band">
  <div id="anthem-rot"><span id="anthem-chip">★ Anthem drop</span></div>
</div>

<div id="alert-scene">
  <div id="alert-gifbox"></div>
  <div id="alert-band">
    <div id="alert-rot">
      <div id="alert-halo"></div>
      <div id="alert-chip"></div>
      <div id="alert-hero"><span id="alert-user"></span><br><span id="alert-verb"></span></div>
    </div>
  </div>
</div>

<div id="ms-scene">
  <div id="ms-kicker">Milestone unlocked</div>
  <div id="ms-hero"></div>
  <div id="ms-next"></div>
</div>
<div id="confetti"></div>

<audio id="sfx"></audio>

<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<script src="jjx-core.js?v=7"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════
const FM_LS_COUNT  = 'followMeter.count.v1';
const FM_LS_CONFIG = 'followMeter.config.v1';
const FM_LS_ASSETS = 'followMeter.assets.v1';
const FM_LS_MSG    = 'followMeter.msg';
const FM_BC_NAME   = 'follow-meter-control';

const SLOTS = ['tiktok_follow', 'youtube_follow', 'youtube_sub', 'milestone', 'anthem'];

// Per the handoff: one component, three tokens. Only chip fill/ink/copy, the verb
// and the username colour change between event types.
const TYPE_TOKENS = {
  tiktok_follow:  { fill: '#38BDF8', ink: '#0d0d12', chip: '♪ Followed on TikTok',    verb: 'followed!',   user: '#38BDF8' },
  youtube_follow: { fill: '#EF4444', ink: '#FFFFFF', chip: '▶ Followed on YouTube',   verb: 'followed!',   user: '#F87171' },
  youtube_sub:    { fill: '#FDE047', ink: '#0d0d12', chip: '★ Subscribed on YouTube', verb: 'subscribed!', user: '#FDE047' },
};

const DEFAULT_CONFIG = {
  milestoneEvery: 10,
  meter: { label: 'FOLLOWS/SUBS', x: 0, y: 0, scale: 1, visible: true },
  alertDurationSec: 6,            // handoff default; 4–11 supported
  anthemDurationSec: 10.4,        // covers the 10.9s firework cycle
  impactOffsetMs: 0,              // ±300ms sync fine-tune against the real stream
  // Every on-screen element is independently placeable. x/y/scale are offsets ON
  // TOP of the handoff's measured positions, so 0/0/1 is always the design.
  elements: {
    alertText:  { x: 0, y: 0, scale: 1 },
    milestone:  { x: 0, y: 0, scale: 1 },
    anthemGif:  { x: 0, y: 0, scale: 1 },
    anthemChip: { x: 0, y: 0, scale: 1 },
  },
  // Per-slot splat placement + size. scale is NOT clamped to 1 — an uploaded gif
  // can be blown up past the design box or shrunk right down.
  alerts: {
    tiktok_follow:  { x: 0, y: 0, scale: 1, mediaPct: 100 },
    youtube_follow: { x: 0, y: 0, scale: 1, mediaPct: 100 },
    youtube_sub:    { x: 0, y: 0, scale: 1, mediaPct: 100 },
    milestone:      { x: 0, y: 0, scale: 1, mediaPct: 100 },
  },
};

const deepMerge = JJX.deepMerge, clone = JJX.clone;
let CFG = clone(DEFAULT_CONFIG);
try { const s = JSON.parse(localStorage.getItem(FM_LS_CONFIG) || 'null'); if (s) CFG = deepMerge(CFG, s); } catch (e) {}

let ASSETS = {};
try { ASSETS = JSON.parse(localStorage.getItem(FM_LS_ASSETS) || '{}'); } catch (e) {}

const DOCK_BASE = JJX.dockBase('http://127.0.0.1:4317');
const OVERLAY_NAME = 'follow-meter';
const MIRROR = JJX.isMirror();

// Shipped defaults. A per-slot upload overrides these; without one the overlay
// still looks like the design instead of showing nothing.
const DEFAULT_MEDIA = {
  splat:     'assets/follow-meter/follow-alert.gif',
  smack:     'assets/follow-meter/smack.mp3',
  fireworks: 'assets/follow-meter/anthem-fireworks2.gif',
  anthem:    'assets/follow-meter/anthem.mp3',
};

let count = 0;
try { count = parseInt(localStorage.getItem(FM_LS_COUNT)) || 0; } catch (e) {}
let OVERLAY_ENABLED = false;
document.body.style.display = 'none';

function assetSrc(a) {
  if (!a) return null;
  if (a.url) return a.url.startsWith('http') ? a.url : DOCK_BASE + a.url;
  return a.dataURL || null;
}

async function loadFromDock() {
  try {
    const res = await fetch(`${DOCK_BASE}/overlay-public/${OVERLAY_NAME}/config`, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const p = await res.json();
    if (p.config && Object.keys(p.config).length) {
      CFG = deepMerge(CFG, p.config);
      try { localStorage.setItem(FM_LS_CONFIG, JSON.stringify(CFG)); } catch (e) {}
    }
    if (p.assets && Object.keys(p.assets).length) {
      ASSETS = p.assets;
      try { localStorage.setItem(FM_LS_ASSETS, JSON.stringify(ASSETS)); } catch (e) {}
    }
    applyLayout(); renderMeter();
    return true;
  } catch (err) {
    console.warn('[follow-meter] dock unreachable, using cached config:', err.message);
    return false;
  }
}

// ═══════════════════════════════════════════════════════════════════
// LAYOUT — config x/y/scale are offsets ON TOP of the handoff positions
// ═══════════════════════════════════════════════════════════════════
/** Offsets ON TOP of the handoff's measured position for one element. */
function place(id, key, origin) {
  const e = (CFG.elements && CFG.elements[key]) || {};
  const el = document.getElementById(id);
  if (!el) return;
  el.style.transformOrigin = origin || 'center center';
  el.style.transform = `translate(${e.x || 0}px, ${e.y || 0}px) scale(${e.scale || 1})`;
}

function applyLayout() {
  const m = CFG.meter || {};
  const meter = document.getElementById('meter');
  meter.style.transform = `translate(${m.x || 0}px, ${m.y || 0}px) scale(${m.scale || 1})`;
  meter.style.transformOrigin = 'left top';
  meter.classList.toggle('show', OVERLAY_ENABLED && m.visible !== false);
  document.getElementById('meter-label').textContent = m.label || 'FOLLOWS/SUBS';

  place('alert-band', 'alertText', 'center center');
  place('ms-scene', 'milestone', 'center center');
  place('anthem-gifbox', 'anthemGif', 'center center');
  place('anthem-band', 'anthemChip', 'center center');
}

function applyAlertOffset(slot) {
  const a = (CFG.alerts && CFG.alerts[slot]) || {};
  // Deliberately NOT clamped: an uploaded gif can be scaled up past the design's
  // 650x850 box or shrunk right down. It grows from the box's centre so it stays
  // put rather than drifting toward a corner.
  const frac = Math.max(0.1, Math.min(3, ((a.mediaPct == null ? 100 : a.mediaPct) / 100) * (a.scale || 1)));
  const w = 650 * frac, h = 850 * frac;
  const box = document.getElementById('alert-gifbox');
  box.style.width = w + 'px';
  box.style.height = h + 'px';
  box.style.left = (215 + (650 - w) / 2 + (a.x || 0)) + 'px';
  box.style.top  = (280 + (850 - h) / 2 + (a.y || 0)) + 'px';
}

// ═══════════════════════════════════════════════════════════════════
// METER — shows only the CURRENT TIER of `every`
// ═══════════════════════════════════════════════════════════════════
function tier() {
  const every = Math.max(1, CFG.milestoneEvery || 10);
  const base = Math.floor(count / every) * every;
  return { every, base, lit: count - base, target: base + every };
}
function buildTrack(every) {
  const track = document.getElementById('meter-track');
  if (track.childElementCount === every) return track;
  track.innerHTML = '';
  for (let i = 0; i < every; i++) track.appendChild(document.createElement('div'));
  return track;
}
function paintSegments(lit, every, allGold) {
  const track = buildTrack(every);
  for (let i = 0; i < every; i++) {
    const isCap = i === every - 1;
    // The cap stays gold in EVERY resting state, including right after a drain.
    track.children[i].className = 'seg' + (isCap || allGold ? ' cap' : (i < lit ? ' on' : ''));
  }
  return track;
}
function renderMeter() {
  const t = tier();
  paintSegments(t.lit, t.every, false);
  setCountText(count, t.target);
  try { localStorage.setItem(FM_LS_COUNT, String(count)); } catch (e) {}
}
function setCountText(cur, target) {
  document.getElementById('meter-count').innerHTML =
    `${cur.toLocaleString()} <span class="tgt">/ ${target.toLocaleString()}</span>`;
}
function popSegment(i) {
  const track = document.getElementById('meter-track');
  const el = track.children[i];
  if (!el) return;
  el.animate([{ transform: 'scaleY(1)' }, { transform: 'scaleY(1.4)' }, { transform: 'scaleY(1)' }],
    { duration: 260, easing: 'ease-out' });
}

// ═══════════════════════════════════════════════════════════════════
// MEDIA — GIFs play ONCE. The handoff flags that follow-alert.gif loops every
// 1.5s, so over a 6s alert the splat smacks four times and slides through the
// text each time; intent is one smack. Rather than re-cutting the asset, decode
// it and play each frame once on a canvas, freezing on the last frame.
// ═══════════════════════════════════════════════════════════════════
const _gifCache = new Map();          // url -> parsed gif (decode once, replay free)

/** Each container owns its player, so the fireworks and the splat — which can be
 *  on screen together — never cancel one another. */
function stopGif(container) {
  if (container && container._stop) { container._stop(); container._stop = null; }
}
async function mountGif(url, container) {
  stopGif(container);
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  container.appendChild(canvas);
  try {
    let gif = _gifCache.get(url);
    if (!gif) {
      const buf = await (await fetch(url)).arrayBuffer();
      gif = JJX.parseGIF(buf);
      _gifCache.set(url, gif);
    }
    if (canvas !== container.firstChild) return 0;   // superseded
    if (!gif.frames.length) throw new Error('no frames');
    container._stop = JJX.playGifOnce(canvas, gif);
    return gif.frames.reduce((n, f) => n + Math.max(20, f.delay || 100), 0);
  } catch (e) {
    if (canvas !== container.firstChild) return 0;
    const img = document.createElement('img');       // last resort: let it loop
    img.src = url;
    container.innerHTML = '';
    container.appendChild(img);
    return 0;
  }
}

// One sound at a time — an anthem landing mid-alert must not double up.
function playSfx(url) {
  if (MIRROR || !url) return;
  const el = document.getElementById('sfx');
  el.pause(); el.currentTime = 0;
  el.src = url;
  el.play().catch(() => {});
}

// ═══════════════════════════════════════════════════════════════════
// QUEUE — alerts play one at a time; a milestone pre-empts and plays alone.
// The COUNT increments on arrival, not on play, or the meter drifts in a storm.
// ═══════════════════════════════════════════════════════════════════
let queue = [];
let busy = false;

function handleFollowEvent(slot, username) {
  if (!OVERLAY_ENABLED) return;
  count++;
  const t = tier();
  renderMeter();
  queue.push({ kind: 'alert', slot, username: username || 'someone' });
  if (count % t.every === 0) queue.push({ kind: 'milestone', value: count });
  pump();
}
function resetCount() { count = 0; renderMeter(); }

async function pump() {
  if (busy || !queue.length || !OVERLAY_ENABLED) return;
  busy = true;
  const item = queue.shift();
  try {
    if (item.kind === 'milestone') await runMilestone(item.value);
    else if (item.kind === 'anthem') await runAnthem();
    else await runAlert(item);
  } catch (e) { console.warn('[follow-meter]', e); }
  busy = false;
  pump();
}

const wait = ms => new Promise(r => setTimeout(r, ms));
const OVERSHOOT = 'cubic-bezier(.34,1.56,.64,1)';

// ── Screen 1 ──────────────────────────────────────────────────────
async function runAlert(item) {
  const tok = TYPE_TOKENS[item.slot] || TYPE_TOKENS.tiktok_follow;
  const up = ASSETS[item.slot] || {};
  const gifUrl = assetSrc(up.gif) || DEFAULT_MEDIA.splat;
  const sfxUrl = assetSrc(up.audio) || DEFAULT_MEDIA.smack;

  const chip = document.getElementById('alert-chip');
  chip.textContent = tok.chip;
  chip.style.background = tok.fill;
  chip.style.color = tok.ink;

  const user = document.getElementById('alert-user');
  const verb = document.getElementById('alert-verb');
  user.textContent = item.username;
  user.style.color = tok.user;
  verb.textContent = tok.verb;
  // Auto-shrink rather than wrap mid-name or push the verb to a third line.
  const n = item.username.length;
  document.getElementById('alert-hero').style.fontSize = n > 16 ? '62px' : n > 12 ? '76px' : '94px';

  applyAlertOffset(item.slot);
  const band = document.getElementById('alert-band');
  band.style.opacity = '0';

  const gifMs = await mountGif(gifUrl, document.getElementById('alert-gifbox'));
  playSfx(sfxUrl);

  // Impact at 0.22s — the whole alert is timed to the smack peak.
  await wait(Math.max(0, 220 + (CFG.impactOffsetMs || 0)));
  band.style.opacity = '1';
  band.animate(
    [{ transform: 'translateY(46px) scale(.86)', opacity: 0 },
     { transform: 'translateY(0) scale(1)', opacity: 1 }],
    { duration: 260, easing: OVERSHOOT, fill: 'both' });

  const holdMs = Math.max(4000, Math.min(11000, (CFG.alertDurationSec || 6) * 1000));
  // Never cut the animation off part-way — hold at least as long as the gif runs.
  await wait(Math.max(holdMs, gifMs + 400) - 220);

  await band.animate(
    [{ transform: 'translateY(0) scale(1)', opacity: 1 },
     { transform: 'translateY(50px) scale(.9)', opacity: 0 }],
    { duration: 280, easing: 'ease-in', fill: 'both' }).finished.catch(() => {});
  band.style.opacity = '0';
  stopGif(document.getElementById('alert-gifbox'));
  document.getElementById('alert-gifbox').innerHTML = '';
}

// ── Screen 3 ──────────────────────────────────────────────────────
async function runMilestone(value) {
  const every = Math.max(1, CFG.milestoneEvery || 10);
  const scene = document.getElementById('ms-scene');
  const hero = document.getElementById('ms-hero');
  const next = document.getElementById('ms-next');
  const meter = document.getElementById('meter');
  const up = ASSETS.milestone || {};

  hero.textContent = `${value.toLocaleString()} ${(CFG.meter && CFG.meter.label) || 'FOLLOWS'}!`;
  next.textContent = `Next up — ${(value + every).toLocaleString()}`;
  next.style.opacity = '0';

  const gifUrl = assetSrc(up.gif);
  if (gifUrl) mountGif(gifUrl, document.getElementById('alert-gifbox'));
  playSfx(assetSrc(up.audio));

  // 0 → 0.35s: the meter pops in place, alone.
  meter.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.28)' }, { transform: 'scale(1)' }],
    { duration: 350, easing: 'ease-in-out' });
  meter.animate([{ filter: 'drop-shadow(0 0 0 rgba(253,224,71,0))' },
                 { filter: 'drop-shadow(0 0 60px rgba(253,224,71,.9))' },
                 { filter: 'drop-shadow(0 0 0 rgba(253,224,71,0))' }],
    { duration: 350, easing: 'ease-in-out' });
  await wait(350);

  // 0.35 → 0.75s: the bar completes, left → right.
  const track = document.getElementById('meter-track');
  for (let i = 0; i < every; i++) {
    setTimeout(() => {
      if (track.children[i]) track.children[i].className = 'seg cap';
      popSegment(i);
    }, i * 40);
  }
  setTimeout(() => setCountText(value, value), 400);   // 20 / 20, not 20 / 30

  // 0.6 → 1.0s: centre group in.
  await wait(250);
  scene.style.opacity = '1';
  scene.animate([{ transform: 'translateY(40px) scale(.8)', opacity: 0 },
                 { transform: 'translateY(0) scale(1)', opacity: 1 }],
    { duration: 400, easing: OVERSHOOT, fill: 'both' });

  await wait(200);
  spawnConfetti();                                     // 0.8s

  await wait(2400);                                    // → 3.2s
  next.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: 'both' });
  next.style.opacity = '1';

  await wait(1000);                                    // → 4.2s: drain right → left
  for (let i = every - 1; i >= 0; i--) {
    setTimeout(() => {
      if (!track.children[i]) return;
      track.children[i].className = 'seg' + (i === every - 1 ? ' cap' : '');
      popSegment(i);
    }, (every - 1 - i) * 40);
  }
  setTimeout(() => setCountText(value, value + every), 400);   // 20 / 30

  scene.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.9)', opacity: 0 }],
    { duration: 800, easing: 'ease-in', fill: 'both' });
  await wait(800);                                     // → 5.0s
  scene.style.opacity = '0';
  document.getElementById('confetti').innerHTML = '';
  stopGif(document.getElementById('alert-gifbox'));
  document.getElementById('alert-gifbox').innerHTML = '';
  renderMeter();
}

// ── Screen 4 — Anthem Drop ────────────────────────────────────────
// Manually triggered hype moment. Red chip over red/white/blue bursts reads as
// patriotic without introducing a new colour; the hero line stays hidden.
async function runAnthem() {
  const up = ASSETS.anthem || {};
  const gifUrl = assetSrc(up.gif) || DEFAULT_MEDIA.fireworks;
  const sfxUrl = assetSrc(up.audio) || DEFAULT_MEDIA.anthem;

  const box = document.getElementById('anthem-gifbox');
  const band = document.getElementById('anthem-band');
  box.style.opacity = '1';
  band.style.opacity = '0';

  const gifMs = await mountGif(gifUrl, box);
  playSfx(sfxUrl);                       // playSfx resets the shared element first

  // First burst at 0.21s — the chip lands on it, same curve as the alert but slower.
  await wait(Math.max(0, 210 + (CFG.impactOffsetMs || 0)));
  band.style.opacity = '1';
  band.animate(
    [{ transform: 'translateY(46px) scale(.86)', opacity: 0 },
     { transform: 'translateY(0) scale(1)', opacity: 1 }],
    { duration: 340, easing: OVERSHOOT, fill: 'both' });

  const holdMs = Math.max(4000, Math.min(11000, (CFG.anthemDurationSec || 10.4) * 1000));
  await wait(Math.max(holdMs, gifMs + 400) - 210);

  await Promise.all([
    band.animate([{ transform: 'translateY(0) scale(1)', opacity: 1 },
                  { transform: 'translateY(50px) scale(.9)', opacity: 0 }],
      { duration: 400, easing: 'ease-in', fill: 'both' }).finished.catch(() => {}),
    box.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'both' }).finished.catch(() => {}),
  ]);
  band.style.opacity = '0';
  box.style.opacity = '0';
  stopGif(box);
  box.innerHTML = '';
}

// 54 dabs from (540,980). The 4px ink outline is what keeps them readable over
// bright gameplay — without it they vanish into light backgrounds.
function spawnConfetti() {
  const layer = document.getElementById('confetti');
  layer.innerHTML = '';
  const COLORS = ['#FDE047', '#A855F7', '#38BDF8', '#F87171'];
  const bits = [];
  for (let i = 0; i < 54; i++) {
    const el = document.createElement('i');
    const size = 18 + Math.random() * 28;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.background = COLORS[i % COLORS.length];
    el.style.borderRadius = Math.random() < 0.5 ? '50%' : '8px';
    layer.appendChild(el);
    const ang = Math.random() * Math.PI * 2;
    const sp = 380 + Math.random() * 720;
    bits.push({ el, x: 540, y: 980, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 320,
                rot: Math.random() * 360, vr: (Math.random() - 0.5) * 420 });
  }
  let last = performance.now(), alive = true;
  setTimeout(() => { alive = false; }, 4200);
  (function step(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    for (const b of bits) {
      b.vy += 780 * dt;                    // gravity
      b.vx *= (1 - 0.5 * dt);              // horizontal drag
      b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
      b.el.style.transform = `translate(${b.x}px, ${b.y}px) rotate(${b.rot}deg)`;
    }
    if (alive) requestAnimationFrame(step);
  })(last);
}

// ═══════════════════════════════════════════════════════════════════
// COMMS
// ═══════════════════════════════════════════════════════════════════
const handleCmd = JJX.createReceiver({ bcName: FM_BC_NAME, lsMsgKey: FM_LS_MSG, handler: handleCmdInner });

function handleCmdInner(msg) {
  switch (msg.cmd) {
    case 'CONFIG_UPDATE':
      CFG = deepMerge(CFG, msg.data || {});
      applyLayout(); renderMeter();
      break;
    case 'ASSET_UPDATE':
      applyAssetUpdate(msg.data || {});
      break;
    case 'ASSETS_REFRESH':
      loadFromDock();
      break;
    case 'TEST_FIRE': {
      const slot = msg.data && msg.data.slot;
      if (slot === 'milestone') { queue.push({ kind: 'milestone', value: count || (CFG.milestoneEvery || 10) }); pump(); }
      else handleFollowEvent(slot, (msg.data && msg.data.username) || 'TestViewer');
      break;
    }
    case 'FIRE_ANTHEM':
      queue.push({ kind: 'anthem' });
      pump();
      break;
    case 'RESET_COUNT': resetCount(); break;
    case 'SET_ENABLED':
      if (handleToggle) handleToggle(!!(msg.data && msg.data.enabled));
      break;
  }
}
function applyAssetUpdate({ slot, kind, mime, dataURL, url }) {
  if (!SLOTS.includes(slot) || (kind !== 'gif' && kind !== 'audio')) return;
  if (!ASSETS[slot]) ASSETS[slot] = {};
  if (url) ASSETS[slot][kind] = { mime, url };
  else if (dataURL) ASSETS[slot][kind] = { mime, dataURL };
  else delete ASSETS[slot][kind];
  try { localStorage.setItem(FM_LS_ASSETS, JSON.stringify(ASSETS)); } catch (e) {}
}

let handleToggle = null;
let eventBus = null;
function connectTransport() {
  // Ably only as the bus's fallback — a reachable dock means zero Ably messages.
  const wantFallback = JJX.param('ablyFallback') !== '0';
  const client = wantFallback ? new Ably.Realtime({ key: JJX.ABLY_KEY }) : null;

  function attach() {
    OVERLAY_ENABLED = true;
    document.body.style.display = 'block';
    applyLayout(); renderMeter();
    loadFromDock();
  }
  function detach() {
    OVERLAY_ENABLED = false;
    document.body.style.display = 'none';
  }
  handleToggle = on => (on ? attach() : detach());

  eventBus = JJX.createOverlayBus({
    ably: client,
    onStatus: (s, why) => console.info('[follow-meter] transport:', s, why || ''),
  });
  eventBus.on('splat-chat', 'milk-event', d => {
    if (!OVERLAY_ENABLED) return;
    d = d || {};
    if (d.type === 'follow' && d.username) {
      handleFollowEvent(d.platform === 'tt' ? 'tiktok_follow' : 'youtube_follow', d.username);
    } else if (d.type === 'yt_sub' && d.username) {
      handleFollowEvent('youtube_sub', d.username);
    }
  });
  eventBus.on(`overlay-cmd:${OVERLAY_NAME}`, 'cmd', d => handleCmd(d));
  eventBus.on(JJX.ABLY_MAIN_CHANNEL, 'follow-meter-cmd', d => handleCmd(d));

  // A socket can't replay a toggle sent while this page was closed.
  fetch(`${DOCK_BASE}/overlay-public/${OVERLAY_NAME}/config`, { cache: 'no-store' })
    .then(r => r.json()).then(p => { if (p.config && p.config.enabled) attach(); })
    .catch(() => {});
}

if (MIRROR) {
  OVERLAY_ENABLED = true;
  document.body.style.display = 'block';
  handleToggle = () => {};
  applyLayout();
} else {
  connectTransport();
}
loadFromDock();
renderMeter();
</script>
