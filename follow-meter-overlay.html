<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FOLLOW METER — Overlay</title>
<!-- The house fonts, same link gift-bar.html uses. This page declared 'Fredoka'
     but never LOADED a font, so it silently fell back to the system sans-serif —
     which is why it read flat next to the other Splatty overlays. Boogaloo is the
     playful hero face those overlays use for big numbers and banners. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: 'Fredoka', 'Nunito', sans-serif;
  }
  #conn-dot {
    display: none;
    position: fixed; top: 12px; right: 12px;
    width: 12px; height: 12px; border-radius: 50%;
    background: #555; z-index: 9999;
  }

  /* ── METER PILL ───────────────────────────────────────────────── */
  #meter {
    position: fixed; left: 50%; top: 60px;
    transform-origin: top center;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    opacity: 0; transition: opacity .35s ease;
    z-index: 20;
  }
  #meter.show { opacity: 1; }
  /* No pill/chip behind the text — it reads straight over the stream, so it leans
     on a heavy text-shadow for legibility instead of a plate. */
  #meter-pill {
    display: flex; align-items: baseline; gap: 12px;
    padding: 0 4px;
  }
  #meter-label {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700; font-size: 28px; letter-spacing: .05em;
    color: #fff; text-transform: uppercase;
    text-shadow: 0 2px 6px rgba(0,0,0,0.85), 0 0 18px rgba(0,0,0,0.6);
  }
  #meter-count {
    font-family: 'Boogaloo', cursive;
    font-weight: 400; font-size: 46px; letter-spacing: .02em; color: #FDE047;
    text-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 16px rgba(253,224,71,0.45);
  }
  /* Segmented track: one block per follow in the current tier, so progress is
     countable at a glance instead of a smooth bar you have to eyeball. */
  #meter-track {
    display: flex; gap: 5px;
    width: 420px; height: 30px;
  }
  #meter-track .seg {
    flex: 1 1 0; height: 100%;
    border-radius: 5px;
    background: rgba(255,255,255,0.13);
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow: 0 2px 6px rgba(0,0,0,0.45);
    transition: background .25s ease, box-shadow .25s ease;
  }
  #meter-track .seg.on {
    background: linear-gradient(180deg, #7DE3FF, #38BDF8);
    border-color: rgba(255,255,255,0.75);
    box-shadow: 0 0 12px rgba(56,189,248,0.75), 0 2px 6px rgba(0,0,0,0.45);
  }
  /* The block that completes the tier lands on the milestone colour. */
  #meter-track .seg.on.last {
    background: linear-gradient(180deg, #FDE047, #F59E0B);
    box-shadow: 0 0 14px rgba(253,224,71,0.85), 0 2px 6px rgba(0,0,0,0.45);
  }

  /* ── ALERT STAGE — the media is absolutely positioned over the FULL
     1080×1920 canvas so a gif can go edge-to-edge (its cap is mediaPct, set
     per slot from the control). The text is an overlaid caption pinned near
     the bottom, so it never steals height from the media the way an in-flow
     column did (which boxed even a "100%" gif into the upper ~half). */
  #alert-pos {
    position: fixed; left: 0; top: 0; width: 1080px; height: 1920px;
    z-index: 30; pointer-events: none;
  }
  #alert-stage {
    position: absolute; inset: 0;
    opacity: 0;
    transform: scale(0.92);
    transform-origin: center;
    transition: opacity .28s ease, transform .28s ease;
  }
  #alert-stage.show {
    opacity: 1; transform: scale(1);
  }
  #alert-media-wrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #alert-media-wrap img, #alert-media-wrap video, #alert-media-wrap canvas {
    /* width/height are set inline per-slot (mediaPct of the full canvas) */
    object-fit: contain;
    display: block;
    /* No drop-shadow: on a transparent gif it haloes the artwork, but on an opaque
       rectangular one it outlines the whole frame — which reads as a border box
       drawn around the gif. The overlay is meant to be a wide-open canvas. */
  }
  #alert-text {
    position: absolute; left: 50%; bottom: 150px;
    transform: translateX(-50%);
    max-width: 900px;
    text-align: center;
    font-family: 'Boogaloo', cursive;
    font-weight: 400; font-size: 58px; line-height: 1.15; letter-spacing: .01em;
    color: #fff;
    padding: 12px 34px;
    border-radius: 18px;
    background: rgba(10,10,16,0.55);
    border: 2px solid rgba(255,255,255,0.2);
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  #alert-text.tiktok { border-color: rgba(56,189,248,0.7); }
  #alert-text.youtube { border-color: rgba(248,113,113,0.7); }
  #alert-text.milestone {
    border-color: rgba(253,224,71,0.85);
    background: rgba(40,30,0,0.55);
    color: #FDE047;
  }
</style>
</head>
<body>
<div id="conn-dot"></div>

<div id="meter">
  <div id="meter-pill">
    <span id="meter-label">FOLLOWERS</span>
    <span id="meter-count">0 / 10</span>
  </div>
  <div id="meter-track"></div>
</div>

<div id="alert-pos">
  <div id="alert-stage">
    <div id="alert-media-wrap"></div>
    <div id="alert-text"></div>
  </div>
</div>

<audio id="alert-audio"></audio>

<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<script src="jjx-core.js?v=7"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
// CONFIG / CONSTANTS — shared helpers live in jjx-core.js (window.JJX)
// ═══════════════════════════════════════════════════════════════════
const ABLY_KEY = JJX.ABLY_KEY;
const ABLY_CH  = JJX.ABLY_MAIN_CHANNEL;

const FM_LS_COUNT   = 'followMeter.count.v1';
const FM_LS_CONFIG  = 'followMeter.config.v1';
const FM_LS_ASSETS  = 'followMeter.assets.v1';
const FM_LS_MSG     = 'followMeter.msg';
const FM_BC_NAME    = 'follow-meter-control';

const SLOTS = ['tiktok_follow', 'youtube_follow', 'youtube_sub', 'milestone'];

const DEFAULT_CONFIG = {
  milestoneEvery: 10,
  meter: { label: 'FOLLOWERS', x: 0, y: 0, scale: 1, visible: true },
  alertDurationSec: 4.5,
  // Each alert type gets its own position/scale — a milestone banner and a
  // tiny follow ping don't belong in the same spot. mediaPct is how much of the
  // full 1080×1920 canvas the gif/video may fill (100 = edge to edge), so a big
  // celebration gif isn't boxed into a small centered tile.
  alerts: {
    tiktok_follow:  { x: 0, y: 0, scale: 1, mediaPct: 100 },
    youtube_follow: { x: 0, y: 0, scale: 1, mediaPct: 100 },
    youtube_sub:    { x: 0, y: 0, scale: 1, mediaPct: 100 },
    milestone:      { x: 0, y: 0, scale: 1, mediaPct: 100 },
  },
  texts: {
    tiktok_follow:  '{username} followed on TikTok!',
    youtube_follow: '{username} followed on YouTube!',
    youtube_sub:    '{username} subscribed on YouTube!',
    milestone:      '{count} FOLLOWERS! 🎉',
  },
};

const deepMerge = JJX.deepMerge;
const clone = JJX.clone;

let CFG = clone(DEFAULT_CONFIG);
try { const s = JSON.parse(localStorage.getItem(FM_LS_CONFIG) || 'null'); if (s) CFG = deepMerge(CFG, s); } catch (e) {}

// slot -> { gif:{mime,url|dataURL}, audio:{mime,url|dataURL} }
// `url` = served by the Producer Dock (current); `dataURL` = legacy localStorage copy,
// still honored so an overlay keeps working before/without a dock fetch.
let ASSETS = {};
try { ASSETS = JSON.parse(localStorage.getItem(FM_LS_ASSETS) || '{}'); } catch (e) {}

// ── Producer Dock backend ──────────────────────────────────────────
// Config and uploaded media come from the dock over HTTP instead of living in
// browser localStorage (one quota shared by every overlay on this origin, which
// is what eventually threw "storage full" — and TikTok Studio's browser source
// has its own storage that the control page can't write to anyway).
// Verified: TikTok Studio's engine can reach 127.0.0.1 for WS, fetch and <img>.
// Override with ?dock=http://host:port (or #dock=… — some static hosts drop the
// query string, and pointing at the wrong dock fails silently). A page already
// served from a local origin is the dock serving it, and uses that same origin.
const DOCK_BASE = JJX.dockBase('http://127.0.0.1:4317');
const OVERLAY_NAME = 'follow-meter';

/** Absolute src for an asset, tolerating both the dock shape and the legacy one. */
function assetSrc(a) {
  if (!a) return null;
  if (a.url) return a.url.startsWith('http') ? a.url : DOCK_BASE + a.url;
  return a.dataURL || null;
}

/**
 * Pull config + asset URLs from the dock in one request. Failure is non-fatal:
 * whatever was cached in localStorage stays in use, so a dock that is off or
 * still starting degrades to the last-known look rather than a blank overlay.
 */
async function loadFromDock() {
  try {
    const res = await fetch(`${DOCK_BASE}/overlay-public/${OVERLAY_NAME}/config`, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const payload = await res.json();
    if (payload.config && Object.keys(payload.config).length) {
      CFG = deepMerge(CFG, payload.config);
      try { localStorage.setItem(FM_LS_CONFIG, JSON.stringify(CFG)); } catch (e) {}
    }
    if (payload.assets && Object.keys(payload.assets).length) {
      ASSETS = payload.assets;
      // Cached as URLs (a few hundred bytes), never as dataURLs — that distinction
      // is the whole reason the storage quota stops being a problem.
      try { localStorage.setItem(FM_LS_ASSETS, JSON.stringify(ASSETS)); } catch (e) {}
    }
    applyMeterLayout(); renderMeter();
    return true;
  } catch (err) {
    console.warn('[follow-meter] dock unreachable, using cached config/assets:', err.message);
    return false;
  }
}

let count = 0;
try { count = parseInt(localStorage.getItem(FM_LS_COUNT)) || 0; } catch (e) {}

let OVERLAY_ENABLED = false;
document.body.style.display = 'none';

// Mirror mode: a lightweight, muted, always-visible copy embedded as an iframe
// inside follow-meter-control.html so position/scale changes can be seen live
// while tuning — no Ably connection (so it can't double-process real follows
// or make noise), driven purely by the same BroadcastChannel/localStorage
// commands the control page already sends. See connectAbly() below.
const MIRROR = JJX.isMirror();

// ═══════════════════════════════════════════════════════════════════
// RENDER: meter
// ═══════════════════════════════════════════════════════════════════
function applyMeterLayout() {
  const el = document.getElementById('meter');
  const m = CFG.meter;
  el.style.transform = `translateX(calc(-50% + ${m.x}px)) translateY(${m.y}px) scale(${m.scale})`;
  el.classList.toggle('show', OVERLAY_ENABLED && m.visible !== false);
  document.getElementById('meter-label').textContent = m.label || 'FOLLOWERS';
}
function applyAlertLayoutFor(slot) {
  const el = document.getElementById('alert-pos');
  const a = (CFG.alerts && CFG.alerts[slot]) || { x: 0, y: 0, scale: 1 };
  // Position only — NO scale() here. Scaling this element scaled the media with it,
  // and the overlay canvas is a fixed 1080x1920 with overflow:hidden, so anything
  // past the edge was cut off. At Size 100% ANY scale above 1 guaranteed clipping
  // (scale 2.7 made the media 2916x5184). Scale now sizes the media directly
  // (sizeMediaEl, clamped to the canvas) and the caption via its own transform.
  el.style.transform = `translate(${a.x}px, ${a.y}px)`;
  const txt = document.getElementById('alert-text');
  txt.style.transform = `translateX(-50%) scale(${a.scale || 1})`;
}
// Give the media a box that is mediaPct% of the FULL canvas and let it fit inside.
//
// Deliberately width/height, NOT max-width/max-height: a max only ever shrinks, so
// any gif whose own pixels were smaller than the cap rendered at its natural size
// and the Size slider did nothing above that — a small gif sat marooned in the
// middle of a 1080x1920 canvas, which reads as a frame around it. Setting the box
// explicitly lets a small gif scale UP to fill the screen as well as down.
//
// object-fit:contain guarantees the whole frame stays visible (letterboxed at
// worst) — 'cover' would fill the box by cropping the gif's edges off.
function sizeMediaEl(el, slot) {
  const a = (CFG.alerts && CFG.alerts[slot]) || {};
  const pct = Math.max(10, Math.min(100, a.mediaPct == null ? 100 : a.mediaPct));
  // Size and Scale both used to enlarge the media — Size here, Scale via a CSS
  // transform on the whole stage — so they multiplied. On a fixed 1080x1920 canvas
  // with overflow:hidden that cut the artwork off (Size 100 x Scale 2.7 asked for
  // 2916x5184). They're combined here instead, and CLAMPED to the canvas, so the
  // media can never be bigger than the screen it has to fit on.
  const frac = Math.min(1, (pct / 100) * (a.scale || 1));
  el.style.width  = (1080 * frac) + 'px';
  el.style.height = (1920 * frac) + 'px';
  el.style.maxWidth = 'none';
  el.style.maxHeight = 'none';
}
/*
 * Progress is shown per TIER, not as a lifetime total: the label reads
 * count / nextMilestone (0/10 → 10/20 → 20/30 …) and the track holds one block
 * per follow in the current tier, filling left to right and resetting each time a
 * milestone lands. `every` drives both, so changing it re-segments the track.
 */
function renderMeter() {
  const every = Math.max(1, CFG.milestoneEvery || 10);
  const tierStart = Math.floor(count / every) * every;
  const nextTarget = tierStart + every;
  const filled = count - tierStart;              // 0 .. every-1

  document.getElementById('meter-count').textContent =
    `${count.toLocaleString()} / ${nextTarget.toLocaleString()}`;

  // Rebuild only when the segment count changes — this runs on every event.
  const track = document.getElementById('meter-track');
  if (track.childElementCount !== every) {
    track.innerHTML = '';
    for (let i = 0; i < every; i++) {
      const s = document.createElement('div');
      s.className = 'seg';
      track.appendChild(s);
    }
  }
  for (let i = 0; i < every; i++) {
    const on = i < filled;
    track.children[i].className = 'seg' + (on ? ' on' : '') + (i === every - 1 ? ' last' : '');
  }

  try { localStorage.setItem(FM_LS_COUNT, String(count)); } catch (e) {}
}

// GIF play-once decoding/rendering lives in jjx-core.js (JJX.parseGIF /
// JJX.playGifOnce) — see the rationale there for why it's hand-rolled.
const fmParseGIF = JJX.parseGIF;
const fmPlayGifOnce = JJX.playGifOnce;

// ═══════════════════════════════════════════════════════════════════
// ALERT QUEUE
// ═══════════════════════════════════════════════════════════════════
let queue = [];
let processing = false;
let _currentGifStop = null; // cancels a still-playing GIF when the alert changes

function fillTemplate(tmpl, vars) {
  return String(tmpl || '')
    .replace(/\{username\}/g, vars.username || 'someone')
    .replace(/\{count\}/g, (vars.count != null ? vars.count : count).toLocaleString());
}

function enqueueAlert(slot, username) {
  if (!SLOTS.includes(slot)) return;
  queue.push({ slot, username: username || '' });
  processQueue();
}

function processQueue() {
  if (processing || !queue.length || !OVERLAY_ENABLED) return;
  processing = true;
  const item = queue.shift();
  showAlert(item, () => { processing = false; processQueue(); });
}

function showAlert(item, done) {
  const wrap  = document.getElementById('alert-media-wrap');
  const stage = document.getElementById('alert-stage');
  const txt   = document.getElementById('alert-text');
  const asset = ASSETS[item.slot] || {};
  const platformClass = item.slot === 'milestone' ? 'milestone' : (item.slot === 'tiktok_follow' ? 'tiktok' : 'youtube');

  if (_currentGifStop) { _currentGifStop(); _currentGifStop = null; }
  wrap.innerHTML = '';
  // Set to scheduleHide() at the end of this call. Media length is only known
  // asynchronously (GIF frame delays after decode, video metadata after load), and
  // this is a per-call closure so a slow decode from a superseded alert can't
  // extend the alert that replaced it.
  let extendHold = null;
  const gifSrc = assetSrc(asset.gif);
  if (gifSrc) {
    const mime = asset.gif.mime || '';
    if (mime.startsWith('video/')) {
      const v = document.createElement('video');
      v.src = gifSrc;
      v.autoplay = true;
      v.playsInline = true;
      v.muted = false;
      v.loop = false; // play once, freeze on last frame — never restart
      sizeMediaEl(v, item.slot);
      // Hold at least as long as the clip runs, so it can't be cut mid-playback.
      v.onloadedmetadata = () => {
        if (v !== wrap.firstChild || !extendHold) return;
        if (isFinite(v.duration)) extendHold(v.duration * 1000 + 400);
      };
      wrap.appendChild(v);
    } else if (mime === 'image/gif') {
      // A plain <img> plays a GIF's own baked-in loop count forever with no
      // way to override it, so decode it ourselves and play it once on a canvas.
      const canvas = document.createElement('canvas');
      sizeMediaEl(canvas, item.slot);
      wrap.appendChild(canvas);
      fetch(gifSrc).then(r => r.arrayBuffer()).then(buf => {
        if (canvas !== wrap.firstChild) return; // a newer alert already replaced this one
        const gif = fmParseGIF(buf);
        if (!gif.frames.length) return;
        _currentGifStop = fmPlayGifOnce(canvas, gif);
        // The GIF's own runtime is the sum of its frame delays — hold at least that
        // long so a long animation isn't chopped off partway through.
        const gifMs = gif.frames.reduce((n, f) => n + Math.max(20, f.delay || 100), 0);
        if (extendHold) extendHold(gifMs + 400);
      }).catch(() => {
        // Corrupt/unsupported GIF — fall back to a plain (looping) <img> rather than showing nothing.
        if (canvas !== wrap.firstChild) return;
        const img = document.createElement('img');
        img.src = gifSrc;
        sizeMediaEl(img, item.slot);
        wrap.innerHTML = '';
        wrap.appendChild(img);
      });
    } else {
      const img = document.createElement('img');
      img.src = gifSrc;
      sizeMediaEl(img, item.slot);
      wrap.appendChild(img);
    }
  }

  txt.className = platformClass;
  txt.textContent = fillTemplate(CFG.texts[item.slot], { username: item.username, count });

  if (!MIRROR) {
    const audioEl = document.getElementById('alert-audio');
    audioEl.pause();
    const audioSrc = assetSrc(asset.audio);
    if (audioSrc) {
      audioEl.src = audioSrc;
      audioEl.currentTime = 0;
      audioEl.play().catch(() => {});
    } else {
      audioEl.removeAttribute('src');
    }
  }

  applyAlertLayoutFor(item.slot);
  stage.classList.add('show');

  if (MIRROR) {
    // Pinned preview: stays on screen (silently) so position/scale nudges are
    // visible without a countdown running out mid-adjustment. The next preview
    // just replaces it in place.
    done();
    return;
  }

  // Hold is a MINIMUM, not a fixed cut-off. The configured duration was hiding the
  // alert on a timer that knew nothing about the media, so any gif or clip longer
  // than it got chopped mid-animation. scheduleHide() is called again once the
  // media's real length is known (GIF frame delays / video metadata) and extends —
  // never shortens — the hold, so an animation always gets to finish.
  const minMs = Math.max(1000, (CFG.alertDurationSec || 4.5) * 1000);
  let hideAt = 0;
  const scheduleHide = ms => {
    const at = Date.now() + ms;
    if (at <= hideAt) return;          // never pull the hide earlier
    hideAt = at;
    clearTimeout(showAlert._t);
    showAlert._t = setTimeout(() => {
      stage.classList.remove('show');
      setTimeout(() => { wrap.innerHTML = ''; done(); }, 300);
    }, ms);
  };
  scheduleHide(minMs);
  extendHold = scheduleHide;           // media handlers above call this once measured
}

// ═══════════════════════════════════════════════════════════════════
// EVENT HANDLING — a follow/sub bumps the combined counter and fires
// its individual alert; crossing a multiple of milestoneEvery queues
// the milestone alert right after it.
// ═══════════════════════════════════════════════════════════════════
function handleFollowEvent(slot, username) {
  if (!OVERLAY_ENABLED) return;
  count++;
  renderMeter();
  enqueueAlert(slot, username);
  const every = Math.max(1, CFG.milestoneEvery || 10);
  if (count % every === 0) enqueueAlert('milestone', username);
}

function resetCount() {
  count = 0;
  renderMeter();
}

// ═══════════════════════════════════════════════════════════════════
// COMMS — three-transport receive via jjx-core: BroadcastChannel +
// localStorage wired by createReceiver (same browser profile), and the Ably
// subscription below routes through the SAME dispatcher so a command heard
// on two transports still fires exactly once.
// ═══════════════════════════════════════════════════════════════════
const handleCmd = JJX.createReceiver({
  bcName: FM_BC_NAME,
  lsMsgKey: FM_LS_MSG,
  handler: handleCmdInner,
});

function handleCmdInner(msg) {
  switch (msg.cmd) {
    case 'CONFIG_UPDATE':
      CFG = deepMerge(CFG, msg.data || {});
      // Alert x/y/scale is applied per-slot at show time (applyAlertLayoutFor),
      // not globally here — each alert type has its own position now.
      applyMeterLayout(); renderMeter();
      break;
    case 'ASSET_UPDATE': {
      // Carries a dock `url` now (a few hundred bytes) rather than a base64 dataURL,
      // so this reaches the live overlay over Ably as a single small message —
      // no chunked transfer, no localStorage quota.
      applyAssetUpdate(msg.data || {});
      break;
    }
    case 'ASSETS_REFRESH':
      // The control page saved something; re-pull the authoritative copy from the dock.
      loadFromDock();
      break;
    case 'TEST_FIRE':
      handleFollowEvent(msg.data.slot, msg.data.username || 'TestViewer');
      break;
    case 'RESET_COUNT':
      resetCount();
      break;
    case 'SET_ENABLED':
      if (handleToggle) handleToggle(!!(msg.data && msg.data.enabled));
      break;
  }
}
function applyAssetUpdate({ slot, kind, mime, dataURL, url }) {
  if (!SLOTS.includes(slot) || (kind !== 'gif' && kind !== 'audio')) return;
  if (!ASSETS[slot]) ASSETS[slot] = {};
  // A dock upload sends `url`; the legacy Ably/localStorage path sends `dataURL`.
  if (url) ASSETS[slot][kind] = { mime, url };
  else if (dataURL) ASSETS[slot][kind] = { mime, dataURL };
  else delete ASSETS[slot][kind];
  try { localStorage.setItem(FM_LS_ASSETS, JSON.stringify(ASSETS)); } catch (e) {}
}

// The chunked-over-Ably asset receiver is gone: media comes from the dock by URL
// (loadFromDock), so nothing publishes chunks any more. Subscribing to that channel
// would have kept an Ably attachment alive purely to receive nothing.

// ═══════════════════════════════════════════════════════════════════
// ABLY — toggle channel (always attached) + chat/config channels
// (attached only while enabled), same pattern as new-here-overlay.html.
// ═══════════════════════════════════════════════════════════════════
let _fmAttached = false;
let eventBus = null;
function connectAbly() {
  // Ably is constructed ONLY as the bus's fallback. When the dock's socket is
  // reachable — the normal case — no channel is ever attached, so this overlay
  // costs zero Ably messages and holds no realtime connection of its own.
  // ABLY_FALLBACK=0 opts out entirely for a socket-only setup.
  const wantFallback = JJX.param('ablyFallback') !== '0';
  const client = wantFallback ? JJX.dockRealtime({ fallbackKey: ABLY_KEY }) : null;

  function attachMain() {
    OVERLAY_ENABLED = true;
    document.body.style.display = 'block';
    applyMeterLayout(); renderMeter();
    // Config/media may have changed while this overlay was toggled off.
    loadFromDock();
    _fmAttached = true;
  }
  function detachMain() {
    OVERLAY_ENABLED = false;
    document.body.style.display = 'none';
    _fmAttached = false;
  }

  // Real follow/sub traffic comes off the dock's local socket, with Ably as an
  // automatic fallback (JJX.createOverlayBus). Same 'milk-event' payload either way.
  // 'follow' is a dedicated, unambiguous signal — added alongside the existing 'join'
  // event so nothing else breaks — that fires only on a genuine TikTok/YouTube
  // follow, never a room-join/viewer-enter.
  eventBus = JJX.createOverlayBus({
    ably: client,
    onStatus: (state, why) => console.info('[follow-meter] event transport:', state, why || ''),
  });
  eventBus.on('splat-chat', 'milk-event', d => {
    if (!OVERLAY_ENABLED) return;
    d = d || {};
    if (d.type === 'follow' && d.username) {
      const slot = d.platform === 'tt' ? 'tiktok_follow' : 'youtube_follow';
      handleFollowEvent(slot, d.username);
    } else if (d.type === 'yt_sub' && d.username) {
      handleFollowEvent('youtube_sub', d.username);
    }
  });

  // Control-plane (config nudges, test fires, on/off) over the same socket, relayed
  // by the dock's /api/overlay/:name/cmd. Ably carries it only in fallback mode.
  eventBus.on(`overlay-cmd:${OVERLAY_NAME}`, 'cmd', d => handleCmd(d));
  eventBus.on(ABLY_CH, 'follow-meter-cmd', d => handleCmd(d));   // fallback shape

  // The on/off toggle rides the same command stream now.
  handleToggle = enabled => { if (enabled) attachMain(); else detachMain(); };

  // Ask the dock what the current on/off state is, since a toggle sent while this
  // overlay was closed isn't replayed by a socket.
  fetch(`${DOCK_BASE}/overlay-public/${OVERLAY_NAME}/config`, { cache: 'no-store' })
    .then(r => r.json())
    .then(p => { if (p.config && p.config.enabled) attachMain(); })
    .catch(() => {});
}
// Set once connectAbly runs; kept module-level so handleCmd can reach it.
let handleToggle = null;

if (MIRROR) {
  // No Ably here — the mirror must never process real follows/subs a second
  // time or make sound. It's driven entirely by the BroadcastChannel/
  // localStorage listeners above, which follow-meter-control.html already
  // sends CONFIG_UPDATE/ASSET_UPDATE/TEST_FIRE over regardless of Ably.
  OVERLAY_ENABLED = true;
  document.body.style.display = 'block';
  applyMeterLayout();
} else {
  connectAbly();
}

// Both modes read the same backend, so the mirror previews exactly what the live
// overlay will show. Fire-and-forget: rendering already happened from the cached
// copy, and this refreshes it in place once the dock answers.
loadFromDock();

renderMeter();
</script>
</body>
</html>
