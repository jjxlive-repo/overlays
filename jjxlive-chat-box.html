<style>
* { box-sizing: border-box; }
:root {
  --overlay-top:134px; --overlay-right:34px;
  --chat-width:235px; --chat-height:210px;
  --event-width:235px; --event-height:42px; --event-gap:8px;
  --chat-radius:14px; --chat-font-scale:1; --bg-opacity:1;
  --audience-left:840px; --audience-top:88px; --audience-scale:.9;
  --chat-font-family:"DM Sans", system-ui, -apple-system, "Segoe UI", Arial, "Segoe UI Emoji", "Noto Color Emoji", "Apple Color Emoji", sans-serif;
}
html, body { width:1080px; min-width:1080px; height:1920px; min-height:1920px; margin:0; overflow:hidden; background:transparent; font-family:var(--chat-font-family); }
body { color:#fff; pointer-events:none; -webkit-font-smoothing:antialiased; }
.jjx-chat-overlay { position:fixed; top:var(--overlay-top); right:var(--overlay-right); width:var(--chat-width); height:calc(var(--chat-height) + var(--event-height) + var(--event-gap)); pointer-events:none; z-index:20; }
html.controller-preview,
html.controller-preview body {
  width:235px;
  min-width:235px;
  height:260px;
  min-height:260px;
}
html.controller-preview .jjx-chat-overlay {
  top:0;
  right:0;
}
html.controller-preview .audience-widget {
  display:none;
}
.event-zone { position:absolute; top:0; right:0; width:var(--event-width); height:var(--event-height); z-index:4; opacity:0; transform:translateY(6px); pointer-events:none; }
.event-zone.is-visible { opacity:1; transform:none; animation:eventIn .24s cubic-bezier(.34,1.56,.64,1) both; }
.event-zone.is-out { animation:eventOut .3s ease both; }
.chat-zone { position:absolute; top:calc(var(--event-height) + var(--event-gap)); right:0; width:var(--chat-width); height:var(--chat-height); overflow:hidden; z-index:2; pointer-events:none; }
.chat-list { height:100%; display:flex; flex-direction:column; justify-content:flex-end; gap:8px; overflow:hidden; -webkit-mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.4) 10px,#000 26px,#000 100%); mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.4) 10px,#000 26px,#000 100%); }
.chat-message { position:relative; flex:0 0 auto; min-width:0; overflow:hidden; animation:chatIn .26s cubic-bezier(.34,1.56,.64,1) both; }
.chat-message.is-removing { animation:chatOut .32s ease both; }
.chat-meta { display:flex; align-items:center; gap:6px; min-width:0; }
.chat-image-row { display:flex; gap:4px; margin-top:5px; overflow:hidden; }
.message-text { display:-webkit-box; -webkit-line-clamp:var(--clamp-lines,2); -webkit-box-orient:vertical; max-width:100%; overflow:hidden; overflow-wrap:anywhere; }
.message-text img, .chat-sticker { display:inline-block; max-width:calc(22px * var(--chat-font-scale)); max-height:calc(22px * var(--chat-font-scale)); width:auto; height:auto; margin:0 2px; vertical-align:-5px; border-radius:5px; }
.emoji { display:inline-block; width:1.08em; height:1.08em; margin:0 .04em; vertical-align:-.16em; }
/* ── Audience rails (design 15a: two doodle mini-rails, flush right edge) ──
   Deliberately theme-independent: the cream/ink doodle look and the surge
   colour ramp are fixed by the handoff, so the chat themes don't restyle it.
   Green = people joining; yellow is reserved for coins elsewhere on stream. */
.audience-widget {
  position:fixed;
  left:var(--audience-left);
  top:var(--audience-top);
  width:135px; /* chevron 28 + gap 7 + rail 100 */
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:14px;
  font-family:"Baloo 2", system-ui, sans-serif;
  transform:scale(var(--audience-scale));
  transform-origin:top right; /* shrink toward the screen edge so rails stay flush */
  pointer-events:none;
  z-index:24;
  opacity:1;
  transition:opacity .18s ease;
}
.audience-widget.is-hidden { opacity:0; }
.audience-platform {
  display:flex;
  align-items:center;
  gap:7px;
}
.audience-chevron {
  flex:0 0 28px;
  width:28px;
  height:17px;
  display:flex;
  align-items:center;
  opacity:0; /* calm: fully invisible, but the space stays reserved */
}
.audience-chevron svg { display:block; }
.audience-rail {
  width:100px;
  padding:10px 0 12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  background:#fdf8ee;
  border:3px solid #1a1a1a;
  border-right:none;
  border-radius:16px 0 0 16px;
  box-shadow:0 4px 0 rgba(0,0,0,.35);
}
.audience-brand { display:flex; }
.audience-brand svg { display:block; }
.audience-value {
  font-size:24px;
  font-weight:800;
  line-height:1;
  color:#1a1a1a;
  font-variant-numeric:tabular-nums;
  transition:color .4s;
}
/* Surge tiers — shake speeds up and the number heats up as joins/min climb.
   Amplitude is capped at ±3.5px; anything stronger made the count unreadable. */
.audience-platform[data-tier="1"] .audience-rail { animation:shakeSoft .5s linear infinite; }
.audience-platform[data-tier="2"] .audience-rail { animation:shakeMed .32s linear infinite; }
.audience-platform[data-tier="3"] .audience-rail { animation:shakeHard .2s linear infinite; }
.audience-platform[data-tier="1"] .audience-value { color:#17a24b; animation:numPulse 1s ease-in-out infinite; }
.audience-platform[data-tier="2"] .audience-value { color:#e8871a; animation:numPulse .6s ease-in-out infinite; }
.audience-platform[data-tier="3"] .audience-value { color:#e5312b; animation:numPulse .35s ease-in-out infinite, numHot .7s linear infinite; }
/* Chevron tempo is steady across tiers on purpose — only the shake scales. */
.audience-platform:not([data-tier="0"]) .audience-chevron { animation:chevStep .9s linear infinite; }
@keyframes shakeSoft {
  0%,100% { transform:translate(0,0); }
  25% { transform:translate(.5px,-2px); }
  50% { transform:translate(-.5px,2px); }
  75% { transform:translate(.5px,-1.5px); }
}
@keyframes shakeMed {
  0%,100% { transform:translate(0,0); }
  20% { transform:translate(1px,-3.5px); }
  40% { transform:translate(-1px,3.5px); }
  60% { transform:translate(1px,-3px); }
  80% { transform:translate(-1px,3px); }
}
@keyframes shakeHard {
  0%,100% { transform:translate(0,0) rotate(0deg); }
  15% { transform:translate(1px,-3.5px) rotate(-.4deg); }
  35% { transform:translate(-1px,3.5px) rotate(.4deg); }
  55% { transform:translate(1px,-3px) rotate(-.4deg); }
  75% { transform:translate(-1px,3px) rotate(.4deg); }
}
@keyframes chevStep {
  0%,22% { opacity:0; }
  23%,52% { opacity:1; }
  53%,100% { opacity:0; }
}
@keyframes numPulse {
  0%,100% { transform:scale(1); }
  50% { transform:scale(1.14); }
}
@keyframes numHot {
  0%,100% { color:#e5312b; }
  50% { color:#ff8c1a; }
}
@media (prefers-reduced-motion: reduce) {
  .audience-widget,
  .audience-rail,
  .audience-value {
    animation:none !important;
    transition:none !important;
  }
  /* Keep the surge readable without motion: chevron holds on instead of blinking. */
  .audience-platform:not([data-tier="0"]) .audience-chevron { animation:none !important; opacity:1; }
}
@keyframes chatIn { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:translateX(0); } }
@keyframes chatOut { to { opacity:0; transform:translateY(-12px) scale(.96); } }
@keyframes eventIn { from { opacity:0; transform:translateY(9px) scale(.96); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes eventOut { to { opacity:0; transform:translateY(-9px); } }
@keyframes splatPop { 0%{opacity:0;transform:scale(.82) rotate(-1.5deg);} 65%{opacity:1;transform:scale(1.04) rotate(1deg);} 100%{opacity:1;transform:scale(1) rotate(0);} }
@keyframes chipFloat { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

<body>
<div id="jjx-chat-overlay" class="jjx-chat-overlay" data-theme="night" data-style="minimal">
  <div id="event-zone" class="event-zone"></div>

<script>
const CONFIG = {
  defaultStyle: "minimal",
  position: {
    top: 134,
    right: 34,
    width: 235,
    chatHeight: 210,
    eventHeight: 42,
    eventGap: 8
  },
  chat: {
    maxMessages: 3,
    maxMessagesCap: 30,   // hard upper limit for maxMessages
    messageLifetime: 8500,
    clampLines: 2
  },
  events: {
    enabled: true,
    duration: 4000,
    highDuration: 7000,
    queue: true,
    showFollowsAsEvents: false,
    showJoinsAsEvents: false,
    showLikesAsEvents: true,
    likeMilestoneStep: 1000
  },
  accessibility: {
    colorblindSafe: true,
    strongTextShadow: true
  },
  socialStream: {
    session: "", // set via ?session=... in this page's URL — never hardcode a real ID, this file is served publicly

    socketBase: "wss://io.socialstream.ninja/join"
  },
  audience: {
    enabled: true,
    left: 945,   // 1080 - 135: rails sit flush against the right screen edge
    top: 700,

    surgeEnabled: true,
    surgeScore: 32
  },
  ably: {
    key: null,
    channel: "splat-overlay",
    enabled: true
  }

const STYLE_PRESETS = ["minimal", "glass", "caption"];
const THEME_PRESETS = ["night", "broadcast", "comic-grape"];
const DEFAULT_THEME = "night";
const THEME_FONT = {
  night: '"DM Sans", system-ui, -apple-system, "Segoe UI", Arial, "Segoe UI Emoji", "Noto Color Emoji", "Apple Color Emoji", sans-serif',
  broadcast: '"Barlow Condensed", "Oswald", "Arial Narrow", Arial, "Segoe UI Emoji", "Noto Color Emoji", "Apple Color Emoji", sans-serif',
  "comic-grape": '"Fredoka", "Baloo 2", "Arial Rounded MT Bold", Arial, "Segoe UI Emoji", "Noto Color Emoji", "Apple Color Emoji", sans-serif'
};
function applyThemeFont(theme) {
  const fam = THEME_FONT[theme];
  if (fam) document.documentElement.style.setProperty("--chat-font-family", fam);
}
const chatQueue = [];
const eventQueue = [];
let activeEvent = false;
let mockTimers = [];
let ssnSocket = null;
let ablyClient = null;
let ablyChannel = null;
let lastLikeMilestone = 0;
let producerStateSocket = null;
let producerStateReconnectTimer = null;
let producerStateConnected = false;
let audienceSampleTimer = null;
const fallbackJoinTimes = [];
const AUDIENCE_PLATFORMS = ["youtube", "tiktok"];
const audienceMetrics = {
  tiktokViewers: null,
  youtubeViewers: null
};

// Surge model (per platform, independent) — see the design handoff.
// Join rate is derived from the viewer count itself: (now − 10s ago) scaled to joins/min.
const SURGE = {
  sampleMs: 500,
  windowMs: 10000,     // look-back used to derive the join rate
  minWindowMs: 5000,   // below this much history the rate isn't trustworthy yet
  threshold: 90,       // joins/min on the combined scale
  platformFactor: .55, // per-platform trigger = threshold * this (≈50/min)
  tier2Ratio: 1.6,
  tier3Ratio: 2.6,
  onMs: 5000,          // hysteresis: sustained above trigger before surging
  offMs: 10000,        // sustained below trigger before clearing
  externalMs: 8000     // how long a Producer Dock / join-burst signal stands in
};
const audienceSurgeState = {
  youtube: newSurgeState(),
  tiktok: newSurgeState()
};
function newSurgeState() {
  return { history: [], rate: 0, ratio: 0, surging: false, aboveSince: null, belowSince: null, externalUntil: 0, tier: 0 };
}

const overlay = document.getElementById("jjx-chat-overlay");
const audienceWidget = document.getElementById("jjx-audience-widget");
const audienceRows = {
  tiktok: document.getElementById("jjx-tt-audience-row"),
  youtube: document.getElementById("jjx-yt-audience-row")
};
const audienceValues = {
  tiktok: document.getElementById("jjx-tt-metric-value"),
  youtube: document.getElementById("jjx-yt-metric-value")
};
const eventZone = document.getElementById("event-zone");
const chatZone = document.getElementById("chat-zone");
const chatList = document.getElementById("chat-list");
const params = new URLSearchParams(location.search);
const isControllerPreview = params.get("preview") === "1";
const SETTINGS_STORAGE_KEY = "jjxlive-chat-controller-settings-v1";
const LEGACY_SETTINGS_STORAGE_KEY = "jjxlive-chat-box-settings-v1";

function param(name, fallback) {
  const direct = params.get(name);
  if (direct != null && direct !== "") return direct;
  const loose = location.href.match(new RegExp(`${name}=([^&#?]+)`));
  return loose ? decodeURIComponent(loose[1].replace(/\+/g, " ")) : fallback;
}

function asBool(value, fallback) {
  if (value == null) return fallback;
  if (String(value) === "0" || String(value).toLowerCase() === "false") return false;
  if (String(value) === "1" || String(value).toLowerCase() === "true") return true;
  return fallback;
}

function applyUrlParams() {
  const style = STYLE_PRESETS.includes(param("style", CONFIG.defaultStyle))
    ? param("style", CONFIG.defaultStyle)
    : CONFIG.defaultStyle;
  overlay.dataset.style = style;
  const theme = THEME_PRESETS.includes(param("theme", DEFAULT_THEME)) ? param("theme", DEFAULT_THEME) : DEFAULT_THEME;
  overlay.dataset.theme = theme;
  applyThemeFont(theme);
  CONFIG.events.enabled = asBool(param("events", null), CONFIG.events.enabled);
  CONFIG.events.duration = Number(param("eventDuration", CONFIG.events.duration)) || CONFIG.events.duration;
  CONFIG.chat.maxMessages = Number(param("maxMessages", CONFIG.chat.maxMessages)) || CONFIG.chat.maxMessages;
  CONFIG.chat.clampLines = Math.max(1, Number(param("lines", CONFIG.chat.clampLines)) || CONFIG.chat.clampLines);
  CONFIG.position.top = Number(param("top", CONFIG.position.top)) || CONFIG.position.top;
  CONFIG.position.right = Number(param("right", CONFIG.position.right)) || CONFIG.position.right;
  CONFIG.position.width = Number(param("width", CONFIG.position.width)) || CONFIG.position.width;
  CONFIG.position.chatHeight = Number(param("height", CONFIG.position.chatHeight)) || CONFIG.position.chatHeight;
  const fontScale = Number(param("fontScale", 1)) || 1;
  const font = param("font", "");
  const bgOpacity = Number(param("bgOpacity", 1));
  CONFIG.audience.enabled = asBool(param("audience", null), CONFIG.audience.enabled);
  CONFIG.audience.left = Number(param("audienceX", CONFIG.audience.left));
  CONFIG.audience.top = Number(param("audienceY", CONFIG.audience.top));
  CONFIG.audience.scale = Number(param("audienceScale", CONFIG.audience.scale)) || CONFIG.audience.scale;
  CONFIG.audience.surgeEnabled = asBool(param("audienceSurge", null), CONFIG.audience.surgeEnabled);

  document.documentElement.style.setProperty("--overlay-top", `${CONFIG.position.top}px`);
  document.documentElement.style.setProperty("--overlay-right", `${CONFIG.position.right}px`);
  document.documentElement.style.setProperty("--chat-width", `${CONFIG.position.width}px`);
  document.documentElement.style.setProperty("--event-width", `${CONFIG.position.width}px`);
  document.documentElement.style.setProperty("--chat-height", `${CONFIG.position.chatHeight}px`);
  document.documentElement.style.setProperty("--event-height", `${CONFIG.position.eventHeight}px`);
  document.documentElement.style.setProperty("--event-gap", `${CONFIG.position.eventGap}px`);
  document.documentElement.style.setProperty("--clamp-lines", CONFIG.chat.clampLines);
  applyOverlaySettings({
    fontScale,
    font,
    bgOpacity,
    audienceEnabled: CONFIG.audience.enabled,
    audienceLeft: CONFIG.audience.left,
    audienceTop: CONFIG.audience.top,
    audienceScale: CONFIG.audience.scale,
    audienceSurgeEnabled: CONFIG.audience.surgeEnabled
  });
}

function safeFontFamily(font) {
  const allowed = {
    rounded: '"Arial Rounded MT Bold", "Trebuchet MS", Arial, "Segoe UI Emoji", "Noto Color Emoji", "Apple Color Emoji", sans-serif',
    trebuch: '"Trebuchet MS", Arial, "Segoe UI Emoji", "Noto Color Emoji", "Apple Color Emoji", sans-serif',
    arial: 'Arial, Helvetica, "Segoe UI Emoji", "Noto Color Emoji", "Apple Color Emoji", sans-serif',
    impact: 'Impact, "Arial Black", "Segoe UI Emoji", "Noto Color Emoji", "Apple Color Emoji", sans-serif',
    mono: '"Lucida Console", "Courier New", "Segoe UI Emoji", "Noto Color Emoji", "Apple Color Emoji", monospace'
  };
  return allowed[String(font || "").toLowerCase()] || "";
}

function numericAudienceValue(value) {
  if (value == null || value === "") return null;
  const parsed = Number(String(value).replace(/[^0-9.-]/g, ""));
  return Number.isFinite(parsed) && parsed >= 0 ? parsed : null;
}

function audiencePath(data, path) {
  return path.split(".").reduce((value, key) => value && typeof value === "object" ? value[key] : null, data);
}

function firstAudienceNumber(data, paths) {
  for (const path of paths) {
    const value = numericAudienceValue(audiencePath(data, path));
    if (value != null) return value;
  }
  return null;
}

// Abbreviation rules are fixed by the design: exact under 1K, two decimals with
// trailing zeros stripped up to 9,999, one decimal from 10K.
function formatAudienceValue(value) {
  if (value == null) return "—";
  const n = Math.round(value);
  if (n < 1000) return String(n);
  const trim = text => text.replace(/\.?0+$/, "");
  if (n < 10000) return `${trim((n / 1000).toFixed(2))}K`;
  if (n < 1000000) return `${trim((n / 1000).toFixed(1))}K`;
  return `${trim((n / 1000000).toFixed(1))}M`;
}

function audienceViewers(platform) {
  return platform === "tiktok" ? audienceMetrics.tiktokViewers : audienceMetrics.youtubeViewers;
}

function renderAudienceMetrics() {
  AUDIENCE_PLATFORMS.forEach(platform => {
    const el = audienceValues[platform];
    if (el) el.textContent = formatAudienceValue(audienceViewers(platform));
  });
  updateAudienceAria();
}

function updateAudienceAria() {
  const surging = AUDIENCE_PLATFORMS.filter(platform => audienceSurgeState[platform].tier > 0);
  audienceWidget.setAttribute(
    "aria-label",
    `YouTube viewers ${formatAudienceValue(audienceMetrics.youtubeViewers)}; ` +
    `TikTok viewers ${formatAudienceValue(audienceMetrics.tiktokViewers)}` +
    (surging.length ? `; ${surging.join(" and ")} surging` : "")
  );
}

// Rate over the widest sample that is at least minWindowMs old, normalised to joins/min.
function audienceJoinRate(history, now, current) {
  if (!history.length) return 0;
  let ref = history[0];
  for (const sample of history) {
    if (now - sample.t < SURGE.windowMs) break;
    ref = sample;
  }
  const elapsed = now - ref.t;
  if (elapsed < SURGE.minWindowMs) return 0;
  return Math.max(0, (current - ref.v) * 60000 / elapsed);
}

function evaluateAudienceSurge(state, now) {
  const trigger = SURGE.threshold * SURGE.platformFactor;
  const hot = state.rate >= trigger;
  if (hot) {
    if (state.aboveSince == null) state.aboveSince = now;
    state.belowSince = null;
  } else {
    if (state.belowSince == null) state.belowSince = now;
    state.aboveSince = null;
  }
  if (!state.surging && hot && now - state.aboveSince >= SURGE.onMs) state.surging = true;
  if (state.surging && !hot && now - state.belowSince >= SURGE.offMs) state.surging = false;

  state.ratio = state.rate / trigger;
  const on = CONFIG.audience.surgeEnabled && (state.surging || now < state.externalUntil);
  state.tier = !on
    ? 0
    : state.ratio >= SURGE.tier3Ratio ? 3
    : state.ratio >= SURGE.tier2Ratio ? 2
    : 1;
}

function sampleAudienceSurge() {
  const now = Date.now();
  AUDIENCE_PLATFORMS.forEach(platform => {
    const state = audienceSurgeState[platform];
    const current = audienceViewers(platform);
    if (current == null) {
      state.history.length = 0;
      state.rate = 0;
    } else {
      state.history.push({ t: now, v: current });
      while (state.history.length > 2 && now - state.history[0].t > SURGE.windowMs * 2) state.history.shift();
      state.rate = audienceJoinRate(state.history, now, current);
    }
    evaluateAudienceSurge(state, now);
  });
  renderAudienceSurge();
}

// Only touch the DOM when a tier actually changes — reassigning data-tier every
// tick would restart the shake/pulse keyframes and make them stutter.
function renderAudienceSurge() {
  let changed = false;
  AUDIENCE_PLATFORMS.forEach(platform => {
    const row = audienceRows[platform];
    if (!row) return;
    const next = String(audienceSurgeState[platform].tier);
    if (row.dataset.tier !== next) {
      row.dataset.tier = next;
      changed = true;
    }
  });
  if (changed) updateAudienceAria();
}

// External surge signals (Producer Dock pulse, or the TikTok join-burst fallback)
// stand in for the local join-rate model when it has nothing to go on. They only
// ever assert tier 1 — the tier ramp needs a real rate.
function setAudienceSurge(active, pulse = null, platform = null) {
  const on = Boolean(active && CONFIG.audience.surgeEnabled);
  const until = on ? Date.now() + SURGE.externalMs : 0;
  (platform ? [platform] : AUDIENCE_PLATFORMS).forEach(key => {
    audienceSurgeState[key].externalUntil = until;
    evaluateAudienceSurge(audienceSurgeState[key], Date.now());
  });
  renderAudienceSurge();
}

function applyProducerPulse(pulse) {
  if (!pulse || typeof pulse !== "object") return;
  const score = numericAudienceValue(pulse.score) || 0;
  const momentum = String(pulse.momentum || "steady").toLowerCase();
  const primaryDriver = String(pulse.primaryDriver || "").toLowerCase();
  const components = Array.isArray(pulse.components) ? pulse.components : [];
  const componentScore = key => {
    const component = components.find(item => String(item?.key || "").toLowerCase() === key);
    return numericAudienceValue(component?.score) || 0;
  };
  const joinScore = componentScore("joins");
  const viewerScore = componentScore("viewers");
  const joinOrViewerDriven = /join|viewer/.test(primaryDriver) || joinScore >= CONFIG.audience.surgeScore || viewerScore >= CONFIG.audience.surgeScore;
  const active = momentum === "rising" && joinOrViewerDriven && Math.max(score, joinScore, viewerScore) >= CONFIG.audience.surgeScore;
  setAudienceSurge(active, { score });
}

function applyProducerSnapshot(snapshot) {
  if (!snapshot || typeof snapshot !== "object") return;
  const tiktokViewers = numericAudienceValue(snapshot.metrics?.tiktok?.viewer_count?.currentValue);
  const youtubeViewers = numericAudienceValue(snapshot.metrics?.youtube?.viewer_count?.currentValue);
  updateAudienceMetrics({
    tiktokViewers,
    youtubeViewers
  });
  applyProducerPulse(snapshot.pulse);
}

function producerStateSocketUrl() {
  try {
    const requestedDock = param("dock", "");
    const origin = requestedDock
      ? new URL(requestedDock, location.href).origin
      : /^(127\.0\.0\.1|localhost)$/i.test(location.hostname)
        ? location.origin
        : "http://127.0.0.1:4317";
    return `${origin.replace(/^http/i, "ws")}/ws`;
  } catch (_) {
    return "ws://127.0.0.1:4317/ws";
  }
}

function connectProducerState() {
  window.clearTimeout(producerStateReconnectTimer);
  if (producerStateSocket && [WebSocket.OPEN, WebSocket.CONNECTING].includes(producerStateSocket.readyState)) return;
  try {
    producerStateSocket = new WebSocket(producerStateSocketUrl());
  } catch (_) {
    producerStateReconnectTimer = window.setTimeout(connectProducerState, 3000);
    return;
  }
  producerStateSocket.onopen = () => {
    producerStateConnected = true;
  };
  producerStateSocket.onmessage = event => {
    let message;
    try { message = JSON.parse(event.data); } catch (_) { return; }
    if (message?.type === "snapshot") applyProducerSnapshot(message.payload);
  };
  producerStateSocket.onclose = () => {
    producerStateConnected = false;
    producerStateReconnectTimer = window.setTimeout(connectProducerState, 3000);
  };
  producerStateSocket.onerror = () => {
    producerStateConnected = false;
    try { producerStateSocket.close(); } catch (_) {}
  };
}

function trackFallbackJoin(raw) {
  if (producerStateConnected || !CONFIG.audience.surgeEnabled) return;
  const data = unwrapAudiencePayload(raw);
  if (!data) return;
  const platform = platformKey(data.platform || data.source || data.type || data.site || "");
  const event = String(data.event || data.action || data.typeEvent || "").toLowerCase();
  if (platform !== "tiktok" || !["join", "roomjoin", "enter"].includes(event)) return;
  const now = Date.now();
  fallbackJoinTimes.push(now);
  while (fallbackJoinTimes.length && now - fallbackJoinTimes[0] > 15000) fallbackJoinTimes.shift();
  if (fallbackJoinTimes.length < 6) return;
  // No clear-timer needed: the assertion carries its own SURGE.externalMs expiry.
  setAudienceSurge(true, { score: Math.min(100, fallbackJoinTimes.length * 10) }, "tiktok");
}

function unwrapAudiencePayload(raw) {
  let data = raw;
  if (typeof data === "string") {
    try { data = JSON.parse(data); } catch (_) { return null; }
  }
  if (!data || typeof data !== "object") return null;
  if (data.detail && typeof data.detail === "object") data = data.detail;
  if (data.action === "content" && data.value) {
    try { data = JSON.parse(data.value); } catch (_) {}
  }
  return data && typeof data === "object" ? data : null;
}

function updateAudienceMetrics(raw) {
  const data = unwrapAudiencePayload(raw);
  if (!data) return;
  const platform = platformKey(data.platform || data.source || data.type || data.site || "");

  const direct = {
    tiktokViewers: firstAudienceNumber(data, ["tiktokViewers", "ttViewers"]),
    youtubeViewers: firstAudienceNumber(data, ["youtubeViewers", "ytViewers"])
  };

  Object.entries(direct).forEach(([key, value]) => {
    if (value != null) audienceMetrics[key] = value;
  });

  const viewers = firstAudienceNumber(data, [
    "viewerCount", "viewers", "liveViewers", "concurrentViewers", "userCount", "roomUserCount",
    "roomStats.viewerCount", "roomStats.userCount", "roomInfo.userCount",
    "statistics.concurrentViewers", "stats.viewers"
  ]);
  if (viewers != null) {
    if (platform === "tiktok") audienceMetrics.tiktokViewers = viewers;
    if (platform === "youtube") audienceMetrics.youtubeViewers = viewers;
  }

  renderAudienceMetrics();
}

function applyOverlaySettings(settings = {}) {
  if (settings.theme && THEME_PRESETS.includes(settings.theme)) {
    overlay.dataset.theme = settings.theme;
    applyThemeFont(settings.theme);
  }
  if (settings.style && STYLE_PRESETS.includes(settings.style)) {
    overlay.dataset.style = settings.style;
  }
  if (settings.fontScale != null) {
    const scale = Math.max(.75, Math.min(1.5, Number(settings.fontScale) || 1));
    document.documentElement.style.setProperty("--chat-font-scale", String(scale));
  }
  if (settings.bgOpacity != null) {
    const bgOpacity = Math.max(.1, Math.min(1, Number(settings.bgOpacity)));
    document.documentElement.style.setProperty("--bg-opacity", String(bgOpacity));
  }
  if (settings.fontSize != null) {
    const scale = Math.max(.75, Math.min(1.5, Number(settings.fontSize) / 15 || 1));
    document.documentElement.style.setProperty("--chat-font-scale", String(scale));
  }
  if (settings.font) {
    const family = safeFontFamily(settings.font);
    if (family) document.documentElement.style.setProperty("--chat-font-family", family);
  }
  if (settings.width != null) {
    const width = Math.max(180, Math.min(420, Number(settings.width) || CONFIG.position.width));
    CONFIG.position.width = width;
    document.documentElement.style.setProperty("--chat-width", `${width}px`);
    document.documentElement.style.setProperty("--event-width", `${width}px`);
  }
  if (settings.height != null) {
    const height = Math.max(120, Math.min(520, Number(settings.height) || CONFIG.position.chatHeight));
    CONFIG.position.chatHeight = height;
    document.documentElement.style.setProperty("--chat-height", `${height}px`);
  }
  if (settings.top != null) {
    const top = Math.max(0, Math.min(1820, Number(settings.top)));
    CONFIG.position.top = top;
    document.documentElement.style.setProperty("--overlay-top", `${top}px`);
  }
  if (settings.right != null) {
    const right = Math.max(0, Math.min(980, Number(settings.right)));
    CONFIG.position.right = right;
    document.documentElement.style.setProperty("--overlay-right", `${right}px`);
  }
  if (settings.clampLines != null) {
    const lines = Math.max(1, Math.min(8, Math.round(Number(settings.clampLines)) || CONFIG.chat.clampLines));
    CONFIG.chat.clampLines = lines;
    document.documentElement.style.setProperty("--clamp-lines", String(lines));
  }
  if (settings.maxMessages != null) {
    CONFIG.chat.maxMessages = Math.max(1, Math.min(CONFIG.chat.maxMessagesCap, Number(settings.maxMessages) || CONFIG.chat.maxMessages));
    while (chatQueue.length > CONFIG.chat.maxMessages) {
      chatQueue.shift();
      removeOldestChatElement();
    }
  }
  if (settings.showFollowsAsEvents != null) {
    CONFIG.events.showFollowsAsEvents = Boolean(settings.showFollowsAsEvents);
  }
  if (settings.showLikesAsEvents != null) {
    CONFIG.events.showLikesAsEvents = Boolean(settings.showLikesAsEvents);
  }
  if (settings.showJoinsAsEvents != null) {
    CONFIG.events.showJoinsAsEvents = Boolean(settings.showJoinsAsEvents);
  }
  if (settings.audienceEnabled != null) {
    CONFIG.audience.enabled = Boolean(settings.audienceEnabled);
    audienceWidget.classList.toggle("is-hidden", !CONFIG.audience.enabled);
  }
  if (settings.audienceLeft != null) {
    const left = Math.max(0, Math.min(1080, Number(settings.audienceLeft) || 0));
    CONFIG.audience.left = left;
    document.documentElement.style.setProperty("--audience-left", `${left}px`);
  }
  if (settings.audienceTop != null) {
    const top = Math.max(0, Math.min(1890, Number(settings.audienceTop) || 0));
    CONFIG.audience.top = top;
    document.documentElement.style.setProperty("--audience-top", `${top}px`);
  }
  if (settings.audienceScale != null) {
    const scale = Math.max(.65, Math.min(1.35, Number(settings.audienceScale) || 1));
    CONFIG.audience.scale = scale;
    document.documentElement.style.setProperty("--audience-scale", String(scale));
  }
  if (settings.audienceSurgeEnabled != null) {
    CONFIG.audience.surgeEnabled = Boolean(settings.audienceSurgeEnabled);
    if (!CONFIG.audience.surgeEnabled) setAudienceSurge(false);
  }
  if (settings.audienceMetrics) updateAudienceMetrics(settings.audienceMetrics);
  if (!isControllerPreview) saveOverlaySettings(settings);
}

function saveOverlaySettings(settings = {}) {
  const saved = loadOverlaySettings();
  const next = {
    ...saved,
    ...Object.fromEntries(Object.entries(settings).filter(([, value]) => value != null && value !== ""))
  };
  delete next.textOpacity;
  delete next.maxChars;
  try { localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(next)); } catch (_) {}
}

function loadOverlaySettings() {
  try {
    const saved = localStorage.getItem(SETTINGS_STORAGE_KEY) ||
      localStorage.getItem(LEGACY_SETTINGS_STORAGE_KEY) ||
      "{}";
    return JSON.parse(saved) || {};
  }
  catch (_) { return {}; }
}

function sanitizeText(value) {
  return String(value ?? "").replace(/[<>&]/g, char => ({
    "<": "&lt;",
    ">": "&gt;",
    "&": "&amp;"
  }[char]));
}

function renderUnicodeEmoji(root) {
  if (!root || !window.twemoji) return;
  window.twemoji.parse(root, {
    base: "https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/",
    folder: "svg",
    ext: ".svg",
    className: "emoji"
  });
}

const ALLOWED_IMAGE_HOSTS = /(^|\.)(tiktokcdn|ttlivecdn|byteoversea|ibyteimg|akamaized|giphy|tenor|socialstream|ggpht|googleusercontent|ytimg)\.[a-z.]+$/i;

function isLikelyImageUrl(url) {
  try {
    const parsed = new URL(url, location.href);
    return /^https?:$/.test(parsed.protocol) &&
      (/\.(png|jpe?g|gif|webp|avif)(\?|$)/i.test(parsed.href) || ALLOWED_IMAGE_HOSTS.test(parsed.hostname));
  } catch (_) {
    return false;
  }
}

function sanitizeMessageContent(value) {
  const raw = String(value ?? "");
  const template = document.createElement("template");
  template.innerHTML = raw;
  const makeSticker = url => {
    const img = document.createElement("img");
    img.className = "chat-sticker";
    img.src = url;
    img.alt = "";
    img.loading = "eager";
    img.referrerPolicy = "no-referrer";
    return img;
  };
  const makeLinkChip = url => {
    const chip = document.createElement("span");
    chip.className = "chat-link-chip";
    try {
      const parsed = new URL(url);
      const host = parsed.hostname.replace(/^www\./, "");
      chip.textContent = /(^|\.)youtu\.be$|(^|\.)youtube\.com$/.test(host)
        ? "YOUTUBE LINK"
        : host.toUpperCase().slice(0, 18);
    } catch (_) {
      chip.textContent = "LINK";
    }
    return chip;
  };

  template.content.querySelectorAll("script, style, iframe, object, embed, video, audio, source").forEach(el => el.remove());
  template.content.querySelectorAll("*").forEach(el => {
    if (el.tagName.toLowerCase() !== "img") {
      el.replaceWith(document.createTextNode(el.textContent || ""));
      return;
    }
    const src = el.getAttribute("src") || el.getAttribute("data-src") || "";
    let url;
    try { url = new URL(src, location.href); } catch (_) { el.remove(); return; }
    if (!/^https?:$/.test(url.protocol)) { el.remove(); return; }
    if (!isLikelyImageUrl(url.href)) { el.replaceWith(document.createTextNode(url.href)); return; }
    [...el.attributes].forEach(attr => el.removeAttribute(attr.name));
    el.src = url.href;
    el.alt = "";
    el.loading = "eager";
    el.referrerPolicy = "no-referrer";
    el.className = "chat-sticker";
  });

  function replaceUrlsInText(node) {
    const text = node.nodeValue || "";
    const urlRe = /https?:\/\/[^\s<>"']+/gi;
    if (!urlRe.test(text)) return;
    urlRe.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0;
    let match;
    while ((match = urlRe.exec(text))) {
      if (match.index > last) frag.appendChild(document.createTextNode(text.slice(last, match.index)));
      const cleanUrl = match[0].replace(/[),.;!?]+$/g, "");
      frag.appendChild(isLikelyImageUrl(cleanUrl) ? makeSticker(cleanUrl) : makeLinkChip(cleanUrl));
      const trailing = match[0].slice(cleanUrl.length);
      if (trailing) frag.appendChild(document.createTextNode(trailing));
      last = match.index + match[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.replaceWith(frag);
  }

  function walk(node) {
    [...node.childNodes].forEach(child => {
      if (child.nodeType === 3) replaceUrlsInText(child);
      else if (child.nodeType === 1 && child.tagName.toLowerCase() !== "img") walk(child);
    });
  }
  walk(template.content);
  return template.innerHTML || sanitizeText(raw);
}

function textBlob(...values) {
  return values.map(value => {
    if (Array.isArray(value)) return value.map(v => textBlob(v)).join(" ");
    if (value && typeof value === "object") {
      try { return JSON.stringify(value); } catch (_) { return ""; }
    }
    return String(value || "");
  }).join(" ").toLowerCase();
}

function collectImageUrls(data) {
  const candidates = [
    data.image,
    data.imageUrl,
    data.img,
    data.imgUrl,
    data.media,
    data.mediaUrl,
    data.attachment,
    data.attachmentUrl,
    data.photo,
    data.photoUrl,
    data.picture,
    data.pictureUrl,
    data.contentImg,
    data.contentimg
  ];
  if (Array.isArray(data.images)) candidates.push(...data.images);
  if (Array.isArray(data.attachments)) {
    data.attachments.forEach(item => {
      if (typeof item === "string") candidates.push(item);
      else if (item && typeof item === "object") candidates.push(item.url, item.src, item.imageUrl, item.mediaUrl);
    });
  }
  return [...new Set(candidates
    .filter(Boolean)
    .map(value => String(value).trim())
    .filter(isLikelyImageUrl)
  )].slice(0, 3);
}

function platformLabel(platform) {
  const p = String(platform || "").toLowerCase();
  if (p.includes("tiktok")) return "TT";
  if (p.includes("youtube")) return "YT";
  if (p.includes("twitch")) return "TW";
  return "JJ";
}

function platformKey(platform) {
  const p = String(platform || "").toLowerCase();
  if (p.includes("tiktok")) return "tiktok";
  if (p.includes("youtube")) return "youtube";
  return "other";
}

function viewerStatus(data, platform) {
  const p = platformKey(platform);
  const statusText = textBlob(
    data.membership, data.memberLevel, data.memberLabel, data.subscriberType,
    data.userBadges, data.badges, data.badgeType, data.badge, data.subBadge,
    data.tiktokFan, data.fanClub, data.fanClubMember, data.isFan, data.fan
  );
  const isSuperfan = p === "tiktok" && (
    data.isSuperfan === true || data.isSuperFan === true ||
    data.superfan === true || data.superFan === true ||
    /\b(super\s*fan|superfan|subscriber|subscription)\b/.test(statusText)
  );
  const isMember = p === "youtube" && (
    data.isSubscriber === true || data.subscriber === true ||
    data.isMember === true || data.member === true ||
    Boolean(data.membership || data.subBadge) ||
    /\b(member|membership|subscriber|sponsor)\b/.test(statusText)
  );
  const isFanClub = p === "tiktok" && !isSuperfan && (
    data.isFanClubMember === true || data.fanClubMember === true ||
    data.isTikTokFan === true || data.tiktokFan === true ||
    data.isFan === true || data.fan === true ||
    /\b(fan\s*club|fanclub|\bfan\b)\b/.test(statusText)
  );

  if (isSuperfan) return { kind: "superfan", label: "SUPERFAN" };
  if (isMember) return { kind: "member", label: "MEMBER" };
  if (isFanClub) return { kind: "fanclub", label: "♥" };
  return null;
}

function getEventIcon(type) {
  return {
    follow: "*",
    gift: "+",
    highGift: "DI",
    sub: "ST",
    member: "MB",
    likeMilestone: "LK",
    join: "IN",
    raid: "RD",
    bossEvent: "BF",
    leagueEvent: "LG",
    diamondDrop: "DI",
    system: "!"
  }[type] || "!";
}

function buildEventText(msg) {
  const name = msg.username || "Viewer";
  const gift = msg.giftName || msg.text || msg.message || "";
  return {
    follow: `${name} followed`,
    gift: `${name} sent ${gift || "a gift"}`,
    highGift: `${name} sent ${gift || "a huge gift"}`,
    sub: `New sub: ${name}`,
    member: `New member: ${name}`,
    likeMilestone: `${msg.value || msg.message || "Likes"} reached`,
    join: `${name} joined`,
    raid: `${name} raided`,
    bossEvent: msg.message || msg.text || "Boss Fight Started",
    leagueEvent: msg.message || msg.text || "League event",
    diamondDrop: `${name} dropped diamonds`,
    system: msg.message || msg.text || "System alert"
  }[msg.eventType] || (msg.message || msg.text || `${name} did something`);
}

function normalizeIncomingMessage(raw) {
  let data = raw;
  if (typeof data === "string") {
    try { data = JSON.parse(data); } catch (_) { data = { message: raw }; }
  }
  if (data?.detail && typeof data.detail === "object") data = data.detail;
  if (data?.action === "content" && data.value) {
    try { data = JSON.parse(data.value); } catch (_) {}
  }

  const event = String(data.event || data.action || data.typeEvent || "").toLowerCase();
  const platform = data.platform || data.source || data.type || data.site || "unknown";
  const username = data.username || data.chatname || data.name || data.displayName || "Viewer";
  const message = data.message || data.chatmessage || data.text || "";
  const giftName = data.giftName || data.gift || data.gifttitle || "";
  const value = data.value || data.amount || data.coins || data.hasDonation || data.donoValue || "";
  const status = viewerStatus(data, platform);
  const imageUrls = collectImageUrls(data);

  let kind = "chat";
  let eventType = null;
  const lowerMessage = String(message).toLowerCase();

  if (event === "follow" || event === "follower") {
    if (!CONFIG.events.showFollowsAsEvents) return { kind: "ignore", raw: data };
    eventType = "follow";
  }
  else if (event === "gift" || event === "giftredemption" || event === "giftpurchase" || giftName || data.hasDonation || data.donoValue) eventType = value && Number(String(value).replace(/[^0-9.]/g, "")) >= 1000 ? "highGift" : "gift";
  else if (event === "superchat" || event === "supersticker" || event === "donation") eventType = "highGift";
  else if (event === "sub" || event === "subscribe") eventType = "sub";
  else if (event === "member" || event === "membership" || event === "sponsor") eventType = "member";
  else if (event === "like" || event === "like_batch" || data.likes != null) {
    if (!CONFIG.events.showLikesAsEvents) return { kind: "ignore", raw: data };
    const likes = Number(data.likes || data.count || value || 0);
    if (likes >= lastLikeMilestone + CONFIG.events.likeMilestoneStep) {
      lastLikeMilestone = Math.floor(likes / CONFIG.events.likeMilestoneStep) * CONFIG.events.likeMilestoneStep;
      eventType = "likeMilestone";
      data.value = `${lastLikeMilestone.toLocaleString()} likes`;
    }
  }
  else if (event === "join" || event === "roomjoin" || event === "enter") {
    if (!CONFIG.events.showJoinsAsEvents) return { kind: "ignore", raw: data };
    eventType = "join";
  }
  else if (event === "raid") eventType = "raid";
  else if (event === "bossevent" || data.bossEvent) eventType = "bossEvent";
  else if (event === "leagueevent" || data.leagueEvent) eventType = "leagueEvent";
  else if (event === "diamonddrop" || lowerMessage.includes("dropped diamonds")) eventType = "diamondDrop";
  else if (event === "system" || data.system === true) eventType = "system";

  if (eventType) kind = "event";

  return {
    kind,
    eventType,
    platform,
    username,
    message,
    avatarUrl: data.avatar || data.avatarUrl || data.chatimg || "",
    imageUrls,
    value: data.value || value,
    giftName,
    status,
    raw: data
  };
}

function handleIncoming(raw) {
  updateAudienceMetrics(raw);
  trackFallbackJoin(raw);
  const msg = normalizeIncomingMessage(raw);
  if (msg.kind === "ignore") return;
  if (msg.kind === "event") {
    showEvent({
      type: msg.eventType,
      username: msg.username,
      text: buildEventText(msg),
      value: msg.value,
      icon: getEventIcon(msg.eventType)
    });
    return;
  }

  if (!String(msg.message || "").trim()) return;
  addChatMessage({
    platform: msg.platform,
    username: msg.username,
    message: msg.message,
    avatarUrl: msg.avatarUrl,
    imageUrls: msg.imageUrls,
    status: msg.status,
    badges: []
  });
}

function addChatMessage({ platform = "unknown", username = "Viewer", message = "", avatarUrl = "", imageUrls = [], badges = [], status = null }) {
  const item = { platform, username, message, avatarUrl, imageUrls, badges, status, id: Date.now() + Math.random() };
  chatQueue.push(item);
  renderChatMessage(item);

  while (chatQueue.length > CONFIG.chat.maxMessages) {
    chatQueue.shift();
    removeOldestChatElement();
  }
}

function renderChatMessage(item) {
  const row = document.createElement("div");
  row.className = `chat-message${item.status ? ` is-${item.status.kind}` : ""}`;
  row.dataset.id = item.id;
  row.dataset.platform = platformKey(item.platform);
  const statusHtml = item.status
    ? `<span class="status-pill ${sanitizeText(item.status.kind)}">${sanitizeText(item.status.label)}</span>`
    : "";
  const imageHtml = item.imageUrls?.length
    ? `<div class="chat-image-row">${item.imageUrls.map(url => `<img class="chat-inline-image" src="${sanitizeText(url)}" alt="" referrerpolicy="no-referrer">`).join("")}</div>`
    : "";
  row.innerHTML = `
    <div class="chat-meta">
      <span class="platform-chip" data-platform="${sanitizeText(platformKey(item.platform))}">${sanitizeText(platformLabel(item.platform))}</span>
      ${statusHtml}
      <span class="username">${sanitizeText(item.username)}</span>
    </div>
    <div class="message-text">${sanitizeMessageContent(item.message)}</div>
    ${imageHtml}
  `;
  chatList.appendChild(row);
  renderUnicodeEmoji(row);

  if (overlay.dataset.style === "chips") {
    window.setTimeout(() => removeChatElement(row), CONFIG.chat.messageLifetime);
  }
}

function removeOldestChatElement() {
  const oldest = chatList.querySelector(".chat-message");
  if (oldest) removeChatElement(oldest);
}

function removeChatElement(el) {
  if (!el || el.classList.contains("is-removing")) return;
  el.classList.add("is-removing");
  window.setTimeout(() => el.remove(), 420);
}

function showEvent({ type = "system", username = "", text = "", value = "", icon = "!" }) {
  if (!CONFIG.events.enabled) return;
  const item = { type, username, text, value, icon };
  if (activeEvent && CONFIG.events.queue) {
    eventQueue.push(item);
    return;
  }
  renderEvent(item);
}

function renderEvent(item) {
  activeEvent = true;
  eventZone.className = "event-zone is-visible";
  eventZone.dataset.eventType = item.type;
  eventZone.innerHTML = `
    <div class="event-card">
      <span class="event-icon">${sanitizeText(item.icon)}</span>
      <span class="event-copy">
        <span class="event-main">${sanitizeText(item.text)}</span>
        ${item.value ? `<span class="event-value">${sanitizeText(item.value)}</span>` : ""}
      </span>
    </div>
  `;
  renderUnicodeEmoji(eventZone);
  const duration = ["highGift", "diamondDrop", "bossEvent", "leagueEvent"].includes(item.type)
    ? CONFIG.events.highDuration
    : CONFIG.events.duration;

  window.setTimeout(() => {
    eventZone.classList.remove("is-visible");
    eventZone.classList.add("is-out");
    window.setTimeout(() => {
      eventZone.className = "event-zone";
      eventZone.innerHTML = "";
      activeEvent = false;
      const next = eventQueue.shift();
      if (next) renderEvent(next);
    }, 380);
  }, duration);
}

function startMockMode() {
  let mockTt = 128;
  let mockYt = 42;
  updateAudienceMetrics({ tiktokViewers: mockTt, youtubeViewers: mockYt });
  if (asBool(param("surge", null), false)) {
    // Ramp the counts so the real join-rate model drives the tiers, rather than
    // faking the surge flag — this exercises the escalation the same way a live
    // FYP spike would. Expect tier 1 after ~5s of hysteresis, then 2 and 3.
    let step = 1;
    mockTimers.push(window.setInterval(() => {
      step += .06;
      mockTt += Math.max(1, Math.round(step * (1 + Math.random())));
      mockYt += Math.max(0, Math.round(step * Math.random()));
      updateAudienceMetrics({ tiktokViewers: mockTt, youtubeViewers: mockYt });
    }, 500));
  }
  const chats = [
    "LET'S GOOO 🔥🎉",
    "Joe lock in 😂",
    "Jamie carried 🫶🏽✨",
    "W stream ❤️‍🔥",
    "No way haha 🐿️",
    "That was clean 🧑🏾‍🚀",
    "chat behave",
    "sticker check https://media.tenor.com/2roX3uxz_68AAAAM/cat-space.gif",
    "check this https://youtu.be/dQw4w9WgXcQ"
  ];
  const names = ["Sarah", "Mike", "Jamie", "Wekka", "Bob", "Layla", "Kinz"];
  const events = [
    { type: "follow", username: "Sarah", text: "Sarah followed", value: "", icon: "*" },
    { type: "gift", username: "Mike", text: "Mike sent Galaxy", value: "1,000 coins", icon: "+" },
    { type: "diamondDrop", username: "Joe", text: "Joe dropped diamonds", value: "Diamond Drop", icon: "DI" },
    { type: "leagueEvent", username: "Wekka", text: "New Champion: Wekka", value: "League of Splatties", icon: "LG" },
    { type: "bossEvent", username: "Boss", text: "Boss Fight Started", value: "Raid ready", icon: "BF" },
    { type: "leagueEvent", username: "Jamie", text: "League Promotion: Jamie", value: "Rank up", icon: "LG" },
    { type: "likeMilestone", username: "Chat", text: "1,000 likes reached", value: "Milestone", icon: "LK" }
  ];

  function nextChat() {
    const roll = Math.random();
    const status = roll > .82
      ? { kind: "superfan", label: "SUPERFAN" }
      : roll > .66
        ? { kind: "member", label: "MEMBER" }
        : roll > .5
          ? { kind: "fanclub", label: "♥" }
          : null;
    addChatMessage({
      platform: Math.random() > .45 ? "tiktok" : "youtube",
      username: names[Math.floor(Math.random() * names.length)],
      message: chats[Math.floor(Math.random() * chats.length)],
      imageUrls: Math.random() > .82 ? ["https://media.tenor.com/2roX3uxz_68AAAAM/cat-space.gif"] : [],
      status
    });
    mockTimers.push(window.setTimeout(nextChat, 2000 + Math.random() * 2000));
  }
  function nextEvent() {
    const evt = events[Math.floor(Math.random() * events.length)];
    showEvent(evt);
    mockTimers.push(window.setTimeout(nextEvent, 5000 + Math.random() * 4000));
  }
  nextChat();
  nextEvent();
}

function startControllerPreview() {
  CONFIG.chat.clampLines = Math.max(1, Number(param("lines", 2)) || 2);
  document.documentElement.style.setProperty("--clamp-lines", String(CONFIG.chat.clampLines));

  addChatMessage({
    platform: "tiktok",
    username: "NovaTap",
    message: "that spin was wild 😂🔥"
  });
  addChatMessage({
    platform: "youtube",
    username: "RiffRaff",
    message: "clutch moment 🫶🏽✨",
    status: { kind: "member", label: "MEMBER" }
  });
  addChatMessage({
    platform: "tiktok",
    username: "BlueRoom",
    message: "we are going to space 🧑🏾‍🚀"
  });

  activeEvent = true;
  eventZone.className = "event-zone is-visible";
  eventZone.dataset.eventType = "gift";
  eventZone.innerHTML = `
    <div class="event-card">
      <span class="event-icon">+</span>
      <span class="event-copy">
        <span class="event-main">GalaxyAnna sent Galaxy</span>
        <span class="event-value">Galaxy x1 ✨</span>
      </span>
    </div>
  `;
  renderUnicodeEmoji(eventZone);
}

function cycleStyle() {
  const current = STYLE_PRESETS.indexOf(overlay.dataset.style);
  overlay.dataset.style = STYLE_PRESETS[(current + 1) % STYLE_PRESETS.length];
}

function cycleTheme() {
  const i = THEME_PRESETS.indexOf(overlay.dataset.theme);
  const next = THEME_PRESETS[(i + 1) % THEME_PRESETS.length];
  overlay.dataset.theme = next;
  applyThemeFont(next);
}

window.addEventListener("message", event => {
  if (!event.data) return;
  handleIncoming(event.data);
});

document.addEventListener("keydown", event => {
  if (param("test", "0") !== "1") return;
  if (event.key.toLowerCase() === "c") {
    addChatMessage({ platform: "tiktok", username: "TestChat", message: "Manual chat pop" });
  }
  if (event.key.toLowerCase() === "e") {
    showEvent({ type: "gift", username: "TestEvent", text: "TestEvent sent Galaxy", value: "1,000 coins", icon: "+" });
  }
  if (event.key.toLowerCase() === "s") cycleStyle();
  if (event.key.toLowerCase() === "t") cycleTheme();
});

function connectSocialStreamSocket() {
  if (!CONFIG.socialStream.connectWebSocket) return;
  const session = param("session", CONFIG.socialStream.session);
  ssnSocket = new WebSocket(`${CONFIG.socialStream.socketBase}/${encodeURIComponent(session)}/4`);
  ssnSocket.onmessage = event => handleIncoming(event.data);
  ssnSocket.onclose = () => window.setTimeout(connectSocialStreamSocket, 3000);
  ssnSocket.onerror = () => {
    try { ssnSocket.close(); } catch (_) {}
  };
}

function connectAblyControls() {
  /* The old `window.Ably` guard is gone with the SDK: the transport is the dock socket
     via JJX.dockRealtime, which needs no Ably global. Left in place it always tripped,
     silently disabling this page's realtime. */
  if (!CONFIG.ably.enabled) return;
  try {
    ablyClient = JJX.dockRealtime({ fallbackKey: CONFIG.ably.key });
    ablyChannel = ablyClient.channels.get(CONFIG.ably.channel);
    JJX.cameraBeats({ client: ablyClient });   // shared camera beats (jjx-core)
    ablyChannel.subscribe("jjx-chat-settings", message => {
      applyOverlaySettings(message.data || {});
    });
    ablyChannel.subscribe("jjx-chat-test", message => {
      const data = message.data || {};
      if (data.kind === "event") showEvent(data.event || { type: "system", text: "Controller test event", icon: "!" });
      else addChatMessage(data.chat || { platform: "tiktok", username: "Controller", message: "Controller test chat" });
    });
    ablyChannel.subscribe("jjx-audience-metrics", message => {
      updateAudienceMetrics(message.data || {});
    });
    const requestCurrentSettings = () => {
      ablyChannel.publish("jjx-chat-settings-request", {
        source: "jjxlive-chat-box",
        requestedAt: Date.now()
      }).catch(() => {});
    };
    ablyClient.connection.on("connected", requestCurrentSettings);
    requestCurrentSettings();
  } catch (_) {}
}

applyUrlParams();
if (!isControllerPreview) applyOverlaySettings(loadOverlaySettings());
if (isControllerPreview) {
  startControllerPreview();
} else {
  renderAudienceMetrics();
  audienceSampleTimer = window.setInterval(sampleAudienceSurge, SURGE.sampleMs);
  if (param("test", "0") === "1") startMockMode();
  connectSocialStreamSocket();
  connectAblyControls();
  if (param("test", "0") !== "1") connectProducerState();
}
</script>
