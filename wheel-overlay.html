 *   legend    + counter-rotating outer frame and 12 chasing studs
 */
const FRAME_INSET = { spin: 150, power: 96, takeover: 44, legend: 12 };
const FRAME_THICK = { spin: 20,  power: 38, takeover: 58, legend: 82 };

function runFrame(run) {
  const spin = run.spin, t = tierOf(spin), k = t.k, ti = tierIndex(spin);
  const legend = spin.tier === 'legend';
  const ins = FRAME_INSET[spin.tier], th = FRAME_THICK[spin.tier];
  publishFx('jamie-cue', { cue: 'look', result: 'frame', x: 540, tier: spin.tier });

  // border-image needs a REAL border-width on a wrapper div to render at all.
  const m = place(el('fx marquee' + (legend ? ' legend' : '')), ins, ins, 1080 - ins * 2, 1920 - ins * 2);
  m.style.borderWidth = th + 'px';
  runNode(run, laneFx, m);

  // POWER and up: a breathing glow, so the step off Spin is visible immediately.
  if (ti >= 1) m.classList.add('marquee-glow');

  // TAKEOVER and up: a second frame just inside the first — reads as the claim
  // thickening rather than merely growing.
  if (ti >= 2) {
    const g = ins + th + 10;
    const inner = place(el('fx marquee' + (legend ? ' legend' : '')), g, g, 1080 - g * 2, 1920 - g * 2);
    inner.style.borderWidth = Math.round(th * 0.42) + 'px';
    inner.style.opacity = '.75';
    runNode(run, laneFx, inner);
  }

  if (legend) {
    const o = Math.max(4, ins - 14);
    const m2 = place(el('fx marquee legend counter'), o, o, 1080 - o * 2, 1920 - o * 2);
    m2.style.borderWidth = Math.round(th * 0.6) + 'px';
    runNode(run, laneFx, m2);
    // 12 studs chasing along the top edge.
    const rail = place(el('fx'), ins, ins, 1080 - ins * 2, th);
    runNode(run, laneFx, rail);
    for (let i = 0; i < 12; i++) {
      const s = el('stud');
      s.style.cssText = `position:absolute;top:${th / 2 - 7}px;width:14px;height:14px;` +
        `--cd:2600ms;animation-delay:${(-i * 216)}ms`;
      rail.appendChild(s);
    }
  }
  canvasBump(k);
  return 520;
}

// ═══════════════════════════════════════════════════════════════════
// AVATAR ◉ — invade. Anchored to the HEAD, not the cam rect, and clamped
// into frame so an invader can never land off-screen.
// ═══════════════════════════════════════════════════════════════════
const AVATAR_EXTRA = { spin: 0, power: 0, takeover: 2, legend: 5 };

function runAvatarLegacy(run) {
  const spin = run.spin, t = tierOf(spin), k = t.k, g = t.size;
  const legend = spin.tier === 'legend';
  const n = 1 + AVATAR_EXTRA[spin.tier];
  const url = avatarUrl(spin);

  for (let i = 0; i < n; i++) {
    runTimer(run, () => {
      const h = headNow;
      const s = (190 - i * 14) * g;
      const fromLeft = i % 2 === 0;
      const anchor = headPoint(h, fromLeft ? -0.75 : 0.75, rnd(-0.35, 0.35));
      // Clamp into frame — the head can sit near an edge.
      const x = Math.min(1080 - s - 12, Math.max(12, anchor.x - s / 2));
      const y = Math.min(1920 - s - 12, Math.max(12, anchor.y - s / 2));

      const inv = place(el('fx invader' + (legend ? ' legend' : '')),
        fromLeft ? -s : 1080, y, s, s);
      inv.style.backgroundImage = `url('${url}')`;
      inv.style.transition = 'left 520ms cubic-bezier(.2,.95,.3,1.35)';
      runNode(run, laneFx, inv);
      void inv.offsetWidth;
      inv.style.left = x + 'px';

      // Lands with a bump and a spark burst, name tag snapping out beside it.
      runTimer(run, () => {
        canvasBump(k * (1 - i * 0.1));
        sparkBurst(run, { x: x + s / 2, y: y + s / 2 }, Math.round(9 * k), k, legend);
        if (i === 0) {
          const tag = el('fx inv-tag');
          tag.style.cssText = `left:${x + s + 12}px;top:${y + s / 2 - 22}px;font-size:${30 * g}px`;
          tag.textContent = displayName(spin);        // viewer input — textContent
          runNode(run, laneFx, tag);
          reveal(tag, 'show');
        }
      }, 520);

      // Then drifts up and out.
      runTimer(run, () => inv.classList.add('drifting'), 520 + holdOf(spin));
    }, i * 160);
  }
  return 520 + holdOf(spin) + 700;
}

const ECHO_COUNT = { spin: 2, power: 3, takeover: 4, legend: 5 };
const ECHO_POSITIONS = [
  { x: 70,  y: 500, r: -10 },
  { x: 790, y: 480, r:  11 },
  { x: 150, y: 1030, r: 8 },
  { x: 745, y: 1080, r: -8 },
  { x: 420, y: 1320, r: 4 },
];
const ECHO_POSITIONS_CAM_BOTTOM = [
  { x: 70,  y: 90,  r: -10 },
  { x: 790, y: 120, r:  11 },
  { x: 150, y: 430, r: 8 },
  { x: 745, y: 470, r: -8 },
  { x: 420, y: 760, r: 4 },
];

function runAvatar(run) {
  const spin = run.spin, t = tierOf(spin), k = t.k, g = t.size;
  const legend = spin.tier === 'legend';
  const count = ECHO_COUNT[spin.tier] || ECHO_COUNT.spin;
  const giver = esc(displayName(spin));
  const prompt = el('fx echo-countdown');
  prompt.style.top = layout === 'cam-bottom' ? '1050px' : '790px';
  prompt.innerHTML = `<small>${giver} TRIGGERED</small>SNAPSHOT ECHO`;
  runNode(run, laneFx, prompt);
  publishFx('jamie-cue', { cue: 'confused', result: 'avatar', x: 540, tier: spin.tier });

  const addEcho = (snap, index) => {
    if (run.done) return;
    const positions = layout === 'cam-bottom' ? ECHO_POSITIONS_CAM_BOTTOM : ECHO_POSITIONS;
    const pos = positions[index % positions.length];
    const size = Math.min(250, (180 + index * 8) * g);
    const node = place(el('fx snapshot-echo' + (legend ? ' legend' : '')), pos.x, pos.y, size, size);
    node.style.setProperty('--er', pos.r + 'deg');
    node.style.animationDelay = (index * 40) + 'ms,' + (500 + index * 70) + 'ms';
    node.style.backgroundImage = snap?.dataURL
      ? `url('${snap.dataURL}')`
      : `url('${avatarUrl(spin)}')`;
    runNode(run, laneFx, node);
    ripple(run, { x: pos.x + size / 2, y: pos.y + size / 2 }, g, legend);
    sparkBurst(run, { x: pos.x + size / 2, y: pos.y + size / 2 }, Math.round(5 * k), g, legend);
    canvasBump(Math.max(0.65, k * .45), 300);
    prompt.innerHTML = index + 1 < count
      ? `<small>${giver} TRIGGERED</small>SNAPSHOT ECHO ${index + 1}/${count}`
      : `<small>SNAPSHOT ECHO</small>${giver} CAUGHT IN IT`;
    if (index + 1 === count && legend) {
      publishFx('jamie-cue', { cue: 'celebrate', result: 'avatar', x: pos.x + size / 2, tier: spin.tier });
    }
  };

  const first = run.snapshots.camera || camStill;
  addEcho(first, 0);
  for (let i = 1; i < count; i++) {
    runTimer(run, () => {
      askInteractionSnapshot(run, 'camera', i, (snap) => addEcho(snap || first, i), 520);
    }, i * 210);
  }
  runTimer(run, () => {
    prompt.style.transition = 'opacity .35s ease';
    prompt.style.opacity = '0';
  }, count * 210 + 650);
  return count * 210 + 900;
}

// ═══════════════════════════════════════════════════════════════════
// BALL DROP ● — the cam becomes a ball.
//
// CONTRACT 3 (game-scene): when `targetsNow` is present the ball lands in the
// GAME'S OWN bucket. When it is absent, the fallback sphere lands on the layout's
// ground line. We never draw a second bucket over the game.
//
// CONTRACT 4 (camera): the overlay does not own the cam — Studio does. It does not
// need to. The effect freezes the cam at detach anyway, so we cover the live cam
// rect with a STILL of it (supplied by gesture-cam, which already captures that
// strip) and from that instant we own those pixels: the hole is punched in our own
// copy. No still available => the ball is drawn from the sphere art alone and the
// cam is left untouched, which still reads.
//
// THE BALL NEVER SCALES NON-UNIFORMLY — it is the camera, and any squash warps the
// face inside. Impacts are uniform pulses only.
// ═══════════════════════════════════════════════════════════════════
let gameBalls = [];         // Ball Guys balls from gesture-cam — what Ball Drop bounces off
let ballSignalsCh = null;
function publishScanRequest() {
  // Ask gesture-cam to start scanning the game region. It only scans in bursts, so
  // without this the colliders simply are not being published when a gift lands.
  if (ballSignalsCh) { try { ballSignalsCh.publish('scan-request', {}).catch(() => {}); } catch (e) {} }
}
let targetsNow = null;      // legacy target rect; Ball Drop no longer draws a bucket
let camStill = null;        // { dataURL, rect } from gesture-cam, or null
window.setTargets = (t) => { targetsNow = (t && t.w > 0 && t.h > 0) ? t : null; };
let camStillRequest = null;
/** Ask gesture-cam for a clean frame now. No-op without a dock — Ball Drop then flies
 *  the sphere art alone, which is the documented fallback. */
function requestCamStill() { if (camStillRequest) camStillRequest(); }
window.setCamStill = (s) => {
  camStill = (s && s.dataURL && s.rect) ? s : null;
  // Decode ahead of time so the fisheye warp at detach is synchronous. Decoding
  // there instead would land a frame or two late — exactly on the beat the ball
  // is supposed to already be carrying the face.
  if (camStill) {
    const img = new Image();
    img.onload = () => { camStill.img = img; };
    img.src = camStill.dataURL;
  }
};

/**
 * FISHEYE — blow the face up inside the sphere.
 *
 * `background-size: cover` on the whole cam strip gave a flat, zoomed-OUT picture
 * pasted on a circle: the face was small, undistorted, and read as a sticker rather
 * than as something trapped in a ball. Two things fix that, and neither is available
 * in CSS — a real barrel distortion needs per-pixel resampling.
 *
 *   ZOOM   crop tight to the tracked head instead of the whole cam rect
 *   BULGE  remap radius as r^p (p > 1), which pulls samples toward the centre and so
 *          MAGNIFIES the middle while squeezing the rim — the lens look. The nose
 *          ends up nearest the glass, which is the joke.
 *
 * Runs once per drop on a 512px canvas (~260k samples, a few ms), not per frame.
 */
const FISHEYE = { size: 512, power: 1.55, crop: 1.15 };

/** `lens` is the operator setting carried on the spin; FISHEYE is the fallback for a
 *  payload that predates it (a stored row, or a hand-built test spin). */
function fisheyeFace(still, head, lens) {
  if (!still || !still.img || !still.img.width) return null;
  const power = Number(lens && lens.power) > 0 ? Number(lens.power) : FISHEYE.power;
  const crop = Number(lens && lens.crop) > 0 ? Number(lens.crop) : FISHEYE.crop;
  const N = FISHEYE.size, R = N / 2;
  const src = still.img, rect = still.rect;

  // Stage px -> still-image px.
  const sx = src.width / rect.w, sy = src.height / rect.h;
  const hc = headPoint(head, 0, 0);
  // A square crop around the head, padded slightly so the warp has edge to eat.
  const cropStage = Math.max(head.w, head.h) * crop;
  const cx = (hc.x - rect.x) * sx, cy = (hc.y - rect.y) * sy;
  const rx = (cropStage / 2) * sx, ry = (cropStage / 2) * sy;

  const cut = document.createElement('canvas');
  cut.width = N; cut.height = N;
  const cctx = cut.getContext('2d');
  // Draw the crop square-on first; sampling then happens in a clean N x N space.
  cctx.drawImage(src, cx - rx, cy - ry, rx * 2, ry * 2, 0, 0, N, N);
  const srcData = cctx.getImageData(0, 0, N, N).data;

  const out = document.createElement('canvas');
  out.width = N; out.height = N;
  const octx = out.getContext('2d');
  const dst = octx.createImageData(N, N);
  const d = dst.data;

  for (let y = 0; y < N; y++) {
    const v = (y - R) / R;
    for (let x = 0; x < N; x++) {
      const u = (x - R) / R;
      const r = Math.sqrt(u * u + v * v);
      const o = (y * N + x) * 4;
      if (r > 1) { d[o + 3] = 0; continue; }          // outside the sphere
      // r^p < r for p>1, so we sample nearer the middle => the middle is magnified.
      const rs = Math.pow(r, power);
      const k = r === 0 ? 0 : rs / r;
      const sxp = Math.round(R + u * k * R);
      const syp = Math.round(R + v * k * R);
      const s = (Math.min(N - 1, Math.max(0, syp)) * N + Math.min(N - 1, Math.max(0, sxp))) * 4;
      d[o] = srcData[s]; d[o + 1] = srcData[s + 1]; d[o + 2] = srcData[s + 2];
      // Feather the last 2% so the rim meets the ring art without a jagged edge.
      d[o + 3] = r > 0.98 ? Math.round(255 * (1 - r) / 0.02) : 255;
    }
  }
  octx.putImageData(dst, 0, 0);
  return out.toDataURL('image/png');
}

const BALL_SCALE   = { spin: 0.78, power: 0.82, takeover: 0.86, legend: 0.90 };

function runBall(run) {
  const spin = run.spin, t = tierOf(spin), k = t.k, g = t.size;
  const legend = spin.tier === 'legend';
  const h = headNow;
  const ground = LAYOUTS[layout].ground;
  requestInteraction(run, { ms: 4300, hands: false, body: true, mode: 'ball-body' });
  publishFx('jamie-cue', { cue: 'chase', result: 'ball', x: headPoint(h, 0, 0).x, tier: spin.tier });

  // Target: the game's own bucket when tracked, otherwise a centered landing zone.
  const tracked = !!targetsNow;
  const bw = 300 * g, bh = 230 * g;
  // targetsNow is the bucket's INTERIOR — the clear space between its walls and
  // above its floor — so the ball can be contained by it rather than parked on top.
  const target = tracked
    ? { x: targetsNow.x + targetsNow.w / 2, mouthY: targetsNow.y,
        floor: targetsNow.y + targetsNow.h, left: targetsNow.x, right: targetsNow.x + targetsNow.w,
        w: targetsNow.w, h: targetsNow.h }
    : { x: 540, mouthY: ground - bh, floor: ground, left: 540 - bw / 2, right: 540 + bw / 2,
        w: bw, h: bh };

  // NO BUCKET. The ball falls into the actual Ball Guys game and bounces off the
  // balls in it — the same interaction Bomb Drop already has, off the same colliders
  // gesture-cam detects visually. Drawing our own bucket was a stand-in for a game
  // we can in fact reach; a fake receptacle sitting on top of a real game reads as a
  // sticker, not as the ball landing in anything.
  publishScanRequest();

  // ── The cam still ──────────────────────────────────────────────────
  // Ask for a FRESH one right now, before this effect draws anything. gesture-cam
  // captures the composited projector, so a still taken mid-effect contains whatever
  // we had on screen at the time — which is how the ball ended up carrying the black
  // hole instead of a face. Asking at t=0 gets a clean frame, and it arrives over the
  // local socket well inside the 460ms before detach.
  requestCamStill();
  const camR = camStill ? camStill.rect : camRect();

  // ── The cam rect shrinks and rounds into a circle on the tracked head ──
  // NOTHING is frozen or punched yet. Through the shrink the REAL camera is still
  // live underneath — the face has to be visible right up to the moment the ball
  // leaves with it, or there is nothing to take.
  // The ball is always head-sized. Tier adds polish and activity around it, never
  // another full multiplier on the captured camera crop.
  const size = Math.min(320, Math.max(220, Math.max(h.w, h.h) * BALL_SCALE[spin.tier]));
  const c0 = headPoint(h, 0, 0);
  const ball = el('fx ball');
  place(ball, camR.x, camR.y, camR.w, camR.h);
  ball.style.borderRadius = '0px';
  const shell = el('ball-shell'); shell.style.cssText = 'position:absolute;inset:0';
  const gloss = el('ball-gloss'); gloss.style.cssText = 'position:absolute;inset:0';
  const ring  = el('ball-ring' + (legend ? ' legend' : '')); ring.style.cssText = 'position:absolute;inset:0;opacity:0;transition:opacity .3s ease';
  ball.appendChild(shell); ball.appendChild(gloss); ball.appendChild(ring);
  runNode(run, laneFx, ball);

  ball.style.transition = 'left .42s cubic-bezier(.3,.05,.2,1), top .42s cubic-bezier(.3,.05,.2,1),' +
                          ' width .42s cubic-bezier(.3,.05,.2,1), height .42s cubic-bezier(.3,.05,.2,1),' +
                          ' border-radius .42s cubic-bezier(.3,.05,.2,1)';
  void ball.offsetWidth;
  ball.style.left = (c0.x - size / 2) + 'px';
  ball.style.top = (c0.y - size / 2) + 'px';
  ball.style.width = size + 'px';
  ball.style.height = size + 'px';
  ball.style.borderRadius = '50%';
  ring.style.opacity = '1';

  const shadow = place(el('fx ball-shadow'), c0.x - size / 2, ground - 18, size, 34);
  runNode(run, laneFx, shadow);

  // ── DETACHED: real physics. Not a head any more. ──
  runTimer(run, () => {
    // THIS is the moment the face leaves. Only now does the ball take the still, the
    // cam freeze go up, and the hole get punched — in that order, so the ball carries
    // a picture of the face and the hole is what is left behind.
    if (camStill) {
      // Zoomed and lens-warped, not the flat cam crop — see fisheyeFace. Falls back
      // to the plain still if the image has not decoded yet, so the ball always
      // carries a face rather than nothing.
      const warped = fisheyeFace(camStill, h, spin.lens);
      ball.style.backgroundImage = `url('${warped || camStill.dataURL}')`;
      ball.style.backgroundSize = 'cover';
      ball.style.backgroundPosition = 'center';
      if (warped) ball.classList.add('ball-lens');

      const frozen = place(el('fx cam-frozen'), camStill.rect.x, camStill.rect.y,
                                                camStill.rect.w, camStill.rect.h);
      frozen.style.backgroundImage = `url('${camStill.dataURL}')`;
      runNode(run, laneFx, frozen);
    }
    if (camStill) {
      const c = headPoint(h, 0, 0);
      const d = Math.min(360, size * 1.10);
      const hole = place(el('fx cam-hole'), c.x - d / 2, c.y - d / 2, d, d);
      runNode(run, laneFx, hole);
      for (let i = 0; i < 7; i++) {
        const s = el('fx spark');
        const sz = rnd(10, 26);
        s.style.cssText = `left:${c.x}px;top:${c.y}px;width:${sz}px;height:${sz}px;background:#2A0447;` +
          `--dx:${rnd(-200,200).toFixed(0)}px;--dy:${rnd(-160,60).toFixed(0)}px;--sd:${rnd(600,1000)}ms`;
        runNode(run, laneFx, s);
      }
    }

    sparkBurst(run, { x: c0.x, y: c0.y }, Math.round(12 * k), k, legend);
    let x = c0.x, y = c0.y, vx = (target.x - c0.x) / 0.82, vy = 160, rot = 0;
    // Weighted drop, not a rubber ball. Collisions can redirect it enough to sell
    // the interaction, but the bucket floor captures it instead of springing it up.
    const G = 3400, COLLISION_REST = 0.18;
    let last = performance.now(), settled = false, captured = false;
    // Separate cap for the game-ball colliders, and a per-drop ceiling: a ball resting
    // against or grazing a static collider must be able to STOP bouncing off it. Without
    // this a resting contact re-satisfies `dist < rr` every single animation frame
    // forever, and each one fired a network publish — a live 60/s request storm that
    // never ended on its own, discovered live on stream.
    let colliderBounces = 0;
    let bodyBounces = 0;
    const MAX_COLLIDER_BOUNCES = 3;
    const MAX_BODY_BOUNCES = 2;
    const fallStartedAt = performance.now();

    const step = (now) => {
      if (run.done) return;
      const dt = Math.min(0.032, (now - last) / 1000); last = now;
      vy += G * dt; x += vx * dt; y += vy * dt;
      rot += vx * dt * 0.4;                        // rotation from horizontal velocity
      const radius = size / 2;

      // Once its lower edge crosses the mouth, the ball belongs to the bucket.
      // Outside body/game colliders can no longer kick it back out.
      if (!captured && tracked && vy > 0 && y + radius >= target.mouthY &&
          x + radius > target.left && x - radius < target.right) {
        captured = true;
        vx *= 0.18;
      }

      // After the ball has cleared the face it can bounce off the streamer's tracked
      // shoulders, torso and arms. The short delay prevents an immediate collision
      // with the head collider at the exact point the ball detaches from it.
      if (!captured && bodyBounces < MAX_BODY_BOUNCES && now - fallStartedAt > 300) {
        const hit = bodyCollision(x, y, size * .43, currentBodyParts(run));
        if (hit) {
          const vn = vx * hit.nx + vy * hit.ny;
          if (vn < 0) {
            x += hit.nx * hit.penetration; y += hit.ny * hit.penetration;
            vx = (vx - 1.25 * vn * hit.nx) * .62;
            vy = (vy - 1.25 * vn * hit.ny) * .62;
            bodyBounces++;
            canvasBump(k * .65);
          }
        }
      }

      // Bounce off the Ball Guys balls, exactly as Bomb Drop does. They are static
      // and immovable; we take the normal and reflect.
      for (const b of captured ? [] : gameBalls) {
        if (colliderBounces >= MAX_COLLIDER_BOUNCES) break;
        const dx2 = x - b.x, dy2 = y - b.y;
        const rr = (b.r || 0) + size / 2;
        const dist = Math.hypot(dx2, dy2);
        if (dist <= 0.001 || dist >= rr) continue;
        const nx = dx2 / dist, ny = dy2 / dist;
        const vn = vx * nx + vy * ny;
        // Only reflect when actually APPROACHING (closing speed < 0). A ball already
        // moving away is a separating contact, not a collision — reflecting it too
        // flips it back INTO the collider, which is exactly the loop that caused the
        // storm: correct position, wrong velocity, re-penetrate next frame, repeat.
        if (vn >= 0) continue;
        x = b.x + nx * rr; y = b.y + ny * rr;
        vx = (vx - (1 + COLLISION_REST) * vn * nx) * .72;
        vy = (vy - (1 + COLLISION_REST) * vn * ny) * .72;
        colliderBounces++;
        canvasBump(k * 0.7);
        ball.style.transform = 'rotate(' + rot + 'deg) scale(1.09)';
        setTimeout(() => { if (!run.done) ball.style.transform = 'rotate(' + rot + 'deg) scale(1)'; }, 110);
      }
      // WALLS. Once the ball is below the bucket's mouth it is inside the U, so the
      // sides are solid: bounce off them instead of sliding out through the drawing.
      if (tracked && (captured || y + radius > target.mouthY)) {
        const safeLeft = target.left + radius;
        const safeRight = target.right - radius;
        if (safeLeft <= safeRight) {
          if (x < safeLeft)  { x = safeLeft;  vx = captured ? 0 : Math.abs(vx) * COLLISION_REST; }
          if (x > safeRight) { x = safeRight; vx = captured ? 0 : -Math.abs(vx) * COLLISION_REST; }
        } else {
          x = target.x;
          vx = 0;
        }
        if (captured) {
          const lock = 1 - Math.exp(-10 * dt);
          x += (target.x - x) * lock;
          vx *= Math.exp(-12 * dt);
        }
      }
      const rest = target.floor - radius;
      if (!settled && y >= rest) {
        // Heavy landing: one compression beat, zero upward velocity.
        settled = true;
        captured = tracked || captured;
        y = rest; x = target.x; vy = 0; vx = 0;
        settleBallDrop(run, ball, target, size, k, legend, tracked);
        return;
      }
      // Ground shadow tightens as it falls.
      const prox = Math.max(0.25, 1 - Math.abs(rest - y) / 900);
      shadow.style.left = (x - (size * prox) / 2) + 'px';
      shadow.style.width = (size * prox) + 'px';
      shadow.style.opacity = String(0.18 + 0.4 * prox);

      ball.style.left = (x - size / 2) + 'px';
      ball.style.top = (y - size / 2) + 'px';
      ball.style.transform = `rotate(${rot}deg) scale(1)`;
      const id = requestAnimationFrame(step);
      run.rafs.add(id);
    };
    ball.style.transition = 'none';
    const id = requestAnimationFrame(step);
    run.rafs.add(id);
  }, 460);

  return 460 + 1900;
}

/** Entry: lock the ball to the bucket floor and play one short impact pulse. */
function settleBallDrop(run, ball, target, size, k, legend, tracked) {
  canvasBump(k, 520);
  publishFx('impact', { kind: 'object', x: target.x, tier: run.spin.tier });
  if (legend) publishFx('jamie-cue', { cue: 'celebrate', result: 'ball', x: target.x, tier: run.spin.tier });
  ball.style.left = (target.x - size / 2) + 'px';
  ball.style.top = (target.floor - size) + 'px';
  ball.style.transform = 'scale(1.035)';
  setTimeout(() => { if (!run.done) ball.style.transform = 'scale(1)'; }, 120);

  const g = tierOf(run.spin).size;

  if (tierIndex(run.spin) >= 2) {
    const n = legend ? 34 : 16;
    for (let c = 0; c < n; c++) {
      const s = el('fx spark');
      const sz = rnd(8, 20);
      s.style.cssText = `left:${target.x}px;top:${target.mouthY}px;width:${sz}px;height:${sz * 1.6}px;` +
        `background:${legend ? '#FDE68A' : '#E879F9'};border-radius:2px;` +
        `--dx:${rnd(-260, 260).toFixed(0)}px;--dy:${rnd(-420, -120).toFixed(0)}px;--sd:${rnd(700, 1300)}ms`;
      runNode(run, laneFx, s);
    }
  }

  const plate = el('fx ball-plate');
  plate.style.cssText = `left:0;top:${target.mouthY - 120}px;width:1080px;text-align:center;font-size:${44 * g}px`;
  plate.textContent = tracked ? 'IN THE BUCKET' : 'BALL DROP';
  runNode(run, laneFx, plate);
  reveal(plate, 'show');
}

/** The hero line — the ONLY place the name is printed during impact. */
function showHero(run, spin) {
  const res = RESULT_BY_KEY[spin.result] || { label: spin.result };
  const h = el(`hero tier-${spin.tier}`);
  h.innerHTML = `<div class="h-name">${esc(displayName(spin))}</div>` +
                `<div class="h-what">${esc(res.label)}</div>`;
  runNode(run, laneImpact, h);
  reveal(h, 'show');
}

// ── Stage 3: SETTLED → lay the brick, then release the queue ──
function startSettle(run) {
  // The wall is never attached to a run: a brick outlives every spin, so a
  // teardown must not be able to reach it.
  //
  // A PREVIEW plays the full effect but lays NO brick. The wall is a ledger of real
  // money; an operator checking what Legend Crack looks like must not leave a
  // supporter in it. Preview spins are also never persisted by the dock, so a
  // reload clears any trace of them.
  if (!run.spin.preview) addSupporter(run.spin);
  finishActive();
}

function finishActive() {
  if (!active) return;
  const run = active;
  active = null;
  cleanupRun(run); // clears timers + removes any still-attached (receipt/wheel/impact) nodes
  pump();          // next spin, if any
}

/** Schedule a stage's advance with a watchdog that force-advances on hang. */
function runStage(run, advance, plannedMs) {
  let fired = false;
  const go = () => { if (fired) return; fired = true; advance(); };
  runTimer(run, go, plannedMs);
  runTimer(run, () => { if (!fired) { console.warn('[wheel] stage watchdog'); go(); } }, plannedMs + STAGE_WATCHDOG_PAD);
}

// ═══════════════════════════════════════════════════════════════════
// EFFECT PRIMITIVES — shared by all nine effects.
// ═══════════════════════════════════════════════════════════════════

/**
 * BROADCAST THE BEAT to the other overlays.
 *
 * Studio composites each browser source separately, so nothing here can transform
 * Feed Jamie — and Jamie stands at the cam/gameplay seam, directly under everything
 * this overlay does. Without this, the frame shakes and Jamie hangs there perfectly
 * still, which reads as a bug rather than a layer. So the camera-level beats go out
 * on the socket and every overlay that wants to move applies them ITSELF, using the
 * same origin and the same curve.
 *
 * Only frame-level beats belong here (bump, hard shake). Effect-local motion stays
 * local — a bucket of water is this overlay's business.
 */
let fxCh = null;
// Hard backstop on the OUTBOUND publish only — the local bump on #bump always plays
// at full rate; this only throttles what goes out over the network. Found live: a
// physics bug elsewhere let a resting collision re-fire every animation frame, and
// each one hit /api/overlay-bus/publish — a 60/s request storm with no natural end.
// The real fix is capping that loop (see runBall), but nothing that broadcasts to
// every other overlay on the stream should be able to flood the dock even if some
// future bug calls it too often — 50ms floor is comfortably under the tightest
// legitimate beat spacing in this file (Stamp's Legend marks, 110ms apart).
const lastFxPublishAt = new Map();
const FX_PUBLISH_MIN_GAP_MS = 50;
function publishFx(kind, data) {
  if (!fxCh) return;   // no dock yet: everything still plays here, just alone
  const now = performance.now();
  const last = lastFxPublishAt.get(kind) || 0;
  if (now - last < FX_PUBLISH_MIN_GAP_MS) return;
  lastFxPublishAt.set(kind, now);
  try { fxCh.publish(kind, data).catch(() => {}); } catch (e) {}
}

/** Canvas bump on the beat. Amplitude scales with k. Lives on #bump so it can
 *  never collide with another element's transform. */
function canvasBump(k, ms) {
  const scale = +(1 + 0.012 * k).toFixed(4);
  const dur = ms || 420 + 100 * k;
  bumpEl.style.setProperty('--bump', scale);
  bumpEl.style.setProperty('--bump-ms', dur + 'ms');
  bumpEl.classList.remove('bumping');
  void bumpEl.offsetWidth;              // restart the animation even mid-flight
  bumpEl.classList.add('bumping');
  publishFx('bump', { scale, ms: dur });
}
// Drop the class once the bump finishes so #bump sits with no animation between
// beats. `both` holds the final frame either way, but a permanently-animated
// element is one more thing that can interact badly with a later transform.
bumpEl.addEventListener('animationend', (e) => {
  if (e.animationName === 'om-bump') bumpEl.classList.remove('bumping');
});

/** N sparks off a point, each carrying its own vector as a custom property. */
function sparkBurst(run, at, n, k, gold) {
  const geo = Math.min(1.28, Math.max(0.85, k));
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 * i) / n + Math.random() * 0.5;
    const d = (60 + Math.random() * 120) * geo;
    const s = el('fx spark');
    const size = (4 + Math.random() * 5) * geo;
    s.style.cssText = `left:${at.x}px;top:${at.y}px;width:${size}px;height:${size}px;` +
      `background:${gold ? '#FDE68A' : '#E879F9'};` +
      `--dx:${(Math.cos(a) * d).toFixed(1)}px;--dy:${(Math.sin(a) * d).toFixed(1)}px;` +
      `--sd:${420 + Math.random() * 260}ms`;
    runNode(run, laneFx, s);
  }
}

function ripple(run, at, k, gold) {
  const geo = Math.min(1.28, Math.max(0.85, k));
  const size = 150 * geo;
  const r = el('fx ripple' + (gold ? ' legend' : ''));
  r.style.cssText = `left:${at.x - size / 2}px;top:${at.y - size / 2}px;width:${size}px;height:${size}px;` +
    `border-width:${(2.2 * geo).toFixed(1)}px`;
  runNode(run, laneFx, r);
}

/** LEGEND FLARE — renders under EVERY effect at Legend and nowhere else.
 *  Gold flash + slow rotating rays + held vignette + an 18-spark burst off the head. */
function legendFlare(run) {
  const hold = holdOf(run.spin);   // the flare holds exactly as long as the effect does
  const flash = el('lf-flash');
  const rays = el('lf-rays');
  const vign = el('lf-vignette');
  vign.style.setProperty('--hold', hold + 'ms');
  runNode(run, laneFlare, rays);
  runNode(run, laneFlare, vign);
  runNode(run, laneFlare, flash);
  sparkBurst(run, forehead(headNow), 18, TIER.legend.k, true);
}

// ═══════════════════════════════════════════════════════════════════
// EFFECT REGISTRY. `hero: false` means the effect's in-scene payoff IS the
// name, so printing a hero line too would say it twice — ONE VOICE PER EFFECT.
// Only `stamp` is built (checkpoint 4); the rest fall back to the placeholder
// card until checkpoint 7, which is why `run` is dispatched, not assumed.
// ═══════════════════════════════════════════════════════════════════
const EFFECTS = {
  stamp:     { hero: false, run: runStamp },
  curse:     { hero: true,  run: runCurse },
  flood:     { hero: true,  run: runFlood },
  weather:   { hero: true,  run: runWeather },
  crack:     { hero: false, run: runCrack },
  spotlight: { hero: false, run: runSpotlight },
  frame:     { hero: true,  run: runFrame },
  avatar:    { hero: false, run: runAvatar },
  ball:      { hero: true,  run: runBall },
};

const TIER_ORDER = ['spin', 'power', 'takeover', 'legend'];
const tierIndex = (spin) => Math.max(0, TIER_ORDER.indexOf(spin.tier));
const camRect = () => (layout === 'cam-top'
  ? { x: 0, y: 0, w: 1080, h: 470 }
  : { x: 170, y: 1040, w: 740, h: 420 });
/** The giver's face, or the splat badge when they have no avatar. */
const avatarUrl = (spin) => spin.user?.avatarUrl || 'assets/wheel/splat-badge.png';
const rnd = (a, b) => a + Math.random() * (b - a);

function place(node, x, y, w, h) {
  node.style.left = x + 'px'; node.style.top = y + 'px';
  node.style.width = w + 'px'; node.style.height = h + 'px';
  return node;
}

function closestOnSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy || 1e-6;
  const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
  return { x: x1 + t * dx, y: y1 + t * dy };
}

/** Circle-vs-body collision against gesture-cam's head circle and limb capsules. */
function bodyCollision(x, y, radius, parts) {
  let best = null;
  for (const part of parts || []) {
    let q, reach;
    if (part.t === 'c') {
      q = { x: Number(part.x), y: Number(part.y) };
      reach = radius + Number(part.r || 0);
    } else if (part.t === 'l') {
      q = closestOnSegment(x, y, Number(part.x1), Number(part.y1), Number(part.x2), Number(part.y2));
      reach = radius + Number(part.r || 0);
    } else continue;
    const dx = x - q.x, dy = y - q.y;
    const dist = Math.hypot(dx, dy);
    if (!(dist < reach) || !isFinite(dist)) continue;
    const nx = dist > .001 ? dx / dist : 0;
    const ny = dist > .001 ? dy / dist : -1;
    const hit = { nx, ny, penetration: reach - dist };
    if (!best || hit.penetration > best.penetration) best = hit;
  }
  return best;
}

// ═══════════════════════════════════════════════════════════════════
// STAMP ✦ — the flagship. The name is physically stamped on the face.
//
// A die swings in on an arc, presses and squashes on a hard ease-in, and on
// CONTACT fires the bump, ink burst and ripple — all anchored to the brow, not
// the frame, so the beat lands on the face wherever the face is. It lifts away
// revealing an ink impression masked through a real rubber-ink alpha texture,
// which rides the head through the hold and then peels off toward the wall.
//
// Plate width is measured against HEAD WIDTH and capped under it, so even a
// Legend stamp never overhangs the skull.
// ═══════════════════════════════════════════════════════════════════
/**
 * SIZE THE PLATE TO THE NAME, NOT JUST THE HEAD.
 *
 * The handoff sizes the plate as a fraction of head width and caps it under the skull.
 * That kept it tidy and made it unreadable: a head is ~280px, so the plate was ~220px,
 * and a nine-character name inside that lands around 38px — indecipherable on stream.
 *
 * The name IS the payoff of this effect, so legibility wins over skull-containment.
 * The plate now starts from a per-tier target FONT size and grows wide enough to carry
 * the name at that size, so a long name gets a wider plate instead of smaller text. It
 * will overhang the face, which is what a stamp pressed across someone's face does.
 */
const STAMP_PLATE = { spin: 0.95, power: 1.08, takeover: 1.22, legend: 1.36 };
const STAMP_FONT  = { spin: 62,   power: 72,   takeover: 84,   legend: 94 };
/** Baloo 2 at weight 800; rough advance per character. */
const GLYPH_W = 0.58;

/** Legend presses FOUR marks — brow, both cheeks, chin — each on its own tracked
 *  face point, the die walking between them. Cheek/chin marks run smaller. */
const STAMP_MARKS_LEGEND = [
  { ox: 0,     oy: -0.27, rot:  -5, scale: 1.00 },
  { ox: -0.27, oy:  0.05, rot: -15, scale: 0.72 },
  { ox:  0.27, oy:  0.05, rot:  13, scale: 0.72 },
  { ox: 0,     oy:  0.31, rot:   6, scale: 0.66 },
];

function runStamp(run) {
  const spin = run.spin;
  const t = tierOf(spin);
  const k = t.k;
  const g = t.size;
  const legend = spin.tier === 'legend';
  const name = displayName(spin);

  const marks = legend ? STAMP_MARKS_LEGEND
                       : [{ ox: 0, oy: -0.27, rot: -5, scale: 1.00 }];

  // Plate is a fraction of head width. The cap is per-MARK, not just on the plate:
  // an off-centre mark at ox spans ox·hw ± w/2, so keeping it inside the head box
  // needs w ≤ hw(1 − 2|ox|). Without that, Legend's cheek marks (ox ±0.27 at 72%)
  // stick ~26px out past the skull on each side.
  // Start from the target font and the name's own length, then take whichever is
  // wider: the tier's plate, or the width the name needs to be READ at that size.
  const targetFont = STAMP_FONT[spin.tier];
  const nameChars = Math.max(3, name.length);
  const needed = nameChars * targetFont * GLYPH_W * 1.22;      // + padding
  const baseW = Math.min(1000, Math.max(headNow.w * STAMP_PLATE[spin.tier], needed));
  // Marks stay on SCREEN rather than on the skull — the old skull clamp is what kept
  // pulling the plate back down to an unreadable size.
  const markWidth = (m) => Math.min(baseW * m.scale, 1040);
  // 2:1 — the ink-mask art is 2048x1024, so the impression box matches it and the
  // texture maps 1:1 instead of being stretched. Clamped so a long name cannot
  // produce an absurdly tall slab.
  const markHeight = (w) => Math.max(90, Math.min(w / 2, 300));
  const swingMs = 320 + 70 * g;
  const pressMs = 86 + 22 * g;
  const liftMs  = 400 + 70 * g;

  // One die walks between the marks: move → press → beat, then on to the next.
  const MOVE_MS = 165, BEAT_MS = 110;
  const die = el('fx stamp-die' + (legend ? ' legend' : ''));
  runNode(run, laneFx, die);

  let clock = 0;
  marks.forEach((m, i) => {
    const w = markWidth(m), h = markHeight(w);
    // The die ART IS SQUARE (1254x1254). Rendering it into the impression's 2:1 box
    // squashed it into a small squat blob — on stream it read as a tiny icon rather
    // than a stamp. It gets its own square box, sized off the plate.
    const dieSize = w * 0.92;
    const first = i === 0;
    const inMs = first ? swingMs : MOVE_MS;

    // ARRIVE: swing in from off to the side on the first mark, walk across after.
    runTimer(run, () => {
      const p = headPoint(headNow, m.ox, m.oy);
      const rot = (headNow.roll || 0) + m.rot;
      die.style.width = dieSize + 'px';
      die.style.height = dieSize + 'px';
      if (first) {
        // Pre-position off the arc so the swing has somewhere to come FROM.
        die.style.transition = 'none';
        die.style.left = (p.x - dieSize / 2 + 190 * g) + 'px';
        die.style.top  = (p.y - dieSize / 2 - 250 * g) + 'px';
        die.style.transform = `rotate(${rot + 26}deg) scale(1)`;
        die.style.opacity = '0';
        void die.offsetWidth;
        die.style.transition = `left ${inMs}ms cubic-bezier(.2,.9,.25,1.25),` +
                               `top ${inMs}ms cubic-bezier(.2,.9,.25,1.25),` +
                               `transform ${inMs}ms cubic-bezier(.2,.9,.25,1.25),opacity 120ms ease`;
      } else {
        die.style.transition = `left ${inMs}ms ease-in-out, top ${inMs}ms ease-in-out, transform ${inMs}ms ease-in-out`;
      }
      die.style.opacity = '1';
      die.style.left = (p.x - dieSize / 2) + 'px';
      // Centred ON the face point, so the die lands exactly over the footprint the
      // impression will occupy and lifts to reveal it. Anchoring its BOTTOM edge here
      // instead pushes the brow mark off the top of the skull.
      die.style.top  = (p.y - dieSize / 2) + 'px';
      die.style.transform = `rotate(${rot}deg) scale(1)`;
    }, clock);
    clock += inMs;

    // PRESS: hard ease-in, squashes 3.5% onto the face.
    runTimer(run, () => {
      const rot = (headNow.roll || 0) + m.rot;
      die.style.transition = `transform ${pressMs}ms cubic-bezier(.5,0,1,1)`;
      die.style.transform = `rotate(${rot}deg) scale(1, 0.965)`;
    }, clock);
    clock += pressMs;

    // CONTACT: the beat. Everything here is anchored to the face point.
    runTimer(run, () => {
      const at = headPoint(headNow, m.ox, m.oy);
      canvasBump(k * m.scale);
      publishFx('impact', { kind: 'press', x: at.x, tier: spin.tier });
      ripple(run, at, k * m.scale, legend);
      sparkBurst(run, at, Math.round(10 * k * m.scale), k * m.scale, legend);
      layInk(run, name, m, w, h, legend, g);
    }, clock);

    // LIFT away, revealing the impression underneath.
    runTimer(run, () => {
      const p = headPoint(headNow, m.ox, m.oy);
      const rot = (headNow.roll || 0) + m.rot;
      const last = i === marks.length - 1;
      die.style.transition = `transform ${liftMs}ms ease, top ${liftMs}ms ease, opacity ${liftMs}ms ease`;
      die.style.top = (p.y - dieSize / 2 - 46 * g) + 'px';
      die.style.transform = `rotate(${rot}deg) scale(1)`;
      if (last) die.style.opacity = '0';
    }, clock + 30);
    clock += (i === marks.length - 1 ? liftMs : BEAT_MS);
  });

  return clock;   // when the press sequence ends; the impression's dwell follows
}

/** The pressed impression: the name, masked through a rubber-ink alpha texture so
 *  coverage breaks up like real pressed ink. Rides the head through the hold on a
 *  rAF follow, then peels off toward the wall. */
function layInk(run, name, mark, w, h, legend, k) {
  const ink = el('fx stamp-ink' + (legend ? ' legend' : ''));
  const tex = `assets/wheel/ink-mask-${1 + Math.floor(Math.random() * 3)}.png`;
  ink.style.cssText = `width:${w}px;height:${h}px`;

  const plate = el('ink-plate');
  // The mask art is 2:1; the impression box is too (see markHeight), so it maps 1:1
  // and the texture is not stretched into mush.
  plate.style.cssText = `-webkit-mask-image:url('${tex}');mask-image:url('${tex}')`;
  ink.appendChild(plate);

  const label = el('ink-name');
  // FILL the plate. The plate was already widened to carry the name at the tier's
  // target size, so this normally lands on that size; it only shrinks for a name long
  // enough to hit the 1000px plate cap.
  const fit = Math.min(h * 0.72, (w * 0.88) / (Math.max(3, name.length) * GLYPH_W));
  label.style.fontSize = Math.max(34, fit) + 'px';
  label.textContent = name;                   // textContent, not innerHTML — viewer input
  ink.appendChild(label);
  runNode(run, laneFx, ink);

  // FOLLOW the head live, including through the hold, translating AND rotating
  // with roll. Stops the moment the run is torn down.
  // Legend presses four marks, so four follow loops run at once. Each is tracked
  // (not just the last) or an interrupted run leaves three of them painting.
  let raf = null;
  const follow = () => {
    if (run.done || !ink.isConnected) return;
    const p = headPoint(headNow, mark.ox, mark.oy);
    ink.style.left = (p.x - w / 2) + 'px';
    ink.style.top  = (p.y - h / 2) + 'px';   // centred on the mark, matching the die
    ink.style.transform = `rotate(${(headNow.roll || 0) + mark.rot}deg)`;
    raf = requestAnimationFrame(follow);
    run.rafs.add(raf);
  };
  follow();

  // PEEL off toward the wall once the dwell is done.
  const dwell = holdOf(run.spin);
  runTimer(run, () => {
    if (raf) { cancelAnimationFrame(raf); run.rafs.delete(raf); raf = null; }
    ink.style.transition = 'transform 640ms cubic-bezier(.4,0,.2,1), opacity 640ms cubic-bezier(.4,0,.2,1)';
    ink.style.transform += ` translate(${(Math.random() * 120 - 60).toFixed(0)}px, ${420 + 180 * k}px) rotate(28deg) scale(.7)`;
    ink.style.opacity = '0';
  }, dwell);
}

function displayName(spin) {
  return spin.user?.username || 'someone';
}

// ═══════════════════════════════════════════════════════════════════
// SUPPORTER WALL — a literal physical wall, laid brick by brick.
//
// GEOMETRY (see the CSS note): 6 courses × 58.3px = the 350px band exactly,
// brick 177×55.3 at the art's own aspect, 3px mortar. 1080 = 6 × 180 exactly,
// so full courses tile with no end gap. Offset courses carry a part-brick
// CLOSER at each end — real masonry that stops the edges being holes.
//
// WHY BRICKS ARE NEVER REMOVED
// The published spin carries signature.expiresAt (Spin ≈10min, Power ≈30min,
// Takeover/Legend session-scoped) and the SIGNATURE lane honours it. The wall
// deliberately does NOT: taking a brick out mid-wall leaves a hole, which
// breaks running bond, breaks ground-up fill, and stops it reading as a wall
// at all. A wall's forgetting mechanism is its capacity, not a timer — when
// every slot is laid the pointer wraps and OVERWRITES the oldest brick in
// place, so the masonry is never disturbed.
// ═══════════════════════════════════════════════════════════════════
// Brick width is DERIVED from the stage, never hardcoded. The handoff's nominal 177
// leaves 1080 - (6×177 + 5×3) = 3px of bare stage at the right end of every flush
// course — a sliver of nothing, which is exactly what a physical wall cannot have.
// Solving 6w + 5m = 1080 gives 177.5, so the courses close flush on both edges.
const WALL = { w: 1080, bandH: 350, courses: 6, perCourse: 6, mortar: 3 };
WALL.brickW = (WALL.w - (WALL.perCourse - 1) * WALL.mortar) / WALL.perCourse;  // 177.5
WALL.pitchX = WALL.brickW + WALL.mortar;              // 180.5
WALL.pitchY = WALL.bandH / WALL.courses;              // 58.333…
WALL.brickH = WALL.pitchY - WALL.mortar;              // 55.333… — art aspect 3.2, no squash

/** Lay out every piece once, ground-up and left-to-right. Course-major order is
 *  load-bearing: it is what guarantees a brick can never sit above a gap. */
function buildWallSlots() {
  const slots = [];
  for (let c = 0; c < WALL.courses; c++) {
    const offset = (c % 2) ? -WALL.pitchX / 2 : 0;    // running bond
    for (let x = offset; x < WALL.w; x += WALL.pitchX) {
      const left = Math.max(0, x), right = Math.min(WALL.w, x + WALL.brickW);
      if (right - left <= 1) continue;
      slots.push({
        course: c, x: left, w: right - left,
        // A closer is a clipped part-brick at a course end: structural, never named.
        closer: (right - left) < WALL.brickW - 0.5,
        bottom: c * WALL.pitchY,
      });
    }
  }
  return slots;
}
const WALL_SLOTS = buildWallSlots();
const NAME_SLOTS = WALL_SLOTS.map((s, i) => i).filter((i) => !WALL_SLOTS[i].closer);

const supporters = new Array(WALL_SLOTS.length).fill(null); // by slot index
const laidCloser = new Set();
let wallPtr = 0;   // index into NAME_SLOTS — next name-bearing slot to write

/** Dollar band for name styling: ≥100 / 25–99 / 5–24 / <5. */
function usdBand(usd) { return usd >= 100 ? 3 : usd >= 25 ? 2 : usd >= 5 ? 1 : 0; }

function brickEl(slot, cls) {
  const b = el(`brick ${cls}`);
  b.style.left = slot.x + 'px';
  b.style.width = slot.w + 'px';
  b.style.height = WALL.brickH + 'px';
  b.style.bottom = slot.bottom + 'px';
  return b;
}

/** Closers are laid with the course, not awarded to anyone — otherwise an offset
 *  course would show a 90px hole at its edge until the wall happened to fill. */
function layCloser(slotIndex, silent) {
  if (laidCloser.has(slotIndex)) return;
  laidCloser.add(slotIndex);
  const slot = WALL_SLOTS[slotIndex];
  const b = brickEl(slot, 'b' + (1 + (slotIndex % 3)));
  laneWall.appendChild(b);
  if (!silent) reveal(b, 'dropping');
}

/** Write a supporter into a FIXED slot. The brick stays there for good. */
/** Advance the write pointer, stepping OVER top-tier bricks while any lesser slot is
 *  still available. A $100+ name is the wall's whole point; it should not be the first
 *  thing a $1 spin erases just because it happens to be oldest. If every slot is
 *  top-tier the guard yields and the oldest is overwritten — capacity still wins, and
 *  the loop is bounded by the slot count so it can never spin. */
function nextWallSlot() {
  for (let step = 0; step < NAME_SLOTS.length; step++) {
    const i = NAME_SLOTS[(wallPtr + step) % NAME_SLOTS.length];
    const held = supporters[i];
    if (!held || usdBand(held.usd) < 3) {
      wallPtr = (wallPtr + step + 1) % NAME_SLOTS.length;
      return i;
    }
  }
  const i = NAME_SLOTS[wallPtr % NAME_SLOTS.length];   // all top-tier — oldest gives way
  wallPtr = (wallPtr + 1) % NAME_SLOTS.length;
  return i;
}

function addSupporter(spin, opts) {
  const silent = !!(opts && opts.silent);   // hydration: rebuild, do not re-perform
  const slotIndex = nextWallSlot();
  const slot = WALL_SLOTS[slotIndex];
  const usd = usdOf(spin);
  const band = usdBand(usd);

  // Overwrite in place — remove only the brick that occupied THIS slot.
  const prev = supporters[slotIndex];
  if (prev && prev.node) prev.node.remove();

  const b = brickEl(slot, (band === 3 ? 'b-legend' : 'b' + (1 + (slotIndex % 3))) + ` usd-${band}`);
  b.appendChild(el('b-name', esc(displayName(spin))));
  b.appendChild(el('b-usd', usdLabel(spin)));
  laneWall.appendChild(b);
  supporters[slotIndex] = { node: b, usd, eventId: spin.eventId };

  // Lay this course's closers so the wall has no open edge. The left closer goes
  // in as soon as the course is started; the right one when the course completes.
  for (let i = 0; i < WALL_SLOTS.length; i++) {
    if (!WALL_SLOTS[i].closer || WALL_SLOTS[i].course !== slot.course) continue;
    const isLeft = WALL_SLOTS[i].x === 0;
    const courseNameSlots = NAME_SLOTS.filter((n) => WALL_SLOTS[n].course === slot.course);
    const courseFull = courseNameSlots.every((n) => supporters[n]);
    if (isLeft || courseFull) layCloser(i, silent);
  }

  if (!silent) reveal(b, 'dropping');
}

// ── Payload derivations (schemaVersion 2) ─────────────────────────────
// The dock publishes value ONCE, in coin equivalents. Everything money-shaped is
// derived from that here rather than shipped as extra fields that could drift.

/** 1 TikTok coin = 1 YouTube jewel = $0.01 of VIEWER spend (dock pricing.ts). Super
 *  Chats are already converted to coins upstream, so this one rate covers every
 *  platform. NOT the streamer payout rate — this is what the viewer paid, which is
 *  what a supporter wall should be a ledger of. */
const COIN_USD = 0.01;
function usdOf(spin) {
  const coins = Number(spin?.gift?.totalValue);
  return Number.isFinite(coins) && coins > 0 ? coins * COIN_USD : 0;
}

/** What to call the units on screen. Presentation only — tiering never reads this. */
const PLATFORM_UNIT = { tiktok: 'coins', youtube: 'jewels', twitch: 'bits' };
function unitOf(spin) { return PLATFORM_UNIT[spin?.platform] || 'coins'; }

/** Money as shown on the wall/chip: whole dollars once we're past $1, cents below,
 *  so a Rose reads "$0.25" and a Galaxy reads "$10" rather than "$10.00". */
function usdLabel(spin) {
  const usd = usdOf(spin);
  return usd >= 1 ? '$' + Math.round(usd) : '$' + usd.toFixed(2);
}

/** The gift chip shown on the reel housing during the spin. Every part is optional:
 *  an anonymous or unnamed gift still produces a valid chip rather than "undefined". */
function giftChip(spin) {
  const chip = el('gift-chip');
  const name = spin?.gift?.name;
  const count = Number(spin?.gift?.repeatCount);
  const coins = Number(spin?.gift?.totalValue);
  // el() assigns innerHTML, and gift names arrive from the platform — esc() them.
  // The numbers are Number()-coerced above, so they cannot carry markup.
  if (name) chip.appendChild(el('g-name', esc(name)));
  if (Number.isFinite(count) && count > 1) chip.appendChild(el('g-amt', `×${count}`));
  chip.appendChild(el('g-amt', `${Number.isFinite(coins) ? coins : 0} ${unitOf(spin)}`));
  chip.appendChild(el('g-usd', usdLabel(spin)));
  return chip;
}

// ═══════════════════════════════════════════════════════════════════
// TRANSPORT — subscribe to splat-overlay 'wheel.spin' via JJX.dockRealtime, which
// carries it over the dock's local WebSocket (Ably is off — see the header note).
// The Ably-shaped channels.get()/subscribe() API below is the facade's, not Ably's.
// A local test hook (window.wheelTest) drives the page with no dock for verification.
// ═══════════════════════════════════════════════════════════════════
// Initialized before connect(): dockRealtime may report an already-open local socket
// synchronously, and hydrate() must never hit this binding in its temporal dead zone.
let hydrated = false;
function connect() {
  const conn = $('conn');
  try {
    const client = JJX.dockRealtime({ fallbackKey: ABLY_KEY });
    const ch = client.channels.get(ABLY_CH);
    client.connection.on('connected', () => { conn.textContent = 'wheel: live ✓'; });
    client.connection.on('disconnected', () => { conn.textContent = 'wheel: reconnecting…'; });
    ch.subscribe('wheel.spin', (msg) => onWheelSpin(msg.data));
    // Operator preview from wheel-control.html. Same renderer, same code path — the
    // only difference is that it lays no brick (see startSettle). Deliberately a
    // separate event name so a preview can never be mistaken for a resolved spin,
    // and so the dock stays the only publisher of `wheel.spin`.
    ch.subscribe('wheel.preview', (msg) => {
      const p = msg && msg.data;
      if (p) onWheelSpin({ ...p, preview: true });
    });
    ch.subscribe('wheel.clear', () => clearWheelEffects());
    hydrate();
    // Head tracking rides the same socket on its own channel (contract 2). It is a
    // continuous stream, so it stays OFF the batched publish path and off Ably.
    // Absent tracker = the layout fallback, which every head-anchored effect
    // already renders correctly.
    client.channels.get('head-track').subscribe('head', (msg) => window.setHead(msg.data));
    interactionCh = client.channels.get('wheel-interaction');
    interactionCh.subscribe('hand-track', (msg) => {
      const d = (msg && msg.data) || {};
      if (String(d.eventId || '') !== interactionEventId) return;
      ingestInteractionHands(d.eventId, d.hands);
    });
    interactionCh.subscribe('body-track', (msg) => {
      const d = (msg && msg.data) || {};
      if (String(d.eventId || '') !== interactionEventId) return;
      interactionBodies = Array.isArray(d.parts) ? d.parts : [];
      interactionBodiesAt = performance.now();
    });
    interactionCh.subscribe('snapshot', (msg) => {
      const d = (msg && msg.data) || {};
      const pending = snapshotWaiters.get(String(d.requestId || ''));
      if (!pending || pending.run.done) return;
      snapshotWaiters.delete(String(d.requestId || ''));
      pending.callback(d);
    });
    // Contracts 3 + 4. Both are optional by design: absent targets => Ball Drop uses
    // the ground-line landing zone; absent still => it flies the sphere art and leaves
    // the camera alone.
    // Ball Guys colliders — Ball Drop bounces off the same balls Bomb Drop does.
    ballSignalsCh = client.channels.get('ball-signals');
    ballSignalsCh.subscribe('bomb-colliders', (msg) => {
      const d = msg && msg.data;
      gameBalls = (d && Array.isArray(d.balls)) ? d.balls.filter((b) => b && b.r > 0) : [];
    });
    const targets = client.channels.get('game-targets');
    targets.subscribe('targets', (msg) => window.setTargets(msg.data));
    targets.subscribe('cam-snapshot', (msg) => window.setCamStill(msg.data));
    // Ask for a fresh still up front and then periodically, so one is already in hand
    // when a Ball Drop fires — requesting at detach would arrive too late to cover.
    // Camera-level beats, for the other overlays sharing this frame (see publishFx).
    fxCh = client.channels.get('wheel-fx');
    // Live rail height/Y position — see applyReelLayout. Instant feedback while an
    // operator is dragging the control page's inputs, ahead of Save.
    fxCh.subscribe('reel-layout', (msg) => applyReelLayout(msg && msg.data));
    fxCh.subscribe('reel-copy', (msg) => applyCarouselCopy(msg && msg.data, true));
    // gesture-cam snapshots the COMPOSITED projector, so a still taken while an effect
    // is on screen contains that effect. That is how the ball came to carry its own
    // black hole: the periodic capture ran during a Ball Drop, baked the hole in, and
    // every later drop reused it. So the loop only ever fires when the stage is idle.
    camStillRequest = () => targets.publish('cam-snapshot-request', {}).catch(() => {});
    camStillRequest();
    setInterval(() => { if (!active) camStillRequest(); }, 20000);
  } catch (e) {
    conn.textContent = 'wheel: transport unavailable';
  }
}
connect();

// ── ART PRELOAD ──────────────────────────────────────────────────
// Decode the whole set up front. Without this the first fire of an effect shows
// gaps where art has not decoded yet — the ink texture and splash crown are simply
// ABSENT on play one, which on a live stream is the first impression of the
// flagship. Masks are preloaded too: a mask that has not decoded passes nothing
// through, so the impression would be invisible rather than merely unstyled.
const PRELOAD = [
  'stamp-die.png', 'stamp-die-legend.png', 'stamp-die-press.png',
  'ink-mask-1.png', 'ink-mask-2.png', 'ink-mask-3.png', 'seal-legend.png',
  'bucket.png', 'bucket-legend.png', 'bucket-pour.png', 'bucket-mouth.png',
  'water-splash-crown.png', 'water-sheet.png', 'wet-film.png',
  'ball-shell.png', 'ball-gloss.png', 'ball-ring.png', 'ball-ring-legend.png',
  'frame-marquee.png', 'frame-marquee-legend.png',
  'glass-crack-web.png', 'glass-shards.png',
  'spotlight-cone.png', 'spotlight-floor-pool.png',
  'splat-badge.png', 'storm-star.png',
];
let preloaded = 0;
PRELOAD.forEach((f) => {
  const img = new Image();
  img.onload = () => { preloaded++; };
  img.onerror = () => console.warn('[wheel] preload failed:', f);
  img.src = 'assets/wheel/' + f;
});
window.wheelPreloadCount = () => ({ requested: PRELOAD.length, decoded: preloaded });

// ═══════════════════════════════════════════════════════════════════
// HYDRATION — rebuild the wall (and resume the queue) after a reload.
//
// The supporter wall is the one thing here that is meant to be PERMANENT, and
// until this existed it lived only in memory: a Studio browser-source refresh,
// a dock restart or a crash wiped every brick. The dock is the source of truth
// (GET /api/wheel/snapshot), so recovery is a replay, not a cache.
//
// WHY REPLAY WORKS. Slot assignment is presentation and stays here, but it is
// deterministic: same starting state, same arrival order, same slots — including
// the guard that steps over top-tier bricks. So replaying the dock's ordered list
// through addSupporter() reproduces the exact wall, and the dock never needs to
// know what a course or a closer is.
// ═══════════════════════════════════════════════════════════════════
async function hydrate() {
  if (hydrated) return;
  // Resolve the dock the same way every other page does — never hardcode it. When
  // stream-launch hands Studio http://127.0.0.1:4317/overlays/wheel-overlay.html,
  // dockBase() returns location.origin, so the page asks the host that served it.
  // That is what makes a tunnel or a non-default port work; a literal address here
  // would hydrate from the wrong place (or nowhere) the moment either changed.
  const base = JJX.dockBase();
  try {
    const res = await fetch(base + '/api/wheel/snapshot', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const snap = await res.json();
    hydrated = true;

    // Rebuild the wall SILENTLY. These bricks were laid minutes ago; dropping 33
    // of them again on load would read as 33 new supporters arriving at once.
    for (const spin of snap.wall || []) addSupporter(spin, { silent: true });

    // Seed the dedupe set from everything replayed, so a spin that also arrives
    // live on the socket does not play (or lay a second brick) a second time.
    for (const spin of snap.wall || []) {
      if (spin.revision != null) seenRevisions.add('r' + spin.revision);
    }
    // Resume anything the dock still considers unfinished. These have NOT been
    // marked seen, so they play properly — that is the point of resuming them.
    for (const spin of snap.queued || []) onWheelSpin(spin);

    console.info('[wheel] hydrated:', (snap.wall || []).length, 'wall,',
                 (snap.queued || []).length, 'queued, revision', snap.revision);
  } catch (e) {
    // A dock that is not up yet is not an error worth going dark over — the
    // socket keeps retrying, and the next connect calls this again.
    console.warn('[wheel] hydrate failed (will retry on next connect):', e.message);
  }

  // The rail's persisted height/Y position — separate try/catch, because a failure
  // here (or on a dock predating the setting) must not block wall hydration above.
  try {
    const res = await fetch(base + '/api/settings', { cache: 'no-store' });
    if (res.ok) {
      const wheelSettings = (await res.json()).settings?.wheel;
      applyReelLayout(wheelSettings?.reel);
      setEnabledRailResults(wheelSettings?.enabledResults);
    }
  } catch (e) { /* falls back to the CSS default (identity) — see #wheel-stage */ }
}

// Test hook — feed a WheelSpin-shaped object straight into the machine.
window.wheelTest = (spin) => onWheelSpin(spin);
window.wheelHydrate = hydrate;
</script>
</body>
</html>
