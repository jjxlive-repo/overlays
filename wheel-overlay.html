<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPIN THE SCREEN — Wheel Overlay</title>
<!--
  Spin the Screen — wheel overlay skeleton (checkpoint 3).

  A DUMB RENDERER. It never decides anything: the Producer Dock resolves every spin
  (result, variant, seed, signature, revision) and publishes ONE authoritative
  `wheel.spin` on the `splat-overlay` channel. This page receives that and plays it —
  nothing here rolls randomness or picks a result. The design handoff's `spinGift({...,
  result })` "omit and the wheel picks at random" is PROTOTYPE HARNESS framing and must
  never be implemented here; `result` is authoritative input.

  ORIGIN: GitHub Pages, added to TikTok LIVE Studio as a browser source (1080×1920,
  transparent). Test B (2026-07-24) confirmed Studio rejects http://localhost sources,
  so the overlay lives on Pages — exactly like every other overlay.

  TRANSPORT (updated 2026-07-24, overlays 1939e8b): Ably is OFF (`ABLY_ENABLED = false`
  in jjx-core — the account is being cancelled). Everything rides `JJX.dockRealtime()`
  over ws://127.0.0.1:4317/overlay-ws to the dock. That works from an https Pages origin
  because Chrome treats 127.0.0.1 as potentially-trustworthy, so ws:// to it is not
  mixed-content-blocked — which is also the answer to Test C, and means the checkpoint-5
  FACE-TRACKING stream has a transport (raw socket, never the batched publish path).

  PAYLOAD: schemaVersion 2 (2026-07-25) added `platform`. There is deliberately no `usd`
  field — `gift.totalValue` is in coin equivalents and 1 coin = 1 jewel = $0.01, so
  dollars are derived here (usdOf). See spin-docs/WHEEL-OVERLAY-RECONCILIATION.md.

  What this checkpoint delivers: the five rendering lanes, the
  queued→acknowledged→spinning→impact→settled→complete state machine, in-order queue
  handling that never interrupts an active wheel, per-stage watchdogs + cleanup with no
  orphaned timers or DOM nodes, and revision-dedupe so a re-published or replayed spin
  renders once. Visuals are deliberately PLACEHOLDER — the polished per-result effects
  are checkpoints 4 (Stamp) and 7 (the rest).

  Cache discipline: bump ?v=N on jjx-core (and this page's own source ref if split out)
  on every change — Studio's browser-source cache serves stale copies otherwise.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* Fixed 1080×1920. No viewport units, no bottom-anchoring — Studio scales the whole
     source, and vh/vw + bottom edges drift when it does (repo rule). */
  html, body {
    width: 1080px; height: 1920px;
    overflow: hidden; background: transparent;
    /* The overlay must never eat clicks meant for Studio's own UI. */
    pointer-events: none;
    font-family: 'Fredoka', 'DM Sans', system-ui, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  /* Explicit 1080×1920 — NOT inset:0, which would size to the viewport (correct
     at 1080×1920 in Studio, but collapses to the pane width in a dev preview and
     is fragile either way). Lanes are absolute children of this fixed box. */
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

  /* ── LANES ─────────────────────────────────────────────────────────
     Five independent stacking contexts, spec order. Each lane owns one
     class of visual so a Takeover impact can suppress ambient without
     touching signatures, etc. z rises with "how much it interrupts". */
  .lane { position: absolute; }
  #lane-wall      { left: 0; bottom: 0; width: 1080px; height: 350px; z-index: 5; }  /* scenery, not an event — and outside the bump */
  #lane-flare     { inset: 0; z-index: 20; }   /* legendFlare: under every effect, Legend only */
  #lane-wheel     { inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; }
  #lane-fx        { inset: 0; z-index: 45; }   /* the effect itself */
  #lane-impact    { inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; }

  /* ── SUPPORTER WALL ────────────────────────────────────────────────
     A LITERAL WALL. Bricks touch — every piece is laid against its
     neighbours with a 3px mortar joint and nothing ever floats:

       · 6 courses of 58.3px pitch fill the 350px band EXACTLY, so there
         is no leftover slack for the wall to float on. Brick is 177×55.3,
         which is the art's own 1024×320 aspect (3.2) — no squash.
       · 1080 / 180 = 6 exactly, so full courses tile edge to edge with
         no remainder and no end gap.
       · Running bond offsets alternate courses by half a pitch, which
         leaves a part-brick CLOSER at each end. Those are real masonry,
         not empty slots: without them the offset courses would have a
         90px hole at each edge. They carry no name.
       · Fill is course-major from the ground up, so a brick can never
         appear above an empty space.
       · Bricks NEVER move and are never removed. See addSupporter().

     No background band and no placeholder courses — the wall IS the
     bricks, so an empty wall renders nothing at all. No drop shadow:
     real bricks sit against their neighbours with no gap to cast into. */
  .brick {
    position: absolute; box-sizing: border-box;
    background-size: 100% 100%; background-repeat: no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .brick.b1 { background-image: url('assets/wheel/brick.png'); }
  .brick.b2 { background-image: url('assets/wheel/brick-2.png'); }
  .brick.b3 { background-image: url('assets/wheel/brick-3.png'); }
  .brick.b-legend { background-image: url('assets/wheel/brick-legend.png'); }

  /* Drop-in: falls from above, lands on the course below, squashes, rebounds
     twice with decreasing amplitude, settles. Origin is the BOTTOM edge so the
     squash compresses onto the course beneath rather than about the centre. */
  @keyframes om-drop {
    0%   { transform: translateY(-340px) scaleY(1);    }
    58%  { transform: translateY(0)      scaleY(1);    }
    68%  { transform: translateY(0)      scaleY(.84);  }  /* impact squash */
    78%  { transform: translateY(-13px)  scaleY(1.05); }  /* rebound 1 */
    88%  { transform: translateY(0)      scaleY(.94);  }
    95%  { transform: translateY(-4px)   scaleY(1.01); }  /* rebound 2 */
    100% { transform: translateY(0)      scaleY(1);    }
  }
  .brick.dropping { animation: om-drop 560ms cubic-bezier(.3,.05,.4,1) both; transform-origin: 50% 100%; }

  /* Names are styled by DOLLARS, not tier — that is what makes the wall
     readable as a ledger rather than a list of effects. */
  .brick .b-name {
    max-width: 92%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    line-height: 1.05;
  }
  .brick .b-usd { font-family: 'DM Mono', ui-monospace, monospace; font-size: 13px; color: rgba(250,245,255,.5); margin-top: 1px; }
  .usd-0 .b-name { font-family: Fredoka, system-ui, sans-serif; font-weight: 500; font-size: 20px; color: #A78BFA; }
  .usd-1 .b-name { font-family: Fredoka, system-ui, sans-serif; font-weight: 600; font-size: 22px; color: #E879F9; text-shadow: 0 0 10px rgba(232,121,249,.85); }
  .usd-2 .b-name { font-family: Fredoka, system-ui, sans-serif; font-weight: 700; font-size: 23px; color: #FBBF24; text-shadow: 0 0 12px rgba(251,191,36,.85); }
  .usd-3 .b-name { font-family: Boogaloo, Fredoka, system-ui, sans-serif; font-size: 27px; color: #FDE68A; text-shadow: 0 0 16px rgba(251,191,36,.95); }
  .usd-3 { box-shadow: 0 0 16px rgba(251,191,36,.5); }  /* gold-edged brick, top tier only */

  /* ── WHEEL: EDGE-ON SCROLLING REEL. Segments scroll vertically past a
     centre window and DECELERATE to land the resolved result under the
     pointer — labels stay upright and readable the whole time (spec: "you
     can read what's on each one as they spin"), unlike a top-down disc whose
     text rotates. All segments are the same height = equal, visible, equal
     weight (equal probability is enforced server-side; the reel must LOOK
     equal too). Placeholder art: glyph + label per segment, rendered in code
     so text is crisp — designed segment art can swap in later. */
  :root { --seg-h: 112px; }   /* one segment's height — shared by CSS + JS landing math */
  /* The housing ART (reel-housing.png, 1086x1448 with transparent margins) is the
     background; its purple border, pink centre indicator line and left/right
     triangles are baked in. The scrolling segments sit in a viewport positioned
     over the transparent window HOLE in the art — geometry measured from the PNG's
     alpha: window x 10.41%, y 30.73%, w 79.37%, h 38.47%, centred on the pink line
     at ~50% height. Segments show through the hole; the opaque frame masks any
     overflow; the winning row lands on the pink line. */
  .reel-frame {
    position: relative; width: 900px; height: 1200px;
    background: url('assets/wheel/reel-housing.png') center / 100% 100% no-repeat;
    opacity: 0; transform: scale(0.9); transition: opacity .3s ease, transform .3s ease;
  }
  .reel-frame.show { opacity: 1; transform: scale(1); }
  /* Gift chip — credits WHAT was sent while the reel is still spinning, so the
     attribution and the tension are the same beat (handoff lifecycle). Sits on the
     housing's upper plate, above the window hole. */
  .gift-chip {
    position: absolute; left: 50%; top: 15.5%; transform: translate(-50%, -50%) scale(.92);
    display: flex; align-items: baseline; gap: 12px; white-space: nowrap;
    padding: 10px 26px; border-radius: 999px;
    background: rgba(42, 4, 71, .78); border: 2px solid rgba(232, 121, 249, .55);
    opacity: 0; transition: opacity .32s ease, transform .32s cubic-bezier(.2,1.3,.3,1);
  }
  .reel-frame.show .gift-chip { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .gift-chip .g-name { font-family: Fredoka, system-ui, sans-serif; font-weight: 600; font-size: 30px; color: #FAF5FF; }
  .gift-chip .g-amt  { font-family: Fredoka, system-ui, sans-serif; font-weight: 500; font-size: 25px; color: #C084FC; }
  /* Money in mono so digits don't jitter between spins. */
  .gift-chip .g-usd  { font-family: 'DM Mono', ui-monospace, monospace; font-size: 22px; color: #E879F9; }
  .tier-legend .gift-chip { border-color: rgba(251, 191, 36, .7); }
  .tier-legend .gift-chip .g-usd { color: #FBBF24; }
  /* Viewport = the art's window hole. Mask fades top & bottom so segments roll
     in/out (the edge-of-cylinder feel) inside the window. */
  .reel-viewport {
    position: absolute; left: 10.41%; top: 30.73%; width: 79.37%; height: 38.47%;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 20%, #000 80%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 20%, #000 80%, transparent 100%);
  }
  .reel-strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; transform: translateY(0); }
  .reel-strip.spinning { transition: transform var(--spin-ms, 2200ms) cubic-bezier(.11,.68,.15,1); }
  .reel-seg {
    height: var(--seg-h); display: flex; align-items: center; justify-content: center;
    gap: 20px; padding: 0 30px;
  }
  .reel-seg .seg-label { font-size: 46px; font-weight: 800; letter-spacing: .01em; text-shadow: 0 2px 5px rgba(0,0,0,0.6); }
  /* Result icons drawn from the icons.png sprite sheet, positioned by each icon's
     MEASURED centre (cells are a regular 444px grid but the art isn't centred in
     its cell — up to ~55px drift — so we place by content centre, not cell). */
  .wicon { display: inline-block; flex: 0 0 auto; background: url('assets/wheel/icons.png') no-repeat; }

  /* ── IMPACT: the result reveal card. Tier is read from SHAPE + SCALE +
     ICON + TEXT, never hue alone (streamer is red-green colorblind). ── */
  .impact {
    text-align: center; padding: 40px 60px; border-radius: 28px;
    background: rgba(10,8,18,0.72); border: 3px solid rgba(255,255,255,0.35);
    box-shadow: 0 20px 70px rgba(0,0,0,0.6);
    opacity: 0; transform: scale(0.8); transition: opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .impact.show { opacity: 1; transform: scale(1); }
  .impact .i-glyph { display: flex; justify-content: center; margin-bottom: 8px; }
  .impact .i-user  { font-size: 40px; font-weight: 700; margin-bottom: 6px; max-width: 820px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .impact .i-tier  { font-size: 30px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 14px; }
  .impact .i-result { font-size: 64px; font-weight: 800; letter-spacing: .04em; }
  /* Tier accents: distinct BORDER + GLYPH, with color as a secondary cue only. */
  .tier-spin     .i-tier { color: #9ecbff; }  .impact.tier-spin     { border-color: #4c9aff; }
  .tier-power    .i-tier { color: #b6a6ff; }  .impact.tier-power    { border-color: #a98bff; transform: scale(0.8); }
  .tier-takeover .i-tier { color: #ffd27a; }  .impact.tier-takeover { border-color: #ffb020; }
  .tier-legend   .i-tier { color: #ffe08a; }  .impact.tier-legend   { border-color: #ffd700; box-shadow: 0 0 60px rgba(255,215,0,0.5), 0 20px 70px rgba(0,0,0,0.6); }

  /* The AMBIENT and SIGNATURE lanes that checkpoint 3 shipped are gone, along with
     the RECEIPT card. The handoff's lifecycle is three phases and states it twice:
     "No receipt card, no ambient tail", and idle shows "supporter wall only". All
     three competed with the hero line for the same attention beat, and persistent
     recognition is now the wall's job — which is why the wall ignores expiry while
     the dock still computes signature.expiresAt for checkpoint 8's operator tools. */

  /* ── EFFECT LAYER ─────────────────────────────────────────────────
     Head-anchored art. Anchors are px in the 1080×1920 stage, written by
     JS from the live head box each frame, so an effect translates AND
     rotates with head roll. */
  .fx { position: absolute; will-change: transform, opacity; }

  /* STAMP — the die that swings in and presses the name onto the face. */
  .stamp-die {
    background: url('assets/wheel/stamp-die.png') center / 100% 100% no-repeat;
    transform-origin: 50% 100%;   /* pivots on its FACE, so the press reads as contact */
  }
  .stamp-die.legend { background-image: url('assets/wheel/stamp-die-legend.png'); }

  /* The pressed impression.
     MASK THE PLATE, NOT THE TEXT. The rubber-ink texture is what makes the edges
     break up like real pressed ink — but applied to the NAME it just eats the name,
     which on stream meant the stamp was effectively invisible. So the masked texture
     is a coloured PLATE underneath, and the name sits on top of it unmasked.
     The name also carries the project's 8-direction ink outline, which every name
     over gameplay is supposed to have (design tokens) and which this was missing —
     without it, plum-on-skin and gold-on-skin both disappear. */
  .stamp-ink { position: absolute; }
  .stamp-ink .ink-plate {
    position: absolute; inset: 0; background: #3B0764; opacity: .92;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  }
  .stamp-ink .ink-name {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: Boogaloo, Fredoka, system-ui, sans-serif;
    color: #FAF5FF; white-space: nowrap; letter-spacing: .02em;
    text-shadow:
      3px 0 0 #2A0447, -3px 0 0 #2A0447, 0 3px 0 #2A0447, 0 -3px 0 #2A0447,
      3px 3px 0 #2A0447, -3px 3px 0 #2A0447, 3px -3px 0 #2A0447, -3px -3px 0 #2A0447;
  }
  .stamp-ink.legend .ink-plate { background: #6B4B0B; }
  .stamp-ink.legend .ink-name  { color: #FDE68A; }

  @keyframes om-ripple { from { transform: scale(.25); opacity: .55; } to { transform: scale(1); opacity: 0; } }
  .ripple { border-radius: 50%; border: 3px solid rgba(232,121,249,.75); animation: om-ripple 520ms cubic-bezier(.2,.9,.2,1) both; }
  .ripple.legend { border-color: rgba(251,191,36,.85); }

  /* One keyframe, per-element custom properties — the pattern the handoff calls out
     as worth keeping. Each spark carries its own vector instead of needing its own
     animation. */
  @keyframes om-spark { from { transform: translate(0,0) scale(1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  .spark { border-radius: 50%; animation: om-spark var(--sd, 520ms) cubic-bezier(.2,.8,.3,1) both; }

  /* Canvas bump. Lives on #bump, NOT on #stage — the handoff warns that a bump
     sharing an element with another transform silently replaces it. The WALL is
     outside #bump on purpose: scaling anchored masonry would lift it off the frame
     edges and open exactly the gaps the wall must never have. */
  @keyframes om-bump { 0% { transform: scale(1); } 34% { transform: scale(var(--bump, 1.012)); } 100% { transform: scale(1); } }
  #bump { position: absolute; inset: 0; transform-origin: 50% 42%; }
  #bump.bumping { animation: om-bump var(--bump-ms, 460ms) cubic-bezier(.2,.9,.2,1) both; }

  /* ── LEGEND FLARE — renders UNDER every effect at Legend and nowhere else.
     Quantity + frame takeover + gold + flourish, per the tier grammar. ── */
  @keyframes om-flash  { 0% { opacity: 0; } 18% { opacity: .5; } 100% { opacity: 0; } }
  @keyframes om-rays   { to { transform: rotate(360deg); } }
  @keyframes om-vign   { 0% { opacity: 0; } 22% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; } }
  .lf-flash { position: absolute; inset: 0; background: #FBBF24; mix-blend-mode: screen; animation: om-flash 880ms ease-out both; }
  .lf-rays {
    position: absolute; left: 50%; top: 50%; width: 2600px; height: 2600px; margin: -1300px 0 0 -1300px;
    background: repeating-conic-gradient(rgba(251,191,36,.16) 0deg 6deg, transparent 6deg 14deg);
    /* Masked to fade past 60% radius so the rays never show a hard circular edge. */
    -webkit-mask-image: radial-gradient(circle, #000 42%, transparent 60%);
            mask-image: radial-gradient(circle, #000 42%, transparent 60%);
    animation: om-rays 30s linear infinite;
  }
  .lf-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, transparent 46%, rgba(180,83,9,.5) 100%); animation: om-vign var(--hold, 2600ms) ease-in-out both; }

  /* ── CURSE ◍ — the giver possesses the camera ──────────────────────
     The curse IS the giver's avatar: their face screen-blended over the
     tracked head in three layers — a core plus two hue-split clones on
     STEPPED glitch loops — so it reads as something wearing the face. */
  .curse-av { background-size: cover; background-position: center; border-radius: 50%; }
  .curse-core  { mix-blend-mode: screen; opacity: .62; }
  .curse-ghost { mix-blend-mode: screen; opacity: .38; }
  @keyframes om-glitch {
    0%,100% { transform: translate(0,0); } 20% { transform: translate(-11px, 2px); }
    40% { transform: translate(9px,-3px); } 60% { transform: translate(-6px,-2px); }
    80% { transform: translate(11px, 3px); }
  }
  /* steps() is the point — a smooth glitch is not a glitch. */
  .curse-ghost.g1 { animation: om-glitch 640ms steps(4, end) infinite; filter: hue-rotate(-38deg); }
  .curse-ghost.g2 { animation: om-glitch 820ms steps(4, end) infinite reverse; filter: hue-rotate(42deg); }
  @keyframes om-breathe { 0%,100% { transform: scale(1); opacity: .55; } 50% { transform: scale(1.06); opacity: .9; } }
  .curse-halo { border-radius: 50%; box-shadow: 0 0 90px 30px rgba(232,121,249,.55); animation: om-breathe 1500ms ease-in-out infinite; }
  .curse-halo.legend { box-shadow: 0 0 110px 36px rgba(251,191,36,.6); }
  .curse-vignette { background: radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(42,4,71,.92) 100%); mix-blend-mode: multiply; }
  .tear { mix-blend-mode: screen; background: linear-gradient(90deg, rgba(232,121,249,.75), rgba(56,189,248,.6)); animation: om-glitch var(--td, 500ms) steps(6, end) infinite; }
  @keyframes om-drip { from { height: 0; opacity: .9; } to { height: var(--dh, 120px); opacity: .25; } }
  .drip { background: linear-gradient(180deg, #2A0447, rgba(42,4,71,0)); animation: om-drip var(--dd, 900ms) ease-in both; }
  .curse-frame { border: 3px dashed rgba(232,121,249,.85); }
  .curse-corner { border: 4px solid #FBBF24; }
  .curse-sigil { border-radius: 50%; background-size: cover; background-position: center; box-shadow: 0 0 0 3px #FBBF24; }

  /* ── FLOOD ◒ — buckets thrown from the sides ──────────────────────── */
  /* The art ships an upright bucket AND a correctly drawn TIPPED one with its water
     attached. Use both: fly the upright in, then SWAP to the tipped sprite. Rotating
     the upright bucket 116° instead turns it into a sideways tube, which is what it
     looked like on stream. */
  .bucket { background: url('assets/wheel/bucket.png') center / 100% 100% no-repeat; }
  .bucket.legend { background-image: url('assets/wheel/bucket-legend.png'); }
  .bucket.pouring { background-image: url('assets/wheel/bucket-pour.png'); }
  /* bucket-pour and water-sheet are both drawn RIGHT-FACING, so a bucket throwing
     leftwards has to be mirrored. */
  .bucket.flip, .water-y.flip { transform: scaleX(-1); }
  .bucket.legend.pouring { filter: drop-shadow(0 0 10px rgba(251,191,36,.85)); }
  /* Water travels a real ARC, so the path is x and y on different timings. */
  @keyframes om-arc-x { from { transform: translateX(0); } to { transform: translateX(var(--ax, 0px)); } }
  @keyframes om-arc-y { 0% { transform: translateY(0) rotate(0deg); } 40% { transform: translateY(calc(var(--ah, -130px))) rotate(18deg); } 100% { transform: translateY(var(--ay, 0px)) rotate(46deg); } }
  .water-x { animation: om-arc-x var(--wd, 265ms) linear both; }
  /* water-sheet.png — "separate right-moving thrown water mass". This was
     bucket-pour.png, which the manifest describes as a tipped BUCKET with water
     attached, so every throw launched a second whole bucket across the frame. */
  .water-y { background: url('assets/wheel/water-sheet.png') center / 100% 100% no-repeat; animation: om-arc-y var(--wd, 265ms) cubic-bezier(.3,0,.7,1) both; }
  .droplet { border-radius: 50%; background: #7DD3FC; animation: om-arc-y var(--wd, 265ms) cubic-bezier(.3,0,.7,1) both; }
  @keyframes om-splash { 0% { transform: scale(.3); opacity: 0; } 30% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.35); opacity: 0; } }
  .splash { background: url('assets/wheel/water-splash-crown.png') center / 100% 100% no-repeat; animation: om-splash 620ms cubic-bezier(.2,.9,.2,1) both; }
  .wet-film { background: url('assets/wheel/wet-film.png') center / 100% 100% no-repeat; transition: opacity .4s ease; }
  /* A face bead is a bead PLUS a tapered trail behind it — same duration, same delay. */
  @keyframes om-bead { from { transform: translateY(0); opacity: .95; } to { transform: translateY(var(--dy, 90px)); opacity: 0; } }
  @keyframes om-run  { from { transform: scaleY(0); opacity: .7; } to { transform: scaleY(1); opacity: 0; } }
  .bead { border-radius: 50%; background: #7DD3FC; animation: om-bead var(--bd, 900ms) ease-in both; }
  .run  { background: linear-gradient(180deg, rgba(125,211,252,0), rgba(125,211,252,.75)); transform-origin: 50% 0; animation: om-run var(--bd, 900ms) ease-in both; }
  @keyframes om-shakeoff { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-9px) } 45% { transform: translateX(8px) } 70% { transform: translateX(-5px) } 88% { transform: translateX(3px) } }
  .shaking { animation: om-shakeoff 460ms ease-in-out both; }

  /* ── WEATHER ❉ — particle pool on randomised paths ────────────────── */
  @keyframes om-fall { from { transform: translateY(-40px) translateX(0) rotate(var(--pr,0deg)); opacity: 0; }
                       12% { opacity: 1; }
                       to  { transform: translateY(var(--fy, 900px)) translateX(var(--fx, 40px)) rotate(var(--pr,0deg)); opacity: .1; } }
  .storm-p { background: linear-gradient(180deg, rgba(192,132,252,0), #C084FC); animation: om-fall var(--fd, 1400ms) linear infinite both; }
  .storm-p.gold { background: linear-gradient(180deg, rgba(251,191,36,0), #FBBF24); }
  .bolt { background: #FDE68A; animation: om-flash 260ms ease-out both; }

  /* ── CRACK ◆ — break the glass ─────────────────────────────────────── */
  @keyframes om-crack { from { transform: rotate(var(--cr,0deg)) scaleX(0); } to { transform: rotate(var(--cr,0deg)) scaleX(1); } }
  .spoke { transform-origin: 0 50%; background: rgba(250,245,255,.92); animation: om-crack var(--cd, 260ms) cubic-bezier(.1,.9,.2,1) both; }
  .crack-web { background: url('assets/wheel/glass-crack-web.png') center / 100% 100% no-repeat; animation: om-splash 520ms ease-out both; }
  @keyframes om-shake { 0%,100% { transform: translate(0,0) } 15% { transform: translate(-14px, 6px) } 35% { transform: translate(12px,-8px) } 55% { transform: translate(-8px,-4px) } 78% { transform: translate(6px, 5px) } }
  #bump.shaking-hard { animation: om-shake 380ms ease-in-out both; }
  @keyframes om-tumble { from { transform: translate(0,0) rotate(0deg); opacity: 1; } to { transform: translate(var(--dx,0px), 1400px) rotate(var(--dr, 420deg)); opacity: .2; } }
  .shard { background: url('assets/wheel/glass-shards.png') center / cover no-repeat; animation: om-tumble var(--sd, 1100ms) cubic-bezier(.4,0,.9,1) both; }

  /* ── SPOTLIGHT ▲ — the giver steals your light ────────────────────── */
  .sl-cone { background: url('assets/wheel/spotlight-cone.png') center top / 100% 100% no-repeat; opacity: .82;
             transition: left .5s cubic-bezier(.3,.8,.3,1), top .5s ease, width .44s ease, opacity .3s ease; }
  .sl-pool { background: url('assets/wheel/spotlight-floor-pool.png') center / 100% 100% no-repeat;
             transition: left .5s cubic-bezier(.3,.8,.3,1), width .44s ease, opacity .3s ease; }
  .sl-dark { background: rgba(10,4,20,.72); transition: opacity .5s ease; }
  @keyframes om-rise { from { transform: translateY(150px) scale(.9); opacity: 0; } 70% { transform: translateY(-16px) scale(1.03); opacity: 1; } to { transform: translateY(0) scale(1); opacity: 1; } }
  .sl-giver { background-size: cover; background-position: center; border-radius: 50%; animation: om-rise 620ms cubic-bezier(.2,1.1,.3,1.2) both; }
  .sl-shadow { background: radial-gradient(ellipse, rgba(0,0,0,.72), transparent 70%); }
  .sl-plate { font-family: Boogaloo, Fredoka, system-ui, sans-serif; color: #FDE68A; text-align: center; white-space: nowrap; }
  .sl-beam { background: linear-gradient(180deg, rgba(251,191,36,.35), transparent); transform-origin: 50% 0; animation: om-glitch 2600ms ease-in-out infinite; }

  /* ── FRAME ▣ — claim the frame ─────────────────────────────────────
     9-SLICED. border-image is inert on an <img> and inert without a real
     border-width, so it must be a wrapper div that HAS a border-width. */
  .marquee {
    border-style: solid;
    border-image-source: url('assets/wheel/frame-marquee.png');
    border-image-slice: 34% fill;
    border-image-repeat: stretch;
  }
  .marquee.legend { border-image-source: url('assets/wheel/frame-marquee-legend.png'); }
  @keyframes om-marquee { to { transform: rotate(-360deg); } }
  .marquee.counter { animation: om-marquee 26s linear infinite; }
  @keyframes om-marquee-glow { 0%,100% { filter: drop-shadow(0 0 10px rgba(232,121,249,.5)); } 50% { filter: drop-shadow(0 0 26px rgba(232,121,249,.95)); } }
  .marquee-glow { animation: om-marquee-glow 1400ms ease-in-out infinite; }
  .marquee.legend.marquee-glow { animation: none; filter: drop-shadow(0 0 24px rgba(251,191,36,.85)); }
  @keyframes om-chase { from { left: 0; } to { left: 100%; } }
  .stud { border-radius: 50%; background: #FDE68A; box-shadow: 0 0 12px rgba(251,191,36,.9); animation: om-chase var(--cd, 2600ms) linear infinite both; }

  /* ── AVATAR ◉ — invade ─────────────────────────────────────────────── */
  .invader { background-size: cover; background-position: center; border-radius: 50%; box-shadow: 0 0 0 4px #E879F9, 0 12px 40px rgba(0,0,0,.5); }
  .invader.legend { box-shadow: 0 0 0 4px #FBBF24, 0 0 40px rgba(251,191,36,.6); }
  .inv-tag {
    font-family: Fredoka, system-ui, sans-serif; font-weight: 600; color: #FAF5FF; white-space: nowrap;
    background: rgba(42,4,71,.85); border-radius: 999px; padding: 6px 18px;
    opacity: 0; transform: scale(.7); transition: opacity .22s ease, transform .28s cubic-bezier(.2,1.4,.3,1);
  }
  .inv-tag.show { opacity: 1; transform: scale(1); }
  @keyframes om-drift { to { transform: translateY(-260px); opacity: 0; } }
  .drifting { animation: om-drift 700ms ease-in both; }

  /* ── BALL DROP ● — the cam becomes a ball ──────────────────────────
     Layer order is fixed by the art: circular cam crop → shell (multiply)
     → gloss (screen) → rim ring. */
  .ball { background-size: cover; background-position: center; overflow: hidden; will-change: transform, left, top; }
  .ball-shell { background: url('assets/wheel/ball-shell.png') center / 100% 100% no-repeat; mix-blend-mode: multiply; }
  .ball-gloss { background: url('assets/wheel/ball-gloss.png') center / 100% 100% no-repeat; mix-blend-mode: screen; }
  .ball-ring  { background: url('assets/wheel/ball-ring.png') center / 100% 100% no-repeat; }
  .ball-ring.legend { background-image: url('assets/wheel/ball-ring-legend.png'); }
  .ball-shadow { background: radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%); border-radius: 50%; }
  .ball-trail { background: linear-gradient(180deg, rgba(251,191,36,.85), rgba(251,191,36,0)); border-radius: 6px; }
  /* The frozen cam still, covering the live cam so we own the pixels. */
  .cam-frozen { background-size: cover; background-position: center; }
  /* A real void, not a transparent punch. Transparent revealed the LIVE camera
     underneath, so the hole was the streamer's face and nothing looked missing. */
  .cam-hole {
    border-radius: 50%;
    background: radial-gradient(circle, #000 58%, #14041F 78%, rgba(20,4,31,0) 100%);
    box-shadow: inset 0 0 60px 20px #000, 0 0 0 5px rgba(232,121,249,.55), 0 0 40px rgba(232,121,249,.4);
  }
  /* Tracked mode draws a lock-on reticle instead of a bucket — the game already
     has one on screen, and drawing a second would read as a mistake. */
  .ball-reticle {
    border: 3px solid rgba(232,121,249,.9); border-radius: 10px;
    box-shadow: 0 0 0 2px rgba(42,4,71,.6), 0 0 22px rgba(232,121,249,.5);
    animation: om-breathe 900ms ease-in-out infinite;
  }
  .bucket-lip { background: url('assets/wheel/bucket-mouth.png') center top / 100% 100% no-repeat; }
  .ball-plate {
    position: absolute; font-family: Boogaloo, Fredoka, system-ui, sans-serif; color: #FAF5FF;
    text-shadow: 2px 0 0 #2A0447, -2px 0 0 #2A0447, 0 2px 0 #2A0447, 0 -2px 0 #2A0447,
                 2px 2px 0 #2A0447, -2px 2px 0 #2A0447, 2px -2px 0 #2A0447, -2px -2px 0 #2A0447;
    opacity: 0; transform: translateY(14px); transition: opacity .3s ease, transform .3s cubic-bezier(.2,1.3,.3,1);
  }
  .ball-plate.show { opacity: 1; transform: translateY(0); }

  /* ── HERO LINE — the ONE place the name is printed during impact.
     Every name over gameplay carries an 8-direction ink outline so it stays
     legible against arbitrary gameplay colour underneath. ── */
  .hero {
    position: absolute; left: 0; top: 760px; width: 1080px; text-align: center;
    opacity: 0; transform: translateY(18px) scale(.96); isolation: isolate;
    transition: opacity .52s cubic-bezier(.18,1.2,.3,1), transform .52s cubic-bezier(.18,1.2,.3,1);
  }
  .hero.show { opacity: 1; transform: translateY(0) scale(1); }
  /* A blurred dark halo behind the name. The 8-direction outline alone is not enough
     over bright or busy gameplay — the same technique the Follow Meter uses to keep
     its hero legible, and for the same reason: this is the ONE place the giver's name
     is printed during impact, so it cannot be allowed to disappear into the frame. */
  .hero::before {
    content: ''; position: absolute; left: 90px; right: 90px; top: -26px; bottom: -14px;
    background: rgba(13,8,22,.78); filter: blur(46px); border-radius: 50%; z-index: -1;
  }
  .hero .h-name {
    font-family: Boogaloo, Fredoka, system-ui, sans-serif; font-size: 112px; color: #FAF5FF;
    line-height: 1.02;
    text-shadow: 4px 0 0 #2A0447, -4px 0 0 #2A0447, 0 4px 0 #2A0447, 0 -4px 0 #2A0447,
                 4px 4px 0 #2A0447, -4px 4px 0 #2A0447, 4px -4px 0 #2A0447, -4px -4px 0 #2A0447,
                 0 10px 0 rgba(42,4,71,.9);
  }
  .hero .h-what { font-family: Fredoka, system-ui, sans-serif; font-weight: 600; font-size: 38px; color: #C084FC; letter-spacing: .04em; }
  .hero.tier-legend .h-name { color: #FDE68A; }
  .hero.tier-legend .h-what { color: #FBBF24; }

  /* Dev-only heads-up so an operator loading the page in a browser knows it's alive
     and which transport it's on. Hidden inside Studio is fine — pointer-events off. */
  #conn { position: absolute; left: 12px; top: 12px; z-index: 90; font-size: 14px;
    color: rgba(255,255,255,0.5); font-family: 'DM Mono', monospace; }
</style>
