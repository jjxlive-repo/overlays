<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPIN THE SCREEN — Wheel Overlay</title>
<!-- Typeface: Baloo 2 (600/700/800) — the Doodle Stream HUD family Feed Jamie uses.
     One family across every module sharing the frame; the old Fredoka/Boogaloo/DM Mono
     set is gone with the carnival skin (Doodle alignment, 2026-07-27). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<!--
  Spin the Screen — wheel overlay skeleton (checkpoint 3).

  A DUMB RENDERER. It never decides anything: the Producer Dock resolves every spin
  (result, variant, seed, signature, revision) and publishes ONE authoritative
  `wheel.spin` on the `splat-overlay` channel. This page receives that and plays it —
  nothing here rolls randomness or picks a result. The design handoff's `spinGift({...,
  result })` "omit and the wheel picks at random" is PROTOTYPE HARNESS framing and must
  never be implemented here; `result` is authoritative input.

  ORIGIN: GitHub Pages, added to TikTok LIVE Studio as a browser source (1080×1920,
  transparent). Test B (2026-07-24) confirmed Studio rejects http://localhost sources,
  so the overlay lives on Pages — exactly like every other overlay.

  TRANSPORT (updated 2026-07-24, overlays 1939e8b): Ably is OFF (`ABLY_ENABLED = false`
  in jjx-core — the account is being cancelled). Everything rides `JJX.dockRealtime()`
  over ws://127.0.0.1:4317/overlay-ws to the dock. That works from an https Pages origin
  because Chrome treats 127.0.0.1 as potentially-trustworthy, so ws:// to it is not
  mixed-content-blocked — which is also the answer to Test C, and means the checkpoint-5
  FACE-TRACKING stream has a transport (raw socket, never the batched publish path).

  PAYLOAD: schemaVersion 2 (2026-07-25) added `platform`. There is deliberately no `usd`
  field — `gift.totalValue` is in coin equivalents and 1 coin = 1 jewel = $0.01, so
  dollars are derived here (usdOf). See spin-docs/WHEEL-OVERLAY-RECONCILIATION.md.

  What this checkpoint delivers: the five rendering lanes, the
  queued→acknowledged→spinning→impact→settled→complete state machine, in-order queue
  handling that never interrupts an active wheel, per-stage watchdogs + cleanup with no
  orphaned timers or DOM nodes, and revision-dedupe so a re-published or replayed spin
  renders once. Visuals are deliberately PLACEHOLDER — the polished per-result effects
  are checkpoints 4 (Stamp) and 7 (the rest).

  Cache discipline: bump ?v=N on jjx-core (and this page's own source ref if split out)
  on every change — Studio's browser-source cache serves stale copies otherwise.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* Fixed 1080×1920. No viewport units, no bottom-anchoring — Studio scales the whole
     source, and vh/vw + bottom edges drift when it does (repo rule). */
  html, body {
    width: 1080px; min-width: 1080px;
    height: 1920px; min-height: 1920px;
    overflow: hidden; background: transparent;
    /* The overlay must never eat clicks meant for Studio's own UI. */
    pointer-events: none;
    font-family: 'Baloo 2', system-ui, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  /* Explicit 1080×1920 — NOT inset:0, which would size to the viewport (correct
     at 1080×1920 in Studio, but collapses to the pane width in a dev preview and
     is fragile either way). Lanes are absolute children of this fixed box. */
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

  /* ── LANES ─────────────────────────────────────────────────────────
     Five independent stacking contexts, spec order. Each lane owns one
     class of visual so a Takeover impact can suppress ambient without
     touching signatures, etc. z rises with "how much it interrupts". */
  .lane { position: absolute; }
  #lane-wall      { left: 0; bottom: 0; width: 1080px; height: 350px; z-index: 5; }  /* scenery, not an event — and outside the bump */
  #lane-flare     { inset: 0; z-index: 20; }   /* legendFlare: under every effect, Legend only */
  #lane-wheel     { inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; }
  /* Full-width rail layout. The operator owns two primary dials: total HEIGHT and a
     vertical Y offset. Width is fixed to the 1080px source so every enabled result
     can remain visible as the carousel turns. */
  #wheel-stage {
    width: 1080px;
    height: var(--wheel-reel-h, 220px);
    transform: translateY(var(--wheel-y, 0px));
  }
  #lane-fx        { inset: 0; z-index: 45; }   /* the effect itself */
  #lane-impact    { inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; }

  /* ── SUPPORTER WALL ────────────────────────────────────────────────
     A LITERAL WALL. Bricks touch — every piece is laid against its
     neighbours with a 3px mortar joint and nothing ever floats:

       · 6 courses of 58.3px pitch fill the 350px band EXACTLY, so there
         is no leftover slack for the wall to float on. Brick is 177×55.3,
         which is the art's own 1024×320 aspect (3.2) — no squash.
       · 1080 / 180 = 6 exactly, so full courses tile edge to edge with
         no remainder and no end gap.
       · Running bond offsets alternate courses by half a pitch, which
         leaves a part-brick CLOSER at each end. Those are real masonry,
         not empty slots: without them the offset courses would have a
         90px hole at each edge. They carry no name.
       · Fill is course-major from the ground up, so a brick can never
         appear above an empty space.
       · Bricks NEVER move and are never removed. See addSupporter().

     No background band and no placeholder courses — the wall IS the
     bricks, so an empty wall renders nothing at all. No drop shadow:
     real bricks sit against their neighbours with no gap to cast into. */
  /* SOLID FILLS, not the brick-*.png art. That art is a rounded, hand-cut "Painted
     Splat" chip shape with real padding inside its own bounding box — not a
     rectangle that fills the box it's placed in. The wall's geometry tiles boxes
     together with an EXACT 3px gap (verified correct — this is a running-bond brick
     wall, mortar joints included), which is precisely what exposed the mismatch:
     boxes touch exactly as designed, but the art's painted pixels sit well inside
     each box, so what actually renders is visible gaps between rounded chips — the
     opposite of "bricks touching, nothing floating." Same fix already applied to the
     reel housing for the same reason: a solid CSS fill always exactly fills its own
     box, so adjacent bricks meet with zero surprise gap, by construction. */
  .brick {
    position: absolute; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .brick.b1 { background: #2A0447; }
  .brick.b2 { background: #331154; }
  .brick.b3 { background: #3B0764; }
  .brick.b-legend { background: #241041; }

  /* Drop-in: falls from above, lands on the course below, squashes, rebounds
     twice with decreasing amplitude, settles. Origin is the BOTTOM edge so the
     squash compresses onto the course beneath rather than about the centre. */
  @keyframes om-drop {
    0%   { transform: translateY(-340px) scaleY(1);    }
    58%  { transform: translateY(0)      scaleY(1);    }
    68%  { transform: translateY(0)      scaleY(.84);  }  /* impact squash */
    78%  { transform: translateY(-13px)  scaleY(1.05); }  /* rebound 1 */
    88%  { transform: translateY(0)      scaleY(.94);  }
    95%  { transform: translateY(-4px)   scaleY(1.01); }  /* rebound 2 */
    100% { transform: translateY(0)      scaleY(1);    }
  }
  .brick.dropping { animation: om-drop 560ms cubic-bezier(.3,.05,.4,1) both; transform-origin: 50% 100%; }

  /* Names are styled by DOLLARS, not tier — that is what makes the wall
     readable as a ledger rather than a list of effects. */
  .brick .b-name {
    max-width: 92%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    line-height: 1.05;
  }
  .brick .b-usd { font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 12px; color: rgba(250,245,255,.5); margin-top: 1px; }
  /* Dollar bands read through weight + hue, never glow (style-guide don'ts).
     The two top bands wear the coin yellow — a brick IS money. */
  .usd-0 .b-name { font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 600; font-size: 20px; color: #c9b3e8; }
  .usd-1 .b-name { font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 22px; color: #e795c9; }
  .usd-2 .b-name { font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800; font-size: 23px; color: #ffd93b; }
  .usd-3 .b-name { font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800; font-size: 26px; color: #ffd93b; }
  /* Inset ring + outer glow in ONE declaration, deliberately — these used to live on
     two separate rules (.brick.b-legend / .usd-3) with different specificity, and the
     ring silently ate the glow instead of the two combining. box-shadow does not
     merge across rules; whichever rule wins the cascade wins outright. */
  .usd-3 { box-shadow: inset 0 0 0 3px #ffd93b; }  /* solid gold-edged brick, top tier only — no glow */

  /* ── WHEEL: CENTER-STAGE RAIL. The rail always spans the full 1080px source.
     Every enabled outcome remains visible as a complete nine-card pass while
     repeated passes move horizontally behind a fixed centre marker. The winner
     then holds in the centre so the spin reads as a shared stream moment rather
     than a modal appearing and disappearing. */
  /* Doodle HUD housing (Feed Jamie alignment): solid ink-bordered band with a flat
     offset shadow — no gradient, no inner glow, no blur (style guide don'ts). The
     band stays DARK (hybrid direction) so a spin still reads as an event over
     gameplay; the CONSTRUCTION — #1a1a1a borders + flat shadows — is what matches
     Feed Jamie's cream card. Gold is reserved for Legendary chances on the chips,
     so no tier-legend housing variant. */
  .reel-frame {
    position: relative;
    width: 1080px;
    height: 100%;
    overflow: visible;
    border-top: 4px solid #1a1a1a;
    border-bottom: 4px solid #1a1a1a;
    background: #2a0447;
    box-shadow: 0 6px 0 rgba(0,0,0,.5);
    opacity: 0;
    transform: scaleY(.88);
    transition: opacity .3s ease, transform .3s cubic-bezier(.2,1,.3,1);
  }
  .reel-frame.show { opacity: 1; transform: scaleY(1); }
  /* Purple ribbon — Feed Jamie's CTA ribbon grammar (#6c3fd8 + #ffd93b). */
  .reel-moment-title {
    position: absolute; left: 50%; bottom: calc(100% + 16px); z-index: 12;
    transform: translateX(-50%);
    background: #6c3fd8; color: #ffd93b; white-space: nowrap;
    border: 3px solid #1a1a1a; border-radius: 12px;
    box-shadow: 0 4px 0 rgba(0,0,0,.35);
    padding: 6px 22px 8px;
    font-family: 'Baloo 2', system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(24px, calc(var(--wheel-reel-h, 220px) * .13), 34px);
    letter-spacing: .05em;
    transition: transform .35s cubic-bezier(.2,1.35,.3,1);
  }
  .reel-moment-title:empty,
  .reel-winner-label:empty,
  .reel-seg .seg-label:empty {
    display: none !important;
  }
  .reel-frame.final-pass .reel-moment-title {
    transform: translateX(-50%) scale(1.06);
  }
  .reel-viewport {
    position: absolute; left: 0; right: 0; top: 0; height: 100%;
    overflow: visible;
    /* Keep the moving strip inside the 1080px rail horizontally while allowing the
       selected card's ring and lift to rise beyond the rail edge. */
    clip-path: inset(-180px 0 -180px 0);
  }
  .reel-strip {
    position: absolute; left: 0; top: 50%; height: 100%;
    display: flex; align-items: center;
    gap: 6px;
    will-change: transform;
    transform: translate3d(0,-50%,0);
  }
  /* Low-profile ticker chips: WIDE (icon beside label) instead of tall, solid
     sticker fills with the 3px ink border + flat offset shadow. */
  .reel-seg {
    --card-bg: #4B126F;
    --card-ink: #fdf8ee;
    position: relative;
    flex: 0 0 auto;
    height: 62%;
    min-width: 0;
    display: flex; flex-direction: row; align-items: center; justify-content: center;
    gap: clamp(8px, calc(var(--wheel-reel-h, 220px) * .055), 16px);
    overflow: visible;
    border: 3px solid #1a1a1a;
    border-radius: 14px;
    background: var(--card-bg);
    box-shadow: 0 4px 0 rgba(0,0,0,.45);
    color: var(--card-ink);
    opacity: .8;
    transform: scale(.94);
    transform-origin: 50% 50%;
    transition:
      opacity .16s ease,
      border-color .3s ease,
      box-shadow .3s ease,
      background .3s ease;
  }
  /* Result type controls the chip's hue; tier reads through the escalation
     grammar and gold, never through glow. */
  .reel-seg.type-curse     { --card-bg:#7a285c; }
  .reel-seg.type-stamp     { --card-bg:#8a3028; }
  .reel-seg.type-flood     { --card-bg:#08749b; }
  .reel-seg.type-weather   { --card-bg:#475569; }
  .reel-seg.type-crack     { --card-bg:#5145cd; }
  .reel-seg.type-spotlight { --card-bg:#936313; }
  .reel-seg.type-frame     { --card-bg:#7e28a8; }
  .reel-seg.type-avatar    { --card-bg:#11776f; }
  .reel-seg.type-ball      { --card-bg:#2754b8; }
  /* Focus = cream ring + deeper flat shadow. Never glow. */
  .reel-frame:not(.landed) .reel-seg.center-focus {
    border-color: #fdf8ee;
    box-shadow: 0 6px 0 rgba(0,0,0,.5);
  }
  .reel-seg .seg-label {
    max-width: 94%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: clamp(16px, calc(var(--wheel-reel-h, 220px) * .105), 26px);
    font-weight: 800; line-height: 1.25; letter-spacing: .01em;
    transform: scale(var(--wheel-content-scale, 1));
  }
  .reel-frame.landed .reel-seg {
    opacity: .28; transform: scale(.82);
    transition: opacity .24s ease, transform .34s cubic-bezier(.2,1.25,.3,1),
                border-color .3s ease, box-shadow .3s ease, background .3s ease;
  }
  .reel-frame.landed .reel-seg.winner {
    --winner-ring: #fdf8ee;
    z-index: 20;
    opacity: 1;
    transform: translateY(-8%) scale(1.12);
    outline: 5px solid var(--winner-ring);
    outline-offset: 6px;
    border-color: #1a1a1a;
    box-shadow: 0 7px 0 rgba(0,0,0,.5);
    animation: reelWinnerLock .72s cubic-bezier(.2,1.25,.3,1) both;
  }
  @keyframes reelWinnerLock {
    0% {
      transform: translateY(0) scale(1.2);
      outline-color: rgba(253,248,238,0);
      outline-offset: 1px;
    }
    58% {
      transform: translateY(-11%) scale(1.2);
      outline-color: var(--winner-ring);
      outline-offset: 8px;
    }
    100% {
      transform: translateY(-8%) scale(1.12);
      outline-color: var(--winner-ring);
      outline-offset: 6px;
    }
  }
  .reel-frame.tier-legend .reel-seg.winner {
    --winner-ring: #fdf8ee;
    color: #1a1a1a;
    border-color: #1a1a1a;
    background: #ffd93b;
    box-shadow: 0 7px 0 rgba(0,0,0,.5);
  }
  /* Gold = coin yellow, whole-chip fill (yellow is currency; Legend IS spend). */
  .reel-seg.gold {
    color: #1a1a1a;
    border-color: #1a1a1a;
    background: #ffd93b;
    box-shadow: 0 4px 0 rgba(0,0,0,.45);
  }
  .reel-seg.gold::after {
    content: attr(data-gold-label);
    position: absolute; left: 50%; top: -12px;
    transform: translateX(-50%);
    padding: 2px 9px 3px; border-radius: 999px;
    color: #ffd93b; background: #6c3fd8;
    border: 2px solid #1a1a1a;
    font: 800 clamp(10px, calc(var(--wheel-reel-h, 220px) * .055), 13px)/1.2 'Baloo 2', system-ui, sans-serif;
    letter-spacing: .05em;
  }
  .reel-seg.gold[data-gold-label=""]::after { display: none; }
  .reel-arrow {
    position: absolute; left: 50%; top: -4px; z-index: 22;
    width: 0; height: 0;
    transform: translateX(-50%);
    border-left: clamp(13px, calc(var(--wheel-reel-h, 220px) * .09), 22px) solid transparent;
    border-right: clamp(13px, calc(var(--wheel-reel-h, 220px) * .09), 22px) solid transparent;
    border-top: clamp(18px, calc(var(--wheel-reel-h, 220px) * .13), 30px) solid #fdf8ee;
  }
  .reel-frame.tier-legend .reel-arrow { border-top-color: #ffd93b; }
  .reel-winner-label {
    position: absolute; left: 50%; bottom: calc(100% + 84px); z-index: 11;
    transform: translateX(-50%) translateY(8px) scale(.94);
    padding: 7px 20px 9px;
    border: 4px solid #1a1a1a;
    background: #fdf8ee;
    border-radius: 12px;
    box-shadow: 0 5px 0 rgba(0,0,0,.35);
    color: #1a1a1a; white-space: nowrap;
    text-transform: uppercase;
    font-family: 'Baloo 2', system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(22px, calc(var(--wheel-reel-h, 220px) * .13), 34px);
    letter-spacing: .06em;
    opacity: 0;
    transition: opacity .24s ease, transform .3s cubic-bezier(.2,1.35,.3,1);
  }
  .reel-frame.landed .reel-winner-label {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
  .reel-frame.tier-legend .reel-winner-label {
    background: #ffd93b;
    color: #1a1a1a;
  }
  /* Gift attribution anchors to the rail's lower edge. It remains compact so the
     adjustable rail height controls screen coverage instead of the chip spilling
     outside the operator-selected band. */
  .gift-chip {
    position: absolute; left: 50%; bottom: calc(100% + 84px); z-index: 10;
    transform: translateX(-50%) scale(.92);
    display: flex; align-items: center; gap: 10px; white-space: nowrap;
    padding: 6px 16px 8px; border-radius: 999px;
    background: #fdf8ee; border: 3px solid #1a1a1a; box-shadow: 0 4px 0 rgba(0,0,0,.35);
    opacity: 0; transition: opacity .32s ease, transform .32s cubic-bezier(.2,1.3,.3,1);
  }
  .reel-frame.show .gift-chip { opacity: 1; transform: translateX(-50%) scale(1); }
  .reel-frame.landed .gift-chip {
    opacity: 0; visibility: hidden;
    transform: translateX(-50%) translateY(8px) scale(.94);
  }
  .gift-chip .g-name { font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800; font-size: clamp(17px, calc(var(--wheel-reel-h, 220px) * .1), 24px); color: #1a1a1a; }
  .gift-chip .g-amt  { font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: clamp(15px, calc(var(--wheel-reel-h, 220px) * .085), 21px); color: #1a1a1a; }
  /* Money wears the coin-yellow badge — yellow = currency only, per the style guide. */
  .gift-chip .g-usd  { font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800; font-size: clamp(14px, calc(var(--wheel-reel-h, 220px) * .08), 19px); color: #1a1a1a; background: #ffd93b; border: 2px solid #1a1a1a; border-radius: 999px; padding: 1px 10px 2px; }
  /* Result icons drawn from the icons.png sprite sheet, positioned by each icon's
     MEASURED centre (cells are a regular 444px grid but the art isn't centred in
     its cell — up to ~55px drift — so we place by content centre, not cell). */
  .wicon { display: inline-block; flex: 0 0 auto; background: url('assets/wheel/icons.png') no-repeat; }
  .wicon.ball {
    border: 3px solid #1a1a1a;
    border-radius: 50%;
    background: #8fb8f0;
  }

  /* ── IMPACT: the result reveal card. Tier is read from SHAPE + SCALE +
     ICON + TEXT, never hue alone (streamer is red-green colorblind). ── */
  .impact {
    text-align: center; padding: 36px 56px; border-radius: 16px;
    background: #fdf8ee; border: 3px solid #1a1a1a; color: #1a1a1a;
    box-shadow: 0 6px 0 rgba(0,0,0,.35);
    opacity: 0; transform: scale(0.8); transition: opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .impact.show { opacity: 1; transform: scale(1); }
  .impact .i-glyph { display: flex; justify-content: center; margin-bottom: 8px; }
  .impact .i-user  { font-size: 40px; font-weight: 700; margin-bottom: 6px; max-width: 820px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .impact .i-tier  { font-size: 30px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 14px; }
  .impact .i-result { font-size: 64px; font-weight: 800; letter-spacing: .04em; }
  /* Tier accents: the doodle escalation ramp (green → orange → red) carried by the
     tier label, size and glyph. Legend takes the whole card coin-gold. */
  .tier-spin     .i-tier { color: #17a24b; }
  .tier-power    .i-tier { color: #e8871a; }
  .tier-takeover .i-tier { color: #e5312b; }
  .tier-legend   .i-tier { color: #1a1a1a; }  .impact.tier-legend   { background: #ffd93b; }

  /* The AMBIENT and SIGNATURE lanes that checkpoint 3 shipped are gone, along with
     the RECEIPT card. The handoff's lifecycle is three phases and states it twice:
     "No receipt card, no ambient tail", and idle shows "supporter wall only". All
     three competed with the hero line for the same attention beat, and persistent
     recognition is now the wall's job — which is why the wall ignores expiry while
     the dock still computes signature.expiresAt for checkpoint 8's operator tools. */

  /* ── EFFECT LAYER ─────────────────────────────────────────────────
     Head-anchored art. Anchors are px in the 1080×1920 stage, written by
     JS from the live head box each frame, so an effect translates AND
     rotates with head roll. */
  .fx { position: absolute; will-change: transform, opacity; }

  /* STAMP — the die that swings in and presses the name onto the face. */
  .stamp-die {
    background: url('assets/wheel/stamp-die.png') center / 100% 100% no-repeat;
    transform-origin: 50% 100%;   /* pivots on its FACE, so the press reads as contact */
  }
  .stamp-die.legend { background-image: url('assets/wheel/stamp-die-legend.png'); }

  /* The pressed impression.
     MASK THE PLATE, NOT THE TEXT. The rubber-ink texture is what makes the edges
     break up like real pressed ink — but applied to the NAME it just eats the name,
     which on stream meant the stamp was effectively invisible. So the masked texture
     is a coloured PLATE underneath, and the name sits on top of it unmasked.
     The name also carries the project's 8-direction ink outline, which every name
     over gameplay is supposed to have (design tokens) and which this was missing —
     without it, plum-on-skin and gold-on-skin both disappear. */
  .stamp-ink { position: absolute; }
  .stamp-ink .ink-plate {
    position: absolute; inset: 0; background: #6c3fd8; opacity: .92;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  }
  .stamp-ink .ink-name {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800;
    color: #fdf8ee; white-space: nowrap; letter-spacing: .02em;
    text-shadow:
      3px 0 0 #1a1a1a, -3px 0 0 #1a1a1a, 0 3px 0 #1a1a1a, 0 -3px 0 #1a1a1a,
      3px 3px 0 #1a1a1a, -3px 3px 0 #1a1a1a, 3px -3px 0 #1a1a1a, -3px -3px 0 #1a1a1a;
  }
  .stamp-ink.legend .ink-plate { background: #6B4B0B; }
  .stamp-ink.legend .ink-name  { color: #ffd93b; }

  @keyframes om-ripple { from { transform: scale(.25); opacity: .55; } to { transform: scale(1); opacity: 0; } }
  .ripple { border-radius: 50%; border: 3px solid rgba(232,121,249,.75); animation: om-ripple 520ms cubic-bezier(.2,.9,.2,1) both; }
  .ripple.legend { border-color: rgba(251,191,36,.85); }

  /* One keyframe, per-element custom properties — the pattern the handoff calls out
     as worth keeping. Each spark carries its own vector instead of needing its own
     animation. */
  @keyframes om-spark { from { transform: translate(0,0) scale(1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  .spark { border-radius: 50%; animation: om-spark var(--sd, 520ms) cubic-bezier(.2,.8,.3,1) both; }

  /* Canvas bump. Lives on #bump, NOT on #stage — the handoff warns that a bump
     sharing an element with another transform silently replaces it. The WALL is
     outside #bump on purpose: scaling anchored masonry would lift it off the frame
     edges and open exactly the gaps the wall must never have. */
  @keyframes om-bump { 0% { transform: scale(1); } 34% { transform: scale(var(--bump, 1.012)); } 100% { transform: scale(1); } }
  #bump { position: absolute; inset: 0; transform-origin: 50% 42%; }
  #bump.bumping { animation: om-bump var(--bump-ms, 460ms) cubic-bezier(.2,.9,.2,1) both; }

  /* ── LEGEND FLARE — renders UNDER every effect at Legend and nowhere else.
     Quantity + frame takeover + gold + flourish, per the tier grammar. ── */
  @keyframes om-flash  { 0% { opacity: 0; } 18% { opacity: .16; } 100% { opacity: 0; } }
  @keyframes om-rays   { to { transform: rotate(360deg); } }
  @keyframes om-vign   { 0% { opacity: 0; } 22% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; } }
  .lf-flash { position: absolute; inset: 0; background: #FBBF24; mix-blend-mode: screen; animation: om-flash 880ms ease-out both; }
  .lf-rays {
    position: absolute; left: 50%; top: 46%; width: 980px; height: 980px; margin: -490px 0 0 -490px;
    background: repeating-conic-gradient(rgba(251,191,36,.10) 0deg 4deg, transparent 4deg 18deg);
    opacity: .48;
    /* A contained halo, not a page-sized sunburst. The stream remains visible. */
    -webkit-mask-image: radial-gradient(circle, #000 28%, rgba(0,0,0,.72) 42%, transparent 54%);
            mask-image: radial-gradient(circle, #000 28%, rgba(0,0,0,.72) 42%, transparent 54%);
    animation: om-rays 30s linear infinite;
  }
  .lf-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, transparent 54%, rgba(28,8,42,.34) 100%); animation: om-vign var(--hold, 2600ms) ease-in-out both; }

  /* ── CURSE ◍ — the giver possesses the camera ──────────────────────
     The curse IS the giver's avatar: their face screen-blended over the
     tracked head in three layers — a core plus two hue-split clones on
     STEPPED glitch loops — so it reads as something wearing the face. */
  .curse-av { background-size: cover; background-position: center; border-radius: 50%; }
  .curse-core  { mix-blend-mode: screen; opacity: .62; }
  .curse-ghost { mix-blend-mode: screen; opacity: .38; }
  @keyframes om-glitch {
    0%,100% { transform: translate(0,0); } 20% { transform: translate(-11px, 2px); }
    40% { transform: translate(9px,-3px); } 60% { transform: translate(-6px,-2px); }
    80% { transform: translate(11px, 3px); }
  }
  /* steps() is the point — a smooth glitch is not a glitch. */
  .curse-ghost.g1 { animation: om-glitch 640ms steps(4, end) infinite; filter: hue-rotate(-38deg); }
  .curse-ghost.g2 { animation: om-glitch 820ms steps(4, end) infinite reverse; filter: hue-rotate(42deg); }
  @keyframes om-breathe { 0%,100% { transform: scale(1); opacity: .55; } 50% { transform: scale(1.06); opacity: .9; } }
  .curse-halo { border-radius: 50%; box-shadow: 0 0 90px 30px rgba(232,121,249,.55); animation: om-breathe 1500ms ease-in-out infinite; }
  .curse-halo.legend { box-shadow: 0 0 110px 36px rgba(251,191,36,.6); }
  .curse-vignette { background: radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(42,4,71,.92) 100%); mix-blend-mode: multiply; }
  .tear { mix-blend-mode: screen; background: linear-gradient(90deg, rgba(232,121,249,.75), rgba(56,189,248,.6)); animation: om-glitch var(--td, 500ms) steps(6, end) infinite; }
  @keyframes om-drip { from { height: 0; opacity: .9; } to { height: var(--dh, 120px); opacity: .25; } }
  .drip { background: linear-gradient(180deg, #2A0447, rgba(42,4,71,0)); animation: om-drip var(--dd, 900ms) ease-in both; }
  .curse-frame { border: 3px dashed rgba(232,121,249,.85); }
  .curse-corner { border: 4px solid #FBBF24; }
  .curse-sigil { border-radius: 50%; background-size: cover; background-position: center; box-shadow: 0 0 0 3px #FBBF24; }

  /* ── FLOOD ◒ — buckets thrown from the sides ──────────────────────── */
  /* The art ships an upright bucket AND a correctly drawn TIPPED one with its water
     attached. Use both: fly the upright in, then SWAP to the tipped sprite. Rotating
     the upright bucket 116° instead turns it into a sideways tube, which is what it
     looked like on stream. */
  .bucket { background: url('assets/wheel/bucket.png') center / 100% 100% no-repeat; }
  .bucket.legend { background-image: url('assets/wheel/bucket-legend.png'); }
  .bucket.pouring { background-image: url('assets/wheel/bucket-pour.png'); }
  /* bucket-pour and water-sheet are both drawn RIGHT-FACING, so a bucket throwing
     leftwards has to be mirrored. */
  .bucket.flip, .water-y.flip { transform: scaleX(-1); }
  .bucket.legend.pouring { filter: drop-shadow(0 0 10px rgba(251,191,36,.85)); }
  /* Water travels a real ARC, so the path is x and y on different timings. */
  @keyframes om-arc-x { from { transform: translateX(0); } to { transform: translateX(var(--ax, 0px)); } }
  @keyframes om-arc-y { 0% { transform: translateY(0) rotate(0deg); } 40% { transform: translateY(calc(var(--ah, -130px))) rotate(18deg); } 100% { transform: translateY(var(--ay, 0px)) rotate(46deg); } }
  .water-x { animation: om-arc-x var(--wd, 265ms) linear both; }
  /* water-sheet.png — "separate right-moving thrown water mass". This was
     bucket-pour.png, which the manifest describes as a tipped BUCKET with water
     attached, so every throw launched a second whole bucket across the frame. */
  .water-y { background: url('assets/wheel/water-sheet.png') center / 100% 100% no-repeat; animation: om-arc-y var(--wd, 265ms) cubic-bezier(.3,0,.7,1) both; }
  .droplet { border-radius: 50%; background: #7DD3FC; animation: om-arc-y var(--wd, 265ms) cubic-bezier(.3,0,.7,1) both; }
  @keyframes om-splash { 0% { transform: scale(.3); opacity: 0; } 30% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.35); opacity: 0; } }
  .splash { background: url('assets/wheel/water-splash-crown.png') center / 100% 100% no-repeat; animation: om-splash 620ms cubic-bezier(.2,.9,.2,1) both; }
  .wet-film { background: url('assets/wheel/wet-film.png') center / 100% 100% no-repeat; transition: opacity .4s ease; }
  /* A face bead is a bead PLUS a tapered trail behind it — same duration, same delay. */
  @keyframes om-bead { from { transform: translateY(0); opacity: .95; } to { transform: translateY(var(--dy, 90px)); opacity: 0; } }
  @keyframes om-run  { from { transform: scaleY(0); opacity: .7; } to { transform: scaleY(1); opacity: 0; } }
  .bead { border-radius: 50%; background: #7DD3FC; animation: om-bead var(--bd, 900ms) ease-in both; }
  .run  { background: linear-gradient(180deg, rgba(125,211,252,0), rgba(125,211,252,.75)); transform-origin: 50% 0; animation: om-run var(--bd, 900ms) ease-in both; }
  @keyframes om-shakeoff { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-9px) } 45% { transform: translateX(8px) } 70% { transform: translateX(-5px) } 88% { transform: translateX(3px) } }
  .shaking { animation: om-shakeoff 460ms ease-in-out both; }

  /* ── WEATHER ❉ — particle pool on randomised paths ────────────────── */
  @keyframes om-fall { from { transform: translateY(-40px) translateX(0) rotate(var(--pr,0deg)); opacity: 0; }
                       12% { opacity: 1; }
                       to  { transform: translateY(var(--fy, 900px)) translateX(var(--fx, 40px)) rotate(var(--pr,0deg)); opacity: .1; } }
  .storm-p { background: linear-gradient(180deg, rgba(192,132,252,0), #C084FC); animation: om-fall var(--fd, 1400ms) linear infinite both; }
  .storm-p.gold { background: linear-gradient(180deg, rgba(251,191,36,0), #FBBF24); }
  .bolt { background: #FDE68A; animation: om-flash 260ms ease-out both; }

  /* ── CRACK ◆ — break the glass ─────────────────────────────────────── */
  @keyframes om-crack { from { transform: rotate(var(--cr,0deg)) scaleX(0); } to { transform: rotate(var(--cr,0deg)) scaleX(1); } }
  .spoke { transform-origin: 0 50%; background: rgba(250,245,255,.92); animation: om-crack var(--cd, 260ms) cubic-bezier(.1,.9,.2,1) both; }
  .crack-web { background: url('assets/wheel/glass-crack-web.png') center / 100% 100% no-repeat; animation: om-splash 520ms ease-out both; }
  @keyframes om-shake { 0%,100% { transform: translate(0,0) } 15% { transform: translate(-14px, 6px) } 35% { transform: translate(12px,-8px) } 55% { transform: translate(-8px,-4px) } 78% { transform: translate(6px, 5px) } }
  #bump.shaking-hard { animation: om-shake 380ms ease-in-out both; }
  @keyframes om-tumble { from { transform: translate(0,0) rotate(0deg); opacity: 1; } to { transform: translate(var(--dx,0px), 1400px) rotate(var(--dr, 420deg)); opacity: .2; } }
  .shard { background: url('assets/wheel/glass-shards.png') center / cover no-repeat; animation: om-tumble var(--sd, 1100ms) cubic-bezier(.4,0,.9,1) both; }
  .freeze-capture {
    background-size: 100% 100%; background-position: center; overflow: hidden;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.28), inset 0 0 90px rgba(192,132,252,.22);
    filter: saturate(.72) contrast(1.08);
  }
  .freeze-capture::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(130deg, rgba(255,255,255,.13), transparent 28%, rgba(192,132,252,.14) 70%, transparent);
    pointer-events: none;
  }
  /* Cream card + purple ribbon footer — the Feed Jamie card anatomy, replacing
     the rgba + backdrop-blur pill (style guide: no blur pills). */
  .freeze-prompt {
    left: 70px; top: 650px; width: 940px; box-sizing: border-box; text-align: center;
    padding: 20px 28px 0; border: 3px solid #1a1a1a;
    border-radius: 16px; background: #fdf8ee; overflow: hidden;
    box-shadow: 0 5px 0 rgba(0,0,0,.35);
    font: 800 40px/1.1 'Baloo 2', system-ui, sans-serif; letter-spacing: .04em;
    color: #1a1a1a;
    opacity: 0; transform: translateY(12px);
    transition: opacity .24s ease, transform .24s ease;
  }
  .freeze-prompt.show { opacity: 1; transform: translateY(0); }
  .freeze-prompt.done { opacity: 0; transform: translateY(-12px); }
  .freeze-prompt small {
    display: block; margin: 16px -28px 0; padding: 7px 12px 9px;
    border-top: 3px solid #1a1a1a; background: #6c3fd8;
    font-size: 22px; font-weight: 800; letter-spacing: .08em; color: #ffd93b;
  }
  .freeze-shard {
    overflow: hidden; background-repeat: no-repeat;
    will-change: transform, opacity;
    border: 1px solid rgba(250,245,255,.48);
    box-shadow: 0 0 12px rgba(192,132,252,.28);
  }
  .freeze-shard.gold { border-color: rgba(253,230,138,.8); box-shadow: 0 0 18px rgba(251,191,36,.42); }
  .hand-cursor {
    border: 4px solid rgba(250,245,255,.9); border-radius: 50%;
    box-shadow: 0 0 0 5px rgba(168,85,247,.34), 0 0 26px rgba(192,132,252,.9);
    opacity: .9; transform: translate(-50%,-50%);
  }

  /* ── SPOTLIGHT ▲ — the giver steals your light ────────────────────── */
  .sl-cone { background: url('assets/wheel/spotlight-cone.png') center top / 100% 100% no-repeat; opacity: .82;
             transition: left .5s cubic-bezier(.3,.8,.3,1), top .5s ease, width .44s ease, opacity .3s ease; }
  .sl-pool { background: url('assets/wheel/spotlight-floor-pool.png') center / 100% 100% no-repeat;
             transition: left .5s cubic-bezier(.3,.8,.3,1), width .44s ease, opacity .3s ease; }
  .sl-dark { background: rgba(10,4,20,.72); transition: opacity .5s ease; }
  @keyframes om-rise { from { transform: translateY(150px) scale(.9); opacity: 0; } 70% { transform: translateY(-16px) scale(1.03); opacity: 1; } to { transform: translateY(0) scale(1); opacity: 1; } }
  .sl-giver { background-size: cover; background-position: center; border-radius: 50%; animation: om-rise 620ms cubic-bezier(.2,1.1,.3,1.2) both; }
  .sl-shadow { background: radial-gradient(ellipse, rgba(0,0,0,.72), transparent 70%); }
  .sl-plate {
    font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800;
    color: #ffd93b;
    text-align: center;
    white-space: nowrap;
    line-height: 1;
    text-shadow: 3px 0 0 #1a1a1a, -3px 0 0 #1a1a1a, 0 3px 0 #1a1a1a, 0 -3px 0 #1a1a1a;
  }
  .sl-beam { background: linear-gradient(180deg, rgba(251,191,36,.35), transparent); transform-origin: 50% 0; animation: om-glitch 2600ms ease-in-out infinite; }

  /* ── FRAME ▣ — claim the frame ─────────────────────────────────────
     9-SLICED. border-image is inert on an <img> and inert without a real
     border-width, so it must be a wrapper div that HAS a border-width. */
  .marquee {
    border-style: solid;
    border-image-source: url('assets/wheel/frame-marquee.png');
    border-image-slice: 34% fill;
    border-image-repeat: stretch;
  }
  .marquee.legend { border-image-source: url('assets/wheel/frame-marquee-legend.png'); }
  @keyframes om-marquee { to { transform: rotate(-360deg); } }
  .marquee.counter { animation: om-marquee 26s linear infinite; }
  @keyframes om-marquee-glow { 0%,100% { filter: drop-shadow(0 0 10px rgba(232,121,249,.5)); } 50% { filter: drop-shadow(0 0 26px rgba(232,121,249,.95)); } }
  .marquee-glow { animation: om-marquee-glow 1400ms ease-in-out infinite; }
  .marquee.legend.marquee-glow { animation: none; filter: drop-shadow(0 0 24px rgba(251,191,36,.85)); }
  @keyframes om-chase { from { left: 0; } to { left: 100%; } }
  .stud { border-radius: 50%; background: #FDE68A; box-shadow: 0 0 12px rgba(251,191,36,.9); animation: om-chase var(--cd, 2600ms) linear infinite both; }

  /* ── AVATAR ◉ — invade ─────────────────────────────────────────────── */
  .invader { background-size: cover; background-position: center; border-radius: 50%; box-shadow: 0 0 0 4px #E879F9, 0 12px 40px rgba(0,0,0,.5); }
  .invader.legend { box-shadow: 0 0 0 4px #FBBF24, 0 0 40px rgba(251,191,36,.6); }
  .inv-tag {
    font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800; color: #1a1a1a; white-space: nowrap;
    background: #fdf8ee; border: 3px solid #1a1a1a; box-shadow: 0 3px 0 rgba(0,0,0,.35); border-radius: 999px; padding: 6px 18px;
    opacity: 0; transform: scale(.7); transition: opacity .22s ease, transform .28s cubic-bezier(.2,1.4,.3,1);
  }
  .inv-tag.show { opacity: 1; transform: scale(1); }
  @keyframes om-drift { to { transform: translateY(-260px); opacity: 0; } }
  .drifting { animation: om-drift 700ms ease-in both; }
  @keyframes om-echo-pop {
    0% { opacity: 0; transform: translateY(22px) scale(.72) rotate(var(--er,0deg)); }
    68% { opacity: 1; transform: translateY(-8px) scale(1.05) rotate(var(--er,0deg)); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(var(--er,0deg)); }
  }
  @keyframes om-echo-float {
    0%,100% { margin-top: 0; }
    50% { margin-top: -14px; }
  }
  .snapshot-echo {
    border-radius: 50%; background-size: cover; background-position: center;
    border: 6px solid #A855F7;
    box-shadow: 0 16px 40px rgba(0,0,0,.52), 0 0 28px rgba(168,85,247,.58);
    animation: om-echo-pop 480ms cubic-bezier(.18,1.2,.28,1) both,
               om-echo-float 1800ms ease-in-out 500ms infinite;
  }
  .snapshot-echo.legend {
    border-color: #FBBF24;
    box-shadow: 0 16px 40px rgba(0,0,0,.52), 0 0 34px rgba(251,191,36,.74);
  }
  /* Cream card + purple ribbon header — same anatomy as the freeze prompt. */
  .echo-countdown {
    left: 90px; top: 650px; width: 900px; box-sizing: border-box; text-align: center;
    padding: 0 26px 16px; border: 3px solid #1a1a1a;
    border-radius: 16px; background: #fdf8ee; overflow: hidden;
    box-shadow: 0 5px 0 rgba(0,0,0,.35);
    font: 800 36px/1.1 'Baloo 2', system-ui, sans-serif; letter-spacing: .04em;
    color: #1a1a1a;
  }
  .echo-countdown small {
    display: block; margin: 0 -26px 12px; padding: 6px 12px 8px;
    border-bottom: 3px solid #1a1a1a; background: #6c3fd8;
    font-size: 18px; font-weight: 800; letter-spacing: .12em; color: #ffd93b;
  }

  /* ── BALL DROP ● — the cam becomes a ball ──────────────────────────
     Layer order is fixed by the art: circular cam crop → shell (multiply)
     → gloss (screen) → rim ring. */
  .ball {
    /* A complete fallback sphere for previews or brief camera-still dropouts. */
    background-image: radial-gradient(circle at 34% 27%, #fff 0 7%, #E879F9 10% 25%, #671491 55%, #240437 79%);
    background-size: cover; background-position: center; overflow: hidden;
    will-change: transform, left, top;
  }
  /* The warped face is already circular with a feathered rim, so it needs no extra
     masking — just a touch of contrast to survive the multiply shading on top. */
  .ball.ball-lens { filter: saturate(1.12) contrast(1.06); }
  .ball-shell { background: url('assets/wheel/ball-shell.png') center / 100% 100% no-repeat; mix-blend-mode: multiply; }
  .ball-gloss { background: url('assets/wheel/ball-gloss.png') center / 100% 100% no-repeat; mix-blend-mode: screen; }
  .ball-ring  { background: url('assets/wheel/ball-ring.png') center / 100% 100% no-repeat; }
  .ball-ring.legend { background-image: url('assets/wheel/ball-ring-legend.png'); }
  .ball-shadow { background: radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%); border-radius: 50%; }
  /* The frozen cam still, covering the live cam so we own the pixels. */
  .cam-frozen { background-size: cover; background-position: center; }
  /* A real void, not a transparent punch. Transparent revealed the LIVE camera
     underneath, so the hole was the streamer's face and nothing looked missing. */
  .cam-hole {
    border-radius: 50%;
    background: radial-gradient(circle, #000 58%, #14041F 78%, rgba(20,4,31,0) 100%);
    box-shadow: inset 0 0 60px 20px #000, 0 0 0 5px rgba(232,121,249,.55), 0 0 40px rgba(232,121,249,.4);
  }
  /* Tracked mode draws a lock-on reticle instead of a bucket — the game already
     has one on screen, and drawing a second would read as a mistake. */
  .ball-reticle {
    border: 3px solid rgba(232,121,249,.9); border-radius: 10px;
    box-shadow: 0 0 0 2px rgba(42,4,71,.6), 0 0 22px rgba(232,121,249,.5);
    animation: om-breathe 900ms ease-in-out infinite;
  }
  .bucket-lip { background: url('assets/wheel/bucket-mouth.png') center top / 100% 100% no-repeat; }
  .ball-plate {
    position: absolute; font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800; color: #fdf8ee;
    text-shadow: 2px 0 0 #1a1a1a, -2px 0 0 #1a1a1a, 0 2px 0 #1a1a1a, 0 -2px 0 #1a1a1a,
                 2px 2px 0 #1a1a1a, -2px 2px 0 #1a1a1a, 2px -2px 0 #1a1a1a, -2px -2px 0 #1a1a1a;
    opacity: 0; transform: translateY(14px); transition: opacity .3s ease, transform .3s cubic-bezier(.2,1.3,.3,1);
  }
  .ball-plate.show { opacity: 1; transform: translateY(0); }

  /* ── HERO LINE — the ONE place the name is printed during impact.
     Every name over gameplay carries an 8-direction ink outline so it stays
     legible against arbitrary gameplay colour underneath. ── */
  .hero {
    position: absolute; left: 0; top: 760px; width: 1080px; text-align: center;
    opacity: 0; transform: translateY(18px) scale(.96); isolation: isolate;
    transition: opacity .52s cubic-bezier(.18,1.2,.3,1), transform .52s cubic-bezier(.18,1.2,.3,1);
  }
  .hero.show { opacity: 1; transform: translateY(0) scale(1); }
  /* No blurred halo (style guide: no glow, no fading ghosts). Legibility over
     gameplay comes from the ink 8-direction outline + flat offset shadow below. */
  .hero .h-name {
    font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800; font-size: 104px; color: #fdf8ee;
    line-height: 1.02;
    text-shadow: 4px 0 0 #1a1a1a, -4px 0 0 #1a1a1a, 0 4px 0 #1a1a1a, 0 -4px 0 #1a1a1a,
                 4px 4px 0 #1a1a1a, -4px 4px 0 #1a1a1a, 4px -4px 0 #1a1a1a, -4px -4px 0 #1a1a1a,
                 0 9px 0 rgba(0,0,0,.35);
  }
  .hero .h-what { font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800; font-size: 36px; color: #ffd93b; letter-spacing: .06em;
    text-shadow: 2px 0 0 #1a1a1a, -2px 0 0 #1a1a1a, 0 2px 0 #1a1a1a, 0 -2px 0 #1a1a1a,
                 2px 2px 0 #1a1a1a, -2px 2px 0 #1a1a1a, 2px -2px 0 #1a1a1a, -2px -2px 0 #1a1a1a; }
  .hero.tier-legend .h-name { color: #ffd93b; }

  /* Dev-only heads-up so an operator loading the page in a browser knows it's alive
     and which transport it's on. Hidden inside Studio is fine — pointer-events off. */
  #conn { position: absolute; left: 12px; top: 12px; z-index: 90; font-size: 14px;
    color: rgba(255,255,255,0.5); font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<div id="conn">wheel: connecting…</div>
<div id="stage">
  <div class="lane" id="lane-wall"></div>
  <div id="bump">
    <div class="lane" id="lane-flare"></div>
    <div class="lane" id="lane-wheel"><div id="wheel-stage"></div></div>
    <div class="lane" id="lane-fx"></div>

  // the visible journey deterministically so replays look identical while the live
  // rail still reads as naturally interspersed chance.
  const first = Math.max(0, startIndex - Math.ceil(resultCount / 2));

    totalSegments,
    reelResults.length,
    spin.styleSeed || spin.seed || spin.eventId || spin.revision
  );
  const iconBox = Math.round(Math.max(36, Math.min(96, wheelRailHeight * .2 * wheelContentScale)));
  const segments = [];
  for (let c = 0; c < REEL_CYCLES; c++) {
    for (const r of reelResults) {
      const seg = el(`reel-seg type-${r.key}`);
      seg.dataset.resultKey = r.key;
      if (gold.has(segments.length)) {
        seg.classList.add('gold');
        seg.dataset.goldLabel = carouselCopy.goldBadge;
      }
      if (segments.length === landIndex) seg.classList.add('winner');
      seg.appendChild(iconEl(r.key, iconBox));
      seg.appendChild(el('seg-label', esc(carouselResultLabel(r.key))));
      strip.appendChild(seg);
      segments.push(seg);
    }
  }
  vp.appendChild(strip);
  frame.appendChild(vp);
  frame.appendChild(el('reel-arrow'));
  const winnerLabel = el('reel-winner-label', esc(carouselWinnerLabel(spin.result, spin.tier)));
  winnerLabel.dataset.resultKey = spin.result;
  winnerLabel.dataset.tier = spin.tier;
  frame.appendChild(winnerLabel);
  runNode(run, laneWheel, frame);
  reveal(frame, 'show');
  publishFx('jamie-cue', { cue: 'anticipate', result: spin.result, tier: spin.tier, eventId: spin.eventId });

  const vpW = vp.clientWidth || 1080;
  // Four visible slots: the low-profile band uses WIDE chips (icon beside label),
  // cropping at the frame edges so the pass reads as a moving ticker.
  const visibleSlots = 4;
  const cardW = (vpW - REEL_GAP * (visibleSlots - 1)) / visibleSlots;
  for (const seg of segments) seg.style.width = cardW + 'px';

  // One continuous position function owns the complete journey. Changing CSS
  // transitions midway through a moving strip caused the browser to rebase from an
  // in-between transform, which produced the visible forward/backward correction.
  // This curve starts fast and reaches the exact winner with zero end velocity.
  const spinMs = wheelSpinMs || TIMING.spinning.spin;
  const pitch = cardW + REEL_GAP;
  const startX = carouselCenter(vpW, startIndex, cardW);
  const endX = carouselCenter(vpW, landIndex, cardW);
  let focusedIndex = -1;
  const paintReel = (x) => {
    strip.style.transform = `translate3d(${x}px,-50%,0)`;
    const nearest = Math.max(0, Math.min(
      segments.length - 1,
      Math.round((vpW / 2 - x - cardW / 2) / pitch)
    ));
    if (nearest !== focusedIndex) {
      if (focusedIndex >= 0) segments[focusedIndex].classList.remove('center-focus');
      segments[nearest].classList.add('center-focus');
      focusedIndex = nearest;
    }
    // Only cards near the marker need a live transform. The centered card reaches
    // 1.28× while its neighbours recede, so the current possibility is always clear.
    const first = Math.max(0, nearest - 2);
    const last = Math.min(segments.length - 1, nearest + 2);
    for (let i = 0; i < segments.length; i++) {
      if (i < first || i > last) {
        segments[i].style.transform = 'scale(.88)';
        segments[i].style.opacity = '.68';
        segments[i].style.zIndex = '0';
        continue;
      }
      const center = x + i * pitch + cardW / 2;
      const focus = Math.max(0, 1 - Math.abs(center - vpW / 2) / pitch);
      segments[i].style.transform = `scale(${(.88 + .28 * focus).toFixed(3)})`;
      segments[i].style.opacity = String((.68 + .32 * focus).toFixed(3));
      segments[i].style.zIndex = String(Math.round(focus * 10));
    }
  };
  paintReel(startX);
  const motionStarted = performance.now();
  const moveReel = (now) => {
    if (run.done) return;
    const t = Math.max(0, Math.min(1, (now - motionStarted) / spinMs));
    const progress = 1 - Math.pow(1 - t, 3); // continuous ease-out cubic
    paintReel(startX + (endX - startX) * progress);
    if (t < 1) {
      const raf = requestAnimationFrame(moveReel);
      run.rafs.add(raf);
      return;
    }
    // Clear live focus styles before the landed CSS takes over. The strip is already
    // exactly at endX, so this is a scale reveal—not a positional correction.
    for (const seg of segments) {
      seg.style.transform = '';
      seg.style.opacity = '';
      seg.style.zIndex = '';
      seg.classList.remove('center-focus');
    }
    strip.style.transform = `translate3d(${endX}px,-50%,0)`;
    frame.classList.add('landed');
  };
  const motionRaf = requestAnimationFrame(moveReel);
  run.rafs.add(motionRaf);
  runTimer(run, () => {
    frame.classList.add('final-pass');
    momentTitle.textContent = carouselCopy.finalPassTitle;
  }, Math.round(spinMs * .58));
  runStage(run, () => {
    frame.classList.remove('show');
    runTimer(run, () => { frame.remove(); run.nodes.delete(frame); prepareImpact(run); }, 300);
  }, spinMs + WINNER_HOLD_MS);
}

// ── Stage 2: IMPACT (reveal + hold) ──
function prepareImpact(run) {
  const scope = run.spin.result === 'crack' ? 'frame'
              : run.spin.result === 'avatar' ? 'camera'
              : null;
  if (!scope) { startImpact(run); return; }
  askInteractionSnapshot(run, scope, 0, (snap) => {
    if (snap) run.snapshots[scope] = snap;
    startImpact(run);
  }, 420);
}

function startImpact(run) {
  const spin = run.spin;
  const res = RESULT_BY_KEY[spin.result] || { label: spin.result };
  const fx = EFFECTS[spin.result];

  // Legend flare goes UNDER the effect, so it is laid first and for every effect.
  if (spin.tier === 'legend') legendFlare(run);

  if (fx) {
    const pressMs = fx.run(run) || 0;
    // hero:false effects suppress the hero line entirely — their in-scene payoff IS
    // the name, and printing it again would be the same voice twice.
    if (fx.hero !== false) showHero(run, spin);
    // Impact ends after the press sequence, the impression's dwell and its peel.
    const hold = pressMs + holdOf(spin) + 640;
    runStage(run, () => startSettle(run), hold);
    return;
  }

  // PLACEHOLDER card — the seven effects checkpoint 7 still owes.
  const card = el(`impact tier-${spin.tier}`);
  const glyph = el('i-glyph');
  glyph.appendChild(iconEl(spin.result, 130));
  card.appendChild(glyph);
  card.insertAdjacentHTML('beforeend',
    `<div class="i-user">${esc(displayName(spin))}</div>` +
    `<div class="i-tier">${TIER_GLYPH[spin.tier] || ''} ${TIER_LABEL[spin.tier] || spin.tier}</div>` +
    `<div class="i-result">${esc(res.label)}</div>`);
  runNode(run, laneImpact, card);
  reveal(card, 'show');

  const hold = TIMING.impact[spin.tier] ?? TIMING.impact.spin;
  runStage(run, () => {
    card.classList.remove('show');
    runTimer(run, () => { card.remove(); run.nodes.delete(card); startSettle(run); }, 300);
  }, hold);
}

// ═══════════════════════════════════════════════════════════════════
// CURSE ◍ — the giver possesses the camera.
// The curse IS the giver's avatar, worn over the streamer's tracked head.
// ═══════════════════════════════════════════════════════════════════
function runCurse(run) {
  const spin = run.spin, t = tierOf(spin), k = t.k, g = t.size, ti = tierIndex(spin);
  const legend = spin.tier === 'legend';
  publishFx('jamie-cue', { cue: 'confused', result: 'curse', x: headPoint(headNow, 0, 0).x, tier: spin.tier });
  // Legend: the corruption leaves the cam and takes the whole frame.
  const box = legend ? { x: 0, y: 0, w: 1080, h: 1920 } : camRect();
  const url = avatarUrl(spin);

  runNode(run, laneFx, place(el('fx curse-vignette'), box.x, box.y, box.w, box.h));

  if (legend) {
    // Released from head tracking and painted SOLID: a screen-blended avatar over
    // dark gameplay is invisible. Centre y is biased BELOW the hero band so the
    // name and the face are not fighting for the same rows.
    const s = 500, cx = box.w / 2, cy = 1180;
    const ring = place(el('fx curse-halo legend'), cx - s / 2 - 26, cy - s / 2 - 26, s + 52, s + 52);
    runNode(run, laneFx, ring);
    // Orbit ghost offsets derive from the FRAME width, so they cannot clip out.
    const orbit = box.w * 0.26;
    for (let i = 0; i < 4; i++) {
      const a = (Math.PI * 2 * i) / 4;
      const g = place(el('fx curse-av curse-ghost g' + (i % 2 ? 2 : 1)),
        cx + Math.cos(a) * orbit - 66, cy + Math.sin(a) * orbit - 66, 132, 132);
      g.style.backgroundImage = `url('${url}')`;
      runNode(run, laneFx, g);
    }
    const core = place(el('fx curse-av'), cx - s / 2, cy - s / 2, s, s);
    core.style.backgroundImage = `url('${url}')`;   // solid, no blend mode
    runNode(run, laneFx, core);
  } else {
    const h = headNow;
    const s = Math.max(h.w, h.h) * 1.12;
    const c = headPoint(h, 0, 0);
    runNode(run, laneFx, place(el('fx curse-halo'), c.x - s / 2, c.y - s / 2, s, s));
    // Three layers: a core at 62% plus two hue-split clones offset ±11px.
    ['curse-core', 'curse-ghost g1', 'curse-ghost g2'].forEach((cls) => {
      const n = place(el('fx curse-av ' + cls), c.x - s / 2, c.y - s / 2, s, s);
      n.style.backgroundImage = `url('${url}')`;
      runNode(run, laneFx, n);
    });
    // Four gold-ringed avatar sigils pinned to the cursed frame's corners.
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(([fx2, fy]) => {
      const sg = place(el('fx curse-sigil'), box.x + fx2 * (box.w - 64) , box.y + fy * (box.h - 64), 64, 64);
      sg.style.backgroundImage = `url('${url}')`;
      runNode(run, laneFx, sg);
    });
  }

  const frame = place(el('fx curse-frame'), box.x + 8, box.y + 8, box.w - 16, box.h - 16);
  runNode(run, laneFx, frame);
  [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(([fx2, fy]) => {
    const c2 = place(el('fx curse-corner'), box.x + fx2 * (box.w - 46), box.y + fy * (box.h - 46), 46, 46);
    runNode(run, laneFx, c2);
  });

  const bars = legend ? 14 : 4 + ti * 2;
  for (let i = 0; i < bars; i++) {
    const b = place(el('fx tear'), box.x, box.y + rnd(0, box.h), box.w, rnd(3, 16) * g);
    b.style.setProperty('--td', rnd(360, 700).toFixed(0) + 'ms');
    runNode(run, laneFx, b);
  }
  const drips = legend ? 18 : 5 + ti * 2;
  for (let i = 0; i < drips; i++) {
    const d = place(el('fx drip'), box.x + rnd(0, box.w), box.y, rnd(4, 13), 0);
    d.style.setProperty('--dh', rnd(70, 230 * g).toFixed(0) + 'px');
    d.style.setProperty('--dd', rnd(700, 1500).toFixed(0) + 'ms');
    runNode(run, laneFx, d);
  }
  canvasBump(k);
  return 380;
}

// ═══════════════════════════════════════════════════════════════════
// FLOOD ◒ — buckets thrown from the sides. TIER = HOW MANY.
// Each enters from off-frame on alternating sides, stops beside the head just
// above crown height, and tips TOWARD the face on its trailing corner. The water
// leaves the actual tipped mouth and travels a real arc.
// ═══════════════════════════════════════════════════════════════════
const FLOOD_COUNT = { spin: 1, power: 2, takeover: 3, legend: 5 };
const FLOOD_GAP   = { spin: 560, power: 560, takeover: 490, legend: 430 };

function runFlood(run) {
  const spin = run.spin, t = tierOf(spin), k = t.k, g = t.size, ti = tierIndex(spin);
  const legend = spin.tier === 'legend';
  const n = FLOOD_COUNT[spin.tier], gap = FLOOD_GAP[spin.tier];
  let wetness = 0, film = null;

  for (let i = 0; i < n; i++) {
    const at = i * gap;
    const fromLeft = i % 2 === 0;                 // alternating sides
    const dir = fromLeft ? 1 : -1;                // throw direction

    runTimer(run, () => {
      const h = headNow;
      const bw = 190 * g, bh = 150 * g;
      const crown = h.y;
      // Hover clamps when the cam sits at the top of frame and there is no headroom.
      const restY = Math.max(6, crown - bh * 0.86);
      const restX = fromLeft ? h.x - bw * 0.72 : h.x + h.w - bw * 0.28;

      const b = place(el('fx bucket' + (legend ? ' legend' : '')),
        fromLeft ? -bw : 1080, restY, bw, bh);
      b.style.transformOrigin = fromLeft ? '78% 86%' : '22% 86%';   // trailing corner
      b.style.transition = 'left 230ms cubic-bezier(.2,.9,.25,1.1)';
      runNode(run, laneFx, b);
      void b.offsetWidth;
      b.style.left = restX + 'px';

      // TIP toward the face. The art ships a correctly drawn TIPPED bucket, so this
      // swaps sprite rather than rotating the upright one 116° — which turned it into
      // a sideways tube on stream. A small rotation is kept purely for the motion.
      runTimer(run, () => {
        b.style.transition = 'transform 250ms cubic-bezier(.4,0,.6,1)';
        b.classList.add('pouring');
        // The pour art is drawn right-facing; a bucket throwing left must mirror.
        b.style.transform = `${fromLeft ? '' : 'scaleX(-1) '}rotate(${dir * 22}deg)`;
      }, 230);

      // Where the water leaves. With the tipped SPRITE the spout is a known point in
      // the art — the leading edge, about a third down — so the mouth is read off the
      // bucket's own rect instead of being solved backwards from a 116° rotation that
      // no longer happens.
      runTimer(run, () => {
        const mx = restX + (fromLeft ? bw * 0.94 : bw * 0.06);
        const my = restY + bh * 0.34;

        const h2 = headNow, target = headPoint(h2, 0, -0.1);
        const apex = -(112 + 48 * (g - 1));
        const dx = target.x - mx, dy = target.y - my;

        const wrap = place(el('fx water-x'), mx, my, 96 * g, 150 * g);
        wrap.style.setProperty('--ax', dx.toFixed(0) + 'px');
        wrap.style.setProperty('--wd', '265ms');
        const w = el('water-y' + (fromLeft ? '' : ' flip'));   // sheet is right-moving art
        w.style.cssText = `position:absolute;inset:0;--ay:${dy.toFixed(0)}px;--ah:${apex.toFixed(0)}px;--wd:265ms`;
        wrap.appendChild(w);
        runNode(run, laneFx, wrap);

        // Nine droplets trailing on their own offset arcs.
        for (let d = 0; d < 9; d++) {
          const dw = place(el('fx water-x'), mx + rnd(-18, 18), my + rnd(-14, 14), 0, 0);
          dw.style.setProperty('--ax', (dx + rnd(-40, 40)).toFixed(0) + 'px');
          dw.style.setProperty('--wd', (265 + d * 16) + 'ms');
          const dot = el('droplet');
          const ds = rnd(7, 17);
          dot.style.cssText = `position:absolute;width:${ds}px;height:${ds}px;` +
            `--ay:${(dy + rnd(-20, 30)).toFixed(0)}px;--ah:${(apex + rnd(-30, 30)).toFixed(0)}px;--wd:${265 + d * 16}ms`;
          dw.appendChild(dot);
          runNode(run, laneFx, dw);
        }
      }, 480);

      // HIT at ~645ms. Impact is side-on, not top-down.
      runTimer(run, () => {
        const h2 = headNow, c = headPoint(h2, 0, -0.05);
        canvasBump(k);
        publishFx('impact', { kind: 'water', x: c.x, tier: spin.tier });
        // Splash crown biased ALONG the throw direction.
        const sw = 300 * g;
        runNode(run, laneFx, place(el('fx splash'), c.x - sw / 2 + dir * sw * 0.18, c.y - sw * 0.42, sw, sw * 0.7));
        // The impact ring rotates ±24° instead of lying flat.
        const rg = el('fx ripple');
        const rs = 200 * g;
        rg.style.cssText = `left:${c.x - rs / 2}px;top:${c.y - rs / 4}px;width:${rs}px;height:${rs / 2}px;` +
          `border-radius:50%;transform:rotate(${dir * 24}deg)`;
        runNode(run, laneFx, rg);
        // Comedy blobs fly downrange.
        for (let bl = 0; bl < 7; bl++) {
          const s2 = el('fx spark');
          const sz = rnd(10, 26) * g;
          s2.style.cssText = `left:${c.x}px;top:${c.y}px;width:${sz}px;height:${sz}px;background:#38BDF8;` +
            `--dx:${(dir * rnd(80, 260)).toFixed(0)}px;--dy:${rnd(-120, 90).toFixed(0)}px;--sd:${rnd(500, 800)}ms`;
          runNode(run, laneFx, s2);
        }

        // WETNESS IS CUMULATIVE — one film, +0.17 opacity per bucket.
        wetness = Math.min(1, wetness + 0.17);
        if (!film) {
          const fw = h2.w * 1.25, fh = h2.h * 1.2;
          film = place(el('fx wet-film'), c.x - fw / 2, h2.y - 10, fw, fh);
          film.style.opacity = '0';
          runNode(run, laneFx, film);
        }
        film.style.opacity = String(wetness);

        // Face water: a bead WITH a tapered trail behind it — paired nodes, same
        // duration and delay — plus fat drops that hang off the chin.
        for (let bd = 0; bd < 4 + ti; bd++) {
          const p = headPoint(h2, rnd(-0.3, 0.3), rnd(-0.15, 0.25));
          const dur = rnd(700, 1200), fall = rnd(60, 150);
          const trail = place(el('fx run'), p.x - 3, p.y, 6, fall);
          trail.style.setProperty('--bd', dur + 'ms');
          runNode(run, laneFx, trail);
          const bead = place(el('fx bead'), p.x - 6, p.y, 12, 12);
          bead.style.setProperty('--bd', dur + 'ms');
          bead.style.setProperty('--dy', fall + 'px');
          runNode(run, laneFx, bead);
        }
        for (let cd = 0; cd < 3; cd++) {
          const p = headPoint(h2, rnd(-0.16, 0.16), 0.46);
          const bead = place(el('fx bead'), p.x - 9, p.y, 18, 18);
          bead.style.setProperty('--bd', '1400ms');
          bead.style.setProperty('--dy', '190px');
          runNode(run, laneFx, bead);
        }
        // Takeover/Legend add a frame veil with sparse tapered run-downs.
        if (ti >= 2) {
          for (let v = 0; v < 5 + ti * 2; v++) {
            const vx = rnd(0, 1080);
            // Never cross the head silhouette.
            if (vx > h2.x - 30 && vx < h2.x + h2.w + 30) continue;
            const r2 = place(el('fx run'), vx, rnd(0, 400), rnd(4, 9), rnd(120, 340));
            r2.style.setProperty('--bd', rnd(1000, 1700).toFixed(0) + 'ms');
            runNode(run, laneFx, r2);
          }
        }
        // Then they shake it off.
        runTimer(run, () => { if (film) film.classList.add('shaking'); }, 900);
      }, 645);
    }, at);
  }
  return (n - 1) * gap + 645 + 500;
}

// ═══════════════════════════════════════════════════════════════════
// WEATHER ❉ — summon a storm. Volume AND region are both tier-gated.
// Particles stay CSS: storm-star.png is a composite with a bolt and rain marks,
// far too busy to repeat 190 times.
// ═══════════════════════════════════════════════════════════════════
const WEATHER_N = { spin: 42, power: 90, takeover: 150, legend: 190 };

function runWeather(run) {
  const spin = run.spin, t = tierOf(spin), k = t.k, g = t.size, ti = tierIndex(spin);
  const legend = spin.tier === 'legend';
  const cam = camRect();
  // 42 in a strip inside the cam / 90 spilling past it / 150 and 190 full-frame.
  const region = ti === 0 ? { x: cam.x, y: cam.y, w: cam.w, h: cam.h * 0.6 }
               : ti === 1 ? { x: cam.x, y: cam.y, w: cam.w, h: cam.h * 1.5 }
                          : { x: 0, y: 0, w: 1080, h: 1920 };

  for (let i = 0; i < WEATHER_N[spin.tier]; i++) {
    const p = place(el('fx storm-p' + (legend ? ' gold' : '')),
      region.x + rnd(0, region.w), region.y + rnd(0, region.h * 0.2), rnd(2, 5) * g, rnd(18, 46) * g);
    p.style.setProperty('--fy', rnd(region.h * 0.5, region.h).toFixed(0) + 'px');
    p.style.setProperty('--fx', rnd(-70, 70).toFixed(0) + 'px');
    p.style.setProperty('--pr', rnd(-16, 16).toFixed(0) + 'deg');
    p.style.setProperty('--fd', rnd(900, 2000).toFixed(0) + 'ms');
    p.style.animationDelay = rnd(0, 1200).toFixed(0) + 'ms';
    runNode(run, laneFx, p);
  }

  // Legend fires FOUR lightning strikes across the beat, each with its own bolt.
  if (legend) {
    for (let s = 0; s < 4; s++) {
      runTimer(run, () => {
        const x = rnd(120, 960);
        // Its own shape: a jagged column of offset segments.
        let y = 0;
        for (let seg = 0; seg < 9; seg++) {
          const segH = rnd(90, 190);
          const b = place(el('fx bolt'), x + rnd(-60, 60), y, rnd(4, 11), segH);
          runNode(run, laneFx, b);
          y += segH;
        }
        runNode(run, laneFx, place(el('fx lf-flash'), 0, 0, 1080, 1920));
        canvasBump(k);
        publishFx('impact', { kind: 'strike', x, tier: spin.tier });
      }, 220 + s * 560);
    }
  }
  return legend ? 2400 : 900;
}

// ═══════════════════════════════════════════════════════════════════
// CRACK ◆ — break the glass. Radial fracture, each spoke spawning a branch
// at a random kink, over the production crack-web for the fine secondaries.
// ═══════════════════════════════════════════════════════════════════
const CRACK = {
  spin:     { reach: 240, spokes: 6,  whole: false },
  power:    { reach: 460, spokes: 10, whole: false },
  takeover: { reach: 900, spokes: 15, whole: true  },
  legend:   { reach: 900, spokes: 26, whole: true  },
};

function runCrackLegacy(run) {
  const spin = run.spin, t = tierOf(spin), k = t.k, g = t.size;
  const legend = spin.tier === 'legend';
  const cfg = CRACK[spin.tier];
  const cam = camRect();
  // Spin/Power fracture the CAM; Takeover/Legend fracture the whole frame from centre.
  const o = cfg.whole ? { x: 540, y: 960 } : { x: cam.x + cam.w / 2, y: cam.y + cam.h / 2 };

  for (let i = 0; i < cfg.spokes; i++) {
    const ang = (360 / cfg.spokes) * i + rnd(-9, 9);
    const len = cfg.reach * rnd(0.62, 1);
    const dur = rnd(180, 340);
    const s = el('fx spoke');
    s.style.cssText = `left:${o.x}px;top:${o.y}px;width:${len}px;height:${(2.4 * g).toFixed(1)}px;` +
      `--cr:${ang}deg;--cd:${dur}ms`;
    runNode(run, laneFx, s);
    // Each spoke spawns a branch at a random 28–60° kink.
    const kink = ang + (Math.random() < 0.5 ? -1 : 1) * rnd(28, 60);
    const bx = o.x + Math.cos(ang * Math.PI / 180) * len * 0.62;
    const by = o.y + Math.sin(ang * Math.PI / 180) * len * 0.62;
    const b = el('fx spoke');
    b.style.cssText = `left:${bx}px;top:${by}px;width:${(len * 0.45).toFixed(0)}px;height:${(1.8 * g).toFixed(1)}px;` +
      `--cr:${kink}deg;--cd:${(dur * 1.2).toFixed(0)}ms;animation-delay:${(dur * 0.5).toFixed(0)}ms`;
    runNode(run, laneFx, b);
  }

  const ws = cfg.reach * 2;
  runNode(run, laneFx, place(el('fx crack-web'), o.x - ws / 2, o.y - ws / 2, ws, ws));
  runNode(run, laneFx, place(el('fx lf-flash'), o.x - 200, o.y - 200, 400, 400));
  canvasBump(k, 380);
  bumpEl.classList.remove('shaking-hard'); void bumpEl.offsetWidth;
  bumpEl.classList.add('shaking-hard');
  publishFx('shake', { ms: 380 });     // the whole frame took the hit, not just this layer
  runTimer(run, () => bumpEl.classList.remove('shaking-hard'), 420);
  sparkBurst(run, o, Math.round(14 * k), k, legend);

  // Legend: the glass FALLS OUT — nine gold shards tumble off-screen.
  if (legend) {
    runTimer(run, () => {
      for (let i = 0; i < 9; i++) {
        const sz = rnd(90, 210);
        const sh = place(el('fx shard'), rnd(0, 1080 - sz), rnd(0, 700), sz, sz);
        sh.style.setProperty('--dx', rnd(-160, 160).toFixed(0) + 'px');
        sh.style.setProperty('--dr', rnd(-540, 540).toFixed(0) + 'deg');
        sh.style.setProperty('--sd', rnd(900, 1500).toFixed(0) + 'ms');
        runNode(run, laneFx, sh);
      }
    }, 340);
  }
  return legend ? 1500 : 700;
}

// ═══════════════════════════════════════════════════════════════════
// SPOTLIGHT ▲ — built on a FAKE-OUT. The light hunts, finds your face and
// holds one beat, then slides away and the giver rises into it. You sit in
// the dark. `hero: false` — the in-scene payoff IS the name.
// ═══════════════════════════════════════════════════════════════════
/**
 * How much of the screen the light is allowed to take, by tier. A Spin should be a
 * flourish you could talk over — a short beam grazing the top of the game, barely any
 * dimming. A Legend should own the frame: full-height beam, the room actually dark.
 * Everything in between scales monotonically, so the tier is readable from across the
 * room without reading a word.
 *
 *   dark   how far the rest of the frame is dimmed
 *   reach  beam length as a fraction of the drop to the ground line
 *   cone   beam opacity
 *   giver  how large the giver stands (they rise at the bottom of the beam, so a
 *          short beam necessarily means a smaller figure higher up the frame)
 */
const SHATTER_GRID = {
  spin: [3, 4], power: [4, 4], takeover: [4, 5], legend: [5, 5],
};

function runCrack(run) {
  const spin = run.spin, k = tierOf(spin).k;
  const legend = spin.tier === 'legend';
  const snap = run.snapshots.frame || null;
  const sourceRect = snap?.rect || { x: 0, y: 0, w: 1080, h: 1920 };
  requestInteraction(run, { ms: 4400, hands: true, body: true, mode: 'swipe-shatter' });

  const frozen = place(el('fx freeze-capture'), sourceRect.x, sourceRect.y, sourceRect.w, sourceRect.h);
  if (snap?.dataURL) frozen.style.backgroundImage = `url('${snap.dataURL}')`;
  else frozen.style.background = 'linear-gradient(145deg,rgba(36,18,55,.88),rgba(8,18,32,.86))';
  runNode(run, laneFx, frozen);

  const web = place(el('fx crack-web'), 40, 330, 1000, 1000);
  web.style.opacity = '.72';
  runNode(run, laneFx, web);
  const prompt = el('fx freeze-prompt');
  prompt.innerHTML = `${esc(displayName(spin))} FROZE THE SCREEN<small>OPEN HAND • SWIPE IT AWAY</small>`;
  runNode(run, laneFx, prompt);
  reveal(prompt, 'show');
  publishFx('jamie-cue', { cue: 'look', result: 'crack', x: 540, tier: spin.tier });

  let shattered = false;
  const previous = new Map();
  let cursor = null;

  const shatter = (impulse = { x: rnd(-180, 180), y: 420, atX: 540 }) => {
    if (shattered || run.done) return;
    shattered = true;
    prompt.classList.add('done');
    frozen.style.opacity = '0';
    frozen.style.transition = 'opacity 100ms linear';
    web.style.opacity = '0';
    web.style.transition = 'opacity 100ms linear';
    if (cursor) cursor.style.opacity = '0';
    canvasBump(k, 440);
    bumpEl.classList.remove('shaking-hard'); void bumpEl.offsetWidth;
    bumpEl.classList.add('shaking-hard');
    publishFx('shake', { ms: 380 });
    publishFx('impact', { kind: 'glass', x: impulse.atX, tier: spin.tier });
    runTimer(run, () => bumpEl.classList.remove('shaking-hard'), 430);
    sparkBurst(run, { x: impulse.atX, y: 820 }, Math.round(16 * k), k, legend);

    const [cols, rows] = SHATTER_GRID[spin.tier] || SHATTER_GRID.spin;
    const cellW = sourceRect.w / cols, cellH = sourceRect.h / rows;
    const pieces = [];
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const x = sourceRect.x + col * cellW, y = sourceRect.y + row * cellH;
        const shard = place(el('fx freeze-shard' + (legend ? ' gold' : '')), x, y, cellW + 2, cellH + 2);
        if (snap?.dataURL) {
          shard.style.backgroundImage = `url('${snap.dataURL}')`;
          shard.style.backgroundSize = `${sourceRect.w}px ${sourceRect.h}px`;
          shard.style.backgroundPosition = `${-col * cellW}px ${-row * cellH}px`;
        } else {
          shard.style.background = `linear-gradient(${rnd(110,160)}deg,#2A0447,#7B2FBE)`;
        }
        const cut = Math.round(rnd(8, 25));
        shard.style.clipPath = `polygon(${cut}% 0,100% ${Math.round(rnd(0,18))}%,${100-cut/2}% 100%,0 ${Math.round(rnd(78,100))}%)`;
        runNode(run, laneFx, shard);
        pieces.push({
          el: shard, baseX: x, baseY: y, x, y, w: cellW, h: cellH,
          vx: impulse.x * rnd(.55, 1.1) + (x + cellW / 2 - impulse.atX) * rnd(.8, 1.6),
          vy: impulse.y * rnd(.45, .95) - rnd(120, 520),
          rot: rnd(-8, 8), vr: rnd(-190, 190), hits: 0,
        });
      }
    }

    let last = performance.now();
    const physics = (now) => {
      if (run.done) return;
      const dt = Math.min(.035, (now - last) / 1000); last = now;
      const bodies = currentBodyParts(run);
      let alive = 0;
      for (const p of pieces) {
        if (p.y > 2050 || p.el.style.opacity === '0') continue;
        alive++;
        p.vy += 1500 * dt;
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        const hit = p.hits < 3
          ? bodyCollision(p.x + p.w / 2, p.y + p.h / 2, Math.min(p.w, p.h) * .26, bodies)
          : null;
        if (hit && p.vx * hit.nx + p.vy * hit.ny < 0) {
          const vn = p.vx * hit.nx + p.vy * hit.ny;
          p.x += hit.nx * hit.penetration; p.y += hit.ny * hit.penetration;
          p.vx = (p.vx - 1.55 * vn * hit.nx) * .72;
          p.vy = (p.vy - 1.55 * vn * hit.ny) * .72;
          p.vr *= -.74; p.hits++;
        }
        if (p.x < -p.w * .6 || p.x > 1080 - p.w * .4) p.vx *= -.58;
        p.el.style.transform = `translate3d(${p.x - p.baseX}px,${p.y - p.baseY}px,0) rotate(${p.rot}deg)`;
        if (p.y > 1840) p.el.style.opacity = String(Math.max(0, (2050 - p.y) / 210));
      }
      if (alive) {
        const id = requestAnimationFrame(physics);
        run.rafs.add(id);
      }
    };
    const id = requestAnimationFrame(physics);
    run.rafs.add(id);
  };

  const watchSwipe = (now) => {
    if (run.done || shattered) return;
    const hand = currentOpenHands(run)[0];
    if (hand) {
      if (!cursor) {
        cursor = place(el('fx hand-cursor'), hand.x, hand.y, 54, 54);
        runNode(run, laneFx, cursor);
      }
      cursor.style.opacity = '.9';
      cursor.style.left = hand.x + 'px'; cursor.style.top = hand.y + 'px';
      if (hand.speed > 820 && hand.travel > 42) {
        shatter({ x: hand.vx * .34, y: hand.vy * .24 + 260, atX: hand.x });
        return;
      }
      const prior = previous.get(hand.id);
      if (prior) {
        const dt = Math.max(.016, (now - prior.t) / 1000);
        const dx = hand.x - prior.x, dy = hand.y - prior.y;
        const speed = Math.hypot(dx, dy) / dt;
        if (speed > 820 && Math.hypot(dx, dy) > 42) {
          shatter({ x: dx / dt * .34, y: dy / dt * .24 + 260, atX: hand.x });
          return;
        }
      }
      previous.set(hand.id, { x: hand.x, y: hand.y, t: now });
    } else if (cursor) cursor.style.opacity = '0';
    const id = requestAnimationFrame(watchSwipe);
    run.rafs.add(id);
  };
  const id = requestAnimationFrame(watchSwipe);
  run.rafs.add(id);
  runTimer(run, () => shatter(), 2100);
  return 2800;
}

const SPOTLIGHT = {
  spin:     { dark: 0.16, reach: 0.42, cone: 0.42, giver: 0.66 },
  power:    { dark: 0.34, reach: 0.62, cone: 0.58, giver: 0.78 },
  takeover: { dark: 0.56, reach: 0.82, cone: 0.74, giver: 0.90 },
  legend:   { dark: 0.80, reach: 1.00, cone: 0.92, giver: 1.00 },
};
const SPOTLIGHT_TYPE = {
  spin:     { name: 48, sub: 27 },
  power:    { name: 56, sub: 30 },
  takeover: { name: 64, sub: 33 },
  legend:   { name: 72, sub: 36 },
};

function runSpotlight(run) {
  const spin = run.spin, t = tierOf(spin), k = t.k, g = t.size;
  const legend = spin.tier === 'legend';
  const cfg = SPOTLIGHT[spin.tier] || SPOTLIGHT.spin;
  const type = SPOTLIGHT_TYPE[spin.tier] || SPOTLIGHT_TYPE.spin;
  const ground = LAYOUTS[layout].ground;
  // The beam stops short at low tiers, so the "floor" the giver stands on is the
  // bottom of the beam rather than the layout's ground line.
  const beamFloor = Math.round(ground * cfg.reach);
  const stageX = 540;
  publishFx('jamie-cue', { cue: 'look', result: 'spotlight', x: stageX, tier: spin.tier });

  const dark = place(el('fx sl-dark'), 0, 0, 1080, 1920);
  dark.style.background = `rgba(10,4,20,${cfg.dark})`;
  dark.style.opacity = '0';
  runNode(run, laneFx, dark);

  const W = Math.min(680, 520 * g);
  const cone = place(el('fx sl-cone'), 200 - W / 2, 0, W, beamFloor);
  cone.style.opacity = String(cfg.cone);
  const pool = place(el('fx sl-pool'), 200 - W / 2, beamFloor - 70, W, 140);
  pool.style.opacity = String(cfg.cone);
  runNode(run, laneFx, cone); runNode(run, laneFx, pool);

  const moveTo = (x, w) => {
    cone.style.left = (x - w / 2) + 'px'; cone.style.width = w + 'px';
    pool.style.left = (x - w / 2) + 'px'; pool.style.width = w + 'px';
  };

  // HUNT: 600ms then 520ms to two decoys.
  runTimer(run, () => { moveTo(860, W); dark.style.opacity = '1'; }, 20);
  runTimer(run, () => moveTo(300, W), 620);
  // FINDS YOUR FACE and holds one beat (460ms).
  runTimer(run, () => moveTo(headPoint(headNow, 0, 0).x, W), 1140);
  // SLIDES AWAY (440ms) — and the giver rises into it.
  runTimer(run, () => moveTo(stageX, W * 0.82), 1600);   // tightens to 0.82×

  runTimer(run, () => {
    const s = 300 * g * cfg.giver;
    // Hard cast shadow so they read as standing IN the beam, not pasted over it —
    // on the BEAM floor, which at low tiers is well above the layout ground line.
    runNode(run, laneFx, place(el('fx sl-shadow'), stageX - s * 0.8, beamFloor - 40, s * 1.6, 90));
    const g = place(el('fx sl-giver'), stageX - s / 2, beamFloor - s - 30, s, s);
    g.style.backgroundImage = `url('${avatarUrl(spin)}')`;
    runNode(run, laneFx, g);

    // The two lines scale with the tier. At Legend they need about 200px, not
    // the old fixed 120px; placing that fixed box below a 1740px beam let the
    // second line cross the 1920px canvas edge. Size from the actual type and
    // clamp the complete plate into the frame with a small safe margin.
    const plateHeight = type.name + type.sub + 28;
    const plateTop = Math.min(beamFloor + 16, 1920 - plateHeight - 32);
    const plate = place(el('fx sl-plate'), stageX - 400, plateTop, 800, plateHeight);
    plate.innerHTML = `<div style="font-size:${type.name}px">${esc(displayName(spin))}</div>` +
      `<div style="font-size:${type.sub}px;color:#ffd93b">${legend ? 'OWNS THE STAGE' : 'HAS THE LIGHT'}</div>`;
    runNode(run, laneFx, plate);

    if (legend) {
      runNode(run, laneFx, place(el('fx curse-halo legend'), stageX - s / 2 - 24, beamFloor - s - 54, s + 48, s + 48));
      // Two extra sweeping beams.
      for (let i = 0; i < 2; i++) {
        const b = place(el('fx sl-beam'), stageX - 40 + (i ? 260 : -260), 0, 80, beamFloor);
        b.style.transform = `rotate(${i ? 12 : -12}deg)`;
        runNode(run, laneFx, b);
      }
      // 14 gold stars dropping through the beam.
      for (let i = 0; i < 14; i++) {
        const st = place(el('fx storm-p gold'), stageX + rnd(-W / 2, W / 2), rnd(0, 300), 6, 22);
        st.style.setProperty('--fy', Math.max(120, beamFloor - 260).toFixed(0) + 'px');
        st.style.setProperty('--fd', rnd(1200, 2400).toFixed(0) + 'ms');
        st.style.animationDelay = rnd(0, 900).toFixed(0) + 'ms';
        runNode(run, laneFx, st);
      }
    }
    canvasBump(k);
  }, 2040);

  return 2400;
}

// ═══════════════════════════════════════════════════════════════════
// FRAME ▣ — claim the frame. Tier drives how much screen it claims.
// ═══════════════════════════════════════════════════════════════════
/**
 * The handoff's ramp (inset 120/74/40/18, thickness 14/22/32/44) did not read on
 * stream: 46px of inset on a 1920-tall frame is about 2%, and 14→22px of border is
 * nearly invisible at streaming distance. Every tier looked the same until Legend
 * added its second frame and studs, which made Legend the ONLY legible step.
 *
 * So the ramp is amplified — thickness roughly doubles across the range and the inset
 * span is widened — AND each tier now gains a feature of its own, so the step is
 * visible even before you judge the size:
 *   spin      bare marquee, well inside the frame
 *   power     + a breathing glow
 *   takeover  + a second static frame just inside the first
