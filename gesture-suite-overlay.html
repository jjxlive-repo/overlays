<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JJxLive Gesture Suite Overlay</title>
<script src="jjx-core.js?v=9"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 1080px; min-width: 1080px;
    height: 1920px; min-height: 1920px;
    margin: 0; overflow: hidden; background: transparent;
    pointer-events: none;
  }
  #gesture-suite {
    position: absolute; left: 0; top: 0;
    width: 1080px; height: 1920px;
    overflow: hidden; background: transparent;
  }
  .suite-layer {
    position: absolute; inset: 0;
    width: 1080px; height: 1920px;
    border: 0; background: transparent;
    pointer-events: none;
  }
  #suite-feed-jamie { z-index: 10; }
  #suite-wheel       { z-index: 20; }
  #suite-bomb-drop   { z-index: 30; }
  #suite-gesture-fx  { z-index: 40; }
  /* Follow alerts are the stream's highest-priority acknowledgement. Keeping
     them in this compositor is what lets them beat the wheel reliably; a
     z-index inside a separate Studio browser source cannot cross source layers. */
  #suite-follow-meter { z-index: 100; }
</style>
</head>
<body>
<div id="gesture-suite">
  <!-- The TikTok canvas correction belongs on this parent URL only. Child pages
       deliberately omit ttlsFix so the 1920→1392 compensation happens once. -->
  <iframe class="suite-layer" id="suite-feed-jamie" src="feed-jamie-overlay.html?suite=1&amp;v=4" allow="autoplay" title="Feed Jamie overlay"></iframe>
  <iframe class="suite-layer" id="suite-wheel" src="wheel-overlay.html?suite=1&amp;v=5" allow="autoplay" title="Spin the Screen overlay"></iframe>
  <iframe class="suite-layer" id="suite-bomb-drop" src="bomb-drop-overlay.html?suite=1" allow="autoplay" title="Bomb Drop overlay"></iframe>
  <iframe class="suite-layer" id="suite-gesture-fx" src="gesture-fx-overlay.html?suite=1" allow="autoplay" title="Gesture effects overlay"></iframe>
  <iframe class="suite-layer" id="suite-follow-meter" src="follow-meter-overlay.html?suite=1&amp;v=2" allow="autoplay" title="Follow Meter overlay"></iframe>
</div>
</body>
</html>
